<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Relatório de Despesas — Formula Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --fc-primaria: #001528;
            --fc-primaria-clara: #0a3a68;
            --fc-acao: #5DC500;
            --fc-fundo: #f4f6f9;
        }
        body { background: var(--fc-fundo); color: #1f2b38; font-family: system-ui, -apple-system, sans-serif; }
        .rel-topo {
            background: #001528;
            color: #fff; padding: 22px 0;
            width: calc(100% - 32px); max-width: 1000px; margin: 20px auto;
            border-radius: 12px; box-shadow: 0 6px 20px rgba(0,21,40,0.25);
        }
        .rel-topo img { height: 42px; }
        .rel-wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
        .filtros-barra {
            background: #fff; border: 1px solid #e6eaf0; border-radius: 12px;
            padding: 16px; margin: 18px 0; box-shadow: 0 4px 16px rgba(0,21,40,0.06);
        }
        .filtros-barra label { font-weight: 600; color: var(--fc-primaria); font-size: .85rem; margin-bottom: 3px; }
        .resumo-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
        .resumo-card {
            flex: 1; min-width: 150px; background: #fff; border: 1px solid #e6eaf0;
            border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 16px rgba(0,21,40,0.06);
        }
        .resumo-card .rot { font-size: .78rem; color: #6c757d; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
        .resumo-card .val { font-size: 1.5rem; font-weight: 700; color: var(--fc-primaria); }
        .desp-card {
            background: #fff; border: 1px solid #e6eaf0; border-radius: 12px;
            margin-bottom: 14px; overflow: hidden; box-shadow: 0 3px 12px rgba(0,21,40,0.05);
            display: flex; flex-wrap: wrap;
        }
        .desp-info { flex: 1; min-width: 260px; padding: 16px 18px; }
        .desp-foto {
            width: 300px; background: #eef1f5; display: flex; align-items: center;
            justify-content: center; border-left: 1px solid #e6eaf0; position: relative;
        }
        .desp-foto img { width: 100%; height: 100%; max-height: 340px; object-fit: contain; cursor: zoom-in; }
        .desp-foto .placeholder { color: #9aa5b1; font-size: .85rem; padding: 30px; text-align: center; }
        .desp-topo { display: flex; align-items: baseline; margin-bottom: 8px; }
        .desp-tipo { font-weight: 700; color: var(--fc-primaria); font-size: 1.05rem; }
        .desp-valor { margin-left: auto; font-weight: 700; color: var(--fc-primaria); font-size: 1.2rem; }
        .desp-linha { font-size: .9rem; color: #47535f; margin-bottom: 2px; }
        .desp-linha b { color: #2b3742; }
        .badge-grupo {
            display: inline-block; background: var(--fc-primaria); color: #fff;
            border-radius: 6px; padding: 1px 9px; font-size: .72rem; font-weight: 600; margin-top: 6px;
        }
        .badge-proprio { background: var(--fc-acao); }
        .btn-fc { background: var(--fc-primaria); border-color: var(--fc-primaria); color:#fff; font-weight:600; }
        .btn-fc:hover { background: var(--fc-primaria-clara); color:#fff; }
        .btn-fc-verde { background: var(--fc-acao); border-color: var(--fc-acao); color:#fff; font-weight:600; }
        .btn-fc-verde:hover { filter: brightness(.92); color:#fff; }
        .estado-msg { text-align: center; padding: 50px 20px; color: #6c757d; }
        .lightbox {
            position: fixed; inset: 0; background: rgba(0,20,40,0.9); display: none;
            align-items: center; justify-content: center; z-index: 9999; padding: 20px;
        }
        .lightbox.aberto { display: flex; }
        .lightbox img { max-width: 95%; max-height: 95%; object-fit: contain; border-radius: 8px; }
        .lightbox .fechar { position: absolute; top: 16px; right: 24px; color: #fff; font-size: 2.4rem; cursor: pointer; line-height: 1; }
        @media print {
            .no-print { display: none !important; }
            .rel-topo { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .desp-card { page-break-inside: avoid; border: 1px solid #ccc; box-shadow: none; }
            body { background: #fff; }
        }
    </style>
</head>

<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyHQEQanZCbRh7BHA0QIvUKdmNmtrYlDuWSYf7kZc8PCZbzfXk3qrCN7YQ0je6TpENw/exec';

    // Le os parametros passados pelo index.html (token e periodo) via URL.
    const params = new URLSearchParams(window.location.search);
    const tokenSessao = params.get('token') || '';
    const cpfLogado = params.get('cpf') || '';

    let despesasTodas = [];   // tudo do periodo
    let despesasVisiveis = []; // apos filtros locais

    function formatarReal(v) {
        return 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d),)/g, '.');
    }
    function escaparHtml(s) {
        return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function chamar(payload) {
        payload.token = tokenSessao;
        const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const txt = await resp.text();
        let res;
        try { res = JSON.parse(txt); } catch(e) { throw new Error('Resposta inválida do servidor.'); }
        if (!res || res.error) throw new Error(res && res.error ? res.error : 'Erro desconhecido.');
        return res;
    }

    // Busca as despesas do periodo (usa a funcao que ja existe no servidor).
    // Ao abrir: NAO lista despesas. Busca um periodo amplo (ultimos 12 meses)
    // apenas para descobrir as opcoes dos filtros (supervisores, clientes,
    // grupos). As despesas so aparecem quando o usuario clica em "Aplicar".
    async function carregarOpcoesFiltros() {
        const hoje = new Date();
        const dozeMeses = new Date(hoje.getFullYear() - 1, hoje.getMonth(), hoje.getDate());
        const fmt = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        // Preenche as datas visiveis com o periodo vindo da URL (mes atual).
        document.getElementById('f-ini').value = params.get('ini') || '';
        document.getElementById('f-fim').value = params.get('fim') || '';
        try {
            // r114: antes buscava 12 meses so para montar os filtros (lento).
            // Agora busca apenas o periodo da URL (mes atual); as opcoes dos
            // filtros crescem a cada "Aplicar filtros" com o periodo escolhido.
            const iniOpc = params.get('ini') || fmt(new Date(hoje.getFullYear(), hoje.getMonth(), 1));
            const fimOpc = params.get('fim') || fmt(hoje);
            const res = await chamar({ action: 'getDespesasRelatorio', cpf: cpfLogado, filtros: { dataIni: iniOpc, dataFim: fimOpc } });
            // Liberado para SUPERVISOR e DIRETOR. O servidor ja garante que o
            // supervisor recebe apenas as PROPRIAS despesas (filtro por permissao).
            // Guarda so para extrair opcoes; NAO exibe despesas.
            popularSeletores(res.lista || []);
            document.getElementById('area-lista').innerHTML =
                '<div class="estado-msg">Selecione os filtros desejados e clique em <b>🔍 Aplicar filtros</b> para gerar o relatório.</div>';
        } catch (err) {
            document.getElementById('estado').innerHTML = '⚠️ ' + escaparHtml(err.message);
        }
    }

    function popularSeletores(lista) {
        const sups = [...new Set(lista.map(d => d.supervisor).filter(Boolean))].sort();
        const clis = [...new Set(lista.map(d => d.cliente).filter(Boolean))].sort();
        const grps = [...new Set(lista.map(d => d.grupo).filter(Boolean))].sort();
        const fill = (id, arr) => {
            const s = document.getElementById(id);
            const ja = new Set(Array.from(s.options).map(o => o.value));
            arr.forEach(v => { if (ja.has(v)) return; const o = document.createElement('option'); o.value = v; o.text = v; s.appendChild(o); });
        };
        fill('f-sup', sups); fill('f-cli', clis); fill('f-grp', grps);
    }

    // Ao clicar em "Aplicar filtros": SEMPRE busca o periodo selecionado no
    // servidor e entao aplica os filtros locais (supervisor/cliente/grupo).
    async function aplicarFiltros() {
        const ini = document.getElementById('f-ini').value;
        const fim = document.getElementById('f-fim').value;
        if (!ini || !fim) { alert('Selecione a data inicial e a data final.'); return; }

        document.getElementById('area-resumo').innerHTML = '';
        document.getElementById('area-lista').innerHTML = '<div class="estado-msg">Carregando despesas…</div>';
        try {
            const res = await chamar({ action: 'getDespesasRelatorio', cpf: cpfLogado, filtros: { dataIni: ini, dataFim: fim } });
            despesasTodas = res.lista || [];
            popularSeletores(despesasTodas); // r114: acrescenta opcoes novas sem perder a selecao
        } catch (err) {
            document.getElementById('area-lista').innerHTML = '<div class="estado-msg">⚠️ ' + escaparHtml(err.message) + '</div>';
            return;
        }

        const fSup = document.getElementById('f-sup').value;
        const fCli = document.getElementById('f-cli').value;
        const fGrp = document.getElementById('f-grp').value;
        despesasVisiveis = despesasTodas.filter(d =>
            (!fSup || d.supervisor === fSup) &&
            (!fCli || d.cliente === fCli) &&
            (!fGrp || d.grupo === fGrp)
        );
        renderizar();
    }

    function renderizar() {
        const resumo = document.getElementById('area-resumo');
        const lista = document.getElementById('area-lista');

        if (!despesasVisiveis.length) {
            resumo.innerHTML = '';
            lista.innerHTML = '<div class="estado-msg">Nenhuma despesa encontrada para os filtros selecionados.</div>';
            return;
        }

        const total = despesasVisiveis.reduce((s, d) => s + Number(d.valor || 0), 0);
        const qtd = despesasVisiveis.length;
        const comFoto = despesasVisiveis.filter(d => d.url).length;

        resumo.innerHTML =
            '<div class="resumo-cards">' +
            '<div class="resumo-card"><div class="rot">Despesas</div><div class="val">' + qtd + '</div></div>' +
            '<div class="resumo-card"><div class="rot">Valor total</div><div class="val">' + formatarReal(total) + '</div></div>' +
            '<div class="resumo-card"><div class="rot">Com comprovante</div><div class="val">' + comFoto + '/' + qtd + '</div></div>' +
            '</div>';

        lista.innerHTML = despesasVisiveis.map((d, i) =>
            '<div class="desp-card">' +
                '<div class="desp-info">' +
                    '<div class="desp-topo"><span class="desp-tipo">' + escaparHtml(d.tipo) + '</span>' +
                        '<span class="desp-valor">' + formatarReal(d.valor) + '</span></div>' +
                    '<div class="desp-linha"><b>Data:</b> ' + escaparHtml(d.data) + '</div>' +
                    '<div class="desp-linha"><b>Cliente:</b> ' + escaparHtml(d.cliente) + ' — ' + escaparHtml(d.unidade) + '</div>' +
                    '<div class="desp-linha"><b>Supervisor:</b> ' + escaparHtml(d.supervisor) + '</div>' +
                    '<div class="desp-linha"><b>Forma:</b> ' + escaparHtml(d.formaPagamento || '—') + '</div>' +
                    (d.obs ? '<div class="desp-linha"><b>Obs:</b> ' + escaparHtml(d.obs) + '</div>' : '') +
                    '<span class="badge-grupo' + (d.recursoProprio ? ' badge-proprio' : '') + '">' + escaparHtml(d.grupo) + '</span>' +
                '</div>' +
                '<div class="desp-foto" id="foto-' + i + '">' +
                    (d.url ? '<span class="placeholder">Carregando comprovante…</span>' : '<span class="placeholder">Sem comprovante</span>') +
                '</div>' +
            '</div>'
        ).join('');

        // Carrega as fotos (todas de uma vez, conforme escolhido).
        // r114: no maximo 3 comprovantes por vez (antes disparava todos juntos e
        // travava o servidor).
        const fila = [];
        despesasVisiveis.forEach((d, i) => { if (d.url) fila.push([d.url, i]); });
        const trabalhador = async () => {
            while (fila.length) { const [u, i] = fila.shift(); await carregarFoto(u, i); }
        };
        for (let k = 0; k < 3; k++) trabalhador();
    }

    async function carregarFoto(url, i) {
        try {
            const res = await chamar({ action: 'getComprovanteImagem', url: url });
            const cont = document.getElementById('foto-' + i);
            if (res.base64) {
                const src = 'data:' + (res.mimeType || 'image/jpeg') + ';base64,' + res.base64;
                cont.innerHTML = '<img src="' + src + '" alt="Comprovante" onclick="abrirLightbox(this.src)">';
            } else {
                cont.innerHTML = '<span class="placeholder">Comprovante indisponível</span>';
            }
        } catch (err) {
            const cont = document.getElementById('foto-' + i);
            if (cont) cont.innerHTML = '<span class="placeholder">Erro ao carregar</span>';
        }
    }

    function abrirLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('aberto');
    }
    function fecharLightbox() {
        document.getElementById('lightbox').classList.remove('aberto');
    }

    // Inicializacao
    if (!tokenSessao) {
        document.getElementById('estado').innerHTML = '⚠️ Sessão não informada. Abra o relatório pelo botão no app.';
    } else {
        carregarOpcoesFiltros();
    }
</script>
