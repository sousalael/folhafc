name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Configurar credenciais do clasp
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Gerar .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.APPS_SCRIPT_ID }}","rootDir":"apps-script"}' > apps-script/.clasp.json

      - name: Enviar código ao Apps Script
        run: clasp push --force
        working-directory: apps-script

      - name: Criar versão e atualizar implantação
        working-directory: apps-script
        run: |
          # Criar nova versão imutável do código enviado
          VERSION_OUTPUT=$(clasp version "Auto-deploy $(date +'%Y-%m-%d %H:%M')")
          echo "$VERSION_OUTPUT"
          
          # Extrair o número da versão criada
          VERSION_NUM=$(echo "$VERSION_OUTPUT" | grep -oP '(?<=~ )\d+')
          echo "Versão criada: $VERSION_NUM"
          
          # Atualizar a implantação existente para apontar para essa versão
          clasp deploy -i "${{ secrets.DEPLOYMENT_ID }}" -V "$VERSION_NUM" --description "v$VERSION_NUM - $(date +'%Y-%m-%d %H:%M')"
