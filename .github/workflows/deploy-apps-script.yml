name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Configurar credenciais do clasp (a partir do Secret)
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Gerar .clasp.json com o Script ID (a partir do Secret)
        run: |
          echo '{"scriptId":"${{ secrets.APPS_SCRIPT_ID }}","rootDir":"apps-script"}' > apps-script/.clasp.json

      - name: Publicar código-fonte no Apps Script
        run: clasp push --force
        working-directory: apps-script

      - name: Atualizar a implantação existente (Web App)
        run: clasp deploy -i "${{ secrets.DEPLOYMENT_ID }}" --description "Auto-deploy $(date +'%Y-%m-%d %H:%M')"
        working-directory: apps-script
