name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar clasp
        run: npm install -g @google/clasp

      - name: Configurar credenciais do clasp
        run: echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json

      - name: Gerar .clasp.json
        run: |
          echo '{"scriptId":"${{ secrets.APPS_SCRIPT_ID }}","rootDir":"apps-script"}' > apps-script/.clasp.json

      - name: Enviar código ao Apps Script
        run: clasp push --force
        working-directory: apps-script

      - name: Atualizar TODAS as implantações
        working-directory: apps-script
        run: |
          set -e
          
          # Criar nova versão
          echo "--- Criando versão ---"
          clasp version "Auto $(date +'%Y-%m-%d %H:%M')" 2>&1 | tee /tmp/ver.txt
          
          # Extrair número da versão (aceita vários formatos de output)
          VER=$(cat /tmp/ver.txt | grep -oE '[0-9]+' | tail -1)
          echo "Versão detectada: $VER"
          
          if [ -z "$VER" ]; then
            echo "ERRO: não conseguiu extrair número da versão"
            exit 1
          fi
          
          # Listar todas as implantações e atualizar CADA UMA
          echo "--- Listando implantações ---"
          clasp deployments 2>&1 | tee /tmp/deps.txt
          
          # Extrair todos os deployment IDs (formato: - AKfycb...)
          grep -oE 'AKfycb[A-Za-z0-9_-]+' /tmp/deps.txt | sort -u | while read DEP_ID; do
            echo "Atualizando deployment: $DEP_ID -> versão $VER"
            clasp deploy -i "$DEP_ID" -V "$VER" --description "Auto v$VER $(date +'%Y-%m-%d %H:%M')" 2>&1 || echo "AVISO: falhou para $DEP_ID, continuando..."
          done
          
          echo "--- Concluído ---"
