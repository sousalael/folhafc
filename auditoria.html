async function prepararEnvio(auditoriaId, cliente, unidade, emailSalvo) {
  const email = prompt('E-mail do cliente:', emailSalvo || '');
  if (!email || !email.includes('@')) return;

  showLoading('Gerando relatório...');
  // Gerar relatório primeiro
  const rg = await apiCall('gerarRelatorioAuditoria', { auditoriaId });
  if (!rg.ok) { hideLoading(); toast('Erro ao gerar: ' + (rg.erro || 'falha')); return; }

  // r107: a Apresentação Executiva (PDF) agora é OBRIGATÓRIA no envio, com
  // o mesmo padrão de exigência do relatório acima — se já existir uma
  // apresentação gerada pra esta auditoria, reaproveita; senão, gera na
  // hora usando A MESMA sequência de chamadas do botão "🎬 Gerar
  // Apresentação" (aguardarPptxGenJS → prepararApresentacaoAuditoria →
  // montarPptxApresentacao → salvarApresentacaoAuditoria), que já é
  // comprovadamente confiável. Nenhum erro é engolido silenciosamente aqui:
  // qualquer falha em qualquer etapa CANCELA o envio e mostra o motivo
  // real na tela, exatamente como já acontecia com o relatório.
  showLoading('Verificando apresentação...');
  const existente = await apiCall('obterApresentacaoAuditoria', { auditoriaId });
  const jaTemPDF = existente.ok && existente.apresentacao && existente.apresentacao.detalhada && existente.apresentacao.detalhada.linkPDF;

  if (!jaTemPDF) {
    const disponivel = await aguardarPptxGenJS();
    if (!disponivel) {
      hideLoading();
      toast('Não foi possível carregar a biblioteca de apresentação (tentamos 3 fontes diferentes). Verifique sua conexão com a internet ou tente em outra rede/dispositivo. Envio cancelado.');
      return;
    }

    showLoading('Preparando dados da apresentação...');
    const prep = await apiCall('prepararApresentacaoAuditoria', { auditoriaId });
    if (!prep.ok) { hideLoading(); toast('Erro ao preparar apresentação: ' + (prep.erro || 'falha ao preparar dados') + '. Envio cancelado.'); return; }

    let salvo;
    try {
      showLoading('Montando apresentação...');
      const pptxB64 = await montarPptxApresentacao(prep, 'detalhada');

      showLoading('Salvando no Drive e convertendo em PDF...');
      salvo = await apiCall('salvarApresentacaoAuditoria', { auditoriaId, detalhadaPPTXBase64: pptxB64 });
    } catch (eMontar) {
      hideLoading();
      toast('Erro ao montar apresentação: ' + eMontar.message + '. Envio cancelado.');
      return;
    }

    if (!salvo.ok) { hideLoading(); toast('Erro ao salvar apresentação: ' + (salvo.erro || 'falha') + '. Envio cancelado.'); return; }
    if (!salvo.detalhada || !salvo.detalhada.linkPDF) {
      hideLoading();
      const motivo = (salvo.detalhada && salvo.detalhada.erroPDF) ? salvo.detalhada.erroPDF : 'conversão para PDF falhou';
      toast('Não foi possível gerar o PDF da apresentação (' + motivo + '). Envio cancelado.');
      return;
    }
  }

  showLoading('Enviando relatório e apresentação...');
  // r130: este e-mail leva só os relatórios; a pesquisa CSAT/NPS tem botão e e-mail próprios (prepararEnvioPesquisa).
  const re = await apiCall('enviarRelatorioAuditoria', { auditoriaId, email });
  hideLoading();
  if (re.ok) {
    toast('Relatório e apresentação enviados para ' + email);
    verHistorico();
  } else {
    toast('Erro: ' + (re.erro || 'falha'));
  }
}

// r130: envio SEPARADO da pesquisa CSAT/NPS. O e-mail explica a qual inventário a pesquisa se refere (cliente, unidade e data).
async function prepararEnvioPesquisa(auditoriaId) {
  const a = (state.histLista || []).find(x => x.id === auditoriaId);
  if (!a) { toast('Análise não encontrada no histórico. Atualize a lista e tente de novo.', 4000); return; }
  if (String(a.tipoAvaliacao || '').toUpperCase().indexOf('DURANTE') === -1) { toast('A pesquisa CSAT/NPS só é enviada em análises DURANTE A OPERAÇÃO', 4000); return; }
  const email = prompt('E-mail do cliente para receber a pesquisa CSAT/NPS\n(' + a.cliente + ' — ' + a.unidade + '):', a.emailCliente || '');
  if (!email || !email.includes('@')) return;
  showLoading('Enviando a pesquisa CSAT/NPS...');
  const urlBaseApp = window.location.href.split('?')[0].split('#')[0].replace(/[^\/]*$/, '');
  const re = await apiCall('enviarPesquisaNps', { auditoriaId, email: email.trim(), urlBaseApp });
  hideLoading();
  if (re.ok) toast('Pesquisa CSAT/NPS enviada para ' + email.trim(), 4000);
  else if (/nao reconhecida|não reconhecida/i.test(String(re.erro || ''))) toast('O script do servidor ainda não tem o envio da pesquisa. Publique a nova versão no Apps Script.', 6000);
  else toast('Erro: ' + (re.erro || 'falha'), 5000);
}

// Fontes alternativas do PptxGenJS 3.12.0, em domínios diferentes do CDN
// principal (usado na tag <script> do <head>). Se o domínio principal
// estiver bloqueado (rede corporativa, extensão de bloqueio etc.), tenta
// os próximos antes de desistir — r70.1.
const PPTXGENJS_CDNS_ALT = [
  'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
  'https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js'
];

function carregarScriptExterno(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { resolve(true); };
    s.onerror = function () { reject(new Error('falha ao carregar ' + url)); };
    document.head.appendChild(s);
  });
}

// Aguarda a lib PptxGenJS carregar (tolera race de timing no load da tag
// <script> do <head>). Se depois de alguns segundos ela ainda não tiver
// carregado — sinal de que o CDN principal está bloqueado/indisponível —
// tenta buscar de fontes alternativas antes de desistir de vez — r70.1.
async function aguardarPptxGenJS() {
  if (typeof PptxGenJS !== 'undefined') return true;

  for (var n = 0; n < 20; n++) { // 20 x 150ms = 3s
    if (typeof PptxGenJS !== 'undefined') return true;
    await new Promise(function (r) { setTimeout(r, 150); });
  }

  for (var i = 0; i < PPTXGENJS_CDNS_ALT.length; i++) {
    try {
      await carregarScriptExterno(PPTXGENJS_CDNS_ALT[i]);
      if (typeof PptxGenJS !== 'undefined') return true;
    } catch (e) { /* tenta a próxima fonte */ }
  }

  return typeof PptxGenJS !== 'undefined';
}

async function gerarApresentacaoVariante(auditoriaId, cliente, unidade, variante) {
  const disponivel = await aguardarPptxGenJS();
  if (!disponivel) {

  if (!confirm('Gerar a apresentação executiva desta auditoria?\n\nSe já existir uma apresentação anterior para esta auditoria, ela será substituída.')) return;

  showLoading('Preparando dados da apresentação...');
  const prep = await apiCall('prepararApresentacaoAuditoria', { auditoriaId });
  if (!prep.ok) { hideLoading(); toast('Erro: ' + (prep.erro || 'falha ao preparar dados')); return; }

  try {
    showLoading('Montando apresentação...');
    const pptxB64 = await montarPptxApresentacao(prep, variante);

    showLoading('Salvando no Drive e convertendo em PDF...');
    const payload = { auditoriaId: auditoriaId, detalhadaPPTXBase64: pptxB64 };

    const salvo = await apiCall('salvarApresentacaoAuditoria', payload);

    if (!salvo.ok) { toast('Erro ao salvar: ' + (salvo.erro || 'falha')); return; }
    mostrarLinksApresentacao(cliente, unidade, salvo, variante, prep);

}

// usando o backend obterApresentacaoAuditoria. Chamado pelos botões
// "Baixar PPTX" / "Baixar PDF" do Histórico.

  showLoading('Buscando apresentação...');

  hideLoading();

  if (!r.ok || !r.apresentacao || !r.apresentacao.detalhada) {
    toast('Ainda não existe uma apresentação gerada para esta auditoria. Use "🎬 Gerar Apresentação" primeiro.');
    return;
  }

  const obj = r.apresentacao.detalhada;
  const link = tipo === 'pdf' ? obj.linkPDF : obj.linkPPTX;

  if (!link) {
    if (tipo === 'pdf') {
      toast('O PDF desta apresentação não foi gerado' + (obj.erroPDF ? (': ' + obj.erroPDF) : '') + '. Abra o PPTX e exporte como PDF, se precisar.');
    } else {
      toast('O PPTX desta apresentação não está disponível. Gere a apresentação novamente.');

    return;

}

function mostrarLinksApresentacao(cliente, unidade, salvo, variante, prep) {
  const obj = salvo[variante];

  function escHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  const bloco = (!obj || (!obj.linkPPTX && !obj.linkPDF))
    ? `<div style="font-size:12px;color:var(--text-light);margin-top:10px">Não foi possível gerar a apresentação.</div>`
    : `
      <div style="display:flex;gap:6px;margin-top:14px">
        ${obj.linkPPTX ? `<a class="btn-fc btn-fc-outline" style="width:auto;flex:1;padding:8px;font-size:11px;text-decoration:none;text-align:center" href="${obj.linkPPTX}" target="_blank">📽️ PPTX</a>` : ''}
        ${obj.linkPDF ? `<a class="btn-fc btn-fc-navy" style="width:auto;flex:1;padding:8px;font-size:11px;text-decoration:none;text-align:center" href="${obj.linkPDF}" target="_blank">📄 PDF</a>` : ''}
      </div>
      ${(obj.linkPPTX && !obj.linkPDF) ? `<div style="font-size:11px;color:var(--text-light);margin-top:8px">PPTX gerado; a conversão automática para PDF falhou${obj.erroPDF ? (': <strong>' + escHtml(obj.erroPDF) + '</strong>') : ''}. Abra o PPTX e exporte como PDF, se precisar.</div>` : ''}`;

  // r73: aviso de diagnóstico de fotos — só aparece quando existem fotos
  // no Drive para esta auditoria mas nenhuma entrou na apresentação
  // (sinal de falha ao baixar do Drive, não de auditoria sem fotos).
  let avisoFotos = '';
  if (prep && prep.fotosDisponiveis > 0 && prep.fotosIncluidas === 0) {
    avisoFotos = `<div style="font-size:11px;color:#E05252;background:#FDEAEA;padding:8px;border-radius:8px;margin-top:10px;text-align:left">⚠️ Havia ${prep.fotosDisponiveis} foto(s) anexada(s) a esta auditoria, mas nenhuma pôde ser incluída na apresentação. Gere de novo e, se persistir, avise — isso indica falha ao baixar as fotos do Drive.</div>`;
  } else if (prep && typeof prep.fotosIncluidas === 'number') {
    avisoFotos = `<div style="font-size:10px;color:var(--text-light);margin-top:10px">${prep.fotosIncluidas} foto(s) incluída(s) na apresentação.</div>`;
  }

  $('#app').innerHTML = `
    <div class="tela-inicial">
      <div class="secao-card" style="text-align:center">
        <div style="font-size:40px;margin-bottom:8px">🎬</div>
        <h2 style="font-size:18px;color:var(--navy);margin-bottom:4px">Apresentação Gerada</h2>
        <p style="color:var(--text-light);margin-bottom:4px">${cliente} — ${unidade}</p>
        ${bloco}
        ${avisoFotos}
        <button class="btn-fc btn-fc-outline" onclick="verHistorico()" style="margin-top:24px">
          <i class="bi bi-arrow-left"></i> Voltar ao Histórico
        </button>
      </div>
    </div>`;
}

// Monta o PPTX (curta ou detalhada) e resolve com o base64 do arquivo.
function montarPptxApresentacao(prep, variante) {
  return new Promise(function(resolve, reject) {
    try {
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_16x9';

      const NAVY='002B50', GREEN='61CF00', DARK='051323', ORANGE='E8872B', BODY='556677', LABEL='8899AA';
      const isDetalhada = (variante === 'detalhada');
      const ident = prep.ident || {};
      const scores = prep.scores || {};
      const estrutura = prep.estrutura || [];
      const textos = prep.textos || {};
      const fotosSet = prep.fotosDetalhada || [];

      // r112: margens seguras (0,5 pol no painel e na base) — ver "LAYOUT DE SLIDES — MARGENS"
      function addLogo(s) {
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:PPT_PAINEL_X, y:4.5, w:PPT_PAINEL_W, h:0.635 }); } catch(e) {} }
      }
      function splitBg(s) {
        s.background = { fill:'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x:6.8, y:0, w:3.2, h:5.625, fill:{ color: DARK } });
        addLogo(s);
      }
      function corScore(v) {
        v = parseFloat(v) || 0;
        if (v >= 7.5) return GREEN;
        if (v >= 6) return 'D4A017';
        if (v >= 4) return ORANGE;
        return 'E05252';
      }
      function painelInfo(s) {
        const nome = (ident.cliente||'') + '\n' + (ident.unidade||'');
        const hNome = Math.min(1.1, pptMedirAltura(nome, PPT_PAINEL_W, 12, 1.1));
        s.addText(nome, { x:PPT_PAINEL_X, y:0.8, w:PPT_PAINEL_W, h:hNome, fontSize:12, fontFace:'Arial', bold:true, color:'FFFFFF', isTextBox:true, margin:0, valign:'top' });
        const info = (ident.data_auditoria||'') + '\n' + (ident.tipo_avaliacao||'');
        s.addText(info, { x:PPT_PAINEL_X, y:0.8 + hNome + 0.12, w:PPT_PAINEL_W, h:Math.min(1.2, pptMedirAltura(info, PPT_PAINEL_W, 10, 1.4)), fontSize:10, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
      }

      // r112: slide(s) de texto corrido — reduz a fonte e, se preciso, continua no slide seguinte
      function slideTexto(rot, a, b, texto, italico) {
        texto = String(texto || '').trim();
        if (!texto) return;
        const hMax = PPT_Y_MAX - 1.7;
        let fs = pptFonteQueCabe(texto, PPT_W_ESQ, hMax, 12, 10.5, 1.4);
        const partes = fs ? [texto] : pptDividirTexto(texto, PPT_W_ESQ, hMax, (fs = 11), 1.4);
        partes.forEach(function(p, i) {
          const sx = pres.addSlide();
          splitBg(sx);
          rotulo(sx, rot + (i > 0 ? ' (CONT.)' : ''));
          sx.addText([{ text:a, options:{ color: DARK } }, { text:b + (i > 0 ? ' (cont.)' : ''), options:{ color: GREEN } }], { x:0.8, y:0.9, w:5.7, h:0.6, fontSize:pptTituloFs(a + b + (i > 0 ? ' (cont.)' : ''), 5.7, 26, 16), fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
          sx.addText(p, { x:0.8, y:1.7, w:5.7, h:Math.min(hMax, pptMedirAltura(p, 5.7, fs, 1.4)), fontSize:fs, fontFace:'Arial', color: BODY, italic: !!italico, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
          painelInfo(sx);
        });
      }

      // r100: estima a altura (em polegadas) que um bloco de texto vai
      // ocupar num text box do PptxGenJS, a partir do tamanho da fonte e
      // da largura disponível — usado para dimensionar as caixas de
      // texto dinamicamente e evitar que um bloco sobreponha o próximo.
      function estimarAlturaTexto(texto, larguraPol, fontSize, lineSpacingMultiple) {
        texto = String(texto || '');
        if (!texto) return 0.3;
        lineSpacingMultiple = lineSpacingMultiple || 1.2;
        const charsPorLinha = Math.max(10, Math.floor((larguraPol * 72) / (fontSize * 0.52)));
        let linhas = 0;
        texto.split('\n').forEach(function(par) {
          linhas += Math.max(1, Math.ceil(par.length / charsPorLinha));
        });
        const alturaLinha = (fontSize * 1.22 * lineSpacingMultiple) / 72;
        return Math.max(0.3, linhas * alturaLinha + 0.12);
      }

      // r100: centraliza as fotos de uma seção dentro de uma grade de até
      // 3 colunas, dentro da área (areaX, areaY, areaW, areaH) informada.
      function montarGradeFotos(s, fotos, areaX, areaY, areaW, areaH) {
        if (!fotos.length) return;
        const cols = fotos.length <= 1 ? 1 : (fotos.length <= 4 ? 2 : 3);
        const rows = Math.ceil(fotos.length / cols);
        const cellW = areaW / cols;
        const cellH = areaH / rows;
        const tam = Math.max(0.1, Math.min(cellW, cellH) - 0.15);
        fotos.forEach(function(f, idx) {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const cx = areaX + col * cellW + (cellW - tam) / 2;
          const cy = areaY + row * cellH + (cellH - tam) / 2;
          try {
            s.addImage({ data:'data:image/jpeg;base64,' + f.base64, x: cx, y: cy, w: tam, h: tam });
          } catch(e) {}
        });
      }

      // r100: número máximo de fotos por slide — seções com mais fotos
      // que isso ganham slides extras de continuação.
      const MAX_FOTOS_POR_SLIDE = 6;

      let numSecao = 0;
      function rotulo(s, texto) {
        numSecao++;
        const n = numSecao < 10 ? '0' + numSecao : String(numSecao);
        s.addText(n + ' / ' + texto, { x:0.8, y:0.45, w:5.5, h:0.25, fontSize:9, fontFace:'Arial', bold:true, color: GREEN, isTextBox:true, margin:0, charSpacing:3 });
      }

      /* Slide 1 — Capa */
      const s1 = pres.addSlide();
      s1.background = { fill: DARK };
      s1.addShape(pres.ShapeType.rect, { x:0, y:0, w:10, h:0.04, fill:{ color: GREEN } });
      s1.addText([
        { text:'Análise de ', options:{ color:'FFFFFF', fontSize:30, fontFace:'Calibri', bold:true } },
        { text:'Preparação para Inventário', options:{ color: GREEN, fontSize:30, fontFace:'Calibri', bold:true } }
      ], { x:0.8, y:0.7, w:8.4, h:1.1, isTextBox:true, margin:0 });
      s1.addText('Apresentação Executiva', { x:0.8, y:1.85, w:6, h:0.4, fontSize:16, fontFace:'Calibri', color: GREEN, isTextBox:true, margin:0 });
      const sub = (ident.cliente||'') + ' — ' + (ident.unidade||'') + '  ·  ' + (ident.data_auditoria||'');
      s1.addText(sub, { x:0.8, y:2.45, w:8.4, h:Math.min(1.2, pptMedirAltura(sub, 8.4, 13, 1.1)), fontSize:13, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, valign:'top' });
      if (LOGO_APRESENTACAO_DATA_URL) { try { s1.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:3.2, y:4.15, w:3.6, h:0.94 }); } catch(e) {} }

      /* Slide 2 — Indicadores */
      const s2 = pres.addSlide();
      splitBg(s2);
      rotulo(s2, 'INDICADORES-CHAVE');
      s2.addText([
        { text:'Score da ', options:{ color: DARK } },
        { text:'Preparação', options:{ color: GREEN } }
      ], { x:0.8, y:0.9, w:5.6, h:0.6, fontSize:26, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });

      const dims = [
        { label:'SCORE GERAL', valor:(scores.geral||'—') + '/10', cor: corScore(scores.geral) },
        { label:'SCORE EQUIPE DE APOIO', valor:(scores.equipe||'—') + '/10', cor: corScore(scores.equipe) }
      ];
      estrutura.forEach(function(e) {
        dims.push({ label: String(e.estrutura||'').toUpperCase(), valor: e.media + '/10', cor: corScore(e.media) });
      });
      dims.forEach(function(d, i) {
        const ky = 1.75 + i * 0.62;
        s2.addShape(pres.ShapeType.rect, { x:0.8, y:ky, w:0.04, h:0.42, fill:{ color: d.cor } });
        s2.addText(d.valor, { x:1.05, y:ky, w:1.6, h:0.32, fontSize:20, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
        s2.addText(d.label, { x:2.75, y:ky+0.05, w:3.2, h:0.3, fontSize:10, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, charSpacing:1 });
      });
      painelInfo(s2);

      /* Slide 2b — Notas por Setor (só na Detalhada) — r72 */
      const notasPorSetor = prep.notasPorSetor || [];
      if (isDetalhada && notasPorSetor.length) {
        const POR_SLIDE_SETOR = 6;   // 1,75 + 6 x 0,5 = 4,75 pol: dentro da margem inferior
        for (let ini = 0; ini < notasPorSetor.length; ini += POR_SLIDE_SETOR) {
          const sN = pres.addSlide();
          splitBg(sN);
          rotulo(sN, 'NOTAS POR SETOR');
          sN.addText([
            { text:'Notas ', options:{ color: DARK } },
            { text:'por Setor' + (ini > 0 ? ' (cont.)' : ''), options:{ color: GREEN } }
          ], { x:0.8, y:0.9, w:5.7, h:0.6, fontSize:26, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
          notasPorSetor.slice(ini, ini + POR_SLIDE_SETOR).forEach(function(n, i) {
            const ky = 1.75 + i * 0.5;
            sN.addShape(pres.ShapeType.rect, { x:0.8, y:ky, w:0.04, h:0.34, fill:{ color: corScore(n.media) } });
            sN.addText(n.media + '/10', { x:1.05, y:ky-0.03, w:1.15, h:0.32, fontSize:16, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
            sN.addText(pptTruncar(n.setor, 46), { x:2.3, y:ky+0.02, w:4.0, h:0.3, fontSize:10, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0 });
          });
          painelInfo(sN);
        }
      }

      /* Slide 3 — Resumo (cenário geral) */
      const resumoTxt = isDetalhada ? (textos.resumo_detalhado || textos.resumo_curto || '') : (textos.resumo_curto || '');
      // r112: fonte reduzida e, se ainda não couber, continua no slide seguinte (nada invade a margem)
      slideTexto('RESUMO', 'Cenário ', 'Geral', resumoTxt);

      /* Slides seguintes — um por seção com foto e/ou observação
         disponível (r72: não depende mais só de ter foto), com a
         observação do auditor (reescrita pela IA) quando existir. */
      fotosSet.forEach(function(secao) {
        const meta = SECOES_META_APRESENTACAO[secao.secaoId] || {};
        const fotos = secao.fotos || [];
        let obsTxt = '';
        if (meta.obsId && textos.observacoes && textos.observacoes[meta.obsId]) {
          const o = textos.observacoes[meta.obsId];
          obsTxt = isDetalhada ? (o.detalhada || o.curta || '') : (o.curta || '');
        }
        // r100: nunca gera slide vazio — uma seção sem foto e sem
        // observação (nem do auditor, nem da rede de segurança do
        // backend) é simplesmente pulada.
        if (!fotos.length && !obsTxt) return;

        // r100: seções com mais de MAX_FOTOS_POR_SLIDE fotos ganham
        // slides extras de continuação, em vez de espremer tudo num só.
        // r112: se a observação não couber (nem com fonte 9) acima das fotos, ela vai para slide(s)
        // próprio(s) de observações — nada é cortado e nada invade a margem.
        let obsFs = 11, obsNoSlideProprio = false;
        if (obsTxt) {
          const f = pptFonteQueCabe(obsTxt, 5.7, 1.5, 11, 9, 1.3);
          if (f) obsFs = f; else obsNoSlideProprio = true;
        }
        if (obsTxt && obsNoSlideProprio) {
          slideTexto('OBSERVAÇÕES', (secao.titulo || meta.titulo || '') + ' — ', 'Observações', obsTxt, true);
        }
        const totalPaginas = Math.max(1, Math.ceil(fotos.length / MAX_FOTOS_POR_SLIDE));
        if (!fotos.length && obsNoSlideProprio) return;   // só tinha observação e ela já foi colocada
        for (let pagina = 0; pagina < totalPaginas; pagina++) {
          const s = pres.addSlide();
          splitBg(s);
          const fotosDaPagina = fotos.slice(pagina * MAX_FOTOS_POR_SLIDE, (pagina + 1) * MAX_FOTOS_POR_SLIDE);
          const temFotos = fotosDaPagina.length > 0;
          rotulo(s, temFotos ? 'REGISTROS FOTOGRÁFICOS' : 'OBSERVAÇÕES');
          const tituloTxt = (secao.titulo || meta.titulo || '') + (pagina > 0 ? ' (continuação)' : '');
          s.addText(tituloTxt, { x:0.8, y:0.9, w:5.7, h:0.55, fontSize:pptTituloFs(tituloTxt, 5.7, 22, 13), fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });

          let yFotos = 1.55;
          if (obsTxt && !obsNoSlideProprio && pagina === 0) {
            // r100: altura calculada a partir do texto real, em vez de
            // fixa em 0.85in, para não sobrepor a grade de fotos abaixo.
            const obsH = Math.min(1.5, pptMedirAltura(obsTxt, 5.7, obsFs, 1.3));
            s.addText(obsTxt, { x:0.8, y:1.5, w:5.7, h:obsH, fontSize:obsFs, fontFace:'Arial', color: BODY, italic:true, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
            yFotos = 1.5 + obsH + 0.15;
          }
          montarGradeFotos(s, fotosDaPagina, 0.8, yFotos, 5.7, Math.max(0.8, PPT_Y_MAX - yFotos));
          painelInfo(s);
        }
      });

      /* Slide final — Pontos fortes e oportunidades (r112: blocos que não cabem passam ao slide seguinte) */
      const itensFinal = [];
      if (textos.pontos_fortes) itensFinal.push({ cor: GREEN, marca: '✓', texto: textos.pontos_fortes });
      if (textos.oportunidades) itensFinal.push({ cor: ORANGE, marca: '!', texto: textos.oportunidades });
      while (itensFinal.length) {
        const sF = pres.addSlide();
        splitBg(sF);
        rotulo(sF, 'CONCLUSÃO');
        sF.addText([
          { text:'Pontos-Chave ', options:{ color: DARK } },
          { text:'e Oportunidades', options:{ color: GREEN } }
        ], { x:0.8, y:0.9, w:5.7, h:0.6, fontSize:24, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
        let cy = 1.8;
        while (itensFinal.length) {
          const it = itensFinal[0];
          const disp = PPT_Y_MAX - cy;
          const fs = pptFonteQueCabe(it.texto, 5.3, disp, 11, 9.5, 1.3);
          if (fs) {
            const h = pptMedirAltura(it.texto, 5.3, fs, 1.3);
            sF.addShape(pres.ShapeType.ellipse, { x:0.8, y:cy, w:0.25, h:0.25, fill:{ color: it.cor } });
            sF.addText(it.marca, { x:0.8, y:cy, w:0.25, h:0.25, fontSize:12, bold:true, color:'FFFFFF', align:'center', valign:'middle', isTextBox:true, margin:0 });
            sF.addText(it.texto, { x:1.15, y:cy-0.05, w:5.3, h:h, fontSize:fs, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
            cy += h + 0.25;
            itensFinal.shift();
          } else if (cy > 1.85) {
            break;
          } else {
            const pedacos = pptDividirTexto(it.texto, 5.3, disp, 10, 1.3);
            itensFinal.shift();
            for (let k = pedacos.length - 1; k >= 0; k--) itensFinal.unshift({ cor: it.cor, marca: it.marca, texto: pedacos[k] });
          }
        }
        painelInfo(sF);
      }

      pres.write('base64').then(resolve).catch(reject);
    } catch (e) {
      reject(e);
    }
  });
}

/* ═══════════════════════════════════════════════════════
   LAYOUT DE SLIDES — MARGENS (r112)
   Regras comuns às apresentações (Análise e Performance):
   - conteúdo nunca passa de PPT_Y_MAX (margem inferior de 0,525 pol);
   - texto que não cabe reduz a fonte e, se ainda não couber, CONTINUA no
     slide seguinte (nada é cortado nem invade a margem);
   - painel escuro: texto com 0,5 pol de margem à direita.
   ═══════════════════════════════════════════════════════ */
const PPT_H = 5.625;
const PPT_Y_MAX = 5.1;          // limite inferior do conteúdo
const PPT_X_ESQ = 0.8;          // início da coluna de conteúdo
const PPT_W_ESQ = 5.7;          // largura da coluna (termina em 6,5; o painel escuro começa em 6,8)
const PPT_PAINEL_X = 7.05;      // texto do painel escuro
const PPT_PAINEL_W = 2.45;      // termina em 9,5 (margem direita de 0,5)

// Quantas linhas um parágrafo ocupa (quebra por palavras, como o PowerPoint/Google Slides).
function pptContarLinhas(par, cpl) {
  const palavras = String(par).split(/\s+/).filter(Boolean);
  if (!palavras.length) return 1;
  let linhas = 1, atual = 0;
  palavras.forEach(function(p) {
    const len = p.length;
    if (len > cpl) {
      if (atual > 0) { linhas++; atual = 0; }
      linhas += Math.floor(len / cpl);
      atual = len % cpl;
      return;
    }
    if (atual === 0) atual = len;
    else if (atual + 1 + len <= cpl) atual += 1 + len;
    else { linhas++; atual = len; }
  });
  return linhas;
}
// Altura (pol) de um texto: estimativa CONSERVADORA (largura média do caractere = 0,56 x fonte).
function pptMedirAltura(texto, larguraPol, fontSize, lsm) {
  texto = String(texto || '');
  if (!texto) return 0.3;
  lsm = lsm || 1.2;
  const cpl = Math.max(6, Math.floor((larguraPol * 72) / (fontSize * 0.56)));
  let linhas = 0;
  texto.split('\n').forEach(function(par) { linhas += pptContarLinhas(par, cpl); });
  return linhas * (fontSize * 1.2 * lsm) / 72 + 0.1;
}
// Maior fonte (entre max e min) em que o texto cabe na altura disponível; 0 = não cabe nem na mínima.
function pptFonteQueCabe(texto, larguraPol, hMax, fsMax, fsMin, lsm) {
  for (let fs = fsMax; fs >= fsMin - 0.001; fs -= 0.5) {
    if (pptMedirAltura(texto, larguraPol, fs, lsm) <= hMax) return fs;
  }
  return 0;
}
// Divide um texto longo em partes que cabem na altura (por frases; se uma frase sozinha não cabe, por palavras).
function pptDividirTexto(texto, larguraPol, hMax, fontSize, lsm) {
  texto = String(texto || '').trim();
  if (!texto) return [''];
  const unidades = [];
  texto.split(/\n+/).forEach(function(par, ip) {
    (par.match(/[^.!?…]+[.!?…]*\s*/g) || [par]).forEach(function(f, i) {
      const t = f.trim();
      if (t) unidades.push({ t: t, novoPar: ip > 0 && i === 0 });
    });
  });
  const cabe = function(t) { return pptMedirAltura(t, larguraPol, fontSize, lsm) <= hMax; };
  const partes = [];
  let atual = '';
  unidades.forEach(function(u) {
    const sep = atual ? (u.novoPar ? '\n\n' : ' ') : '';
    const tent = atual + sep + u.t;
    if (cabe(tent)) { atual = tent; return; }
    if (atual) { partes.push(atual); atual = ''; }
    if (cabe(u.t)) { atual = u.t; return; }
    let acum = '';
    u.t.split(/\s+/).forEach(function(p) {
      const t2 = acum ? acum + ' ' + p : p;
      if (cabe(t2)) acum = t2;
      else { if (acum) partes.push(acum); acum = p; }
    });
    atual = acum;
  });
  if (atual) partes.push(atual);
  return partes.length ? partes : [texto];
}
// Tamanho de fonte de um título de uma linha para caber na largura.
function pptTituloFs(txt, larguraPol, fsMax, fsMin) {
  const fs = Math.floor((larguraPol * 72) / (Math.max(1, String(txt).length) * 0.56));
  return Math.max(fsMin, Math.min(fsMax, fs));
}
function pptTruncar(t, n) { t = String(t || ''); return t.length > n ? t.substring(0, n - 1) + '…' : t; }

/* ═══════════════════════════════════════════════════════
   APRESENTAÇÃO DE PERFORMANCE (PPTX) — r110 · margens e gráfico r112
   Mesmo estilo visual da Apresentação Executiva da análise
   (capa escura, painel lateral escuro, verde da marca).
   O gráfico de barras é desenhado com formas (nome da unidade sempre
   aparece, em qualquer leitor: PowerPoint, Google Slides, PDF).
   ═══════════════════════════════════════════════════════ */
function montarPptxPerformance(prep) {
  return new Promise(function(resolve, reject) {
    try {
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_16x9';
      const NAVY='002B50', GREEN='61CF00', DARK='051323', ORANGE='E8872B', BODY='556677', LABEL='8899AA';
      const cli = prep.cliente;
      const textos = prep.textos || {};
      const periodoTxt = prep.periodoTxt || '';
      const fmt = function(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1).replace('.', ','); };
      const corHex = function(n) {
        if (n === null || n === undefined || isNaN(n)) return '9AA7B4';
        if (n >= 9) return '2E7D32';
        if (n >= 7.5) return GREEN;
        if (n >= 6) return 'D4A017';
        if (n >= 4) return ORANGE;
        return 'E05252';
      };
      const bgHex = function(n) {
        if (n === null || n === undefined || isNaN(n)) return 'F4F6F8';
        if (n >= 9) return 'E8F5E9';
        if (n >= 7.5) return 'EAF8E0';
        if (n >= 6) return 'FFF8E1';
        if (n >= 4) return 'FFF3E0';
        return 'FDEAEA';
      };
      const deltaTxt = function(v) { return (v === null || v === undefined) ? '—' : (v === 0 ? '= 0,0' : (v > 0 ? '▲ +' : '▼ ') + fmt(v)); };
      const deltaCor = function(v) { return (v === null || v === undefined || v === 0) ? '6B7B8D' : (v > 0 ? '2E7D32' : 'C0392B'); };

      function addLogo(s) {
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:PPT_PAINEL_X, y:4.5, w:PPT_PAINEL_W, h:0.635 }); } catch(e) {} }
      }
      function splitBg(s) {
        s.background = { fill:'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x:6.8, y:0, w:3.2, h:PPT_H, fill:{ color: DARK } });
        addLogo(s);
      }
      function painelInfo(s, linha3) {
        const nome = String(cli.cliente || '');
        const hNome = Math.min(0.9, pptMedirAltura(nome, PPT_PAINEL_W, 12, 1.1));
        s.addText(nome, { x:PPT_PAINEL_X, y:0.8, w:PPT_PAINEL_W, h:hNome, fontSize:12, fontFace:'Arial', bold:true, color:'FFFFFF', isTextBox:true, margin:0, valign:'top' });
        const info = periodoTxt + (linha3 ? '\n' + linha3 : '');
        s.addText(info, { x:PPT_PAINEL_X, y:0.8 + hNome + 0.12, w:PPT_PAINEL_W, h:Math.min(1.5, pptMedirAltura(info, PPT_PAINEL_W, 10, 1.4)), fontSize:10, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
      }
      let numSecao = 0;
      function rotulo(s, texto) {
        numSecao++;
        const n = numSecao < 10 ? '0' + numSecao : String(numSecao);
        s.addText(n + ' / ' + texto, { x:PPT_X_ESQ, y:0.45, w:PPT_W_ESQ, h:0.25, fontSize:9, fontFace:'Arial', bold:true, color: GREEN, isTextBox:true, margin:0, charSpacing:3 });
      }
      function titulo2(s, a, b, w) {
        w = w || PPT_W_ESQ;
        const fs = pptTituloFs(a + b, w, 24, 16);
        s.addText([{ text:a, options:{ color: DARK } }, { text:b, options:{ color: GREEN } }], { x:PPT_X_ESQ, y:0.9, w:w, h:0.6, fontSize:fs, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
      }
      // slide de largura total (tabelas): faixa fina superior + logo pequeno no canto
      function fullBg(s) {
        s.background = { fill:'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x:0, y:0, w:10, h:0.5, fill:{ color: DARK } });
        s.addShape(pres.ShapeType.rect, { x:0, y:0.5, w:10, h:0.04, fill:{ color: GREEN } });
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:7.4, y:0.07, w:2.1, h:0.36 }); } catch(e) {} }
      }
      function rotuloFull(s, texto) {
        numSecao++;
        const n = numSecao < 10 ? '0' + numSecao : String(numSecao);
        s.addText(n + ' / ' + texto, { x:0.5, y:0.1, w:6.5, h:0.3, fontSize:9, fontFace:'Arial', bold:true, color: GREEN, isTextBox:true, margin:0, charSpacing:3 });
      }
      function tituloFull(s, a, b) {
        s.addText([{ text:a, options:{ color: DARK } }, { text:b, options:{ color: GREEN } }], { x:0.5, y:0.7, w:9, h:0.5, fontSize:pptTituloFs(a + b, 9, 22, 16), fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
      }
      function notaRodape(s, txt) {
        s.addText(txt, { x:0.5, y:4.98, w:9, h:0.3, fontSize:8, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, valign:'top' });
      }

      // Slide(s) de texto corrido: reduz a fonte e, se necessário, continua em outro slide.
      function slideTexto(rot, a, b, texto) {
        texto = String(texto || '').trim();
        if (!texto) return;
        const hMax = PPT_Y_MAX - 1.7;
        let fs = pptFonteQueCabe(texto, PPT_W_ESQ, hMax, 12, 10.5, 1.4);
        const partes = fs ? [texto] : pptDividirTexto(texto, PPT_W_ESQ, hMax, (fs = 11), 1.4);
        partes.forEach(function(p, i) {
          const s = pres.addSlide();
          splitBg(s);
          rotulo(s, rot + (i > 0 ? ' (CONT.)' : ''));
          titulo2(s, a, b + (i > 0 ? ' (cont.)' : ''));
          s.addText(p, { x:PPT_X_ESQ, y:1.7, w:PPT_W_ESQ, h:Math.min(hMax, pptMedirAltura(p, PPT_W_ESQ, fs, 1.4)), fontSize:fs, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
          painelInfo(s);
        });
      }

      /* 1 — Capa */
      const s1 = pres.addSlide();
      s1.background = { fill: DARK };
      s1.addShape(pres.ShapeType.rect, { x:0, y:0, w:10, h:0.04, fill:{ color: GREEN } });
      s1.addText([
        { text:'Análise de ', options:{ color:'FFFFFF', fontSize:30, fontFace:'Calibri', bold:true } },
        { text:'Performance das Unidades', options:{ color: GREEN, fontSize:30, fontFace:'Calibri', bold:true } }
      ], { x:0.8, y:0.7, w:8.4, h:1.1, isTextBox:true, margin:0 });
      s1.addText('Apresentação Executiva', { x:0.8, y:1.85, w:6, h:0.4, fontSize:16, fontFace:'Calibri', color: GREEN, isTextBox:true, margin:0 });
      const subCapa = String(cli.cliente || '') + '  ·  ' + periodoTxt;
      s1.addText(subCapa, { x:0.8, y:2.45, w:8.4, h:Math.min(0.9, pptMedirAltura(subCapa, 8.4, 13, 1.1)), fontSize:13, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, valign:'top' });
      if (prep.tipoTxt) s1.addText(prep.tipoTxt, { x:0.8, y:3.4, w:8.4, h:0.3, fontSize:11, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0 });
      if (LOGO_APRESENTACAO_DATA_URL) { try { s1.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:3.2, y:4.15, w:3.6, h:0.94 }); } catch(e) {} }

      /* 2 — Indicadores-chave */
      const s2 = pres.addSlide();
      splitBg(s2);
      rotulo(s2, 'INDICADORES-CHAVE');
      titulo2(s2, 'Nota do ', 'Cliente');
      const kpis = [
        { label:'NOTA MÉDIA DO CLIENTE' + (cli.faixa ? ' · ' + String(cli.faixa).toUpperCase() : ''), valor: fmt(cli.geral) + '/10', cor: corHex(cli.geral) },
        { label:'UNIDADES AVALIADAS', valor: String(cli.unidades), cor: NAVY },
        { label:'ANÁLISES NO PERÍODO', valor: String(cli.analises), cor: NAVY },
        { label:'VARIAÇÃO VS PERÍODO ANTERIOR', valor: deltaTxt(cli.variacao.geral), cor: deltaCor(cli.variacao.geral) }
      ];
      if (cli.organizacao !== null && cli.organizacao !== undefined) kpis.push({ label:'ORGANIZAÇÃO (MÉDIA)', valor: fmt(cli.organizacao) + '/10', cor: corHex(cli.organizacao) });
      if (cli.volume !== null && cli.volume !== undefined) kpis.push({ label:'VOLUME (MÉDIA · 10 = IDEAL)', valor: fmt(cli.volume) + '/10', cor: corHex(cli.volume) });
      kpis.forEach(function(k, i) {
        const ky = 1.7 + i * 0.58;
        s2.addShape(pres.ShapeType.rect, { x:0.8, y:ky, w:0.04, h:0.4, fill:{ color: k.cor } });
        s2.addText(k.valor, { x:1.05, y:ky, w:1.8, h:0.32, fontSize:19, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
        s2.addText(k.label, { x:2.95, y:ky+0.04, w:3.5, h:0.3, fontSize:9, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, charSpacing:1 });
      });
      painelInfo(s2, cli.unidades + ' unidade(s)');

      /* 3 — Resumo executivo */
      slideTexto('RESUMO EXECUTIVO', 'Resumo ', 'Executivo', [textos.resumo_executivo, textos.evolucao].filter(Boolean).join('\n\n'));

      /* 4 — Comparativo: gráfico de barras desenhado com formas (8 unidades por slide) */
      const comNota = cli.lista.filter(function(u) { return u.geral !== null && u.geral !== undefined; });
      const POR_GRAFICO = 8;
      for (let ini = 0; ini < comNota.length; ini += POR_GRAFICO) {
        const lote = comNota.slice(ini, ini + POR_GRAFICO);
        const sG = pres.addSlide();
        splitBg(sG);
        rotulo(sG, 'COMPARATIVO ENTRE UNIDADES');
        titulo2(sG, 'Nota por ', 'Unidade' + (ini > 0 ? ' (cont.)' : ''));
        const xNome = PPT_X_ESQ, wNome = 2.15, xTrilho = 3.05, wTrilho = 2.85, yIni = 1.7, passo = 0.4;
        lote.forEach(function(u, i) {
          const y = yIni + i * passo;
          sG.addText(pptTruncar(u.unidade, 60), { x:xNome, y:y, w:wNome, h:0.34, fontSize:8.5, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, valign:'middle', align:'right' });
          sG.addShape(pres.ShapeType.rect, { x:xTrilho, y:y+0.07, w:wTrilho, h:0.2, fill:{ color:'EEF1F4' }, line:{ color:'EEF1F4', width:0 } });
          sG.addShape(pres.ShapeType.rect, { x:xTrilho, y:y+0.07, w:Math.max(0.04, wTrilho * u.geral / 10), h:0.2, fill:{ color: corHex(u.geral) }, line:{ color: corHex(u.geral), width:0 } });
          sG.addText(fmt(u.geral), { x:xTrilho + wTrilho + 0.08, y:y, w:0.55, h:0.34, fontSize:10, fontFace:'Arial', bold:true, color: DARK, isTextBox:true, margin:0, valign:'middle' });
        });
        const yEixo = yIni + lote.length * passo + 0.02;
        [0, 5, 10].forEach(function(v) {
          sG.addText(String(v), { x:xTrilho + wTrilho * v / 10 - 0.2, y:yEixo, w:0.4, h:0.2, fontSize:8, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, align:'center' });
        });
        painelInfo(sG, 'Nota média por unidade (0 a 10)');
      }

      /* 5 — Tabela comparativa (largura total; 7 unidades por slide) */
      const POR_TABELA = 7;
      for (let ini = 0; ini < cli.lista.length; ini += POR_TABELA) {
        const lote = cli.lista.slice(ini, ini + POR_TABELA);
        const sT = pres.addSlide();
        fullBg(sT);
        rotuloFull(sT, 'TABELA COMPARATIVA');
        tituloFull(sT, 'Comparativo ', 'entre Unidades' + (ini > 0 ? ' (cont.)' : ''));
        const cab = ['Unidade', 'Geral', 'Equipe', 'Retaguarda', 'Área de Vendas', 'Variação vs anterior'].map(function(t, i) {
          return { text:t, options:{ bold:true, color:'FFFFFF', fill:{ color: NAVY }, fontSize:10, fontFace:'Arial', align: i === 0 ? 'left' : 'center', valign:'middle' } };
        });
        const cel = function(v) { return { text: fmt(v), options:{ bold:true, color: corHex(v), fill:{ color: bgHex(v) }, fontSize:11, fontFace:'Arial', align:'center', valign:'middle' } }; };
        const linhas = lote.map(function(u) {
          return [
            { text: pptTruncar(u.unidade, 34), options:{ bold:true, color: NAVY, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } },
            cel(u.geral), cel(u.equipe), cel(u.retaguarda), cel(u.areaVendas),
            { text: deltaTxt(u.variacao.geral), options:{ bold:true, color: deltaCor(u.variacao.geral), fontSize:10, fontFace:'Arial', align:'center', valign:'middle' } }
          ];
        });
        if (ini + POR_TABELA >= cli.lista.length) {
          linhas.push([
            { text:'Média do cliente', options:{ bold:true, color: DARK, fill:{ color:'F0F2F4' }, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } },
            cel(cli.geral), cel(cli.equipe), cel(cli.retaguarda), cel(cli.areaVendas),
            { text: deltaTxt(cli.variacao.geral), options:{ bold:true, color: deltaCor(cli.variacao.geral), fill:{ color:'F0F2F4' }, fontSize:10, fontFace:'Arial', align:'center', valign:'middle' } }
          ]);
        }
        sT.addTable([cab].concat(linhas), { x:0.5, y:1.35, w:9, colW:[3.0, 1.0, 1.0, 1.3, 1.5, 1.2], rowH:0.38, border:{ type:'solid', color:'E2E8F0', pt:0.75 } });
        notaRodape(sT, 'Nota da unidade = média das análises do período · nota do cliente = média das unidades · "—" = não avaliado.');
      }

      /* 6 — Leitura comparativa (texto) */
      slideTexto('LEITURA COMPARATIVA', 'Leitura ', 'Comparativa', textos.comparativo);

      /* 7 — Organização x Volume: texto + tabelas (7 unidades por slide) */
      const temOV = cli.lista.some(function(u) { return (u.organizacao !== null && u.organizacao !== undefined) || (u.volume !== null && u.volume !== undefined); });
      if (temOV) {
        slideTexto('ORGANIZAÇÃO X VOLUME', 'Organização ', 'x Volume', textos.volume_organizacao);
        const POR_OV = 7;
        for (let ini = 0; ini < cli.lista.length; ini += POR_OV) {
          const lote = cli.lista.slice(ini, ini + POR_OV);
          const sO = pres.addSlide();
          fullBg(sO);
          rotuloFull(sO, 'ORGANIZAÇÃO X VOLUME');
          tituloFull(sO, 'Organização ', 'x Volume' + (ini > 0 ? ' (cont.)' : ''));
          const cab = ['Unidade', 'Organização', 'Volume (10 = ideal)', 'Média dos dois'].map(function(t, i) {
            return { text:t, options:{ bold:true, color:'FFFFFF', fill:{ color: NAVY }, fontSize:10, fontFace:'Arial', align: i === 0 ? 'left' : 'center', valign:'middle' } };
          });
          const cel = function(v) { return { text: fmt(v), options:{ bold:true, color: corHex(v), fill:{ color: bgHex(v) }, fontSize:11, fontFace:'Arial', align:'center', valign:'middle' } }; };
          const linhas = lote.map(function(u) {
            return [{ text: pptTruncar(u.unidade, 34), options:{ bold:true, color: NAVY, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } }, cel(u.organizacao), cel(u.volume), cel(u.orgVol)];
          });
          if (ini + POR_OV >= cli.lista.length) linhas.push([{ text:'Média do cliente', options:{ bold:true, color: DARK, fill:{ color:'F0F2F4' }, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } }, cel(cli.organizacao), cel(cli.volume), cel(cli.orgVol)]);
          sO.addTable([cab].concat(linhas), { x:0.5, y:1.35, w:9, colW:[3.6, 1.7, 2.0, 1.7], rowH:0.38, border:{ type:'solid', color:'E2E8F0', pt:0.75 } });
          notaRodape(sO, 'Leitura do volume: quanto maior o volume de mercadoria, menor a nota (1 = volume excessivo · 10 = volume ideal).');
        }
      }

      /* 8 — Um slide por unidade (o texto que não couber continua no slide seguinte) */
      cli.lista.forEach(function(u) {
        const txtU = String((textos.unidades && textos.unidades[u.unidade]) || '').trim();
        const mets = [];
        if (u.retaguarda !== null && u.retaguarda !== undefined) mets.push(['Retaguarda', u.retaguarda]);
        if (u.areaVendas !== null && u.areaVendas !== undefined) mets.push(['Área de Vendas', u.areaVendas]);
        if (u.equipe !== null && u.equipe !== undefined) mets.push(['Equipe de apoio', u.equipe]);
        if (u.organizacao !== null && u.organizacao !== undefined) mets.push(['Organização', u.organizacao]);
        if (u.volume !== null && u.volume !== undefined) mets.push(['Volume (10 = ideal)', u.volume]);
        mets.push(['Variação vs anterior', null]);
        const yTxt = 2.3 + Math.ceil(mets.length / 2) * 0.42 + 0.1;
        const hDisp = PPT_Y_MAX - yTxt;
        let fs = pptFonteQueCabe(txtU, PPT_W_ESQ, hDisp, 10, 8.5, 1.3);
        const partes = (!txtU || fs) ? [txtU] : pptDividirTexto(txtU, PPT_W_ESQ, hDisp, (fs = 9), 1.3);

        const sU = pres.addSlide();
        splitBg(sU);
        rotulo(sU, 'UNIDADE');
        sU.addText(pptTruncar(u.unidade, 70), { x:PPT_X_ESQ, y:0.85, w:PPT_W_ESQ, h:0.5, fontSize:pptTituloFs(pptTruncar(u.unidade, 70), PPT_W_ESQ, 22, 13), fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
        sU.addText(fmt(u.geral), { x:PPT_X_ESQ, y:1.4, w:1.7, h:0.7, fontSize:36, fontFace:'Calibri', bold:true, color: corHex(u.geral), isTextBox:true, margin:0 });
        sU.addText((u.faixa ? String(u.faixa).toUpperCase() : '') + '\n' + u.analises + ' análise(s) no período', { x:2.5, y:1.48, w:4.0, h:0.6, fontSize:10, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.2, valign:'top' });
        mets.forEach(function(m, i) {
          const col = i % 2, row = Math.floor(i / 2);
          const mx = 0.8 + col * 2.9, my = 2.3 + row * 0.42;
          const isDelta = m[1] === null;
          const cor = isDelta ? deltaCor(u.variacao.geral) : corHex(m[1]);
          sU.addShape(pres.ShapeType.rect, { x:mx, y:my+0.02, w:0.04, h:0.3, fill:{ color: cor } });
          sU.addText(isDelta ? deltaTxt(u.variacao.geral) : fmt(m[1]), { x:mx+0.14, y:my, w:0.85, h:0.34, fontSize:14, fontFace:'Calibri', bold:true, color: isDelta ? cor : DARK, isTextBox:true, margin:0, valign:'middle' });
          sU.addText(m[0], { x:mx+1.0, y:my, w:1.75, h:0.34, fontSize:8, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, valign:'middle' });
        });
        if (partes[0]) sU.addText(partes[0], { x:PPT_X_ESQ, y:yTxt, w:PPT_W_ESQ, h:Math.min(hDisp, pptMedirAltura(partes[0], PPT_W_ESQ, fs, 1.3)), fontSize:fs, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
        painelInfo(sU);
        for (let k = 1; k < partes.length; k++) {
          const sC = pres.addSlide();
          splitBg(sC);
          rotulo(sC, 'UNIDADE (CONT.)');
          sC.addText(pptTruncar(u.unidade, 70), { x:PPT_X_ESQ, y:0.85, w:PPT_W_ESQ, h:0.5, fontSize:pptTituloFs(pptTruncar(u.unidade, 70), PPT_W_ESQ, 22, 13), fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
          const hC = PPT_Y_MAX - 1.6;
          const partesC = pptDividirTexto(partes[k], PPT_W_ESQ, hC, 11, 1.4);
          sC.addText(partesC[0], { x:PPT_X_ESQ, y:1.6, w:PPT_W_ESQ, h:Math.min(hC, pptMedirAltura(partesC[0], PPT_W_ESQ, 11, 1.4)), fontSize:11, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
          painelInfo(sC);
        }
      });

      /* 9 — Conclusão: pontos positivos e oportunidades (blocos que não cabem passam ao slide seguinte) */
      const itens = [];
      if (textos.pontos_positivos) itens.push({ cor: GREEN, marca: '✓', texto: textos.pontos_positivos });
      if (textos.oportunidades) itens.push({ cor: ORANGE, marca: '!', texto: textos.oportunidades });
      let primeiro = true;
      while (itens.length) {
        const sF = pres.addSlide();
        splitBg(sF);
        rotulo(sF, 'CONCLUSÃO');
        titulo2(sF, 'Pontos-Chave ', 'e Oportunidades');
        let cy = 1.75;
        while (itens.length) {
          const it = itens[0];
          const disp = PPT_Y_MAX - cy;
          const fs = pptFonteQueCabe(it.texto, 5.3, disp, 10.5, 9.5, 1.3);
          if (fs) {
            const h = pptMedirAltura(it.texto, 5.3, fs, 1.3);
            sF.addShape(pres.ShapeType.ellipse, { x:0.8, y:cy, w:0.25, h:0.25, fill:{ color: it.cor } });
            sF.addText(it.marca, { x:0.8, y:cy, w:0.25, h:0.25, fontSize:12, bold:true, color:'FFFFFF', align:'center', valign:'middle', isTextBox:true, margin:0 });
            sF.addText(it.texto, { x:1.15, y:cy-0.05, w:5.3, h:h, fontSize:fs, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
            cy += h + 0.25;
            itens.shift();
          } else if (cy > 1.8) {
            break;                                   // não cabe aqui: vai para o próximo slide
          } else {
            const pedacos = pptDividirTexto(it.texto, 5.3, disp, 10, 1.3);
            itens.shift();
            for (let k = pedacos.length - 1; k >= 0; k--) itens.unshift({ cor: it.cor, marca: it.marca, texto: pedacos[k] });
          }
        }
        painelInfo(sF);
        primeiro = false;
      }
      slideTexto('SUGESTÕES', 'Sugestões de ', 'Evolução', textos.sugestoes);

      pres.write('base64').then(resolve).catch(reject);
    } catch (e) {
      reject(e);
    }
  });
}

/* ═══════════════════════════════════════════════════════
   INICIALIZAÇÃO
   ═══════════════════════════════════════════════════════ */
function init() {
  state.emailsCliente = {};
  renderTelaInicial();
}

document.addEventListener('DOMContentLoaded', init);
</script>
