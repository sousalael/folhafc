        <span class="nps-sub">ligação imediata</span>
      </button>
      <button type="button" class="nps-card nps-acao falha${al.falhas ? ' ativo' : ''}" onclick="npsAbrirDetalhe('diagnostico','baixo_prom')">
        <span class="nps-rot">🟠 Falha do inventário</span>
        <span class="nps-num-s">${al.falhas}</span>
        <span class="nps-sub">correção de processo</span>
      </button>
      <button type="button" class="nps-card nps-acao otimo" onclick="npsAbrirDetalhe('diagnostico','alto_prom')">
        <span class="nps-rot">🟢 Operação perfeita</span>
        <span class="nps-num-s">${al.perfeitas}</span>
        <span class="nps-sub">pedir indicações</span>
      </button>
    </div>`;
}

// r114: recomendações geradas por REGRAS (sem IA), a partir dos números do filtro atual.
function npsRecomendacoes(r) {
  const s = r.resumo, al = s.alertas, out = [];
  const add = (nivel, ic, titulo, texto, ir) => out.push({ nivel, ic, titulo, texto, ir: ir || '' });
  if (al.criticos > 0) add('critico', '🔴', 'Ligar hoje: ' + al.criticos + ' alerta(s) vermelho(s)', 'Inventário mal avaliado e cliente que não recomenda. Contato imediato da coordenação ou diretoria.', "npsAbrirDetalhe('diagnostico','baixo_detr')");
  if (al.falhas > 0) add('falha', '🟠', 'Corrigir processo: ' + al.falhas + ' inventário(s) com falha', 'A equipe ou o supervisor falhou, mesmo com relação ainda preservada. Alinhar com o supervisor e revisar o procedimento.', "npsAbrirDetalhe('diagnostico','baixo_prom')");
  const risco = (r.porUnidade || []).filter(u => u.nps !== null && u.nps < 0).slice(0, 4);
  if (risco.length) add('atencao', '⚠️', 'Unidades com NPS negativo', risco.map(u => u.unidade + ' (' + u.nps + ')').join(' · ') + '. Priorizar visita ou contato com a gerência.', "npsTrocarAba('unidades')");
  if (s.nps !== null && s.nps < 50) add('atencao', '📉', 'NPS abaixo da zona de qualidade (' + s.nps + ')', 'Foco em reduzir detratores: ler os comentários das notas 0–6 e tratar as causas mais citadas.', "npsAbrirDetalhe('respostas','Detrator')");
  if (s.csatMedio !== null && s.csatMedio < 9) add('atencao', '⭐', 'CSAT médio ' + String(s.csatMedio).replace('.', ',') + ' (meta: 9 ou mais)', 'Somente ' + s.pctSatisfeitos + '% avaliaram o inventário com 9–10. Investigar os inventários com nota baixa.', "npsAbrirDetalhe('respostas','todas')");
  if (s.taxaResposta !== null && s.taxaResposta < 50) add('atencao', '📨', 'Retorno da pesquisa baixo (' + s.taxaResposta + '%)', 'Poucas respostas deixam o indicador instável. Reforçar o pedido de resposta logo após o inventário.');
  const pend = s.enviados - s.respondidas;
  if (pend > 0) add('neutro', '⏳', pend + ' pesquisa(s) aguardando resposta', 'Acompanhar e, se passar do prazo, reenviar um lembrete ao gerente.');
  const d = r.destaques;
  if (d && d.base > 0) {
    const pos = d.itens.filter(x => x.chave !== 'outro');
    const outro = d.itens.find(x => x.chave === 'outro');
    const forte = pos.slice().sort((a, b) => b.quantidade - a.quantidade)[0];
    const fraco = pos.slice().sort((a, b) => a.quantidade - b.quantidade)[0];
    if (outro && outro.pct !== null && outro.pct >= 20) add('atencao', '💬', outro.pct + '% marcaram "Outro"', 'Ler os comentários: pode haver um problema que a lista de pontos não cobre.', "npsAbrirDetalhe('respostas','todas')");
    if (forte && forte.quantidade > 0) add('bom', '💪', 'Ponto forte: ' + forte.rotulo + ' (' + forte.pct + '%)', 'É o que mais se destaca na operação. Manter e usar como argumento comercial.');
    if (fraco && forte && fraco.chave !== forte.chave) add('neutro', '🎯', 'Pouco citado: ' + fraco.rotulo + ' (' + fraco.pct + '%)', 'Oportunidade de melhoria: reforçar este ponto no briefing da equipe.');
  }
  if (al.perfeitas > 0) add('otimo', '🌟', al.perfeitas + ' operação(ões) perfeita(s)', 'Momento ideal para pedir indicações comerciais a esses clientes.', "npsAbrirDetalhe('diagnostico','alto_prom')");
  const ordem = { critico: 1, falha: 2, atencao: 3, neutro: 4, bom: 5, otimo: 6 };
  out.sort((a, b) => ordem[a.nivel] - ordem[b.nivel]);
  return out;
}

// r114: análise resumida, visual (medidores, barras e selos coloridos).
// r117: mostra o que existe na planilha SEM filtro, para explicar por que o filtro atual está vazio.
function npsHtmlBase(r) {
  const t = r && r.totais;
  if (!t) return '';
  const br = d => d ? npsDataBR(d) : '—';
  return `<div class="nps-legenda-faixas" style="margin-top:10px;justify-content:center;text-align:center">Base completa (sem filtro): ${t.envios} envio(s) · ${t.respostas} resposta(s) válida(s) · ${t.linhasRespostas} linha(s) na aba NPS_Respostas` +
    (t.respostas ? ' · análises de ' + br(t.dataMin) + ' a ' + br(t.dataMax) : '') + '</div>';
}

function npsHtmlAnalise(r) {
  const s = r.resumo;
  if (!s.respondidas) {
    return `<div class="nps-vazio">Nenhuma resposta neste filtro.<br>${s.enviados ? s.enviados + ' pesquisa(s) enviada(s) aguardando resposta.' : 'Nenhuma pesquisa foi enviada neste filtro.'}<br><small>O período usa a data da <b>análise</b>, não a da resposta. Se esperava ver dados, escolha "Todo o período" no filtro acima.</small>${npsHtmlBase(r)}</div>`;
  }
  const zona = npsZona(s.nps);
  const posNps = s.nps === null ? 50 : Math.max(0, Math.min(100, (s.nps + 100) / 2));
  const posCsat = s.csatMedio === null || s.csatMedio === undefined ? null : Math.max(0, Math.min(100, (s.csatMedio - 1) * 100 / 9));
  const P = s.pctPromotores || 0, N = s.pctNeutros || 0, D = s.pctDetratores || 0;
  const seg = (v, cor) => v ? `<span style="width:${v}%;background:${cor}">${v >= 8 ? v + '%' : ''}</span>` : '';
  const d = r.destaques;
  let barrasDest = '';
  if (d && d.base > 0) {
    const max = Math.max.apply(null, d.itens.map(x => x.quantidade).concat([1]));
    barrasDest = d.itens.map(x => `
      <div class="an-linha">
        <span class="nome">${esc(x.rotulo)}</span><b>${x.pct === null ? '—' : x.pct + '%'}</b>
        <div class="trilho"><span style="width:${Math.round(x.quantidade * 100 / max)}%;background:${x.chave === 'outro' ? '#E8872B' : '#61CF00'}"></span></div>
      </div>`).join('');
  }
  const recs = npsRecomendacoes(r);
  const recHtml = recs.length ? recs.map(x => {
    const cor = NPS_NIVEL_COR[x.nivel] || '#8899AA';
    const inner = `<span class="ic">${x.ic}</span><span><b>${esc(x.titulo)}</b><span>${esc(x.texto)}</span></span>`;
    return x.ir ? `<button type="button" class="an-rec" style="border-left-color:${cor}" onclick="${x.ir}">${inner}</button>`
                : `<div class="an-rec" style="border-left-color:${cor}">${inner}</div>`;
  }).join('') : '<div class="nps-vazio" style="padding:12px">Sem recomendações para este filtro.</div>';
  return `
    ${htmlBlocosNps(r)}
    <div class="nps-bloco">
      <h4>Placar</h4>
      <div class="an-placar">
        <div>
          <div style="display:flex;justify-content:space-between;font-size:12px"><b style="color:var(--navy)">NPS ${s.nps === null ? '—' : s.nps}</b><span style="color:${zona.c};font-weight:700">${zona.t}</span></div>
          <div class="an-medidor"><i style="left:${posNps}%"></i></div>
          <div class="an-medidor-esc"><span>-100</span><span>0</span><span>50</span><span>100</span></div>
        </div>
        ${posCsat === null ? '' : `<div>
          <div style="display:flex;justify-content:space-between;font-size:12px"><b style="color:var(--navy)">CSAT ${String(s.csatMedio).replace('.', ',')}</b><span style="color:${npsCorCsat(s.csatMedio)};font-weight:700">${s.pctSatisfeitos}% satisfeitos</span></div>
          <div class="an-medidor" style="background:linear-gradient(90deg,#E05252 0%,#E05252 55%,#D4A017 55%,#D4A017 78%,#2E7D32 78%,#2E7D32 100%)"><i style="left:${posCsat}%"></i></div>
          <div class="an-medidor-esc"><span>1</span><span>6</span><span>8</span><span>10</span></div>
        </div>`}
        <div>
          <div style="font-size:12px;margin-bottom:6px"><b style="color:var(--navy)">Quem respondeu</b></div>
          <div class="an-barra">${seg(P, '#2E7D32')}${seg(N, '#D4A017')}${seg(D, '#E05252')}</div>
          <div class="nps-legenda-faixas"><span><i style="background:#2E7D32"></i>Promotores ${P}%</span><span><i style="background:#D4A017"></i>Neutros ${N}%</span><span><i style="background:#E05252"></i>Detratores ${D}%</span></div>
        </div>
      </div>
    </div>
    <div class="nps-bloco">
      <h4>Recomendações</h4>
      ${recHtml}
    </div>
    ${barrasDest ? `<div class="nps-bloco"><h4>O que se destacou na operação</h4>${barrasDest}<div class="nps-legenda-faixas">% de quem respondeu o novo modelo (${d.base}).</div></div>` : ''}`;
}

/* ── r130: a aba "CSAT/NPS" tem 2 sub-abas: "Visão geral" (Análise + Resumo + Texto) e "Detalhamento" (Diagnóstico + Por unidade + Respostas) ── */
// Aceita também os nomes antigos (analise, texto, resumo, diagnostico, unidades, respostas) e leva para a sub-aba/seção certa.
function npsAbrirDetalhe(aba, chave) {
  if (!state.npsDados) { toast('Aguarde o carregamento do CSAT/NPS'); return; }
  const a = aba || 'analise';
  const nomeAntigoDetalhe = { diagnostico: 'diag', unidades: 'unid', respostas: 'resp', detalhe: '' };
  const ehDetalhe = Object.prototype.hasOwnProperty.call(nomeAntigoDetalhe, a);
  state.npsModal = {
    aba: ehDetalhe ? 'detalhe' : 'geral',
    cat: (a === 'respostas' && chave) ? chave : 'todas',
    diag: a === 'diagnostico' ? (chave || '') : '',
    soComentario: false,
    ancora: ehDetalhe ? nomeAntigoDetalhe[a] : ''
  };
  if (state.abaHome === 'nps') npsRenderAba();
  else mostrarAbaHome('nps');
}

function npsTrocarAba(aba) { if (!state.npsModal) state.npsModal = { aba: 'geral', cat: 'todas', diag: '', soComentario: false, ancora: '' }; state.npsModal.aba = aba; npsRenderAba(); }
function npsTrocarCat(cat) { state.npsModal.cat = cat; npsRenderAba(); }
function npsToggleComentario() { state.npsModal.soComentario = !state.npsModal.soComentario; npsRenderAba(); }
function npsSelecionarDiag(chave) { state.npsModal.diag = (state.npsModal.diag === chave ? '' : chave); npsRenderAba(); }

/* ═══════════════════════════════════════════════════════
   r127 — ANÁLISE EM TEXTO DO CSAT/NPS (regras automáticas, sem IA) + exportação PDF/PPTX
   Uso interno da diretoria. Responde a TODOS os filtros (cliente, unidade, supervisor, período).
   ═══════════════════════════════════════════════════════ */
function npsN1(v) { return (v === null || v === undefined || isNaN(v)) ? '—' : String(v).replace('.', ','); }
function npsPlural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
function npsLista(itens) {
  if (itens.length <= 1) return itens.join('');
  return itens.slice(0, -1).join(', ') + ' e ' + itens[itens.length - 1];
}
function npsCorHexNps(n) { return (n === null || n === undefined) ? '#8899AA' : (n >= 50 ? '#2E7D32' : (n >= 1 ? '#D4A017' : '#E05252')); }
function npsCorHexCsat(c) { return (c === null || c === undefined) ? '#8899AA' : (c >= 9 ? '#2E7D32' : (c >= 8 ? '#D4A017' : '#E05252')); }

function npsMontarTexto(r) {
  const s = r.resumo;
  const secoes = [];
  const add = (h, paragrafos) => { const p = paragrafos.filter(Boolean); if (p.length) secoes.push({ h, paragrafos: p }); };
  const zona = npsZona(s.nps).t.toLowerCase();

  // 1. Visão geral
  const vg = [];
  vg.push('Neste recorte foram enviadas ' + npsPlural(s.enviados, 'pesquisa', 'pesquisas') + ' e ' + npsPlural(s.respondidas, 'foi respondida', 'foram respondidas') +
    (s.taxaResposta !== null ? ' (retorno de ' + s.taxaResposta + '%)' : '') + '. O NPS é ' + npsN1(s.nps) + ' (' + zona + ')' +
    (s.csatMedio !== null && s.csatMedio !== undefined ? ' e o CSAT médio é ' + npsN1(s.csatMedio) + ', com ' + s.pctSatisfeitos + '% dos inventários avaliados com nota 9 ou 10' : '') + '.');
  if (s.nps !== null) {
    if (s.nps >= 75) vg.push('O resultado está na zona de excelência: a maior parte de quem respondeu recomenda a Formula Code e há pouquíssimos detratores.');
    else if (s.nps >= 50) vg.push('O resultado está na zona de qualidade, acima do patamar que consideramos saudável. Há espaço para chegar à excelência reduzindo os neutros e detratores.');
    else if (s.nps >= 1) vg.push('O resultado está na zona de aperfeiçoamento: os promotores superam os detratores, mas por pouco. Vale tratar as causas dos detratores e neutros.');
    else vg.push('O resultado está na zona crítica: os detratores igualam ou superam os promotores. É prioridade entender e corrigir as causas.');
  }
  if (s.respondidas < 10) vg.push('Atenção: com apenas ' + npsPlural(s.respondidas, 'resposta', 'respostas') + ', a leitura é indicativa e pode mudar bastante com novas respostas.');
  add('Visão geral', vg);

  // 2. Perfil de quem respondeu
  add('Quem respondeu', [
    'Entre as respostas, ' + s.pctPromotores + '% são promotores (nota 9–10), ' + s.pctNeutros + '% neutros (7–8) e ' + s.pctDetratores + '% detratores (0–6). A nota média de recomendação é ' + npsN1(s.mediaNota) + '.'
  ]);

  // 3. Evolução
  const meses = (r.porMes || []).filter(m => m.mes !== 'sem-data' && m.respostas > 0);
  const ev = [];
  if (meses.length >= 2) {
    const a = meses[meses.length - 1], b = meses[meses.length - 2];
    const dn = (a.nps !== null && b.nps !== null) ? a.nps - b.nps : null;
    let tend = 'ficou estável';
    if (dn !== null && dn >= 6) tend = 'melhorou'; else if (dn !== null && dn <= -6) tend = 'piorou';
    ev.push('Em ' + npsMesRotulo(a.mes) + ' o NPS foi ' + npsN1(a.nps) + ' contra ' + npsN1(b.nps) + ' em ' + npsMesRotulo(b.mes) + (dn !== null ? ' (' + (dn > 0 ? '+' : '') + dn + ' pontos)' : '') + ': o indicador ' + tend + '.' +
      ((a.csat !== null && b.csat !== null) ? ' O CSAT foi de ' + npsN1(b.csat) + ' para ' + npsN1(a.csat) + '.' : ''));
    if (meses.length >= 3) {
      const comNps = meses.filter(m => m.nps !== null);
      if (comNps.length >= 3) {
        const melhor = comNps.slice().sort((x, y) => y.nps - x.nps)[0], pior = comNps.slice().sort((x, y) => x.nps - y.nps)[0];
        if (melhor.mes !== pior.mes) ev.push('O melhor mês foi ' + npsMesRotulo(melhor.mes) + ' (NPS ' + melhor.nps + ') e o de maior dificuldade foi ' + npsMesRotulo(pior.mes) + ' (NPS ' + pior.nps + ').');
      }
    }
  } else if (meses.length === 1) {
    ev.push('Só há respostas de ' + npsMesRotulo(meses[0].mes) + ', então ainda não é possível comparar a evolução entre meses.');
  }
  add('Evolução no período', ev);
  if (meses.length) {
    const secEv = secoes.find(x => x.h === 'Evolução no período');
    if (secEv) secEv.tabela = { cab: ['Mês', 'Respostas', 'NPS', 'CSAT'], pesos: [2, 1, 1, 1], linhas: meses.map(m => [npsMesRotulo(m.mes), String(m.respostas), npsN1(m.nps), npsN1(m.csat)]) };
  }

  // 4. Alertas
  const al = s.alertas || {};
  const alt = [];
  if (al.criticos > 0) alt.push(npsPlural(al.criticos, 'inventário mal avaliado por cliente que não recomenda (alerta vermelho)', 'inventários mal avaliados por clientes que não recomendam (alertas vermelhos)') + '. Pedem contato imediato da coordenação ou da diretoria.');
  if (al.falhas > 0) alt.push(npsPlural(al.falhas, 'inventário com falha pontual, mas com relação ainda preservada', 'inventários com falha pontual, mas com relação ainda preservada') + '. Alinhar com o supervisor responsável e revisar o procedimento.');
  if (al.perfeitas > 0) alt.push(npsPlural(al.perfeitas, 'operação perfeita', 'operações perfeitas') + ' (CSAT e NPS altos): bom momento para pedir indicações comerciais a esses clientes.');
  if (!al.criticos && !al.falhas) alt.unshift('Nenhum alerta vermelho ou de falha neste recorte.');
  add('Alertas', alt);

  // 5. Destaques
  const d = r.destaques;
  const dt = [];
  if (d && d.base > 0) {
    const pos = d.itens.filter(x => x.chave !== 'outro');
    const ord = pos.slice().sort((a, b) => b.quantidade - a.quantidade);
    const outro = d.itens.find(x => x.chave === 'outro');
    if (ord[0] && ord[0].quantidade > 0) {
      const top = ord.filter(x => x.quantidade > 0).slice(0, 2).map(x => x.rotulo + ' (' + x.pct + '%)');
      dt.push('O que mais se destacou na operação, segundo ' + npsPlural(d.base, 'resposta', 'respostas') + ': ' + npsLista(top) + '. É um ponto forte para manter e usar como argumento comercial.');
    }
    const fraco = ord[ord.length - 1];
    if (fraco && ord[0] && fraco.chave !== ord[0].chave) dt.push('O ponto menos citado foi ' + fraco.rotulo + ' (' + fraco.pct + '%). Vale reforçá-lo no briefing das equipes.');
    if (outro && outro.pct !== null && outro.pct >= 20) dt.push(outro.pct + '% marcaram "Outro"; ler os comentários pode revelar algo que a lista não cobre.');
  }
  add('Pontos fortes e oportunidades', dt);

  // 6. Quesitos do modelo anterior
  const q = [];
  NPS_QUESITOS_ORDEM.forEach(k => {
    const x = r.quesitos && r.quesitos[k];
    if (!x || !x.total) return;
    const ops = x.opcoes, melhor = ops[0], pior = ops[ops.length - 1];
    q.push({ k, total: x.total, pMelhor: Math.round(x.contagens[melhor] * 100 / x.total), pPior: Math.round(x.contagens[pior] * 100 / x.total), melhor, pior });
  });
  if (q.length) {
    const forte = q.slice().sort((a, b) => b.pMelhor - a.pMelhor)[0];
    const fraco = q.slice().sort((a, b) => b.pPior - a.pPior)[0];
    const par = ['Nas respostas do modelo anterior da pesquisa, o quesito mais bem avaliado foi "' + NPS_QUESITOS_TXT[forte.k] + '" (' + forte.pMelhor + '% "' + forte.melhor + '").'];
    if (fraco.pPior > 0) par.push('O quesito com mais avaliações negativas foi "' + NPS_QUESITOS_TXT[fraco.k] + '" (' + fraco.pPior + '% "' + fraco.pior + '").');
    add('Quesitos do modelo anterior', par);
  }

  // 7. Unidades
  const un = (r.porUnidade || []).filter(u => u.respostas > 0 && u.nps !== null);
  const ut = [];
  if (un.length) {
    const neg = un.filter(u => u.nps < 0).slice(0, 5);
    const bons = un.slice().sort((a, b) => b.nps - a.nps).filter(u => u.nps >= 50).slice(0, 3);
    const fmtU = u => u.unidade + (u.cliente ? ' — ' + u.cliente : '') + ' (NPS ' + u.nps + (u.csat !== null ? ', CSAT ' + npsN1(u.csat) : '') + ', ' + npsPlural(u.respostas, 'resposta', 'respostas') + ')';
    if (neg.length) ut.push('Unidades que pedem atenção (NPS negativo): ' + neg.map(fmtU).join('; ') + '. Priorizar contato com a gerência ou visita.');
    else ut.push('Nenhuma unidade com NPS negativo neste recorte.');
    if (bons.length) ut.push('Unidades de referência (NPS 50 ou mais): ' + bons.map(fmtU).join('; ') + '.');
  }
  const semResp = (r.porUnidade || []).filter(u => u.enviados > 0 && u.respostas === 0).length;
  if (semResp) ut.push(npsPlural(semResp, 'unidade ainda sem nenhuma resposta', 'unidades ainda sem nenhuma resposta') + '; acompanhar e reforçar o pedido de retorno.');
  add('Unidades', ut);

  // 8. Supervisores
  const sp = (r.porSupervisor || []).filter(x => x.respondidas > 0);
  const st = [];
  if (sp.length) {
    const fmtS = x => x.supervisor + ' (NPS ' + npsN1(x.nps) + (x.csat !== null ? ', CSAT ' + npsN1(x.csat) : '') + ', ' + npsPlural(x.respondidas, 'resposta', 'respostas') + ')';
    st.push('Por supervisor (auditor responsável pela análise): ' + sp.slice().sort((a, b) => (b.nps === null ? -999 : b.nps) - (a.nps === null ? -999 : a.nps)).map(fmtS).join('; ') + '.');
    if (sp.length >= 2) {
      const ord = sp.filter(x => x.nps !== null);
      if (ord.length >= 2) {
        const pior = ord[0], melhor = ord[ord.length - 1];
        if (pior.nps !== melhor.nps) st.push('A maior diferença está entre ' + melhor.supervisor + ' (NPS ' + melhor.nps + ') e ' + pior.supervisor + ' (NPS ' + pior.nps + '). Vale entender o que ' + melhor.supervisor + ' faz de diferente e replicar nas demais análises.');
      }
    }
    const crit = sp.filter(x => x.criticos > 0);
    if (crit.length) st.push('Alertas vermelhos em: ' + crit.map(x => x.supervisor + ' (' + x.criticos + ')').join(', ') + '. Acompanhar de perto.');
    if (sp.some(x => x.respondidas < 5)) st.push('Supervisores com menos de 5 respostas têm leitura ainda instável; evitar conclusões definitivas.');
  }
  add('Supervisores', st);

  // 9. Recomendações (as mesmas da aba Análise, em texto)
  const rec = npsRecomendacoes(r).map(x => x.titulo + '. ' + x.texto);
  add('Recomendações', rec);

  const kpis = [
    { r: 'NPS', v: npsN1(s.nps), sub: npsZona(s.nps).t, cor: npsCorHexNps(s.nps) },
    { r: 'CSAT médio', v: npsN1(s.csatMedio), sub: (s.pctSatisfeitos !== null && s.pctSatisfeitos !== undefined ? s.pctSatisfeitos + '% satisfeitos' : 'sem respostas'), cor: npsCorHexCsat(s.csatMedio) },
    { r: 'Respostas', v: String(s.respondidas), sub: 'de ' + s.enviados + ' enviadas', cor: '#002B50' },
    { r: 'Retorno', v: s.taxaResposta === null ? '—' : s.taxaResposta + '%', sub: 'taxa de resposta', cor: '#002B50' }
  ];
  return { titulo: 'Análise CSAT / NPS', contexto: npsRotuloFiltro() + ' · período pela data da análise', kpis, secoes, resumo: s, porSupervisor: sp };
}

function npsHtmlTexto(r) {
  const s = r.resumo;
  if (!s.respondidas) return '<div class="nps-vazio">Nenhuma resposta neste filtro para analisar.<br><small>Ajuste os filtros acima (cliente, unidade, supervisor ou período).</small></div>';
  const t = npsMontarTexto(r);
  const corpo = t.secoes.map(sec => `<div class="nps-bloco"><h4>${esc(sec.h)}</h4>${sec.paragrafos.map(p => `<p style="font-size:13px;line-height:1.7;margin:0 0 8px;color:var(--text)">${esc(p)}</p>`).join('')}</div>`).join('');
  return `
    ${corpo}
    <div class="nps-legenda-faixas" style="justify-content:center;text-align:center">Texto gerado automaticamente por regras, a partir das respostas do filtro atual. Uso interno da diretoria.</div>`;
}

/* r130 — texto da aba "Detalhamento" (Diagnóstico + Por unidade + Respostas), no mesmo formato do texto da Visão geral */
function npsPonto(t) { t = String(t || '').trim(); return /[.!?…]$/.test(t) ? t : t + '.'; }

function npsMontarTextoDetalhe(r) {
  const s = r.resumo;
  const secoes = [];

  // 1. Diagnóstico (CSAT x NPS)
  const dg = {};
  (r.diagnosticos || []).forEach(d => { dg[d.chave] = d; });
  if (s.csatRespondidas) {
    const paras = ['O diagnóstico cruza a satisfação com o inventário (CSAT, nas linhas) com a recomendação (NPS, nas colunas). Base: ' + npsPlural(s.csatRespondidas, 'resposta', 'respostas') + ' do modelo atual da pesquisa.'];
    const prio = (r.diagnosticos || []).filter(d => d.quantidade && (d.nivel === 'critico' || d.nivel === 'falha' || d.nivel === 'atencao'));
    if (prio.length) {
      paras.push('Exigem ação:');
      prio.forEach(d => paras.push(d.titulo + ' — ' + npsPlural(d.quantidade, 'resposta', 'respostas') + '. ' + npsPonto(d.acao)));
    } else paras.push('Nenhuma resposta exige ação neste recorte.');
    secoes.push({
      h: 'Diagnóstico CSAT x NPS', paragrafos: paras,
      tabela: {
        cab: ['CSAT \\ NPS'].concat(NPS_COLUNAS.map(c => c[1])), pesos: [1.2, 2, 2, 2],
        linhas: NPS_LINHAS.map(l => [l[1]].concat(NPS_COLUNAS.map(c => { const d = dg[l[0] + '_' + c[0]]; return d ? d.quantidade + ' · ' + d.titulo : '—'; })))
      }
    });
  } else {
    secoes.push({ h: 'Diagnóstico CSAT x NPS', paragrafos: ['Ainda não há respostas do modelo atual da pesquisa (CSAT + NPS) neste recorte. O diagnóstico depende do cruzamento das duas notas.'] });
  }

  // 2. Resultado por unidade
  const un = r.porUnidade || [];
  if (un.length) {
    secoes.push({
      h: 'Resultado por unidade',
      paragrafos: ['Unidades do menor para o maior NPS; as sem resposta aparecem por último. Alerta vermelho = CSAT 1–6 e NPS 0–6. Falha do inventário = CSAT 1–6 e NPS 7–10.'],
      tabela: {
        cab: ['Unidade', 'Cliente', 'Resp./env.', 'NPS', 'CSAT', 'Alertas verm.', 'Falhas'], pesos: [2.4, 2, 1, 0.8, 0.8, 1, 0.8],
        linhas: un.map(u => [u.unidade, u.cliente || '', u.respostas + '/' + u.enviados, npsN1(u.nps), npsN1(u.csat), String(u.criticos || 0), String(u.falhas || 0)])
      }
    });
  }

  // 3. Respostas recebidas
  const rs = r.respostas || [];
  if (rs.length) {
    const destRot = k => { const it = ((r.destaques || {}).itens || []).find(i => i.chave === k); return it ? it.rotulo : k; };
    const nomeQ = { apresentacao: 'Apresentação', postura: 'Postura', supervisor: 'Supervisor', mapeamento: 'Mapeamento', horario: 'Horário' };
    const paras = [npsPlural(rs.length, 'resposta', 'respostas') + ', das mais recentes para as mais antigas' + (s.respondidas > rs.length ? ' (mostrando as ' + rs.length + ' mais recentes de ' + s.respondidas + ')' : '') + '.'];
    rs.forEach(x => {
      let p = x.unidade + (x.cliente ? ' — ' + x.cliente : '') + ' · análise de ' + npsDataBR(x.dataAuditoria) + ' · respondida em ' + npsDataBR(x.dataResposta) + ' · ' +
        ((x.csat !== null && x.csat !== undefined) ? 'CSAT ' + x.csat + ' · ' : '') + 'NPS ' + x.nota + ' (' + x.categoria + ')';
      if (x.diagnostico) p += ' · ' + x.diagnostico.titulo;
      p += '. ' + (x.comentario ? 'Comentário: “' + String(x.comentario).replace(/\s+/g, ' ').trim() + '”.' : 'Sem comentário.');
      if ((x.destaques || []).length) p += ' Pontos que se destacaram: ' + x.destaques.map(destRot).join(', ') + '.';
      const lg = NPS_QUESITOS_ORDEM.filter(k => x[k]).map(k => nomeQ[k] + ': ' + x[k]);
      if (lg.length) p += ' Modelo anterior da pesquisa — ' + lg.join('; ') + '.';
      paras.push(p);
    });
    secoes.push({ h: 'Respostas recebidas', paragrafos: paras });
  }
  return { secoes };
}

/* r130 — monta o texto conforme o escopo: 'geral' (Visão geral), 'detalhe' (Detalhamento) ou 'completo' (as duas) */
function npsMontarTextoEscopo(escopo) {
  const r = state.npsDados;
  const t1 = npsMontarTexto(r);
  let secoes, nome, sufixo, porSup;
  if (escopo === 'geral') { secoes = t1.secoes; nome = 'Visão geral'; sufixo = 'Visao_Geral'; porSup = t1.porSupervisor; }
  else if (escopo === 'detalhe') { secoes = npsMontarTextoDetalhe(r).secoes; nome = 'Detalhamento'; sufixo = 'Detalhamento'; porSup = null; }
  else { secoes = t1.secoes.concat(npsMontarTextoDetalhe(r).secoes); nome = 'Completa'; sufixo = 'Completa'; porSup = t1.porSupervisor; }
  return { titulo: 'Análise CSAT / NPS — ' + nome, subtitulo: nome, sufixo, contexto: t1.contexto, kpis: t1.kpis, secoes, resumo: t1.resumo, porSupervisor: porSup };
}

async function npsExportarPDF(escopo) {
  escopo = escopo || 'completo';
  if (!state.npsDados || !state.npsDados.resumo.respondidas) { toast('Não há respostas neste filtro'); return; }
  const t = npsMontarTextoEscopo(escopo);
  showLoading('Gerando o PDF da análise...');
  const r = await apiCall('npsExportarPDF', { texto: { titulo: t.titulo, rotulo: t.subtitulo, contexto: t.contexto, kpis: t.kpis, secoes: t.secoes }, sufixo: t.sufixo });
  hideLoading();
  if (!r.ok) { toast('Erro ao exportar: ' + (r.erro || 'falha')); return; }
  pfModalLinks('Análise em PDF pronta', 'A análise de CSAT/NPS (' + t.subtitulo.toLowerCase() + ') foi salva no Drive (pasta NPS_FC).',
    [{ href: r.linkPDF, rot: '📄 Abrir / baixar o PDF', cor: 'var(--navy)' }, { href: r.linkHTML, rot: '🌐 Versão HTML', cor: '#E8EAF6', txt: 'var(--navy)' }]);
}

async function npsExportarPPTX(escopo) {
  escopo = escopo || 'completo';
  if (!state.npsDados || !state.npsDados.resumo.respondidas) { toast('Não há respostas neste filtro'); return; }
  const disponivel = await aguardarPptxGenJS();
  if (!disponivel) { toast('Não foi possível carregar a biblioteca de apresentação. Verifique sua conexão e tente novamente.'); return; }
  const t = npsMontarTextoEscopo(escopo);
  let b64;
  try {
    showLoading('Montando a apresentação...');
    b64 = await montarPptxNps(t, state.npsDados);
  } catch (e) { hideLoading(); toast('Erro ao montar a apresentação: ' + e.message); return; }
  showLoading('Salvando no Drive e convertendo em PDF...');
  const r = await apiCall('npsSalvarApresentacao', { pptxBase64: b64, sufixo: t.sufixo });
  hideLoading();
  if (!r.ok) { toast('Erro ao salvar a apresentação: ' + (r.erro || 'falha')); return; }
  pfModalLinks('Apresentação pronta',
    'A apresentação de CSAT/NPS (' + t.subtitulo.toLowerCase() + ') foi salva no Drive (pasta NPS_FC).' + (r.linkPDF ? '' : '<br><br><b>O PDF não pôde ser gerado</b>' + (r.erroPDF ? ' (' + esc(r.erroPDF) + ')' : '') + '. O PPTX está disponível.'),
    [{ href: r.linkPPTX, rot: '📽️ Baixar o PPTX', cor: 'var(--orange)' }, r.linkPDF ? { href: r.linkPDF, rot: '📄 Abrir / baixar o PDF', cor: 'var(--navy)' } : { rot: 'PDF indisponível' }]);
}

// Apresentação CSAT/NPS (PPTX) — mesmo estilo visual da Performance (capa escura, faixa superior, verde da marca).
function montarPptxNps(t, dados) {
  return new Promise(function (resolve, reject) {
    try {
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_16x9';
      const NAVY = '002B50', GREEN = '61CF00', DARK = '051323', BODY = '556677', LABEL = '8899AA';
      const hex = c => String(c || '#002B50').replace('#', '');
      function fullBg(s) {
        s.background = { fill: 'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 10, h: 0.5, fill: { color: DARK } });
        s.addShape(pres.ShapeType.rect, { x: 0, y: 0.5, w: 10, h: 0.04, fill: { color: GREEN } });
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x: 7.4, y: 0.07, w: 2.1, h: 0.36 }); } catch (e) {} }
      }
      let num = 0;
      function rotulo(s, texto) {
        num++;
        s.addText((num < 10 ? '0' + num : num) + ' / ' + String(texto).toUpperCase(), { x: 0.5, y: 0.1, w: 6.5, h: 0.3, fontSize: 9, fontFace: 'Arial', bold: true, color: GREEN, isTextBox: true, margin: 0, charSpacing: 3 });
      }
      function titulo(s, a, b) {
        s.addText([{ text: a, options: { color: DARK } }, { text: b, options: { color: GREEN } }], { x: 0.5, y: 0.7, w: 9, h: 0.5, fontSize: pptTituloFs(a + b, 9, 22, 16), fontFace: 'Calibri', bold: true, isTextBox: true, margin: 0 });
      }
      function rodape(s) {
        s.addText('Uso interno da diretoria · texto gerado automaticamente a partir das respostas do filtro atual', { x: 0.5, y: 5.2, w: 9, h: 0.25, fontSize: 8, fontFace: 'Arial', color: LABEL, isTextBox: true, margin: 0 });
      }

      /* Capa */
      const s1 = pres.addSlide();
      s1.background = { fill: DARK };
      s1.addShape(pres.ShapeType.rect, { x: 0, y: 0, w: 10, h: 0.04, fill: { color: GREEN } });
      s1.addText([
        { text: 'Análise de ', options: { color: 'FFFFFF', fontSize: 30, fontFace: 'Calibri', bold: true } },
        { text: 'CSAT e NPS', options: { color: GREEN, fontSize: 30, fontFace: 'Calibri', bold: true } }
      ], { x: 0.8, y: 0.7, w: 8.4, h: 1.1, isTextBox: true, margin: 0 });
      s1.addText((t.subtitulo ? t.subtitulo + ' · ' : '') + 'Apresentação para a diretoria', { x: 0.8, y: 1.85, w: 8.4, h: 0.4, fontSize: 16, fontFace: 'Calibri', color: GREEN, isTextBox: true, margin: 0 });
      s1.addText(t.contexto, { x: 0.8, y: 2.45, w: 8.4, h: Math.min(1.2, pptMedirAltura(t.contexto, 8.4, 13, 1.1)), fontSize: 13, fontFace: 'Arial', color: LABEL, isTextBox: true, margin: 0, valign: 'top' });
      if (LOGO_APRESENTACAO_DATA_URL) { try { s1.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x: 3.2, y: 4.15, w: 3.6, h: 0.94 }); } catch (e) {} }

      /* Indicadores */
      const s2 = pres.addSlide();
      fullBg(s2); rotulo(s2, 'Indicadores-chave'); titulo(s2, 'Placar do ', 'recorte');
      t.kpis.forEach(function (k, i) {
        const x = 0.5 + i * 2.28;
        s2.addShape(pres.ShapeType.rect, { x: x, y: 1.5, w: 2.1, h: 1.9, fill: { color: 'F4F6F8' }, line: { color: 'F4F6F8' } });
        s2.addShape(pres.ShapeType.rect, { x: x, y: 1.5, w: 2.1, h: 0.07, fill: { color: hex(k.cor) } });
        s2.addText(k.r.toUpperCase(), { x: x, y: 1.7, w: 2.1, h: 0.3, fontSize: 9, fontFace: 'Arial', bold: true, color: '6B7B8D', align: 'center', isTextBox: true, margin: 0, charSpacing: 2 });
        s2.addText(String(k.v), { x: x, y: 2.05, w: 2.1, h: 0.7, fontSize: 34, fontFace: 'Calibri', bold: true, color: hex(k.cor), align: 'center', isTextBox: true, margin: 0 });
        s2.addText(String(k.sub || ''), { x: x + 0.1, y: 2.8, w: 1.9, h: 0.45, fontSize: 10, fontFace: 'Arial', color: '6B7B8D', align: 'center', isTextBox: true, margin: 0, valign: 'top' });
      });
      // barra promotores / neutros / detratores
      const sm = dados.resumo, P = sm.pctPromotores || 0, N = sm.pctNeutros || 0, D = sm.pctDetratores || 0;
      s2.addText('Quem respondeu', { x: 0.5, y: 3.65, w: 4, h: 0.3, fontSize: 11, fontFace: 'Arial', bold: true, color: NAVY, isTextBox: true, margin: 0 });
      let px = 0.5; const W = 9;
      [[P, '2E7D32', 'Promotores'], [N, 'D4A017', 'Neutros'], [D, 'E05252', 'Detratores']].forEach(function (b) {
        const w = W * b[0] / 100;
        if (w > 0) {
          s2.addShape(pres.ShapeType.rect, { x: px, y: 4.0, w: w, h: 0.4, fill: { color: b[1] }, line: { color: b[1] } });
          if (b[0] >= 8) s2.addText(b[0] + '%', { x: px, y: 4.0, w: w, h: 0.4, fontSize: 11, fontFace: 'Arial', bold: true, color: 'FFFFFF', align: 'center', valign: 'middle', isTextBox: true, margin: 0 });
        }
        px += w;
      });
      s2.addText('Promotores ' + P + '%  ·  Neutros ' + N + '%  ·  Detratores ' + D + '%', { x: 0.5, y: 4.5, w: 9, h: 0.3, fontSize: 10, fontFace: 'Arial', color: BODY, isTextBox: true, margin: 0 });
      rodape(s2);

      /* Seções de texto (com tabela opcional: fica no mesmo slide do texto quando cabe; senão, em slides próprios) */
      function tabelaNoSlide(s, sec, linhasTab, y) {
        const cabT = sec.tabela.cab;
        const pesos = (sec.tabela.pesos && sec.tabela.pesos.length === cabT.length) ? sec.tabela.pesos : cabT.map(function (_, i) { return i === 0 ? 2 : 1; });
        const somaP = pesos.reduce(function (a, b) { return a + b; }, 0);
        const colW = pesos.map(function (pp) { return 9 * pp / somaP; });
        const cabRow = cabT.map(function (h) { return { text: h, options: { bold: true, color: 'FFFFFF', fill: { color: NAVY }, fontSize: 10, fontFace: 'Arial', align: 'center' } }; });
        const rows = [cabRow].concat(linhasTab.map(function (lin) {
          return lin.map(function (v, ci) { return { text: String(v), options: { fontSize: 9.5, fontFace: 'Arial', align: ci === 0 ? 'left' : 'center', color: '333333' } }; });
        }));
        s.addTable(rows, { x: 0.5, y: y, w: 9, colW: colW, border: { type: 'solid', pt: 0.5, color: 'E2E8F0' } });
      }
      t.secoes.forEach(function (sec) {
        const temTab = !!(sec.tabela && sec.tabela.cab && sec.tabela.linhas && sec.tabela.linhas.length);
        let tabelaFeita = false;
        if (sec.paragrafos && sec.paragrafos.length) {
          const texto = sec.paragrafos.join('\n\n');
          const hMax = PPT_Y_MAX - 1.4;
          let fs = pptFonteQueCabe(texto, 9, hMax, 13, 10.5, 1.35);
          const partes = fs ? [texto] : pptDividirTexto(texto, 9, hMax, (fs = 11), 1.35);
          partes.forEach(function (p, i) {
            const s = pres.addSlide();
            fullBg(s); rotulo(s, sec.h + (i > 0 ? ' (cont.)' : ''));
            titulo(s, sec.h + (i > 0 ? ' ' : ''), i > 0 ? '(cont.)' : '');
            const hTxt = Math.min(hMax, pptMedirAltura(p, 9, fs, 1.35));
            s.addText(p, { x: 0.5, y: 1.4, w: 9, h: hTxt, fontSize: fs, fontFace: 'Arial', color: BODY, isTextBox: true, margin: 0, lineSpacingMultiple: 1.35, valign: 'top' });
            // tabela no mesmo slide quando o texto é curto e as linhas cabem (estimativa conservadora: 0,34 pol por linha)
            if (temTab && i === partes.length - 1) {
              const yTab = 1.4 + hTxt + 0.25;
              if (sec.tabela.linhas.length <= 9 && yTab + 0.34 * (sec.tabela.linhas.length + 1) <= PPT_Y_MAX) { tabelaNoSlide(s, sec, sec.tabela.linhas, yTab); tabelaFeita = true; }
            }
            rodape(s);
          });
        }
        if (temTab && !tabelaFeita) {
          const porSlide = 9;
          for (let ini = 0; ini < sec.tabela.linhas.length; ini += porSlide) {
            const s = pres.addSlide();
            fullBg(s); rotulo(s, sec.h + (ini > 0 ? ' (cont.)' : '')); titulo(s, sec.h, ini > 0 ? ' (cont.)' : '');
            tabelaNoSlide(s, sec, sec.tabela.linhas.slice(ini, ini + porSlide), 1.4);
            rodape(s);
          }
        }
      });

      /* Tabela de supervisores (se houver) */
      if (t.porSupervisor && t.porSupervisor.length) {
        const linhas = t.porSupervisor.slice().sort((a, b) => (b.nps === null ? -999 : b.nps) - (a.nps === null ? -999 : a.nps));
        for (let ini = 0; ini < linhas.length; ini += 8) {
          const s = pres.addSlide();
          fullBg(s); rotulo(s, 'Supervisores'); titulo(s, 'Resultado por ', 'supervisor');
          const cab = ['Supervisor', 'Respostas', 'NPS', 'CSAT', 'Alertas vermelhos'].map(function (h) { return { text: h, options: { bold: true, color: 'FFFFFF', fill: { color: NAVY }, fontSize: 10, fontFace: 'Arial', align: 'center' } }; });
          const rows = [cab].concat(linhas.slice(ini, ini + 8).map(function (x) {
            const cel = function (v, o) { return { text: String(v), options: Object.assign({ fontSize: 10, fontFace: 'Arial', align: 'center', color: '333333' }, o || {}) }; };
            return [cel(x.supervisor, { align: 'left' }), cel(x.respondidas), cel(npsN1(x.nps), { bold: true, color: hex(npsCorHexNps(x.nps)) }), cel(npsN1(x.csat), { bold: true, color: hex(npsCorHexCsat(x.csat)) }), cel(x.criticos || 0)];
          }));
          s.addTable(rows, { x: 0.5, y: 1.4, w: 9, colW: [3.6, 1.2, 1.2, 1.2, 1.8], border: { type: 'solid', pt: 0.5, color: 'E2E8F0' } });
          rodape(s);
        }
      }

      pres.write('base64').then(resolve).catch(reject);
    } catch (e) { reject(e); }
  });
}

// r130: Visão geral = Análise + Resumo + Texto (do número para a narrativa).
function npsHtmlVisaoGeral(r) {
  const cab = (n, t) => `<div class="nps-secao-t">${n} · ${t}</div>`;
  if (!r.resumo.respondidas) return npsHtmlAnalise(r);   // sem respostas: uma única mensagem, em vez de três iguais
  return cab(1, 'Análise') + npsHtmlAnalise(r) + cab(2, 'Resumo') + npsHtmlResumo(r) + cab(3, 'Texto') + npsHtmlTexto(r);
}

// r130: Detalhamento = Diagnóstico + Por unidade + Respostas (do quadro geral para o detalhe de cada resposta).
function npsHtmlDetalhamento(r, st) {
  const cab = (n, t) => `<div class="nps-secao-t">${n} · ${t}</div>`;
  return `<div id="nps-sec-diag">${cab(1, 'Diagnóstico')}${npsHtmlDiagnostico(r, st)}</div>
    <div id="nps-sec-unid">${cab(2, 'Por unidade')}${npsHtmlUnidades(r)}</div>
    <div id="nps-sec-resp">${cab(3, 'Respostas')}${npsHtmlRespostas(r, st)}</div>`;
}

function npsRenderAba() {
  const c = $('#abaConteudo');
  if (!c || state.abaHome !== 'nps') return;
  const r = state.npsDados;
  if (!r) {
    const msg = state.npsErroMsg
      ? '<div class="nps-erro">' + esc(state.npsErroMsg) + '</div>'
      : '<div class="nps-vazio">Carregando os dados de CSAT/NPS…<br>Se persistir, tente mudar o filtro ou recarregar a página.</div>';
    c.innerHTML = htmlFiltrosNps() + msg;
    return;
  }
  if (!state.npsModal || (state.npsModal.aba !== 'geral' && state.npsModal.aba !== 'detalhe')) state.npsModal = { aba: 'geral', cat: 'todas', diag: '', soComentario: false, ancora: '' };
  const st = state.npsModal;
  const abas = [['geral', 'Visão geral'], ['detalhe', 'Detalhamento']];
  const corpo = st.aba === 'detalhe' ? npsHtmlDetalhamento(r, st) : npsHtmlVisaoGeral(r);
  const nomeAba = st.aba === 'detalhe' ? 'Detalhamento' : 'Visão geral';
  c.innerHTML = htmlFiltrosNps() + `
    <div class="nps-modal-ctx" style="margin:0 2px 8px">${esc(npsRotuloFiltro())} · período pela data da análise</div>
    <div class="nps-grid k3${state.npsCarregando ? ' carregando' : ''}" id="csatCards">${htmlCardsCsat(r)}</div>
    <div class="nps-subabas" role="tablist">
      ${abas.map(a => `<button type="button" role="tab" class="nps-modal-aba${st.aba === a[0] ? ' ativa' : ''}" onclick="npsTrocarAba('${a[0]}')">${a[1]}</button>`).join('')}
    </div>
    <div class="nps-exporta">
      <div class="rot">Exportar esta aba (${nomeAba})</div>
      <div class="pf-acoes">
        <button type="button" class="pf-acao pdf" onclick="npsExportarPDF('${st.aba}')">📄 PDF</button>
        <button type="button" class="pf-acao ppt" onclick="npsExportarPPTX('${st.aba}')">📽️ PPTX</button>
      </div>
      <div class="rot">Exportar o conteúdo completo (as 2 abas)</div>
      <div class="pf-acoes">
        <button type="button" class="pf-acao pdf" onclick="npsExportarPDF('completo')">📄 PDF completo</button>
        <button type="button" class="pf-acao ppt" onclick="npsExportarPPTX('completo')">📽️ PPTX completo</button>
      </div>
    </div>
    <div>${corpo}</div>`;
  if (st.ancora) {
    const el = document.getElementById('nps-sec-' + st.ancora);
    st.ancora = '';
    if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function npsMesRotulo(ym) {
  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const p = String(ym).split('-');
  if (p.length < 2) return 'sem data';
  return meses[parseInt(p[1], 10) - 1] + '/' + p[0];
}
function npsDataBR(iso) {
  const p = String(iso || '').substring(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : '—';
}

function npsBarrasDist(dist, de, corFn) {
  const max = Math.max.apply(null, dist.concat([1]));
  return dist.map((n, i) => i < de ? '' : `
    <div class="nps-dcol">
      <div class="nps-dn">${n || ''}</div>
      <div class="nps-dbar" style="height:${Math.round(n * 80 / max)}%;background:${corFn(i)}"></div>
      <div class="nps-dl">${i}</div>
    </div>`).join('');
}

function npsHtmlResumo(r) {
  const s = r.resumo;
  if (!s.respondidas) {
    return `<div class="nps-vazio">Nenhuma resposta neste filtro.<br>${s.enviados ? s.enviados + ' pesquisa(s) enviada(s) aguardando resposta.' : 'Nenhuma pesquisa foi enviada neste filtro.'}${npsHtmlBase(r)}</div>`;
  }
  const meses = r.porMes.map(m => {
    const v = m.nps;
    const larg = v === null ? 0 : Math.abs(v) / 2;         // -100..100 -> 0..50% do trilho
    const pos = v !== null && v >= 0 ? 'left:50%' : 'right:50%';
    return `
    <div class="nps-linha-mes">
      <span>${npsMesRotulo(m.mes)}</span>
      <div class="nps-trilho"><span class="nps-preench" style="${pos};width:${larg}%;background:${npsCorValor(v)}"></span></div>
      <span class="nps-val" style="color:${npsCorValor(v)}">${v === null ? '—' : v} <small style="font-weight:400;color:var(--text-light)">${m.csat !== null && m.csat !== undefined ? 'CSAT ' + String(m.csat).replace('.', ',') + ' ' : ''}(${m.respostas})</small></span>
    </div>`;
  }).join('');
  const temLegado = NPS_QUESITOS_ORDEM.some(k => r.quesitos[k] && r.quesitos[k].total > 0);
  let legado = '';
  if (temLegado) {
    legado = '<div class="nps-bloco"><h4>Quesitos do modelo anterior</h4>' + NPS_QUESITOS_ORDEM.map(k => {
      const q = r.quesitos[k]; const tot = q.total;
      if (!tot) return '';
      const seg = q.opcoes.map(o => { const n = q.contagens[o] || 0; return n ? `<span style="width:${n * 100 / tot}%;background:${NPS_COR_OPCAO[o] || '#999'}" title="${esc(o)}: ${n}"></span>` : ''; }).join('');
      const leg = q.opcoes.map(o => { const n = q.contagens[o] || 0; return `<span><i style="background:${NPS_COR_OPCAO[o] || '#999'}"></i>${esc(o)}: <b>${n}</b></span>`; }).join('');
      return `<div class="nps-quesito"><div class="nps-quesito-t">${esc(NPS_QUESITOS_TXT[k])}</div><div class="nps-pilha">${seg}</div><div class="nps-quesito-leg">${leg}</div></div>`;
    }).join('') + '<div class="nps-legenda-faixas" style="margin-top:8px">Respostas dadas antes da mudança do modelo de pesquisa.</div></div>';
  }
  return `
    <div class="nps-bloco">
      <h4>1 · Satisfação com o inventário (CSAT, 1 a 10)</h4>
      ${s.csatRespondidas ? `<div class="nps-dist">${npsBarrasDist(r.distribuicaoCsat, 1, npsCorCsat)}</div>
      <div class="nps-legenda-faixas">
        <span><i style="background:#E05252"></i>1–6 baixo</span><span><i style="background:#D4A017"></i>7–8 médio</span><span><i style="background:#2E7D32"></i>9–10 alto</span>
        <span>Média: <b>${String(s.csatMedio).replace('.', ',')}</b> · satisfeitos (9–10): <b>${s.pctSatisfeitos}%</b></span>
      </div>` : '<div class="nps-vazio" style="padding:12px">Nenhuma resposta do novo modelo neste filtro.</div>'}
    </div>
    <div class="nps-bloco">
      <h4>2 · Recomendação (NPS, 0 a 10)</h4>
      <div class="nps-dist">${npsBarrasDist(r.distribuicao, 0, npsCorNota)}</div>
      <div class="nps-legenda-faixas">
        <span><i style="background:#E05252"></i>0–6 detratores</span><span><i style="background:#D4A017"></i>7–8 neutros</span><span><i style="background:#2E7D32"></i>9–10 promotores</span>
        <span>Nota média: <b>${s.mediaNota === null ? '—' : String(s.mediaNota).replace('.', ',')}</b></span>
      </div>
    </div>
    <div class="nps-bloco">
      <h4>Evolução por mês da análise</h4>
      ${meses}
      <div class="nps-legenda-faixas" style="margin-top:8px">NPS do mês, CSAT médio (quando há) e, entre parênteses, o número de respostas.</div>
    </div>
    ${legado}`;
}

function npsHtmlDiagnostico(r, st) {
  const dg = {};
  r.diagnosticos.forEach(d => { dg[d.chave] = d; });
  if (!r.resumo.csatRespondidas) {
    return '<div class="nps-vazio">O diagnóstico cruza a satisfação com o inventário (CSAT) e a recomendação (NPS).<br>Ainda não há respostas do novo modelo neste filtro.</div>';
  }
  const celulas = NPS_LINHAS.map(l => `<tr><th class="nps-mlin">${l[1]}</th>${NPS_COLUNAS.map(c => {
    const d = dg[l[0] + '_' + c[0]];
    const sel = st.diag === d.chave;
    return `<td><button type="button" class="nps-cel${sel ? ' sel' : ''}${d.quantidade ? '' : ' zero'}" style="background:${NPS_NIVEL_BG[d.nivel]};border-color:${sel ? NPS_NIVEL_COR[d.nivel] : 'transparent'}" onclick="npsSelecionarDiag('${d.chave}')" aria-pressed="${sel}"><b style="color:${NPS_NIVEL_COR[d.nivel]}">${d.quantidade}</b><span>${esc(d.titulo)}</span></button></td>`;
  }).join('')}</tr>`).join('');
  const cab = `<tr><th></th>${NPS_COLUNAS.map(c => `<th>${c[1]}</th>`).join('')}</tr>`;
  let detalhe = '';
  if (st.diag && dg[st.diag]) {
    const d = dg[st.diag];
    detalhe = `
      <div class="nps-bloco" style="border-left:5px solid ${NPS_NIVEL_COR[d.nivel]}">
        <h4>${NPS_NIVEL_ICONE[d.nivel]} ${esc(d.titulo)} · ${d.quantidade} resposta(s)</h4>
        <div class="nps-acao-txt">${esc(d.acao)}</div>
        ${d.itens.length ? d.itens.map(x => `
          <div class="nps-resp ${x.nps >= 9 ? 'p' : (x.nps >= 7 ? 'n' : 'd')}">
            <div class="nps-resp-topo">
              <div class="nps-resp-un">${esc(x.unidade)}<small>${esc(x.cliente)} · análise de ${npsDataBR(x.dataAuditoria)} · respondida em ${npsDataBR(x.dataResposta)}</small></div>
              <div class="nps-notas-duplas"><div class="nps-nota" style="background:${npsCorCsat(x.csat)}" title="Satisfação">${x.csat}</div><div class="nps-nota" style="background:${npsCorNota(x.nps)}" title="Recomendação">${x.nps}</div></div>
            </div>
            ${x.comentario ? `<div class="nps-resp-txt">${esc(x.comentario)}</div>` : '<div class="nps-resp-sem">Sem comentário.</div>'}
          </div>`).join('') : '<div class="nps-vazio" style="padding:12px">Nenhuma resposta neste cruzamento.</div>'}
      </div>`;
  } else {
    const prioritarios = r.diagnosticos.filter(d => d.quantidade && (d.nivel === 'critico' || d.nivel === 'falha' || d.nivel === 'atencao'));
    detalhe = `<div class="nps-bloco"><h4>Exigem ação</h4>${prioritarios.length ? prioritarios.map(d => `
      <button type="button" class="nps-prio" style="border-left-color:${NPS_NIVEL_COR[d.nivel]}" onclick="npsSelecionarDiag('${d.chave}')">
        <b>${NPS_NIVEL_ICONE[d.nivel]} ${esc(d.titulo)} · ${d.quantidade}</b><span>${esc(d.acao)}</span>
      </button>`).join('') : '<div class="nps-vazio" style="padding:12px">Nenhuma resposta exige ação neste filtro. 🎉</div>'}
      <div class="nps-legenda-faixas" style="margin-top:8px">Toque num quadro da tabela para ver as respostas e a ação sugerida.</div></div>`;
  }
  return `
    <div class="nps-bloco">
      <h4>Satisfação com o inventário (linhas) x Recomendação (colunas)</h4>
      <table class="nps-matriz"><thead>${cab}</thead><tbody>${celulas}</tbody></table>
    </div>
    ${detalhe}`;
}

function npsHtmlUnidades(r) {
  if (!r.porUnidade.length) return '<div class="nps-vazio">Nenhuma unidade com pesquisa neste filtro.</div>';
  const linhas = r.porUnidade.map(u => `
    <tr>
      <td class="nps-un">${esc(u.unidade)}<small>${esc(u.cliente)}${u.ultimaAnalise ? ' · última análise ' + npsDataBR(u.ultimaAnalise) : ''}</small></td>
      <td>${u.respostas}<small style="color:var(--text-light)">/${u.enviados}</small></td>
      <td>${u.nps === null ? '<span style="color:var(--text-light)">—</span>' : `<span class="nps-pilula" style="background:${npsCorValor(u.nps)}">${u.nps}</span>`}</td>
      <td>${u.csat === null || u.csat === undefined ? '<span style="color:var(--text-light)">—</span>' : `<span class="nps-pilula" style="background:${npsCorCsat(u.csat)}">${String(u.csat).replace('.', ',')}</span>`}</td>
      <td style="color:${NPS_NIVEL_COR.critico};font-weight:700">${u.criticos || 0}</td>
      <td style="color:${NPS_NIVEL_COR.falha};font-weight:700">${u.falhas || 0}</td>
    </tr>`).join('');
  return `
    <div class="nps-bloco">
      <h4>Do menor para o maior NPS</h4>
      <div class="nps-rolagem"><table class="nps-tabela">
        <thead><tr><th>Unidade</th><th>Resp./env.</th><th>NPS</th><th title="Satisfação média com o inventário (1 a 10)">CSAT</th><th title="Alertas vermelhos">🔴</th><th title="Falhas do inventário">🟠</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table></div>
      <div class="nps-legenda-faixas" style="margin-top:8px">🔴 alerta vermelho (CSAT 1–6 e NPS 0–6) · 🟠 falha do inventário (CSAT 1–6 e NPS 7–10). Unidades sem resposta aparecem por último.</div>
    </div>`;
}

function npsHtmlRespostas(r, st) {
  const cats = [['todas', 'Todas'], ['acao', 'Exigem ação'], ['Promotor', 'Promotores'], ['Neutro', 'Neutros'], ['Detrator', 'Detratores'], ['outro', 'Marcaram "Outro"']];
  const chips = cats.map(c => `<button type="button" class="nps-chip-filtro${st.cat === c[0] ? ' ativo' : ''}" onclick="npsTrocarCat('${c[0]}')">${c[1]}</button>`).join('') +
    `<button type="button" class="nps-chip-filtro${st.soComentario ? ' ativo' : ''}" onclick="npsToggleComentario()">Só com comentário</button>`;
  const exigeAcao = x => x.diagnostico && (x.diagnostico.nivel === 'critico' || x.diagnostico.nivel === 'falha');
  const lista = r.respostas.filter(x => (st.cat === 'todas' || (st.cat === 'acao' ? exigeAcao(x) : (st.cat === 'outro' ? (x.destaques || []).indexOf('outro') !== -1 : x.categoria === st.cat))) && (!st.soComentario || x.comentario));
  const total = r.respostas.length;
  const cortado = r.resumo.respondidas > total ? `<div class="nps-legenda-faixas">Mostrando as ${total} respostas mais recentes.</div>` : '';
  const itens = lista.map(x => {
    const cls = x.categoria === 'Promotor' ? 'p' : (x.categoria === 'Neutro' ? 'n' : 'd');
    const dgTag = x.diagnostico ? `<span class="nps-tag" style="background:${NPS_NIVEL_BG[x.diagnostico.nivel]};color:${NPS_NIVEL_COR[x.diagnostico.nivel]}">${NPS_NIVEL_ICONE[x.diagnostico.nivel]} ${esc(x.diagnostico.titulo)}</span>` : '';
    const dest = (x.destaques || []).map(k => { const it = r.destaques.itens.find(i => i.chave === k); return `<span class="nps-tag${k === 'outro' ? ' medio' : ''}">${esc(it ? it.rotulo : k)}</span>`; }).join('');
    const legado = NPS_QUESITOS_ORDEM.filter(k => x[k]).map(k => {
      const t = NPS_OPCAO_RUIM.indexOf(x[k]) !== -1 ? ' ruim' : (NPS_OPCAO_MEDIA.indexOf(x[k]) !== -1 ? ' medio' : '');
      const nome = { apresentacao: 'Apresentação', postura: 'Postura', supervisor: 'Supervisor', mapeamento: 'Mapeamento', horario: 'Horário' }[k];
      return `<span class="nps-tag${t}">${nome}: ${esc(x[k])}</span>`;
    }).join('');
    const notas = (x.csat !== null && x.csat !== undefined)
      ? `<div class="nps-notas-duplas"><div class="nps-nota" style="background:${npsCorCsat(x.csat)}" title="Satisfação com o inventário">${x.csat}</div><div class="nps-nota" style="background:${npsCorNota(x.nota)}" title="Recomendação">${x.nota}</div></div>`
      : `<div class="nps-nota" style="background:${npsCorNota(x.nota)}" title="${esc(x.categoria)}">${x.nota}</div>`;
    return `
    <div class="nps-resp ${cls}">
      <div class="nps-resp-topo">
        <div class="nps-resp-un">${esc(x.unidade)}<small>${esc(x.cliente)} · análise de ${npsDataBR(x.dataAuditoria)} · respondida em ${npsDataBR(x.dataResposta)}</small></div>
        ${notas}
      </div>
      ${dgTag ? `<div class="nps-tags">${dgTag}</div>` : ''}
      ${x.comentario ? `<div class="nps-resp-txt">${esc(x.comentario)}</div>` : '<div class="nps-resp-sem">Sem comentário.</div>'}
      ${(dest || legado) ? `<div class="nps-tags">${dest}${legado}</div>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="nps-filtros-resp">${chips}</div>
    ${cortado}
    ${itens || '<div class="nps-vazio">Nenhuma resposta com este filtro.</div>'}`;
}

/* ═══════════════════════════════════════════════════════
   ABA "PERFORMANCE" (r110) — somente Diretor
   Cards por cliente (macro) e por unidade (detalhe), comparativo,
   texto da análise e exportação: PDF e apresentação (PPTX + PDF).
   Unidade = média das análises do período; cliente = média das
   unidades. Os filtros só são aplicados ao tocar em "Buscar".
   ═══════════════════════════════════════════════════════ */
const PF_TIPOS = [
  { v: '', t: 'Todas as análises' },
  { v: 'PRÉ-OPERAÇÃO', t: 'Somente PRÉ-OPERAÇÃO' },
  { v: 'DURANTE A OPERAÇÃO', t: 'Somente DURANTE A OPERAÇÃO' }
];
const PF_FAIXAS = ['Excelente', 'Bom', 'Regular', 'Insatisfatório', 'Crítico'];
const PF_COR_FAIXA = { 'Excelente': '#2E7D32', 'Bom': '#61CF00', 'Regular': '#D4A017', 'Insatisfatório': '#E8872B', 'Crítico': '#E05252' };

function pfCor(n) {
  if (n === null || n === undefined || isNaN(n)) return '#9AA7B4';
  if (n >= 9) return '#2E7D32';
  if (n >= 7.5) return '#61CF00';
  if (n >= 6) return '#D4A017';
  if (n >= 4) return '#E8872B';
  return '#E05252';
}
function pfBg(n) {
  if (n === null || n === undefined || isNaN(n)) return '#F4F6F8';
  if (n >= 9) return '#E8F5E9';
  if (n >= 7.5) return '#EAF8E0';
  if (n >= 6) return '#FFF8E1';
  if (n >= 4) return '#FFF3E0';
  return '#FDEAEA';
}
function pfFmt(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1).replace('.', ','); }
function pfDeltaHtml(v) {
  if (v === null || v === undefined) return '<span class="pf-delta" style="color:#9AA7B4">sem comparação</span>';
  if (v === 0) return '<span class="pf-delta" style="color:#6B7B8D">= 0,0 vs anterior</span>';
  return '<span class="pf-delta" style="color:' + (v > 0 ? '#2E7D32' : '#C0392B') + '">' + (v > 0 ? '▲ +' : '▼ ') + pfFmt(v) + ' vs anterior</span>';
}
function pfDeltaCurto(v) {
  if (v === null || v === undefined) return '—';
  if (v === 0) return '= 0,0';
  return (v > 0 ? '▲ +' : '▼ ') + pfFmt(v);
}
function pfDeltaCor(v) { return (v === null || v === undefined || v === 0) ? '#6B7B8D' : (v > 0 ? '#2E7D32' : '#C0392B'); }

const PF_ESTABS = [{ v: '', t: 'Todos os estabelecimentos' }, { v: 'SUPERMERCADO', t: '🛒 Supermercado' }, { v: 'FARMACIA', t: '💊 Farmácia' }];
function pfEstabRotulo(f) { const t = PF_ESTABS.find(x => x.v === f.estab); return t && t.v ? t.t : ''; }
function pfFiltroInicial() { return { clientes: [], estab: '', tipo: '', periodo: '90', de: '', ate: '' }; }
function pfEstado() {
  if (!state.pf) state.pf = { filtro: pfFiltroInicial(), dados: null, aplicado: null, foco: '', textos: null, textosChave: '', origemTexto: '', req: 0 };
  return state.pf;
}
// Presets fecham HOJE (para comparar com um período anterior de mesma duração); "Personalizado" usa as datas digitadas.
function pfIntervalo(f) {
  const iv = npsIntervalo(f);
  if (f.periodo !== 'custom' && f.periodo !== 'tudo' && iv.de) iv.ate = npsIsoLocal(new Date());
  return iv;
}
function pfPeriodoRotulo(f) {
  const iv = pfIntervalo(f);
  const br = s => npsDataBR(s);
  if (!iv.de && !iv.ate) return 'Todo o período';
  if (iv.de && iv.ate) return br(iv.de) + ' a ' + br(iv.ate);
  return iv.de ? 'a partir de ' + br(iv.de) : 'até ' + br(iv.ate);
}
function pfTipoRotulo(f) { const t = PF_TIPOS.find(x => x.v === f.tipo); return t ? t.t : ''; }

/* ── Aba ── */
function carregarPerformanceAba() {
  const c = $('#abaConteudo');
  if (!c) return;
  const p = pfEstado();
  const f = p.filtro;
  const msCli = msHtml('pCli', { opcoes: (state.clientesConcluidos || state.clientes || []).map(x => ({ v: x, t: x })), sel: f.clientes, rotuloTodos: 'Todos os clientes', rotuloPlural: 'clientes', full: true, cb: v => pfMudou('clientes', v) });
  const btnsEstab = PF_ESTABS.map(x => `<button type="button" class="hist-tipo${f.estab === x.v ? ' ativo' : ''}" onclick="pfEscolherEstab('${x.v}')">${x.v ? x.t : 'Todos'}</button>`).join('');
  const optsPer = NPS_PERIODOS.map(x => `<option value="${x.v}"${x.v === f.periodo ? ' selected' : ''}>${x.t}</option>`).join('');
  const optsTipo = PF_TIPOS.map(x => `<option value="${esc(x.v)}"${x.v === f.tipo ? ' selected' : ''}>${x.t}</option>`).join('');
  c.innerHTML = `
    <div class="pf-filtros">
      ${msCli}
      <div class="hist-tipos pf-full" id="pfEstabBtns" role="group" aria-label="Tipo de estabelecimento">${btnsEstab}</div>
      <select id="pfPeriodo" aria-label="Período (data da análise)" onchange="pfMudou('periodo',this.value)">${optsPer}</select>
      <select id="pfTipo" aria-label="Tipo de avaliação" onchange="pfMudou('tipo',this.value)">${optsTipo}</select>
      <div class="pf-datas${f.periodo === 'custom' ? ' aberto' : ''}" id="pfDatas">
        <input type="date" id="pfDe" aria-label="Data inicial" value="${esc(f.de)}" onchange="pfMudou('de',this.value)">
        <input type="date" id="pfAte" aria-label="Data final" value="${esc(f.ate)}" onchange="pfMudou('ate',this.value)">
      </div>
      <div class="pf-aviso-pendente" id="pfAviso">Filtros alterados — toque em Buscar para atualizar.</div>
      <button type="button" class="pf-btn-buscar" id="pfBtnBuscar" onclick="pfBuscar()">🔍 Buscar</button>
    </div>
    <div id="pfResultados"></div>`;
  if (p.dados) pfRender();
  else pfBuscar();   // primeira abertura: cards macro com o filtro padrão (últimos 90 dias)
}

// r129: tipo de estabelecimento em botões (como no Histórico); aplica na hora, sem precisar tocar em Buscar.
function pfEscolherEstab(v) {
  const p = pfEstado();
  p.filtro.estab = v;
  document.querySelectorAll('#pfEstabBtns .hist-tipo').forEach((b, i) => b.classList.toggle('ativo', PF_ESTABS[i].v === v));
  pfBuscar();
}
function pfMudou(campo, valor) {
  const p = pfEstado();
  p.filtro[campo] = valor;
  if (campo === 'periodo') { const d = $('#pfDatas'); if (d) d.classList.toggle('aberto', valor === 'custom'); }
  pfMarcarPendente();
}
function pfMarcarPendente() {
  const p = pfEstado();
  const pend = !p.aplicado || JSON.stringify(p.filtro) !== JSON.stringify(p.aplicado);
  const b = $('#pfBtnBuscar'), a = $('#pfAviso');
  if (b) b.classList.toggle('pendente', !!(pend && p.aplicado));
  if (a) a.classList.toggle('visivel', !!(pend && p.aplicado));
}

async function pfBuscar() {
  const p = pfEstado();
  const f = p.filtro;
  if (f.periodo === 'custom' && f.de && f.ate && f.de > f.ate) { toast('A data inicial é maior que a final'); return; }
  const iv = pfIntervalo(f);
  const req = ++p.req;
  const box = $('#pfResultados');
  if (box) box.classList.add('pf-carregando');
  const r = await apiCall('performanceAnalise', { clientes: f.clientes, estab: f.estab, tipo: f.tipo, de: iv.de, ate: iv.ate });
  const boxAtual = $('#pfResultados');
  if (req !== p.req || state.abaHome !== 'perf' || !boxAtual) return;
  boxAtual.classList.remove('pf-carregando');
  if (!r.ok) {
    const naoPublicado = /nao reconhecida|não reconhecida/i.test(String(r.erro || ''));
    boxAtual.innerHTML = '<div class="pf-erro">' + (naoPublicado
      ? 'O script do servidor ainda não tem o módulo Performance. Publique a nova versão no Apps Script (Implantar → Gerenciar implantações → Nova versão).'
      : 'Não foi possível carregar a Performance: ' + esc(r.erro || 'falha de conexão')) + '</div>';
    return;
  }
  p.dados = r;
  p.aplicado = JSON.parse(JSON.stringify(f));
  pfCarregarContagem();   // r130: os 2 cards do topo (Supermercado/Farmácia) acompanham os filtros aplicados na Performance
  p.foco = (f.clientes.length === 1 && r.clientes.some(c => c.cliente === f.clientes[0])) ? f.clientes[0] : '';
  p.textos = null; p.textosChave = ''; p.origemTexto = '';
  pfMarcarPendente();
  pfRender();
}

function pfRender() {
  const p = pfEstado();
  const box = $('#pfResultados');
  if (!box || !p.dados) return;
  const d = p.dados;
  if (!d.clientes.length) {
    const f = p.aplicado;
    box.innerHTML = '<div class="pf-vazio">Nenhuma análise concluída ' + (f.clientes.length ? 'de <b>' + esc(f.clientes.join(', ')) + '</b> ' : '') + (f.estab ? '(' + esc(pfEstabRotulo(f)) + ') ' : '') +
      'em <b>' + esc(pfPeriodoRotulo(f)) + '</b>' + (f.tipo ? ' (' + esc(pfTipoRotulo(f)) + ')' : '') + '.<br>Ajuste o cliente, o período ou o tipo de avaliação e toque em Buscar.' +
      (f.periodo !== 'tudo' ? '<br><button type="button" class="pf-acao txt" style="display:inline-flex;margin-top:12px" onclick="pfBuscarTodoPeriodo()">Buscar em todo o período</button>' : '') + '</div>';
    return;
  }
  const cli = p.foco ? d.clientes.find(c => c.cliente === p.foco) : null;
  box.innerHTML = cli ? pfHtmlDetalhe(cli) : pfHtmlMacro(d);
}

function pfHtmlPeriodoLinha() {
  const p = pfEstado();
  const ant = p.dados && p.dados.periodoAnterior;
  return `Período (data da análise): <b>${esc(pfPeriodoRotulo(p.aplicado))}</b> · ${esc(pfTipoRotulo(p.aplicado))}${pfEstabRotulo(p.aplicado) ? ' · ' + esc(pfEstabRotulo(p.aplicado)) : ''} · comparado com ` +
    (ant ? `<b>${npsDataBR(ant.de)} a ${npsDataBR(ant.ate)}</b> (período anterior de mesma duração)` : '<b>—</b> (sem período anterior para comparar)');
}

function pfHtmlMetrica(rot, v) {
  const w = (v === null || v === undefined) ? 0 : Math.max(0, Math.min(100, v * 10));
  return `<div class="pf-met"><span>${rot}</span><div class="pf-trilho"><i style="width:${w}%;background:${pfCor(v)}"></i></div><b style="color:${pfCor(v)}">${pfFmt(v)}</b></div>`;
}

function pfHtmlMetricas(o) {
  let h = '';
  if (o.retaguarda !== null) h += pfHtmlMetrica('Retaguarda', o.retaguarda);
  if (o.areaVendas !== null) h += pfHtmlMetrica('Área de Vendas', o.areaVendas);
  if (o.equipe !== null) h += pfHtmlMetrica('Equipe de apoio', o.equipe);
  if (o.organizacao !== null) h += pfHtmlMetrica('Organização', o.organizacao);
  if (o.volume !== null) h += pfHtmlMetrica('Volume (10 = ideal)', o.volume);
  return h;
}

function pfHtmlMacro(d) {
  const t = d.totais;
  const cards = d.clientes.map((c, i) => {
    const total = c.unidades || 1;
    const seg = PF_FAIXAS.map(fx => c.faixas[fx] ? `<span style="width:${c.faixas[fx] * 100 / total}%;background:${PF_COR_FAIXA[fx]}" title="${fx}: ${c.faixas[fx]}"></span>` : '').join('');
    const leg = PF_FAIXAS.filter(fx => c.faixas[fx]).map(fx => `<span><i style="background:${PF_COR_FAIXA[fx]}"></i>${c.faixas[fx]} ${fx}</span>`).join('');
    return `
    <button type="button" class="pf-card" style="border-top-color:${pfCor(c.geral)}" onclick="pfAbrirCliente(${i})" aria-label="Abrir ${esc(c.cliente)}">
      <div class="pf-card-topo">
        <div><div class="pf-nome">${esc(c.cliente)}</div><div class="pf-sub">${c.unidades} unidade(s) · ${c.analises} análise(s)</div></div>
        <div class="pf-nota"><b style="color:${pfCor(c.geral)}">${pfFmt(c.geral)}</b>${c.faixa ? `<span class="pf-faixa" style="background:${pfCor(c.geral)}">${c.faixa}</span>` : ''}</div>
      </div>
      ${pfDeltaHtml(c.variacao.geral)}
      ${pfHtmlMetricas(c)}
      <div class="pf-pilha" aria-hidden="true">${seg}</div>
      <div class="pf-leg">${leg}</div>
      <div class="pf-destaque">
        ${c.referencia ? `<span>★ Referência: <b>${esc(c.referencia.unidade)}</b> (${pfFmt(c.referencia.geral)})</span>` : ''}
        ${c.atencao ? `<span>↗ Maior oportunidade: <b>${esc(c.atencao.unidade)}</b> (${pfFmt(c.atencao.geral)})</span>` : ''}
      </div>
    </button>`;
  }).join('');
  return `
    <div class="pf-resumo-linha"><b>${t.clientes}</b> cliente(s) · <b>${t.unidades}</b> unidade(s) · <b>${t.analises}</b> análise(s) concluída(s).<br>${pfHtmlPeriodoLinha()}</div>
    <div class="pf-grid">${cards}</div>
    <div class="pf-nota-tab">Nota da unidade = média das análises do período; nota do cliente = média das unidades. Toque num cliente para ver as unidades, a análise e exportar.</div>`;
}

function pfAbrirCliente(i) {
  const p = pfEstado();
  const c = p.dados.clientes[i];
  if (!c) return;
  p.foco = c.cliente;   // r127: abrir um cliente NÃO altera os filtros (que podem ter vários clientes)
  pfRender();
  window.scrollTo(0, 0);
}
// Volta para os cards dos clientes da busca atual.
function pfVoltarMacro() {
  const p = pfEstado();
  p.foco = '';
  pfRender();
}
function pfBuscarTodoPeriodo() {
  const p = pfEstado();
  p.filtro.periodo = 'tudo';
  pfSincronizarCampos();
  pfBuscar();
}
function pfSincronizarCampos() {
  const f = pfEstado().filtro;
  [['#pfPeriodo', f.periodo], ['#pfTipo', f.tipo], ['#pfDe', f.de], ['#pfAte', f.ate]].forEach(x => { const el = $(x[0]); if (el) el.value = x[1]; });
  const d = $('#pfDatas'); if (d) d.classList.toggle('aberto', f.periodo === 'custom');
}

function pfCelula(v) { return `<td style="color:${pfCor(v)};background:${pfBg(v)}">${pfFmt(v)}</td>`; }

function pfHtmlDetalhe(c) {
  const p = pfEstado();
  const total = c.unidades || 1;
  const seg = PF_FAIXAS.map(fx => c.faixas[fx] ? `<span style="width:${c.faixas[fx] * 100 / total}%;background:${PF_COR_FAIXA[fx]}"></span>` : '').join('');
  const leg = PF_FAIXAS.filter(fx => c.faixas[fx]).map(fx => `<span><i style="background:${PF_COR_FAIXA[fx]}"></i>${c.faixas[fx]} ${fx}</span>`).join('');
  const unidades = c.lista.map((u, idx) => `
    <div class="pf-card" style="border-top-color:${pfCor(u.geral)}">
      <div class="pf-card-topo">
        <div><div class="pf-nome">${esc(u.unidade)}</div><div class="pf-sub">${u.analises} análise(s)${u.ultimaAnalise ? ' · última em ' + npsDataBR(u.ultimaAnalise) : ''}</div></div>
        <div class="pf-nota"><b style="color:${pfCor(u.geral)}">${pfFmt(u.geral)}</b>${u.faixa ? `<span class="pf-faixa" style="background:${pfCor(u.geral)}">${u.faixa}</span>` : ''}</div>
      </div>
      ${pfDeltaHtml(u.variacao.geral)}
      ${pfHtmlMetricas(u)}
      ${idx === 0 && c.lista.length > 1 && c.referencia ? '<div class="pf-destaque"><span>★ Referência de boas práticas do cliente</span></div>' : ''}
    </div>`).join('');

  const linhas = c.lista.map(u => `<tr><td>${esc(u.unidade)}</td>${pfCelula(u.geral)}${pfCelula(u.equipe)}${pfCelula(u.retaguarda)}${pfCelula(u.areaVendas)}<td style="color:${pfDeltaCor(u.variacao.geral)}">${pfDeltaCurto(u.variacao.geral)}</td></tr>`).join('');
  const tabComp = `
    <div class="pf-bloco"><h4>Comparativo entre unidades</h4>
      <div class="pf-rolagem"><table class="pf-tab"><thead><tr><th>Unidade</th><th>Geral</th><th>Equipe</th><th>Retaguarda</th><th>Área de Vendas</th><th>Variação<br>vs anterior</th></tr></thead><tbody>${linhas}
      <tr class="pf-total"><td>Média do cliente</td>${pfCelula(c.geral)}${pfCelula(c.equipe)}${pfCelula(c.retaguarda)}${pfCelula(c.areaVendas)}<td style="color:${pfDeltaCor(c.variacao.geral)}">${pfDeltaCurto(c.variacao.geral)}</td></tr></tbody></table></div>
      <div class="pf-nota-tab">Setor ou critério não avaliado aparece como "—" (nunca como zero).</div>
    </div>`;

  const temOV = c.lista.some(u => u.organizacao !== null || u.volume !== null);
  const linhasOV = c.lista.map(u => `<tr><td>${esc(u.unidade)}</td>${pfCelula(u.organizacao)}${pfCelula(u.volume)}${pfCelula(u.orgVol)}</tr>`).join('');
  const tabOV = !temOV ? '' : `
    <div class="pf-bloco"><h4>Organização x Volume</h4>
      <div class="pf-rolagem"><table class="pf-tab"><thead><tr><th>Unidade</th><th>Organização</th><th>Volume<br>(10 = ideal)</th><th>Média dos dois</th></tr></thead><tbody>${linhasOV}
      <tr class="pf-total"><td>Média do cliente</td>${pfCelula(c.organizacao)}${pfCelula(c.volume)}${pfCelula(c.orgVol)}</tr></tbody></table></div>
      <div class="pf-nota-tab">Leitura do volume: quanto maior o volume de mercadoria, menor a nota (1 = volume excessivo · 10 = volume ideal). Volume acima do ideal é sempre ponto de atenção, mesmo com boa organização.</div>
    </div>`;

  return `
    <button type="button" class="pf-voltar" onclick="pfVoltarMacro()">← Todos os clientes</button>
    <div class="pf-topo-detalhe">
      <div class="pf-card-topo">
        <div><h3>${esc(c.cliente)}</h3><div class="pf-sub">${c.unidades} unidade(s) · ${c.analises} análise(s)</div></div>
        <div class="pf-nota"><b style="color:${pfCor(c.geral) === '#2E7D32' ? '#61CF00' : pfCor(c.geral)}">${pfFmt(c.geral)}</b>${c.faixa ? `<span class="pf-faixa" style="background:${pfCor(c.geral)}">${c.faixa}</span>` : ''}</div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:rgba(255,255,255,.8)">${pfDeltaHtml(c.variacao.geral).replace(/color:#[0-9A-Fa-f]{6}/, 'color:#fff')}</div>
      <div class="pf-pilha" style="margin-top:10px">${seg}</div>
      <div class="pf-leg" style="margin-top:6px;color:rgba(255,255,255,.75)">${leg}</div>
    </div>
    <div class="pf-resumo-linha">${pfHtmlPeriodoLinha()}</div>
    <div class="pf-acoes">
      <button type="button" class="pf-acao txt" onclick="pfGerarTextoTela()">✨ Gerar análise em texto</button>
      <button type="button" class="pf-acao pdf" onclick="pfExportarPDF()">📄 Exportar análise (PDF)</button>
      <button type="button" class="pf-acao ppt" onclick="pfExportarPPTX()">🎬 Apresentação com resumo executivo (PPTX + PDF)</button>
    </div>
    <div class="pf-grid">${unidades}</div>
    ${tabComp}
    ${tabOV}
    <div id="pfTexto">${pfHtmlTexto(c)}</div>`;
}

/* ── Texto da análise ── */
function pfChaveTexto() { const p = pfEstado(); return JSON.stringify(p.aplicado) + '|' + p.foco; }

function pfHtmlTexto(c) {
  const p = pfEstado();
  if (!p.textos || p.textosChave !== pfChaveTexto()) return '';
  const t = p.textos;
  const par = x => x ? `<p>${esc(x)}</p>` : '';
  const un = c.lista.filter(u => t.unidades && t.unidades[u.unidade]).map(u => `<div class="pf-un"><b>${esc(u.unidade)}</b> <span style="color:${pfCor(u.geral)};font-weight:700">${pfFmt(u.geral)} — ${esc(u.faixa || '')}</span><p>${esc(t.unidades[u.unidade])}</p></div>`).join('');
  return `
    ${p.origemTexto === 'contingencia' ? '<div class="pf-origem">Texto gerado pelo modelo de contingência (a IA não respondeu). Você pode exportar assim ou gerar novamente.</div>' : ''}
    <div class="pf-bloco pf-texto"><h4>Análise de performance</h4>${par(t.resumo_executivo)}${par(t.evolucao)}${par(t.comparativo)}${par(t.volume_organizacao)}</div>
    ${un ? `<div class="pf-bloco pf-texto"><h4>Análise por unidade</h4>${un}</div>` : ''}
    <div class="pf-bloco pf-texto"><h4>Conclusão</h4>
      ${t.pontos_positivos ? `<div class="pf-caixa ok"><h5>✓ PONTOS POSITIVOS</h5><p>${esc(t.pontos_positivos)}</p></div>` : ''}
      ${t.oportunidades ? `<div class="pf-caixa at"><h5>⚠ OPORTUNIDADES DE MELHORIA</h5><p>${esc(t.oportunidades)}</p></div>` : ''}
      ${t.sugestoes ? `<div class="pf-caixa su"><h5>→ SUGESTÕES</h5><p>${esc(t.sugestoes)}</p></div>` : ''}
    </div>`;
}

function pfPayloadBase() {
  const p = pfEstado();
  const iv = pfIntervalo(p.aplicado);
  return { cliente: p.foco, estab: p.aplicado.estab || '', tipo: p.aplicado.tipo, de: iv.de, ate: iv.ate };
}

// Devolve os textos (gera se ainda não existem para este filtro). null = falhou.
async function pfGarantirTexto(forcar) {
  const p = pfEstado();
  if (!forcar && p.textos && p.textosChave === pfChaveTexto()) return p.textos;
  showLoading('Gerando a análise em texto...');
  const r = await apiCall('performanceGerarTexto', pfPayloadBase());
  hideLoading();
  if (!r.ok) { toast('Erro ao gerar a análise: ' + (r.erro || 'falha')); return null; }
  p.textos = r.textos; p.textosChave = pfChaveTexto(); p.origemTexto = r.origem || '';
  return p.textos;
}

async function pfGerarTextoTela() {
  const p = pfEstado();
  const t = await pfGarantirTexto(true);
  if (!t) return;
  const c = p.dados.clientes.find(x => x.cliente === p.foco);
  const el = $('#pfTexto');
  if (el && c) { el.innerHTML = pfHtmlTexto(c); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

/* ── Exportações ── */
function pfModalLinks(titulo, texto, links) {
  let m = document.getElementById('pfModal');
  if (m) m.remove();
  m = document.createElement('div');
  m.id = 'pfModal';
  m.className = 'nps-modal';
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  m.innerHTML = `
    <div class="nps-folha" style="max-width:440px">
      <div class="nps-modal-topo"><div class="nps-modal-linha"><div class="nps-modal-titulo">${esc(titulo)}</div><button type="button" class="nps-modal-x" aria-label="Fechar" onclick="document.getElementById('pfModal').remove()">✕</button></div></div>
      <div class="nps-modal-corpo">
        <p style="font-size:13px;line-height:1.6;color:var(--text)">${texto}</p>
        <div class="pf-links">${links.map(l => l.href
          ? `<a href="${esc(l.href)}" target="_blank" rel="noopener" style="background:${l.cor};color:${l.txt || '#fff'}">${l.rot}</a>`
          : `<button type="button" disabled style="background:#E2E8F0;color:#6B7B8D">${l.rot}</button>`).join('')}</div>
      </div>
    </div>`;
  document.body.appendChild(m);
}

async function pfExportarPDF() {
  const p = pfEstado();
  const t = await pfGarantirTexto(false);
  if (!t) return;
  const c = p.dados.clientes.find(x => x.cliente === p.foco);
  const el = $('#pfTexto'); if (el && c) el.innerHTML = pfHtmlTexto(c);
  showLoading('Gerando o PDF da análise...');
  const r = await apiCall('performanceExportarPDF', Object.assign(pfPayloadBase(), { textos: t }));
  hideLoading();
  if (!r.ok) { toast('Erro ao exportar: ' + (r.erro || 'falha')); return; }
  pfModalLinks('Análise em PDF pronta', 'A análise de <b>' + esc(p.foco) + '</b> foi salva no Drive (pasta Performance_FC).',
    [{ href: r.linkPDF, rot: '📄 Abrir / baixar o PDF', cor: 'var(--navy)' }, { href: r.linkHTML, rot: '🌐 Versão HTML', cor: '#E8EAF6', txt: 'var(--navy)' }]);
}

async function pfExportarPPTX() {
  const p = pfEstado();
  const c = p.dados.clientes.find(x => x.cliente === p.foco);
  if (!c) return;
  const disponivel = await aguardarPptxGenJS();
  if (!disponivel) { toast('Não foi possível carregar a biblioteca de apresentação. Verifique sua conexão e tente novamente.'); return; }
  const t = await pfGarantirTexto(false);
  if (!t) return;
  const el = $('#pfTexto'); if (el) el.innerHTML = pfHtmlTexto(c);
  let b64;
  try {
    showLoading('Montando a apresentação...');
    b64 = await montarPptxPerformance({
      cliente: c, textos: t, periodoTxt: pfPeriodoRotulo(p.aplicado), tipoTxt: pfTipoRotulo(p.aplicado),
      anterior: p.dados.periodoAnterior
    });
  } catch (e) { hideLoading(); toast('Erro ao montar a apresentação: ' + e.message); return; }
  showLoading('Salvando no Drive e convertendo em PDF...');
  const r = await apiCall('performanceSalvarApresentacao', Object.assign(pfPayloadBase(), { pptxBase64: b64 }));
  hideLoading();
  if (!r.ok) { toast('Erro ao salvar a apresentação: ' + (r.erro || 'falha')); return; }
  pfModalLinks('Apresentação pronta',
    'A apresentação de <b>' + esc(p.foco) + '</b> foi salva no Drive (pasta Performance_FC).' + (r.linkPDF ? '' : '<br><br><b>O PDF não pôde ser gerado</b>' + (r.erroPDF ? ' (' + esc(r.erroPDF) + ')' : '') + '. O PPTX está disponível.'),
    [{ href: r.linkPPTX, rot: '📽️ Baixar o PPTX', cor: 'var(--orange)' }, r.linkPDF ? { href: r.linkPDF, rot: '📄 Abrir / baixar o PDF', cor: 'var(--navy)' } : { rot: 'PDF indisponível' }]);
}

async function editarAuditoria(auditoriaId) {
  showLoading('Carregando auditoria...');
  const r = await apiCall('carregarAuditoria', { id: auditoriaId });
  hideLoading();
  if (!r.ok || !r.auditoria) { toast('Erro: ' + (r.erro || 'não encontrada')); return; }
  const a = r.auditoria;
  state.auditoriaId = a.id;
  state.identificacao = a.identificacao || {};
  state.respostas = a.respostas || {};
  state.observacoes = a.observacoes || {};
  state.fotos = {};
  state.fotosIds = a.fotosIds || {};
  state.status = a.status || 'CONCLUIDO';
  state.secaoAtual = 0;
  state.editando = true;
  aplicarTipoEstabelecimento(detectarTipoEstabelecimento(state.identificacao, state.respostas));
  renderFormulario();
}

async function excluirAuditoria(auditoriaId, nome) {
  if (!confirm('Excluir a auditoria "' + nome + '"?')) return;
  if (!confirm('Confirma a exclusão definitiva?')) return;
  showLoading('Excluindo...');
  const r = await apiCall('excluirAuditoria', { auditoriaId });
  hideLoading();
  if (r.ok) { toast('Auditoria excluída'); verHistorico(); }
  else toast('Erro: ' + (r.erro || 'falha'));
}

async function abrirRelatorio(auditoriaId, formato) {
  showLoading('Gerando relatório...');
