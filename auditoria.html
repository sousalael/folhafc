// r116: filtros (cliente, unidade, período) — exibidos no topo da aba CSAT/NPS.
function htmlFiltrosNps() {
  if (!state.npsFiltro) state.npsFiltro = npsFiltroInicial();
  const f = state.npsFiltro;
  const clientes = state.clientesConcluidos || state.clientes || [];
  const msCli = msHtml('nCli', { opcoes: clientes.map(c => ({ v: c, t: c })), sel: f.clientes, rotuloTodos: 'Todos os clientes', rotuloPlural: 'clientes', cb: v => npsMudouClientes(v) });
  const ou = npsOpcoesUnidade();
  const msUni = msHtml('nUni', { opcoes: ou, sel: f.unidades, rotuloTodos: 'Todas as unidades', rotuloPlural: 'unidades', desabilitado: !f.clientes.length, msgVazio: 'Sem unidades para os clientes escolhidos', cb: v => npsMudouUnidades(v) });
  if (!f.supervisores) f.supervisores = [];
  const msSup = msHtml('nSup', { opcoes: (state.npsSupervisores || []).map(x => ({ v: x, t: x })), sel: f.supervisores, rotuloTodos: 'Todos os supervisores', rotuloPlural: 'supervisores', full: true, msgVazio: 'Nenhum supervisor encontrado neste recorte', cb: v => npsMudouSupervisores(v) });
  const optsPer = NPS_PERIODOS.map(p => `<option value="${p.v}"${p.v === f.periodo ? ' selected' : ''}>${p.t}</option>`).join('');
  return `
    <div class="nps-painel" style="margin-bottom:12px">
      <div class="nps-filtros" style="margin-bottom:0">
        ${msCli}
        ${msUni}
        ${msSup}
        <select id="npsPeriodo" aria-label="Período (data da análise)" onchange="npsMudouPeriodo(this.value)" style="grid-column:1/-1">${optsPer}</select>
        <div class="nps-datas${f.periodo === 'custom' ? ' aberto' : ''}" id="npsDatas">
          <input type="date" id="npsDe" aria-label="Data inicial" value="${esc(f.de)}" onchange="npsMudouDatas()">
          <input type="date" id="npsAte" aria-label="Data final" value="${esc(f.ate)}" onchange="npsMudouDatas()">
        </div>
      </div>
    </div>`;
}

// Unidades dos clientes escolhidos. Valor = "cliente\tunidade" (nomes de unidade podem repetir entre clientes).
function npsOpcoesUnidade() {
  const f = state.npsFiltro || npsFiltroInicial();
  const mapa = state.unidadesConcluidas || state.unidades || {};
  const varios = f.clientes.length > 1;
  const out = [];
  f.clientes.forEach(c => (mapa[c] || []).forEach(u => out.push({ v: c + '\t' + u, t: u, sub: varios ? c : '', rot: varios ? u + ' (' + c + ')' : u })));
  return out;
}

function npsMudouClientes(v) {
  const f = state.npsFiltro;
  f.clientes = v;
  const ou = npsOpcoesUnidade();
  f.unidades = f.unidades.filter(x => ou.some(o => o.v === x));   // unidades de clientes desmarcados saem
  msRedesenhar('nUni', ou, !v.length);
  if (MS.nUni) f.unidades = MS.nUni.sel.slice();
  npsCarregarCards();
}
function npsMudouSupervisores(v) { state.npsFiltro.supervisores = v; npsCarregarCards(); }
function npsMudouUnidades(v) { state.npsFiltro.unidades = v; npsCarregarCards(); }
function npsMudouPeriodo(v) {
  state.npsFiltro.periodo = v;
  const d = $('#npsDatas');
  if (d) d.classList.toggle('aberto', v === 'custom');
  if (v !== 'custom') npsCarregarCards();
  else if (state.npsFiltro.de || state.npsFiltro.ate) npsCarregarCards();
}
function npsMudouDatas() {
  state.npsFiltro.de = ($('#npsDe') || {}).value || '';
  state.npsFiltro.ate = ($('#npsAte') || {}).value || '';
  npsCarregarCards();
}

function npsRotuloFiltro() {
  const f = state.npsFiltro || npsFiltroInicial();
  const per = NPS_PERIODOS.find(p => p.v === f.periodo);
  let per_t = per ? per.t : '';
  if (f.periodo === 'custom') {
    const br = s => s ? s.split('-').reverse().join('/') : '…';
    per_t = br(f.de) + ' a ' + br(f.ate);
  }
  const nomesUn = f.unidades.map(x => x.split('\t')[1] || x);
  return (f.clientes.length ? f.clientes.join(', ') : 'Todos os clientes') + ' · ' + (nomesUn.length ? nomesUn.join(', ') : 'Todas as unidades') + ' · ' + ((f.supervisores || []).length ? 'Supervisor: ' + f.supervisores.join(', ') : 'Todos os supervisores') + ' · ' + per_t;
}

async function npsCarregarCards() {
  if (!state.npsFiltro) state.npsFiltro = npsFiltroInicial();
  const f = state.npsFiltro;
  const iv = npsIntervalo(f);
  const req = state.npsReq = (state.npsReq || 0) + 1;
  state.npsCarregando = true;
  const caixa = $('#csatCards');
  if (caixa) caixa.classList.add('carregando');
  const r = await apiCall('npsAnalise', { clientes: f.clientes, unidades: f.unidades, supervisores: f.supervisores || [], de: iv.de, ate: iv.ate });
  if (req !== state.npsReq) return;   // resposta antiga (chegou depois de um filtro mais novo)
  if (!r.ok) {
    state.npsCarregando = false;
    state.npsDados = null;
    const naoPublicado = /nao reconhecida|não reconhecida/i.test(String(r.erro || ''));
    state.npsErroMsg = naoPublicado
      ? 'O script do servidor ainda não tem o módulo NPS. Publique a nova versão no Apps Script (Implantar → Gerenciar implantações → Nova versão).'
      : 'Não foi possível carregar o CSAT/NPS: ' + (r.erro || 'falha de conexão');
    if (state.abaHome === 'nps') npsRenderAba();
    return;
  }
  state.npsErroMsg = '';
  // r127: lista de supervisores do recorte; quem saiu da lista (ex.: trocou de cliente) deixa de filtrar
  state.npsSupervisores = r.supervisoresDisponiveis || [];
  const supAntes = (f.supervisores || []).length;
  f.supervisores = (f.supervisores || []).filter(x => state.npsSupervisores.indexOf(x) !== -1);
  if (f.supervisores.length !== supAntes) { npsCarregarCards(); return; }
  state.npsCarregando = false;
  state.npsDados = r;
  if (state.abaHome === 'nps') npsRenderAba();   // a aba CSAT/NPS acompanha o filtro
}

// r130: redesenha os 2 cards do topo com o que já está em memória (sem nova chamada ao servidor)
function npsRedesenharCards() {
  const box = $('#npsCards');
  if (box) box.innerHTML = htmlCardsNps();
}

// r118: contagem de clientes/unidades/análises concluídas — usa o filtro APLICADO na aba Performance
// (na primeira abertura, o filtro padrão dela).
async function pfCarregarContagem() {
  const p = pfEstado();
  const f = p.aplicado || p.filtro;
  const iv = pfIntervalo(f);
  const req = state.pfContagemReq = (state.pfContagemReq || 0) + 1;
  const r = await apiCall('contarAnalisadasPerformance', { clientes: f.clientes, estab: f.estab, tipo: f.tipo, de: iv.de, ate: iv.ate });
  if (req !== state.pfContagemReq) return;
  if (r && r.ok && r.totais) { state.pfContagem = r.totais; state.pfContagemErro = false; }
  else { state.pfContagem = null; state.pfContagemErro = true; }
  npsRedesenharCards();
}

const NPS_NIVEL_COR = { critico: '#C0392B', falha: '#E8872B', atencao: '#D4A017', neutro: '#8899AA', bom: '#61CF00', otimo: '#2E7D32' };
const NPS_NIVEL_BG = { critico: '#FDEAEA', falha: '#FFF3E0', atencao: '#FFF8E1', neutro: '#F4F6F8', bom: '#EAF8E0', otimo: '#E8F5E9' };
const NPS_NIVEL_ICONE = { critico: '🔴', falha: '🟠', atencao: '🟡', neutro: '⚪', bom: '🟢', otimo: '🟢' };

function npsCorCsat(n) { return n === null || n === undefined ? '#9AA7B4' : (n >= 9 ? '#2E7D32' : (n >= 7 ? '#D4A017' : '#E05252')); }

// Cada card é de um tipo de estabelecimento (Supermercado / Farmácia). A contagem segue os filtros da aba Performance.

  return card('🛒 Supermercado · analisadas', pt ? pt.SUPERMERCADO : null) + card('💊 Farmácia · analisadas', pt ? pt.FARMACIA : null);
}

// r130: os cards de NPS, CSAT e Respostas — agora no topo da aba CSAT/NPS (acompanham os filtros dessa aba).
