<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Auditoria de Operação — Sistema de Gestão FC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
:root{--navy:#002B50;--green:#61CF00;--orange:#E8872B;--dark:#051323;--bg:#F4F6F8;--text:#1A2A3A;--text-light:#6B7B8D;--border:#E2E8F0;--white:#FFF;--red:#E05252;--amber:#D4A017}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.app-header{background:var(--dark);padding:24px 16px;text-align:center}
.app-header img{height:52px;margin-bottom:10px;}
.app-header .header-bar{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
.app-header .badge-mod{background:var(--green);color:var(--dark);font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.5px}
.app-header .btn-voltar{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);font-size:11px;padding:4px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.app-header .btn-voltar:hover{border-color:rgba(255,255,255,.5);color:#FFF}
.app-header .badge-mod{background:var(--green);color:var(--dark);font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.5px}

/* TELA INICIAL */
.tela-inicial{max-width:480px;margin:40px auto;padding:0 16px}
.card-inicio{background:var(--white);border-radius:16px;padding:28px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:none}
.card-inicio h2{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px}
.card-inicio p{font-size:13px;color:var(--text-light);margin-bottom:20px}
.btn-fc{border:none;border-radius:12px;padding:14px 24px;font-size:14px;font-weight:600;width:100%;cursor:pointer;transition:all .2s}
.btn-fc-green{background:var(--green);color:var(--dark)}.btn-fc-green:hover{background:#56b800;color:var(--dark)}
.btn-fc-navy{background:var(--navy);color:var(--white)}.btn-fc-navy:hover{background:#001d38;color:var(--white)}
.btn-fc-orange{background:var(--orange);color:var(--white)}.btn-fc-orange:hover{background:#cf7520;color:var(--white)}
.btn-fc-outline{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-fc-outline:hover{border-color:var(--navy);color:var(--navy)}

/* RASCUNHOS */
.rascunho-item{background:var(--white);border-radius:12px;padding:16px;margin-bottom:10px;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.rascunho-item:hover{border-color:var(--green)}.rascunho-item .ri-titulo{font-weight:600;font-size:14px;color:var(--navy)}
.rascunho-item .ri-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.rascunho-item .ri-badge{display:inline-block;background:var(--orange);color:var(--white);font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:6px}

/* STEPPER */
.stepper-bar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:99;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.stepper-bar::-webkit-scrollbar{display:none}
.step-dot{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-right:4px;cursor:pointer;transition:all .2s;border:2px solid transparent;color:var(--text-light);background:var(--bg)}
.step-dot.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
.step-dot.done{background:rgba(97,207,0,.15);color:#3a8000;border-color:var(--green)}
.step-dot .bi{font-size:12px}

/* FORM CONTAINER */
.form-container{max-width:560px;margin:0 auto;padding:16px}
.secao-card{background:var(--white);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.secao-titulo{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.secao-subtitulo{font-size:12px;color:var(--text-light);margin-bottom:20px;padding-left:28px}

/* SUBSECAO ACCORDION */
.subsecao{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.subsecao-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg);transition:all .2s}
.subsecao-header:hover{background:#e8ecf0}
.subsecao-header .sh-titulo{font-size:13px;font-weight:600;color:var(--text)}
.subsecao-header .sh-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.subsecao-header .sh-badge.pendente{background:#fef3cd;color:#856404}
.subsecao-header .sh-badge.preenchido{background:rgba(97,207,0,.15);color:#3a8000}
.subsecao-body{padding:16px;display:none;border-top:1px solid var(--border)}
.subsecao.aberta .subsecao-body{display:block}
.subsecao.aberta .subsecao-header{background:var(--white)}

/* CRITERIO */
.criterio{margin-bottom:20px}
.criterio:last-child{margin-bottom:0}
.criterio-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.4}
.escala-hints{display:flex;justify-content:space-between;margin-bottom:4px;font-size:10px;color:var(--text-light)}
.rating-row{display:flex;gap:3px;flex-wrap:nowrap}
.rating-btn{flex:1;min-width:0;height:36px;border:2px solid var(--border);border-radius:6px;background:var(--white);font-size:12px;font-weight:600;color:var(--text-light);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;padding:0}
.rating-btn:hover{border-color:var(--navy);color:var(--navy)}
.rating-btn.selected{color:var(--white);border-color:transparent}
.rating-btn.selected.score-low{background:var(--red)}
.rating-btn.selected.score-mid{background:var(--orange)}
.rating-btn.selected.score-ok{background:var(--amber)}
.rating-btn.selected.score-high{background:var(--green)}
.rating-btn.na-btn{font-size:10px;letter-spacing:0}
.rating-btn.na-btn.selected{background:var(--text-light)}

/* CAMPOS */
.campo-obs textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px;font-size:13px;resize:vertical;min-height:80px;font-family:inherit;transition:border-color .2s}
.campo-obs textarea:focus{outline:none;border-color:var(--navy)}
.campo-obs label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}

.campo-input{margin-bottom:16px}
.campo-input label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.campo-input input,.campo-input select{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;transition:border-color .2s;background:var(--white);color:var(--text)}
.campo-input input:focus,.campo-input select:focus{outline:none;border-color:var(--navy)}

/* FOTOS */
.fotos-section{margin-top:16px}
.fotos-section label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:block}
.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foto-slot{aspect-ratio:4/3;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;transition:all .2s;overflow:hidden;position:relative;background:var(--bg)}
.foto-slot:hover{border-color:var(--navy)}
.foto-slot .bi{font-size:20px;color:var(--text-light)}
.foto-slot span{font-size:10px;color:var(--text-light);margin-top:2px}
.foto-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.foto-slot .foto-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:var(--white);border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}

/* NAVIGATION */
.nav-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;z-index:100;justify-content:center;max-width:560px;margin:0 auto}
.nav-bottom .btn-fc{width:auto;flex:1;max-width:200px}
.body-pad{padding-bottom:80px}

/* PROGRESS */
.progress-info{text-align:center;padding:8px;font-size:11px;color:var(--text-light);background:var(--white);border-top:1px solid var(--border)}

/* STATUS */
.status-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--white);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.status-toast.show{opacity:1}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(5,19,35,.7);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:12px;color:var(--white);font-size:14px}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SCORE PREVIEW */
.score-preview{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:10px}
.score-preview .sp-valor{font-size:22px;font-weight:700;color:var(--navy)}
.score-preview .sp-label{font-size:11px;color:var(--text-light)}

@media(max-width:380px){.rating-btn{font-size:11px;height:32px}}
</style>
</head>

  identificacao: {},   // campos da tela de identificação

/* ═══════════════════════════════════════════════════════
   UTILITÁRIOS
   ═══════════════════════════════════════════════════════ */
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(msg, ms=2500) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function showLoading(msg='Carregando...') {
  $('#loadingMsg').textContent = msg;
  $('#loading').style.display = 'flex';
}
function hideLoading() { $('#loading').style.display = 'none'; }

function getToken() {
  return new URLSearchParams(window.location.search).get('token') || sessionStorage.getItem('fc_token');
}

function scoreClass(v) {
  if (v <= 3) return 'score-low';
  if (v <= 5) return 'score-mid';
  if (v <= 7) return 'score-ok';
  return 'score-high';
}

function scoreColor(v) {
  if (v <= 3) return 'var(--red)';
  if (v <= 5) return 'var(--orange)';
  if (v <= 7) return 'var(--amber)';
  return 'var(--green)';
}

function calcMediaSecao(secao) {
  let criterios = secao.criterios || [];
  if (secao.subsecoes) criterios = secao.subsecoes.flatMap(s => s.criterios);
  const notas = criterios.map(c => state.respostas[c.id]).filter(v => v && v !== 'NA');
  if (!notas.length) return null;
  return (notas.reduce((a,b) => a+b, 0) / notas.length).toFixed(1);
}

function secaoPreenchida(secao) {
  let criterios = secao.criterios || [];
  if (secao.subsecoes) criterios = secao.subsecoes.flatMap(s => s.criterios);
  if (secao.tipo === 'identificacao') {
    const obrigatorios = ['tipo_avaliacao','cliente','unidade','data_auditoria'];
    return obrigatorios.every(c => state.identificacao[c]);
  }
  if (secao.tipo === 'finalizacao') return true;
  return criterios.length > 0 && criterios.every(c => state.respostas[c.id] !== undefined);
}

function subsecaoPreenchida(sub) {
  return sub.criterios.every(c => state.respostas[c.id] !== undefined);
}

/* ═══════════════════════════════════════════════════════
   API (comunicação com o backend)
   ═══════════════════════════════════════════════════════ */
async function apiCall(action, dados={}) {
  try {
    const params = new URLSearchParams(window.location.search);
    const cpf = params.get('cpf') || '';
    const token = params.get('token') || '';
    const payload = Object.assign({ action: action, cpf: cpf, token: token }, dados);
    const r = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify(payload)
    });
    const json = await r.json();
    if (json.error && !json.erro) json.erro = json.error;
    if (json.error && json.ok === undefined) json.ok = false;
    return json;
  } catch(e) {
    console.error('API error:', e);
    return { ok:false, erro: e.message };
  }
}

async function salvarRascunho(silencioso) {
  const dados = {
    id: state.auditoriaId,
    identificacao: state.identificacao,
    respostas: state.respostas,
    observacoes: state.observacoes,
    secaoAtual: state.secaoAtual,
    status: 'RASCUNHO'
  };
  // Backup local sempre
  localStorage.setItem('fc_aud_' + (state.auditoriaId || 'temp'), JSON.stringify(dados));
  // Salvar no servidor
  const r = await apiCall('salvarAuditoria', dados);
  if (!silencioso) {
    if (r.ok) toast('Progresso salvo');
    else toast('Salvo localmente (sem conexão)');
  }
}

   RENDERIZAÇÃO — TELA INICIAL
   ═══════════════════════════════════════════════════════ */
async function renderTelaInicial() {
  showLoading('Carregando...');
  // Buscar rascunhos do servidor
  let rascunhos = [];
  const r = await apiCall('listarRascunhosAuditoria', {});
  if (r.ok && r.rascunhos && r.rascunhos.length) {
    rascunhos = r.rascunhos.map(x => ({
      id: x.id,
      identificacao: { cliente: x.cliente, unidade: x.unidade, data_auditoria: x.dataAuditoria, tipo_avaliacao: x.tipoAvaliacao },
      secaoAtual: x.secaoAtual,
      status: 'RASCUNHO'
    }));
  } else {
    // Fallback: buscar do localStorage
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('fc_aud_')) {
        try {
          const d = JSON.parse(localStorage.getItem(k));
          if (d.status === 'RASCUNHO') rascunhos.push(d);
        } catch(e) {}
      }
    }
  }
  // Carregar lista de clientes
  const rc = await apiCall('listarClientesFC', {});
  if (rc.ok) {
    state.clientes = rc.clientes || [];
    state.unidades = {};
    const det = rc.detalhes || {};
    for (const c in det) { state.unidades[c] = det[c].unidades || []; state.emailsCliente = state.emailsCliente || {}; for (const u in det[c].emails) state.emailsCliente[c+'|'+u] = det[c].emails[u]; }
  }
  state.rascunhos = rascunhos;
  hideLoading();

  let rascunhosHtml = '';
  if (rascunhos.length) {
    rascunhosHtml = `
      <div class="card-inicio">
        <h2><i class="bi bi-pencil-square"></i> Continuar Avaliação</h2>
        <p>Avaliações em andamento</p>
        ${rascunhos.map((r,i) => `
          <div class="rascunho-item" onclick="carregarRascunho(${i})">
            <div class="ri-titulo">${r.identificacao.cliente || 'Cliente não definido'}</div>
            <div class="ri-sub">${r.identificacao.unidade || '—'} • ${r.identificacao.data_auditoria || '—'}</div>
            <span class="ri-badge">RASCUNHO</span>
          </div>
        `).join('')}
      </div>`;
  }

  $('#app').innerHTML = `
    <div class="tela-inicial">
      <div class="card-inicio" style="text-align:center;padding:36px 28px">
        <h2 style="font-size:20px">Auditoria de Operação</h2>
        <p style="margin-bottom:0">Avaliação das condições do ambiente para a operação de inventário</p>
      </div>
      <div class="card-inicio">
        <h2><i class="bi bi-plus-circle"></i> Nova Avaliação</h2>
        <p>Iniciar uma nova auditoria de operação</p>
        <button class="btn-fc btn-fc-green" onclick="novaAvaliacao()">
          <i class="bi bi-play-fill"></i> Iniciar Nova Avaliação
        </button>
      </div>
      ${rascunhosHtml}
      <div class="card-inicio">
        <h2><i class="bi bi-clock-history"></i> Histórico</h2>
        <p>Auditorias concluídas — ver relatórios e enviar por e-mail</p>
        <button class="btn-fc btn-fc-outline" onclick="verHistorico()">
          <i class="bi bi-list-ul"></i> Ver Histórico
        </button>
      </div>
    </div>`;
}

function novaAvaliacao() {
  state.auditoriaId = 'aud_' + Date.now();
  state.respostas = {};
  state.observacoes = {};
  state.fotos = {};
  state.identificacao = {};
  state.secaoAtual = 0;
  state.status = 'RASCUNHO';
  renderFormulario();
}

async function carregarRascunho(idx) {
  showLoading('Carregando avaliação...');
  const rascunho = state.rascunhos[idx];
  state.auditoriaId = rascunho.id;

  // Tentar carregar do servidor (dados completos)
  const r = await apiCall('carregarAuditoria', { id: rascunho.id });
  if (r.ok && r.auditoria) {
    state.respostas = r.auditoria.respostas || {};
    state.observacoes = r.auditoria.observacoes || {};
    state.fotos = {};
    state.identificacao = r.auditoria.identificacao || {};
    state.secaoAtual = r.auditoria.secaoAtual || 0;
  } else {
    // Fallback: dados do localStorage
    const local = localStorage.getItem('fc_aud_' + rascunho.id);
    if (local) {
      const d = JSON.parse(local);
      state.respostas = d.respostas || {};
      state.observacoes = d.observacoes || {};
      state.fotos = d.fotos || {};
      state.identificacao = d.identificacao || {};
      state.secaoAtual = d.secaoAtual || 0;
    } else {
      state.respostas = {};
      state.observacoes = {};
      state.fotos = {};
      state.identificacao = rascunho.identificacao || {};
      state.secaoAtual = 0;
    }
  }
  state.status = 'RASCUNHO';
  hideLoading();
  renderFormulario();
}


/* ═══════════════════════════════════════════════════════
   RENDERIZAÇÃO — FORMULÁRIO
   ═══════════════════════════════════════════════════════ */
function renderFormulario() {
  const secao = SECOES[state.secaoAtual];

  // Stepper
  const stepperHtml = SECOES.map((s,i) => {
    let cls = '';
    if (i === state.secaoAtual) cls = 'active';
    else if (secaoPreenchida(s)) cls = 'done';
    const icon = cls === 'done' ? '<i class="bi bi-check-lg"></i>' : (i+1);
    return `<span class="step-dot ${cls}" onclick="irParaSecao(${i})">${icon} <span class="d-none d-sm-inline">${s.titulo}</span></span>`;
  }).join('');

  // Conteúdo da seção
  let conteudo = '';
  if (secao.tipo === 'identificacao') {
    conteudo = renderIdentificacao(secao);
  } else if (secao.tipo === 'finalizacao') {
    conteudo = renderFinalizacao(secao);
  } else {
    conteudo = renderSecaoAvaliacao(secao);
  }

  // Navegação
  const prevBtn = state.secaoAtual > 0
    ? `<button class="btn-fc btn-fc-outline" onclick="secaoAnterior()"><i class="bi bi-chevron-left"></i> Anterior</button>` : '';
  const nextLabel = state.secaoAtual < SECOES.length - 1 ? 'Próxima <i class="bi bi-chevron-right"></i>' : '';
  const nextBtn = state.secaoAtual < SECOES.length - 1
    ? `<button class="btn-fc btn-fc-navy" onclick="proximaSecao()">${nextLabel}</button>` : '';

  const progresso = `${state.secaoAtual + 1} de ${SECOES.length}`;

  $('#app').innerHTML = `
    <div class="stepper-bar">${stepperHtml}</div>
    <div class="form-container body-pad">${conteudo}</div>
    <div class="progress-info">Seção ${progresso}</div>
    <div class="nav-bottom">${prevBtn}${nextBtn}</div>`;

  // Scroll stepper para a posição ativa
  setTimeout(() => {
    const active = document.querySelector('.step-dot.active');
    if (active) active.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 100);
}

/* ── SEÇÃO DE AVALIAÇÃO (critérios, subsecões, fotos, obs) ── */
function renderSecaoAvaliacao(secao) {
  let html = `<div class="secao-card">
    <div class="secao-titulo"><i class="bi ${secao.icone}"></i> ${secao.titulo}</div>
    <div class="secao-subtitulo">${secao.estrutura} → ${secao.departamento || ''}</div>`;

  // Critérios diretos
  if (secao.criterios) {
    html += secao.criterios.map(c => renderCriterio(c)).join('');
  }

  // Subseções (accordion)
  if (secao.subsecoes) {
    html += secao.subsecoes.map(sub => {
      const preenchido = subsecaoPreenchida(sub);
      const aberta = !preenchido;
      return `
        <div class="subsecao ${aberta?'aberta':''}" id="sub_${sub.id}">
          <div class="subsecao-header" onclick="toggleSubsecao('sub_${sub.id}')">
            <span class="sh-titulo">${sub.titulo}</span>
            <span class="sh-badge ${preenchido?'preenchido':'pendente'}">
              ${preenchido ? '<i class="bi bi-check-lg"></i> OK' : 'Pendente'}
            </span>
          </div>
          <div class="subsecao-body">
            ${sub.criterios.map(c => renderCriterio(c)).join('')}
          </div>
        </div>`;
    }).join('');
  }

  // Score parcial
  const media = calcMediaSecao(secao);
  if (media) {
    html += `<div class="score-preview">
      <span class="sp-valor" style="color:${scoreColor(parseFloat(media))}">${media}</span>
      <span class="sp-label">Score parcial desta seção</span>
    </div>`;
  }

  html += '</div>';

  // Observação
  if (secao.observacao) {
    html += `<div class="secao-card">
      <div class="campo-obs">
        <label>${secao.observacao.label}</label>
        <textarea placeholder="Registre suas observações..."
          oninput="setObs('${secao.observacao.id}',this.value)">${state.observacoes[secao.observacao.id]||''}</textarea>
      </div>
    </div>`;
  }

  // Fotos
  if (secao.fotos) {
    html += renderFotos(secao);
  }

  return html;
}

/* ── CRITÉRIO INDIVIDUAL ── */
function renderCriterio(crit) {
  const val = state.respostas[crit.id];
  const tipo = crit.tipo || 'escala';

  let hints = '';
  if (tipo === 'escala_sku') hints = '<div class="escala-hints"><span>Até 10%</span><span>Acima de 90%</span></div>';
  else if (tipo === 'escala_volume') hints = '<div class="escala-hints"><span>Excessiva</span><span>Ideal</span></div>';

  let botoes = '';
  for (let i = 1; i <= 10; i++) {
    const sel = val === i;
    botoes += `<button class="rating-btn ${sel ? 'selected ' + scoreClass(i) : ''}"
      onclick="setNota('${crit.id}',${i})">${i}</button>`;
  }
  const naSel = val === 'NA';
  botoes += `<button class="rating-btn na-btn ${naSel ? 'selected' : ''}"
    onclick="setNota('${crit.id}','NA')">N/A</button>`;

  return `
    <div class="criterio" id="crit_${crit.id}">
      <div class="criterio-label">${crit.label}</div>
      ${hints}
      <div class="rating-row">${botoes}</div>
    </div>`;
}

function setNota(criterioId, valor) {
  state.respostas[criterioId] = valor;
  // Re-render apenas o critério afetado e o score
  const secao = SECOES[state.secaoAtual];
  // Atualizar botões do critério
  const container = document.getElementById('crit_' + criterioId);
  if (container) {
    container.querySelectorAll('.rating-btn').forEach(btn => {
      btn.classList.remove('selected','score-low','score-mid','score-ok','score-high');
      const btnVal = btn.classList.contains('na-btn') ? 'NA' : parseInt(btn.textContent);
      if (btnVal === valor) {
        btn.classList.add('selected');
        if (typeof valor === 'number') btn.classList.add(scoreClass(valor));
      }
    });
  }
  // Atualizar badges de subseção
  if (secao.subsecoes) {
    secao.subsecoes.forEach(sub => {
      const el = document.getElementById('sub_' + sub.id);
      if (el) {
        const badge = el.querySelector('.sh-badge');
        if (subsecaoPreenchida(sub)) {
          badge.className = 'sh-badge preenchido';
          badge.innerHTML = '<i class="bi bi-check-lg"></i> OK';
        }
      }
    });
  }
  // Atualizar score preview
  const media = calcMediaSecao(secao);
  const sp = document.querySelector('.score-preview');
  if (sp && media) {
    sp.querySelector('.sp-valor').textContent = media;
    sp.querySelector('.sp-valor').style.color = scoreColor(parseFloat(media));
  }
  // Atualizar stepper dot
  updateStepper();
}

function setObs(obsId, valor) {
  state.observacoes[obsId] = valor;
}

function toggleSubsecao(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('aberta');
}


/* ── FOTOS ── */
function renderFotos(secao) {
  const fotos = state.fotos[secao.id] || [];
  const max = secao.fotos.max;
  let slots = '';
  for (let i = 0; i < max; i++) {
    if (fotos[i]) {
      slots += `
        <div class="foto-slot">
          <img src="${fotos[i].base64}" alt="Foto ${i+1}">
          <button class="foto-remove" onclick="removerFoto('${secao.id}',${i})"><i class="bi bi-x"></i></button>
        </div>`;
    } else {
      slots += `
        <div class="foto-slot" onclick="capturarFoto('${secao.id}','camera')" style="cursor:pointer">
          <i class="bi bi-camera"></i>
          <span>Câmera</span>
        </div>
        <div class="foto-slot" onclick="capturarFoto('${secao.id}','galeria')" style="cursor:pointer">
          <i class="bi bi-image"></i>
          <span>Galeria</span>
        </div>`;
    }
  }
  return `
    <div class="secao-card">
      <div class="fotos-section">
        <label><i class="bi bi-camera"></i> ${secao.fotos.label}</label>
        <div class="fotos-grid">${slots}</div>
      </div>
    </div>`;
}

let fotoTargetSecao = null;
function capturarFoto(secaoId, modo) {
  fotoTargetSecao = secaoId;
  document.getElementById(modo === 'galeria' ? 'galeriaInput' : 'cameraInput').click();
}

function processarFotoFile(file) {
  if (!file || !fotoTargetSecao) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 1200;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.7);
      if (!state.fotos[fotoTargetSecao]) state.fotos[fotoTargetSecao] = [];
      const secao = SECOES.find(s => s.id === fotoTargetSecao);
      if (state.fotos[fotoTargetSecao].length < (secao?.fotos?.max || 3)) {
        state.fotos[fotoTargetSecao].push({ base64: compressed, legenda: '' });
        renderFormulario();
      } else { toast('Limite de fotos atingido'); }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('cameraInput').addEventListener('change', function(e) {
    processarFotoFile(e.target.files[0]); e.target.value = '';
  });
  document.getElementById('galeriaInput').addEventListener('change', function(e) {
    Array.from(e.target.files).forEach(f => processarFotoFile(f)); e.target.value = '';
  });
});

function removerFoto(secaoId, idx) {
  if (state.fotos[secaoId]) {
    state.fotos[secaoId].splice(idx, 1);
    renderFormulario();
  }
}

/* ── FINALIZAÇÃO ── */
function renderFinalizacao(secao) {
  // Verificar seções pendentes
  const pendentes = SECOES.filter((s,i) => i < SECOES.length-1 && !secaoPreenchida(s));

  // Calcular scores
  const secoesPontuadas = SECOES.filter(s => s.criterios || s.subsecoes);
  let todasNotas = [];
  let notasEquipe = [];
  secoesPontuadas.forEach(s => {
    let criterios = s.criterios || [];
    if (s.subsecoes) criterios = s.subsecoes.flatMap(sub => sub.criterios);
    criterios.forEach(c => {
      const v = state.respostas[c.id];
      if (v && v !== 'NA') {
        todasNotas.push(v);
        if (c.id.includes('eq_') || c.id.includes('_eq_') || c.id.includes('_pes_') || c.id.includes('pesagem')) {
          notasEquipe.push(v);
        }
      }
    });
  });

  const scoreGeral = todasNotas.length ? (todasNotas.reduce((a,b)=>a+b,0)/todasNotas.length).toFixed(1) : '—';
  const scoreEquipe = notasEquipe.length ? (notasEquipe.reduce((a,b)=>a+b,0)/notasEquipe.length).toFixed(1) : '—';

  // Scores por seção
  const scoresSecoes = secoesPontuadas.map(s => ({
    titulo: s.titulo,
    media: calcMediaSecao(s)
  })).filter(s => s.media);

  let html = '';

  // Observação da área de vendas
  if (secao.observacao) {
    html += `<div class="secao-card">
      <div class="campo-obs">
        <label>${secao.observacao.label}</label>
        <textarea placeholder="Registre suas observações..."
          oninput="setObs('${secao.observacao.id}',this.value)">${state.observacoes[secao.observacao.id]||''}</textarea>
      </div>
    </div>`;
  }

  // Resumo de scores
  html += `
    <div class="secao-card" style="text-align:center">
      <div class="secao-titulo" style="justify-content:center"><i class="bi ${secao.icone}"></i> Resumo da Avaliação</div>
      <div style="margin:20px 0">
        <div style="font-size:48px;font-weight:700;color:${todasNotas.length ? scoreColor(parseFloat(scoreGeral)) : 'var(--text-light)'}">${scoreGeral}</div>
        <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:1px">Score Geral</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        ${scoresSecoes.map(s => `
          <div style="background:var(--bg);padding:12px;border-radius:10px">
            <div style="font-size:20px;font-weight:700;color:${scoreColor(parseFloat(s.media))}">${s.media}</div>
            <div style="font-size:10px;color:var(--text-light)">${s.titulo}</div>
          </div>
        `).join('')}
        <div style="background:var(--bg);padding:12px;border-radius:10px;border:2px solid var(--orange)">
          <div style="font-size:20px;font-weight:700;color:var(--orange)">${scoreEquipe}</div>
          <div style="font-size:10px;color:var(--text-light)">Equipe de Apoio</div>
        </div>
      </div>
    </div>`;

  // Pendências
  if (pendentes.length) {
    html += `
      <div class="secao-card" style="border-left:4px solid var(--orange)">
        <div style="font-size:13px;font-weight:600;color:var(--orange);margin-bottom:8px">
          <i class="bi bi-exclamation-triangle"></i> Seções pendentes
        </div>
        ${pendentes.map(p => `
          <div style="font-size:13px;color:var(--text);padding:4px 0">
            • ${p.titulo}
          </div>
        `).join('')}
        <div style="font-size:11px;color:var(--text-light);margin-top:8px">
          Seções com N/A são consideradas preenchidas. Você pode finalizar mesmo com seções pendentes (critérios não avaliados serão ignorados no relatório).
        </div>
      </div>`;
  }

  // Botão finalizar
  html += `
    <div class="secao-card" style="text-align:center">
      <button class="btn-fc btn-fc-green" onclick="finalizarAvaliacao()" style="font-size:16px;padding:16px 32px">
        <i class="bi bi-check-circle"></i> Finalizar Avaliação
      </button>
      <div style="font-size:11px;color:var(--text-light);margin-top:10px">
        Ao finalizar, o relatório será gerado automaticamente.
      </div>
    </div>`;

  return html;
}

/* ═══════════════════════════════════════════════════════
   NAVEGAÇÃO
   ═══════════════════════════════════════════════════════ */
function irParaSecao(idx) {
  salvarRascunho();
  state.secaoAtual = idx;
  renderFormulario();
  window.scrollTo({top:0, behavior:'smooth'});
}

function proximaSecao() {
  if (state.secaoAtual < SECOES.length - 1) {
    salvarRascunho();
    state.secaoAtual++;
    renderFormulario();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function secaoAnterior() {
  if (state.secaoAtual > 0) {
    state.secaoAtual--;
    renderFormulario();
    window.scrollTo({top:0, behavior:'smooth'});
  }
}

function updateStepper() {
  document.querySelectorAll('.step-dot').forEach((dot, i) => {
    dot.classList.remove('active','done');
    if (i === state.secaoAtual) dot.classList.add('active');
    else if (secaoPreenchida(SECOES[i])) dot.classList.add('done');
  });
}

/* ═══════════════════════════════════════════════════════
   FINALIZAR
   ═══════════════════════════════════════════════════════ */
async function finalizarAvaliacao() {
  // Validar identificação mínima
  if (!state.identificacao.tipo_avaliacao || !state.identificacao.cliente || !state.identificacao.unidade) {
    toast('Preencha a Identificação (tipo, cliente e unidade)');
    return;
  }

  if (!confirm('Confirma a finalização desta avaliação?\n\nO relatório será gerado automaticamente.')) return;

  state.status = 'CONCLUIDO';

  // 1. Enviar fotos separadamente (evita estouro de payload)
  let fotosIds = {};
  const temFotos = state.fotos && Object.keys(state.fotos).length > 0;
  if (temFotos) {
    showLoading('Enviando fotos...');
    for (const secaoId of Object.keys(state.fotos)) {
      const fotosSecao = state.fotos[secaoId];
      if (!fotosSecao || !fotosSecao.length) continue;
      const rf = await apiCall('uploadFotosAuditoria', {
        fotos: fotosSecao,
        secaoId: secaoId,
        cliente: state.identificacao.cliente,
        unidade: state.identificacao.unidade,
        data: state.identificacao.data_auditoria
      });
      if (rf.ok && rf.fotosIds) fotosIds[secaoId] = rf.fotosIds;
    }
  }

  // 2. Finalizar auditoria (sem fotos base64 no payload, só IDs)
  showLoading('Finalizando avaliação...');
  const dados = {
    id: state.auditoriaId,
    identificacao: state.identificacao,
    respostas: state.respostas,
    observacoes: state.observacoes,
    fotosIds: fotosIds,
    status: 'CONCLUIDO',
    versao: VERSAO
  };

  // Backup local (sem fotos base64 pra não estourar localStorage)
  const dadosLocal = Object.assign({}, dados);
  try { localStorage.setItem('fc_aud_' + state.auditoriaId, JSON.stringify(dadosLocal)); } catch(e) {}

  const r = await apiCall('finalizarAuditoria', dados);
  if (r.ok) {
    try { localStorage.removeItem('fc_aud_' + state.auditoriaId); } catch(e) {}
  }

  hideLoading();

  // Sucesso — relatório será gerado sob demanda pelo histórico
  $('#app').innerHTML = `
    <div class="tela-inicial">
      <div class="secao-card" style="text-align:center;padding:40px 28px">
        <div style="font-size:56px;margin-bottom:16px">✅</div>
        <h2 style="font-size:20px;color:var(--navy);margin-bottom:8px">Avaliação Finalizada</h2>
        <p style="color:var(--text-light);margin-bottom:16px">
          ${state.identificacao.cliente} — ${state.identificacao.unidade}<br>${state.identificacao.data_auditoria}
        </p>
        <p style="font-size:13px;color:var(--text);margin-bottom:24px">
          A avaliação foi salva com sucesso. O relatório pode ser gerado a qualquer momento pelo <strong>Histórico</strong>.
        </p>
        <button class="btn-fc btn-fc-navy" onclick="renderTelaInicial()" style="margin-bottom:10px">
          <i class="bi bi-arrow-left"></i> Voltar ao Início
        </button>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   HISTÓRICO
   ═══════════════════════════════════════════════════════ */
async function verHistorico() {
  showLoading('Carregando histórico...');
  const r = await apiCall('listarHistoricoAuditorias', {});
  hideLoading();

  if (!r.ok || !r.auditorias || !r.auditorias.length) {
    toast('Nenhuma auditoria concluída encontrada');
    return;
  }

  let itens = r.auditorias.map(a => `
    <div class="rascunho-item" style="cursor:default">
      <div class="ri-titulo">${a.cliente} — ${a.unidade}</div>
      <div class="ri-sub">${a.dataAuditoria} • ${a.auditor} • ${a.tipoAvaliacao}</div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        <span style="font-size:12px;font-weight:700;color:var(--navy)">Score: ${a.scoreGeral || '—'}</span>
        <span style="font-size:12px;color:var(--orange)">Equipe: ${a.scoreEquipe || '—'}</span>
        ${a.dataEnvio ? '<span style="font-size:11px;color:var(--green)">✓ Enviado</span>' : '<span style="font-size:11px;color:var(--text-light)">Não enviado</span>'}
      </div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn-fc btn-fc-navy" style="width:auto;flex:1;padding:8px;font-size:11px" onclick="abrirRelatorio('${a.id}','html')">📄 HTML</button>
        <button class="btn-fc btn-fc-outline" style="width:auto;flex:1;padding:8px;font-size:11px" onclick="abrirRelatorio('${a.id}','pdf')">📥 PDF</button>
        <button class="btn-fc btn-fc-orange" style="width:auto;flex:1;padding:8px;font-size:12px" onclick="prepararEnvio('${a.id}','${a.cliente}','${a.unidade}','${a.emailCliente||''}')">Enviar E-mail</button>
      </div>
    </div>
  `).join('');

  $('#app').innerHTML = `
    <div class="tela-inicial">
      <div class="secao-card">
        <div class="secao-titulo"><i class="bi bi-clock-history"></i> Histórico de Auditorias</div>
        <div class="secao-subtitulo">Auditorias concluídas</div>
      </div>
      ${itens}
      <button class="btn-fc btn-fc-outline" onclick="renderTelaInicial()" style="margin-top:10px">
        <i class="bi bi-arrow-left"></i> Voltar
      </button>
    </div>`;
}

async function abrirRelatorio(auditoriaId, formato) {
  showLoading('Gerando relatório...');
  const rg = await apiCall('gerarRelatorioAuditoria', { auditoriaId });
  hideLoading();
  if (rg.ok) {
    const link = formato === 'pdf' ? rg.linkPDF : rg.linkHTML;
    if (link) window.open(link, '_blank');
    else toast('Relatório gerado mas link indisponível');
  } else {
    toast('Erro: ' + (rg.erro || 'falha ao gerar'));
  }
}

async function prepararEnvio(auditoriaId, cliente, unidade, emailSalvo) {
  const email = prompt('E-mail do cliente:', emailSalvo || '');
  if (!email || !email.includes('@')) return;

  showLoading('Gerando relatório e enviando...');
  // Gerar relatório primeiro
  const rg = await apiCall('gerarRelatorioAuditoria', { auditoriaId });
  if (!rg.ok) { hideLoading(); toast('Erro ao gerar: ' + (rg.erro || 'falha')); return; }
  // Enviar
  const re = await apiCall('enviarRelatorioAuditoria', { auditoriaId, email });
  hideLoading();
  if (re.ok) {
    toast('Enviado para ' + email);
    verHistorico();
  } else {
    toast('Erro: ' + (re.erro || 'falha'));
  }
}

/* ═══════════════════════════════════════════════════════
   INICIALIZAÇÃO
   ═══════════════════════════════════════════════════════ */
function init() {
  state.emailsCliente = {};
  renderTelaInicial();
}

document.addEventListener('DOMContentLoaded', init);
</script>
