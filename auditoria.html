        ${c.atencao ? `<span>↗ Maior oportunidade: <b>${esc(c.atencao.unidade)}</b> (${pfFmt(c.atencao.geral)})</span>` : ''}
      </div>
    </button>`;
  }).join('');
  return `
    <div class="pf-resumo-linha"><b>${t.clientes}</b> cliente(s) · <b>${t.unidades}</b> unidade(s) · <b>${t.analises}</b> análise(s) concluída(s).<br>${pfHtmlPeriodoLinha()}</div>
    <div class="pf-grid">${cards}</div>
    <div class="pf-nota-tab">Nota da unidade = média das análises do período; nota do cliente = média das unidades. Toque num cliente para ver as unidades, a análise e exportar.</div>`;
}

function pfAbrirCliente(i) {
  const p = pfEstado();
  const c = p.dados.clientes[i];
  if (!c) return;
  p.foco = c.cliente;
  p.filtro.cliente = c.cliente;
  p.aplicado.cliente = c.cliente;
  const sel = $('#pfCliente'); if (sel) sel.value = c.cliente;
  pfMarcarPendente();
  pfRender();
  window.scrollTo(0, 0);
}
// Volta para os cards de todos os clientes. Se a última busca foi filtrada por UM cliente, os demais
// não vieram na resposta — então busca de novo, mantendo o período e o tipo que estavam aplicados.
function pfVoltarMacro() {
  const p = pfEstado();
  p.foco = '';
  if (p.dados && p.dados.filtro && p.dados.filtro.cliente) {
    p.filtro = Object.assign({}, p.aplicado, { cliente: '' });
    pfSincronizarCampos();
    pfBuscar();
    return;
  }
  p.filtro.cliente = ''; p.aplicado.cliente = '';
  const sel = $('#pfCliente'); if (sel) sel.value = '';
  pfMarcarPendente();
  pfRender();
}
function pfSincronizarCampos() {
  const f = pfEstado().filtro;
  [['#pfCliente', f.cliente], ['#pfPeriodo', f.periodo], ['#pfTipo', f.tipo], ['#pfDe', f.de], ['#pfAte', f.ate]].forEach(x => { const el = $(x[0]); if (el) el.value = x[1]; });
  const d = $('#pfDatas'); if (d) d.classList.toggle('aberto', f.periodo === 'custom');
}

function pfCelula(v) { return `<td style="color:${pfCor(v)};background:${pfBg(v)}">${pfFmt(v)}</td>`; }

function pfHtmlDetalhe(c) {
  const p = pfEstado();
  const total = c.unidades || 1;
  const seg = PF_FAIXAS.map(fx => c.faixas[fx] ? `<span style="width:${c.faixas[fx] * 100 / total}%;background:${PF_COR_FAIXA[fx]}"></span>` : '').join('');
  const leg = PF_FAIXAS.filter(fx => c.faixas[fx]).map(fx => `<span><i style="background:${PF_COR_FAIXA[fx]}"></i>${c.faixas[fx]} ${fx}</span>`).join('');
  const unidades = c.lista.map((u, idx) => `
    <div class="pf-card" style="border-top-color:${pfCor(u.geral)}">
      <div class="pf-card-topo">
        <div><div class="pf-nome">${esc(u.unidade)}</div><div class="pf-sub">${u.analises} análise(s)${u.ultimaAnalise ? ' · última em ' + npsDataBR(u.ultimaAnalise) : ''}</div></div>
        <div class="pf-nota"><b style="color:${pfCor(u.geral)}">${pfFmt(u.geral)}</b>${u.faixa ? `<span class="pf-faixa" style="background:${pfCor(u.geral)}">${u.faixa}</span>` : ''}</div>
      </div>
      ${pfDeltaHtml(u.variacao.geral)}
      ${pfHtmlMetricas(u)}
      ${idx === 0 && c.lista.length > 1 && c.referencia ? '<div class="pf-destaque"><span>★ Referência de boas práticas do cliente</span></div>' : ''}
    </div>`).join('');

  const linhas = c.lista.map(u => `<tr><td>${esc(u.unidade)}</td>${pfCelula(u.geral)}${pfCelula(u.equipe)}${pfCelula(u.retaguarda)}${pfCelula(u.areaVendas)}<td style="color:${pfDeltaCor(u.variacao.geral)}">${pfDeltaCurto(u.variacao.geral)}</td></tr>`).join('');
  const tabComp = `
    <div class="pf-bloco"><h4>Comparativo entre unidades</h4>
      <div class="pf-rolagem"><table class="pf-tab"><thead><tr><th>Unidade</th><th>Geral</th><th>Equipe</th><th>Retaguarda</th><th>Área de Vendas</th><th>Variação<br>vs anterior</th></tr></thead><tbody>${linhas}
      <tr class="pf-total"><td>Média do cliente</td>${pfCelula(c.geral)}${pfCelula(c.equipe)}${pfCelula(c.retaguarda)}${pfCelula(c.areaVendas)}<td style="color:${pfDeltaCor(c.variacao.geral)}">${pfDeltaCurto(c.variacao.geral)}</td></tr></tbody></table></div>
      <div class="pf-nota-tab">Setor ou critério não avaliado aparece como "—" (nunca como zero).</div>
    </div>`;

  const temOV = c.lista.some(u => u.organizacao !== null || u.volume !== null);
  const linhasOV = c.lista.map(u => `<tr><td>${esc(u.unidade)}</td>${pfCelula(u.organizacao)}${pfCelula(u.volume)}${pfCelula(u.orgVol)}</tr>`).join('');
  const tabOV = !temOV ? '' : `
    <div class="pf-bloco"><h4>Organização x Volume</h4>
      <div class="pf-rolagem"><table class="pf-tab"><thead><tr><th>Unidade</th><th>Organização</th><th>Volume<br>(10 = ideal)</th><th>Média dos dois</th></tr></thead><tbody>${linhasOV}
      <tr class="pf-total"><td>Média do cliente</td>${pfCelula(c.organizacao)}${pfCelula(c.volume)}${pfCelula(c.orgVol)}</tr></tbody></table></div>
      <div class="pf-nota-tab">Leitura do volume: quanto maior o volume de mercadoria, menor a nota (1 = volume excessivo · 10 = volume ideal). Volume acima do ideal é sempre ponto de atenção, mesmo com boa organização.</div>
    </div>`;

  return `
    <button type="button" class="pf-voltar" onclick="pfVoltarMacro()">← Todos os clientes</button>
    <div class="pf-topo-detalhe">
      <div class="pf-card-topo">
        <div><h3>${esc(c.cliente)}</h3><div class="pf-sub">${c.unidades} unidade(s) · ${c.analises} análise(s)</div></div>
        <div class="pf-nota"><b style="color:${pfCor(c.geral) === '#2E7D32' ? '#61CF00' : pfCor(c.geral)}">${pfFmt(c.geral)}</b>${c.faixa ? `<span class="pf-faixa" style="background:${pfCor(c.geral)}">${c.faixa}</span>` : ''}</div>
      </div>
      <div style="margin-top:8px;font-size:11px;color:rgba(255,255,255,.8)">${pfDeltaHtml(c.variacao.geral).replace(/color:#[0-9A-Fa-f]{6}/, 'color:#fff')}</div>
      <div class="pf-pilha" style="margin-top:10px">${seg}</div>
      <div class="pf-leg" style="margin-top:6px;color:rgba(255,255,255,.75)">${leg}</div>
    </div>
    <div class="pf-resumo-linha">${pfHtmlPeriodoLinha()}</div>
    <div class="pf-acoes">
      <button type="button" class="pf-acao txt" onclick="pfGerarTextoTela()">✨ Gerar análise em texto</button>
      <button type="button" class="pf-acao pdf" onclick="pfExportarPDF()">📄 Exportar análise (PDF)</button>
      <button type="button" class="pf-acao ppt" onclick="pfExportarPPTX()">🎬 Apresentação com resumo executivo (PPTX + PDF)</button>
    </div>
    <div class="pf-grid">${unidades}</div>
    ${tabComp}
    ${tabOV}
    <div id="pfTexto">${pfHtmlTexto(c)}</div>`;
}

/* ── Texto da análise ── */
function pfChaveTexto() { const p = pfEstado(); return JSON.stringify(p.aplicado) + '|' + p.foco; }

function pfHtmlTexto(c) {
  const p = pfEstado();
  if (!p.textos || p.textosChave !== pfChaveTexto()) return '';
  const t = p.textos;
  const par = x => x ? `<p>${esc(x)}</p>` : '';
  const un = c.lista.filter(u => t.unidades && t.unidades[u.unidade]).map(u => `<div class="pf-un"><b>${esc(u.unidade)}</b> <span style="color:${pfCor(u.geral)};font-weight:700">${pfFmt(u.geral)} — ${esc(u.faixa || '')}</span><p>${esc(t.unidades[u.unidade])}</p></div>`).join('');
  return `
    ${p.origemTexto === 'contingencia' ? '<div class="pf-origem">Texto gerado pelo modelo de contingência (a IA não respondeu). Você pode exportar assim ou gerar novamente.</div>' : ''}
    <div class="pf-bloco pf-texto"><h4>Análise de performance</h4>${par(t.resumo_executivo)}${par(t.evolucao)}${par(t.comparativo)}${par(t.volume_organizacao)}</div>
    ${un ? `<div class="pf-bloco pf-texto"><h4>Análise por unidade</h4>${un}</div>` : ''}
    <div class="pf-bloco pf-texto"><h4>Conclusão</h4>
      ${t.pontos_positivos ? `<div class="pf-caixa ok"><h5>✓ PONTOS POSITIVOS</h5><p>${esc(t.pontos_positivos)}</p></div>` : ''}
      ${t.oportunidades ? `<div class="pf-caixa at"><h5>⚠ OPORTUNIDADES DE MELHORIA</h5><p>${esc(t.oportunidades)}</p></div>` : ''}
      ${t.sugestoes ? `<div class="pf-caixa su"><h5>→ SUGESTÕES</h5><p>${esc(t.sugestoes)}</p></div>` : ''}
    </div>`;
}

function pfPayloadBase() {
  const p = pfEstado();
  const iv = pfIntervalo(p.aplicado);
  return { cliente: p.foco, tipo: p.aplicado.tipo, de: iv.de, ate: iv.ate };
}

// Devolve os textos (gera se ainda não existem para este filtro). null = falhou.
async function pfGarantirTexto(forcar) {
  const p = pfEstado();
  if (!forcar && p.textos && p.textosChave === pfChaveTexto()) return p.textos;
  showLoading('Gerando a análise em texto...');
  const r = await apiCall('performanceGerarTexto', pfPayloadBase());
  hideLoading();
  if (!r.ok) { toast('Erro ao gerar a análise: ' + (r.erro || 'falha')); return null; }
  p.textos = r.textos; p.textosChave = pfChaveTexto(); p.origemTexto = r.origem || '';
  return p.textos;
}

async function pfGerarTextoTela() {
  const p = pfEstado();
  const t = await pfGarantirTexto(true);
  if (!t) return;
  const c = p.dados.clientes.find(x => x.cliente === p.foco);
  const el = $('#pfTexto');
  if (el && c) { el.innerHTML = pfHtmlTexto(c); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}

/* ── Exportações ── */
function pfModalLinks(titulo, texto, links) {
  let m = document.getElementById('pfModal');
  if (m) m.remove();
  m = document.createElement('div');
  m.id = 'pfModal';
  m.className = 'nps-modal';
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  m.addEventListener('click', e => { if (e.target === m) m.remove(); });
  m.innerHTML = `
    <div class="nps-folha" style="max-width:440px">
      <div class="nps-modal-topo"><div class="nps-modal-linha"><div class="nps-modal-titulo">${esc(titulo)}</div><button type="button" class="nps-modal-x" aria-label="Fechar" onclick="document.getElementById('pfModal').remove()">✕</button></div></div>
      <div class="nps-modal-corpo">
        <p style="font-size:13px;line-height:1.6;color:var(--text)">${texto}</p>
        <div class="pf-links">${links.map(l => l.href
          ? `<a href="${esc(l.href)}" target="_blank" rel="noopener" style="background:${l.cor};color:${l.txt || '#fff'}">${l.rot}</a>`
          : `<button type="button" disabled style="background:#E2E8F0;color:#6B7B8D">${l.rot}</button>`).join('')}</div>
      </div>
    </div>`;
  document.body.appendChild(m);
}

async function pfExportarPDF() {
  const p = pfEstado();
  const t = await pfGarantirTexto(false);
  if (!t) return;
  const c = p.dados.clientes.find(x => x.cliente === p.foco);
  const el = $('#pfTexto'); if (el && c) el.innerHTML = pfHtmlTexto(c);
  showLoading('Gerando o PDF da análise...');
  const r = await apiCall('performanceExportarPDF', Object.assign(pfPayloadBase(), { textos: t }));
  hideLoading();
  if (!r.ok) { toast('Erro ao exportar: ' + (r.erro || 'falha')); return; }
  pfModalLinks('Análise em PDF pronta', 'A análise de <b>' + esc(p.foco) + '</b> foi salva no Drive (pasta Performance_FC).',
    [{ href: r.linkPDF, rot: '📄 Abrir / baixar o PDF', cor: 'var(--navy)' }, { href: r.linkHTML, rot: '🌐 Versão HTML', cor: '#E8EAF6', txt: 'var(--navy)' }]);
}

async function pfExportarPPTX() {
  const p = pfEstado();
  const c = p.dados.clientes.find(x => x.cliente === p.foco);
  if (!c) return;
  const disponivel = await aguardarPptxGenJS();
  if (!disponivel) { toast('Não foi possível carregar a biblioteca de apresentação. Verifique sua conexão e tente novamente.'); return; }
  const t = await pfGarantirTexto(false);
  if (!t) return;
  const el = $('#pfTexto'); if (el) el.innerHTML = pfHtmlTexto(c);
  let b64;
  try {
    showLoading('Montando a apresentação...');
    b64 = await montarPptxPerformance({
      cliente: c, textos: t, periodoTxt: pfPeriodoRotulo(p.aplicado), tipoTxt: pfTipoRotulo(p.aplicado),
      anterior: p.dados.periodoAnterior
    });
  } catch (e) { hideLoading(); toast('Erro ao montar a apresentação: ' + e.message); return; }
  showLoading('Salvando no Drive e convertendo em PDF...');
  const r = await apiCall('performanceSalvarApresentacao', Object.assign(pfPayloadBase(), { pptxBase64: b64 }));
  hideLoading();
  if (!r.ok) { toast('Erro ao salvar a apresentação: ' + (r.erro || 'falha')); return; }
  pfModalLinks('Apresentação pronta',
    'A apresentação de <b>' + esc(p.foco) + '</b> foi salva no Drive (pasta Performance_FC).' + (r.linkPDF ? '' : '<br><br><b>O PDF não pôde ser gerado</b>' + (r.erroPDF ? ' (' + esc(r.erroPDF) + ')' : '') + '. O PPTX está disponível.'),
    [{ href: r.linkPPTX, rot: '📽️ Baixar o PPTX', cor: 'var(--orange)' }, r.linkPDF ? { href: r.linkPDF, rot: '📄 Abrir / baixar o PDF', cor: 'var(--navy)' } : { rot: 'PDF indisponível' }]);
}

async function editarAuditoria(auditoriaId) {
  showLoading('Carregando auditoria...');
  const r = await apiCall('carregarAuditoria', { id: auditoriaId });
  hideLoading();
  if (!r.ok || !r.auditoria) { toast('Erro: ' + (r.erro || 'não encontrada')); return; }
  const a = r.auditoria;
  state.auditoriaId = a.id;
  state.identificacao = a.identificacao || {};
  state.respostas = a.respostas || {};
  state.observacoes = a.observacoes || {};
  state.fotos = {};
  state.fotosIds = a.fotosIds || {};
  state.status = a.status || 'CONCLUIDO';
  state.secaoAtual = 0;
  state.editando = true;
  renderFormulario();
}

async function excluirAuditoria(auditoriaId, nome) {
  if (!confirm('Excluir a auditoria "' + nome + '"?')) return;
  if (!confirm('Confirma a exclusão definitiva?')) return;
  showLoading('Excluindo...');
  const r = await apiCall('excluirAuditoria', { auditoriaId });
  hideLoading();
  if (r.ok) { toast('Auditoria excluída'); verHistorico(); }
  else toast('Erro: ' + (r.erro || 'falha'));
}

async function abrirRelatorio(auditoriaId, formato) {
  showLoading('Gerando relatório...');
  const rg = await apiCall('gerarRelatorioAuditoria', { auditoriaId });
  hideLoading();
  if (rg.ok) {
    const link = formato === 'pdf' ? rg.linkPDF : rg.linkHTML;
    if (link) window.open(link, '_blank');
    else toast('Relatório gerado mas link indisponível');
  } else {
    toast('Erro: ' + (rg.erro || 'falha ao gerar'));
  }
}

async function prepararEnvio(auditoriaId, cliente, unidade, emailSalvo) {
  const email = prompt('E-mail do cliente:', emailSalvo || '');
  if (!email || !email.includes('@')) return;

  showLoading('Gerando relatório...');
  // Gerar relatório primeiro
  const rg = await apiCall('gerarRelatorioAuditoria', { auditoriaId });
  if (!rg.ok) { hideLoading(); toast('Erro ao gerar: ' + (rg.erro || 'falha')); return; }

  // r107: a Apresentação Executiva (PDF) agora é OBRIGATÓRIA no envio, com
  // o mesmo padrão de exigência do relatório acima — se já existir uma
  // apresentação gerada pra esta auditoria, reaproveita; senão, gera na
  // hora usando A MESMA sequência de chamadas do botão "🎬 Gerar
  // Apresentação" (aguardarPptxGenJS → prepararApresentacaoAuditoria →
  // montarPptxApresentacao → salvarApresentacaoAuditoria), que já é
  // comprovadamente confiável. Nenhum erro é engolido silenciosamente aqui:
  // qualquer falha em qualquer etapa CANCELA o envio e mostra o motivo
  // real na tela, exatamente como já acontecia com o relatório.
  showLoading('Verificando apresentação...');
  const existente = await apiCall('obterApresentacaoAuditoria', { auditoriaId });
  const jaTemPDF = existente.ok && existente.apresentacao && existente.apresentacao.detalhada && existente.apresentacao.detalhada.linkPDF;

  if (!jaTemPDF) {
    const disponivel = await aguardarPptxGenJS();
    if (!disponivel) {
      hideLoading();
      toast('Não foi possível carregar a biblioteca de apresentação (tentamos 3 fontes diferentes). Verifique sua conexão com a internet ou tente em outra rede/dispositivo. Envio cancelado.');
      return;
    }

    showLoading('Preparando dados da apresentação...');
    const prep = await apiCall('prepararApresentacaoAuditoria', { auditoriaId });
    if (!prep.ok) { hideLoading(); toast('Erro ao preparar apresentação: ' + (prep.erro || 'falha ao preparar dados') + '. Envio cancelado.'); return; }

    let salvo;
    try {
      showLoading('Montando apresentação...');
      const pptxB64 = await montarPptxApresentacao(prep, 'detalhada');

      showLoading('Salvando no Drive e convertendo em PDF...');
      salvo = await apiCall('salvarApresentacaoAuditoria', { auditoriaId, detalhadaPPTXBase64: pptxB64 });
    } catch (eMontar) {
      hideLoading();
      toast('Erro ao montar apresentação: ' + eMontar.message + '. Envio cancelado.');
      return;
    }

    if (!salvo.ok) { hideLoading(); toast('Erro ao salvar apresentação: ' + (salvo.erro || 'falha') + '. Envio cancelado.'); return; }
    if (!salvo.detalhada || !salvo.detalhada.linkPDF) {
      hideLoading();
      const motivo = (salvo.detalhada && salvo.detalhada.erroPDF) ? salvo.detalhada.erroPDF : 'conversão para PDF falhou';
      toast('Não foi possível gerar o PDF da apresentação (' + motivo + '). Envio cancelado.');
      return;
    }
  }

  showLoading('Enviando relatório e apresentação...');
  // r109: o backend monta o link da pesquisa NPS (só em análises DURANTE A OPERAÇÃO)
  // a partir do endereço de onde o app está hospedado.
  const urlBaseApp = window.location.href.split('?')[0].split('#')[0].replace(/[^\/]*$/, '');
  const re = await apiCall('enviarRelatorioAuditoria', { auditoriaId, email, urlBaseApp });
  hideLoading();
  if (re.ok) {
    toast('Relatório e apresentação enviados para ' + email + (re.npsIncluido ? ' (com pesquisa NPS)' : ''));
    verHistorico();
  } else {
    toast('Erro: ' + (re.erro || 'falha'));
  }
}

/* ═══════════════════════════════════════════════════════
   APRESENTAÇÃO EXECUTIVA (PPTX + PDF) — r69
   Gera duas versões (curta e detalhada) a partir dos dados
   já salvos da auditoria (scores, observações do auditor e
   fotos). Sempre substitui a apresentação anterior no Drive.
   Reaproveita o mesmo estilo visual (capa dark + split navy/
   white + verde) usado no Resumo Executivo de Inventários.
   ═══════════════════════════════════════════════════════ */

// Metadados das seções que têm fotos e/ou observação, na mesma
// ordem/ids usados em SECOES (fonte da verdade lá em cima).
const SECOES_META_APRESENTACAO = {
  estrutura_fisica:   { titulo:'Estrutura Física' },
  deposito:           { titulo:'Depósito Linha Seca', obsId:'obs_deposito' },
  aereos_retaguarda:  { titulo:'Aéreos e Sub-aéreos — Retaguarda' },
  camaras:            { titulo:'Câmaras Frigoríficas', obsId:'obs_camaras' },
  av_pereciveis:      { titulo:'Perecíveis — Área de Vendas' },
  av_mercearia:       { titulo:'Mercearia — Área de Vendas' },
  // r72: espelha o backend — observação geral da Finalização, sem foto própria.
  finalizacao:        { titulo:'Observações Gerais — Área de Vendas', obsId:'obs_area_vendas', semFotos:true }
};

// Fontes alternativas do PptxGenJS 3.12.0, em domínios diferentes do CDN
// principal (usado na tag <script> do <head>). Se o domínio principal
// estiver bloqueado (rede corporativa, extensão de bloqueio etc.), tenta
// os próximos antes de desistir — r70.1.
const PPTXGENJS_CDNS_ALT = [
  'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
  'https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@3.12.0/dist/pptxgen.bundle.js'
];

function carregarScriptExterno(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { resolve(true); };
    s.onerror = function () { reject(new Error('falha ao carregar ' + url)); };
    document.head.appendChild(s);
  });
}

// Aguarda a lib PptxGenJS carregar (tolera race de timing no load da tag
// <script> do <head>). Se depois de alguns segundos ela ainda não tiver
// carregado — sinal de que o CDN principal está bloqueado/indisponível —
// tenta buscar de fontes alternativas antes de desistir de vez — r70.1.
async function aguardarPptxGenJS() {
  if (typeof PptxGenJS !== 'undefined') return true;

  for (var n = 0; n < 20; n++) { // 20 x 150ms = 3s
    if (typeof PptxGenJS !== 'undefined') return true;
    await new Promise(function (r) { setTimeout(r, 150); });
  }

  for (var i = 0; i < PPTXGENJS_CDNS_ALT.length; i++) {
    try {
      await carregarScriptExterno(PPTXGENJS_CDNS_ALT[i]);
      if (typeof PptxGenJS !== 'undefined') return true;
    } catch (e) { /* tenta a próxima fonte */ }
  }

  return typeof PptxGenJS !== 'undefined';
}

// r73: versão Curta eliminada — só resta uma apresentação. LABEL_VARIANTE
// e o parâmetro "variante" ficaram (sempre 'detalhada' agora) só pra não
// mexer no restante do fluxo, que já funciona.
const LABEL_VARIANTE = { detalhada: 'Executiva' };

async function gerarApresentacaoVariante(auditoriaId, cliente, unidade, variante) {
  const disponivel = await aguardarPptxGenJS();
  if (!disponivel) {
    toast('Não foi possível carregar a biblioteca de apresentação (tentamos 3 fontes diferentes). Verifique sua conexão com a internet ou tente em outra rede/dispositivo.');
    return;
  }
  if (!confirm('Gerar a apresentação executiva desta auditoria?\n\nSe já existir uma apresentação anterior para esta auditoria, ela será substituída.')) return;

  showLoading('Preparando dados da apresentação...');
  const prep = await apiCall('prepararApresentacaoAuditoria', { auditoriaId });
  if (!prep.ok) { hideLoading(); toast('Erro: ' + (prep.erro || 'falha ao preparar dados')); return; }

  try {
    showLoading('Montando apresentação...');
    const pptxB64 = await montarPptxApresentacao(prep, variante);

    showLoading('Salvando no Drive e convertendo em PDF...');
    const payload = { auditoriaId: auditoriaId, detalhadaPPTXBase64: pptxB64 };

    const salvo = await apiCall('salvarApresentacaoAuditoria', payload);
    hideLoading();

    if (!salvo.ok) { toast('Erro ao salvar: ' + (salvo.erro || 'falha')); return; }
    mostrarLinksApresentacao(cliente, unidade, salvo, variante, prep);
  } catch (e) {
    hideLoading();
    toast('Erro ao montar apresentação: ' + e.message);
  }
}

// r74: abre uma apresentação já gerada anteriormente (sem regenerar),
// usando o backend obterApresentacaoAuditoria. Chamado pelos botões
// "Baixar PPTX" / "Baixar PDF" do Histórico.
async function abrirApresentacaoExistente(auditoriaId, tipo) {
  showLoading('Buscando apresentação...');
  const r = await apiCall('obterApresentacaoAuditoria', { auditoriaId });
  hideLoading();

  if (!r.ok || !r.apresentacao || !r.apresentacao.detalhada) {
    toast('Ainda não existe uma apresentação gerada para esta auditoria. Use "🎬 Gerar Apresentação" primeiro.');
    return;
  }

  const obj = r.apresentacao.detalhada;
  const link = tipo === 'pdf' ? obj.linkPDF : obj.linkPPTX;

  if (!link) {
    if (tipo === 'pdf') {
      toast('O PDF desta apresentação não foi gerado' + (obj.erroPDF ? (': ' + obj.erroPDF) : '') + '. Abra o PPTX e exporte como PDF, se precisar.');
    } else {
      toast('O PPTX desta apresentação não está disponível. Gere a apresentação novamente.');
    }
    return;
  }

  window.open(link, '_blank');
}

function mostrarLinksApresentacao(cliente, unidade, salvo, variante, prep) {
  const obj = salvo[variante];

  function escHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  const bloco = (!obj || (!obj.linkPPTX && !obj.linkPDF))
    ? `<div style="font-size:12px;color:var(--text-light);margin-top:10px">Não foi possível gerar a apresentação.</div>`
    : `
      <div style="display:flex;gap:6px;margin-top:14px">
        ${obj.linkPPTX ? `<a class="btn-fc btn-fc-outline" style="width:auto;flex:1;padding:8px;font-size:11px;text-decoration:none;text-align:center" href="${obj.linkPPTX}" target="_blank">📽️ PPTX</a>` : ''}
        ${obj.linkPDF ? `<a class="btn-fc btn-fc-navy" style="width:auto;flex:1;padding:8px;font-size:11px;text-decoration:none;text-align:center" href="${obj.linkPDF}" target="_blank">📄 PDF</a>` : ''}
      </div>
      ${(obj.linkPPTX && !obj.linkPDF) ? `<div style="font-size:11px;color:var(--text-light);margin-top:8px">PPTX gerado; a conversão automática para PDF falhou${obj.erroPDF ? (': <strong>' + escHtml(obj.erroPDF) + '</strong>') : ''}. Abra o PPTX e exporte como PDF, se precisar.</div>` : ''}`;

  // r73: aviso de diagnóstico de fotos — só aparece quando existem fotos
  // no Drive para esta auditoria mas nenhuma entrou na apresentação
  // (sinal de falha ao baixar do Drive, não de auditoria sem fotos).
  let avisoFotos = '';
  if (prep && prep.fotosDisponiveis > 0 && prep.fotosIncluidas === 0) {
    avisoFotos = `<div style="font-size:11px;color:#E05252;background:#FDEAEA;padding:8px;border-radius:8px;margin-top:10px;text-align:left">⚠️ Havia ${prep.fotosDisponiveis} foto(s) anexada(s) a esta auditoria, mas nenhuma pôde ser incluída na apresentação. Gere de novo e, se persistir, avise — isso indica falha ao baixar as fotos do Drive.</div>`;
  } else if (prep && typeof prep.fotosIncluidas === 'number') {
    avisoFotos = `<div style="font-size:10px;color:var(--text-light);margin-top:10px">${prep.fotosIncluidas} foto(s) incluída(s) na apresentação.</div>`;
  }

  $('#app').innerHTML = `
    <div class="tela-inicial">
      <div class="secao-card" style="text-align:center">
        <div style="font-size:40px;margin-bottom:8px">🎬</div>
        <h2 style="font-size:18px;color:var(--navy);margin-bottom:4px">Apresentação Gerada</h2>
        <p style="color:var(--text-light);margin-bottom:4px">${cliente} — ${unidade}</p>
        ${bloco}
        ${avisoFotos}
        <button class="btn-fc btn-fc-outline" onclick="verHistorico()" style="margin-top:24px">
          <i class="bi bi-arrow-left"></i> Voltar ao Histórico
        </button>
      </div>
    </div>`;
}

// Monta o PPTX (curta ou detalhada) e resolve com o base64 do arquivo.
function montarPptxApresentacao(prep, variante) {
  return new Promise(function(resolve, reject) {
    try {
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_16x9';

      const NAVY='002B50', GREEN='61CF00', DARK='051323', ORANGE='E8872B', BODY='556677', LABEL='8899AA';
      const isDetalhada = (variante === 'detalhada');
      const ident = prep.ident || {};
      const scores = prep.scores || {};
      const estrutura = prep.estrutura || [];
      const textos = prep.textos || {};
      const fotosSet = prep.fotosDetalhada || [];

      function addLogo(s) {
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:7.05, y:4.55, w:2.7, h:0.7 }); } catch(e) {} }
      }
      function splitBg(s) {
        s.background = { fill:'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x:6.8, y:0, w:3.2, h:5.625, fill:{ color: DARK } });
        addLogo(s);
      }
      function corScore(v) {
        v = parseFloat(v) || 0;
        if (v >= 7.5) return GREEN;
        if (v >= 6) return 'D4A017';
        if (v >= 4) return ORANGE;
        return 'E05252';
      }
      function painelInfo(s) {
        s.addText((ident.cliente||'') + '\n' + (ident.unidade||''), { x:7.05, y:0.8, w:2.7, h:0.5, fontSize:12, fontFace:'Arial', bold:true, color:'FFFFFF', isTextBox:true, margin:0 });
        s.addText((ident.data_auditoria||'') + '\n' + (ident.tipo_avaliacao||''), { x:7.05, y:1.5, w:2.7, h:0.5, fontSize:10, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, lineSpacingMultiple:1.4 });
      }

      // r100: estima a altura (em polegadas) que um bloco de texto vai
      // ocupar num text box do PptxGenJS, a partir do tamanho da fonte e
      // da largura disponível — usado para dimensionar as caixas de
      // texto dinamicamente e evitar que um bloco sobreponha o próximo.
      function estimarAlturaTexto(texto, larguraPol, fontSize, lineSpacingMultiple) {
        texto = String(texto || '');
        if (!texto) return 0.3;
        lineSpacingMultiple = lineSpacingMultiple || 1.2;
        const charsPorLinha = Math.max(10, Math.floor((larguraPol * 72) / (fontSize * 0.52)));
        let linhas = 0;
        texto.split('\n').forEach(function(par) {
          linhas += Math.max(1, Math.ceil(par.length / charsPorLinha));
        });
        const alturaLinha = (fontSize * 1.22 * lineSpacingMultiple) / 72;
        return Math.max(0.3, linhas * alturaLinha + 0.12);
      }

      // r100: centraliza as fotos de uma seção dentro de uma grade de até
      // 3 colunas, dentro da área (areaX, areaY, areaW, areaH) informada.
      function montarGradeFotos(s, fotos, areaX, areaY, areaW, areaH) {
        if (!fotos.length) return;
        const cols = fotos.length <= 1 ? 1 : (fotos.length <= 4 ? 2 : 3);
        const rows = Math.ceil(fotos.length / cols);
        const cellW = areaW / cols;
        const cellH = areaH / rows;
        const tam = Math.max(0.1, Math.min(cellW, cellH) - 0.15);
        fotos.forEach(function(f, idx) {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const cx = areaX + col * cellW + (cellW - tam) / 2;
          const cy = areaY + row * cellH + (cellH - tam) / 2;
          try {
            s.addImage({ data:'data:image/jpeg;base64,' + f.base64, x: cx, y: cy, w: tam, h: tam });
          } catch(e) {}
        });
      }

      // r100: número máximo de fotos por slide — seções com mais fotos
      // que isso ganham slides extras de continuação.
      const MAX_FOTOS_POR_SLIDE = 6;

      let numSecao = 0;
      function rotulo(s, texto) {
        numSecao++;
        const n = numSecao < 10 ? '0' + numSecao : String(numSecao);
        s.addText(n + ' / ' + texto, { x:0.8, y:0.45, w:5.5, h:0.25, fontSize:9, fontFace:'Arial', bold:true, color: GREEN, isTextBox:true, margin:0, charSpacing:3 });
      }

      /* Slide 1 — Capa */
      const s1 = pres.addSlide();
      s1.background = { fill: DARK };
      s1.addShape(pres.ShapeType.rect, { x:0, y:0, w:10, h:0.04, fill:{ color: GREEN } });
      s1.addText([
        { text:'Análise de ', options:{ color:'FFFFFF', fontSize:30, fontFace:'Calibri', bold:true } },
        { text:'Preparação para Inventário', options:{ color: GREEN, fontSize:30, fontFace:'Calibri', bold:true } }
      ], { x:0.8, y:0.7, w:8.4, h:1.1, isTextBox:true, margin:0 });
      s1.addText('Apresentação Executiva', { x:0.8, y:1.85, w:6, h:0.4, fontSize:16, fontFace:'Calibri', color: GREEN, isTextBox:true, margin:0 });
      const sub = (ident.cliente||'') + ' — ' + (ident.unidade||'') + '  ·  ' + (ident.data_auditoria||'');
      s1.addText(sub, { x:0.8, y:2.45, w:8, h:0.4, fontSize:13, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0 });
      if (LOGO_APRESENTACAO_DATA_URL) { try { s1.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:3.2, y:4.35, w:3.6, h:0.94 }); } catch(e) {} }

      /* Slide 2 — Indicadores */
      const s2 = pres.addSlide();
      splitBg(s2);
      rotulo(s2, 'INDICADORES-CHAVE');
      s2.addText([
        { text:'Score da ', options:{ color: DARK } },
        { text:'Preparação', options:{ color: GREEN } }
      ], { x:0.8, y:0.9, w:5.6, h:0.6, fontSize:26, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });

      const dims = [
        { label:'SCORE GERAL', valor:(scores.geral||'—') + '/10', cor: corScore(scores.geral) },
        { label:'SCORE EQUIPE DE APOIO', valor:(scores.equipe||'—') + '/10', cor: corScore(scores.equipe) }
      ];
      estrutura.forEach(function(e) {
        dims.push({ label: String(e.estrutura||'').toUpperCase(), valor: e.media + '/10', cor: corScore(e.media) });
      });
      dims.forEach(function(d, i) {
        const ky = 1.75 + i * 0.62;
        s2.addShape(pres.ShapeType.rect, { x:0.8, y:ky, w:0.04, h:0.42, fill:{ color: d.cor } });
        s2.addText(d.valor, { x:1.05, y:ky, w:1.6, h:0.32, fontSize:20, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
        s2.addText(d.label, { x:2.75, y:ky+0.05, w:3.2, h:0.3, fontSize:10, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, charSpacing:1 });
      });
      painelInfo(s2);

      /* Slide 2b — Notas por Setor (só na Detalhada) — r72 */
      const notasPorSetor = prep.notasPorSetor || [];
      if (isDetalhada && notasPorSetor.length) {
        const sN = pres.addSlide();
        splitBg(sN);
        rotulo(sN, 'NOTAS POR SETOR');
        sN.addText([
          { text:'Notas ', options:{ color: DARK } },
          { text:'por Setor', options:{ color: GREEN } }
        ], { x:0.8, y:0.9, w:5.7, h:0.6, fontSize:26, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
        notasPorSetor.forEach(function(n, i) {
          const ky = 1.75 + i * 0.5;
          sN.addShape(pres.ShapeType.rect, { x:0.8, y:ky, w:0.04, h:0.34, fill:{ color: corScore(n.media) } });
          sN.addText(n.media + '/10', { x:1.05, y:ky-0.03, w:1.15, h:0.32, fontSize:16, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
          sN.addText(n.setor, { x:2.3, y:ky+0.02, w:3.7, h:0.3, fontSize:10, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0 });
        });
        painelInfo(sN);
      }

      /* Slide 3 — Resumo (cenário geral) */
      const s3 = pres.addSlide();
      splitBg(s3);
      rotulo(s3, 'RESUMO');
      s3.addText([
        { text:'Cenário ', options:{ color: DARK } },
        { text:'Geral', options:{ color: GREEN } }
      ], { x:0.8, y:0.9, w:5.6, h:0.6, fontSize:26, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
      const resumoTxt = isDetalhada ? (textos.resumo_detalhado || textos.resumo_curto || '') : (textos.resumo_curto || '');
      // r100: altura calculada a partir do texto (em vez de fixa em 2.4in)
      // para não cortar/sobrepor quando a IA gera um resumo mais longo.
      const resumoH = Math.min(2.9, estimarAlturaTexto(resumoTxt, 5.7, 13, 1.4));
      s3.addText(resumoTxt, { x:0.8, y:1.7, w:5.7, h:resumoH, fontSize:13, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.4 });
      painelInfo(s3);

      /* Slides seguintes — um por seção com foto e/ou observação
         disponível (r72: não depende mais só de ter foto), com a
         observação do auditor (reescrita pela IA) quando existir. */
      fotosSet.forEach(function(secao) {
        const meta = SECOES_META_APRESENTACAO[secao.secaoId] || {};
        const fotos = secao.fotos || [];
        let obsTxt = '';
        if (meta.obsId && textos.observacoes && textos.observacoes[meta.obsId]) {
          const o = textos.observacoes[meta.obsId];
          obsTxt = isDetalhada ? (o.detalhada || o.curta || '') : (o.curta || '');
        }
        // r100: nunca gera slide vazio — uma seção sem foto e sem
        // observação (nem do auditor, nem da rede de segurança do
        // backend) é simplesmente pulada.
        if (!fotos.length && !obsTxt) return;

        // r100: seções com mais de MAX_FOTOS_POR_SLIDE fotos ganham
        // slides extras de continuação, em vez de espremer tudo num só.
        const totalPaginas = Math.max(1, Math.ceil(fotos.length / MAX_FOTOS_POR_SLIDE));
        for (let pagina = 0; pagina < totalPaginas; pagina++) {
          const s = pres.addSlide();
          splitBg(s);
          const fotosDaPagina = fotos.slice(pagina * MAX_FOTOS_POR_SLIDE, (pagina + 1) * MAX_FOTOS_POR_SLIDE);
          const temFotos = fotosDaPagina.length > 0;
          rotulo(s, temFotos ? 'REGISTROS FOTOGRÁFICOS' : 'OBSERVAÇÕES');
          const tituloTxt = (secao.titulo || meta.titulo || '') + (pagina > 0 ? ' (continuação)' : '');
          s.addText(tituloTxt, { x:0.8, y:0.9, w:5.7, h:0.55, fontSize:22, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });

          let yFotos = 1.55;
          if (obsTxt && pagina === 0) {
            // r100: altura calculada a partir do texto real, em vez de
            // fixa em 0.85in, para não sobrepor a grade de fotos abaixo.
            const obsH = Math.min(1.5, estimarAlturaTexto(obsTxt, 5.7, 11, 1.3));
            s.addText(obsTxt, { x:0.8, y:1.5, w:5.7, h:obsH, fontSize:11, fontFace:'Arial', color: BODY, italic:true, isTextBox:true, margin:0, lineSpacingMultiple:1.3 });
            yFotos = 1.5 + obsH + 0.15;
          }
          montarGradeFotos(s, fotosDaPagina, 0.8, yFotos, 5.7, Math.max(0.8, 5.35 - yFotos));
          painelInfo(s);
        }
      });

      /* Slide final — Pontos fortes e oportunidades */
      if (textos.pontos_fortes || textos.oportunidades) {
        const sF = pres.addSlide();
        splitBg(sF);
        rotulo(sF, 'CONCLUSÃO');
        sF.addText([
          { text:'Pontos-Chave ', options:{ color: DARK } },
          { text:'e Oportunidades', options:{ color: GREEN } }
        ], { x:0.8, y:0.9, w:5.7, h:0.6, fontSize:24, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });

        // r100: altura de cada bloco calculada a partir do texto real
        // (em vez de fixa em 0.9in) — é exatamente essa sobreposição
        // entre "Pontos-Chave" e "Oportunidades" que corrigimos aqui.
        let cy = 1.8;
        if (textos.pontos_fortes) {
          const blocoH = Math.min(1.8, estimarAlturaTexto(textos.pontos_fortes, 5.3, 11, 1.3));
          sF.addShape(pres.ShapeType.ellipse, { x:0.8, y:cy, w:0.25, h:0.25, fill:{ color: GREEN } });
          sF.addText('✓', { x:0.8, y:cy, w:0.25, h:0.25, fontSize:12, bold:true, color:'FFFFFF', align:'center', valign:'middle', isTextBox:true, margin:0 });
          sF.addText(textos.pontos_fortes, { x:1.15, y:cy-0.05, w:5.3, h:blocoH, fontSize:11, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3 });
          cy += blocoH + 0.25;
        }
        if (textos.oportunidades) {
          const blocoH = Math.min(1.8, estimarAlturaTexto(textos.oportunidades, 5.3, 11, 1.3));
          sF.addShape(pres.ShapeType.ellipse, { x:0.8, y:cy, w:0.25, h:0.25, fill:{ color: ORANGE } });
          sF.addText('!', { x:0.8, y:cy, w:0.25, h:0.25, fontSize:12, bold:true, color:'FFFFFF', align:'center', valign:'middle', isTextBox:true, margin:0 });
          sF.addText(textos.oportunidades, { x:1.15, y:cy-0.05, w:5.3, h:blocoH, fontSize:11, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3 });
        }
        painelInfo(sF);
      }

      pres.write('base64').then(resolve).catch(reject);
    } catch (e) {
      reject(e);
    }
  });
}

/* ═══════════════════════════════════════════════════════
   APRESENTAÇÃO DE PERFORMANCE (PPTX) — r110
   Mesmo estilo visual da Apresentação Executiva da análise
   (capa escura, painel lateral escuro, verde da marca).
   ═══════════════════════════════════════════════════════ */
function montarPptxPerformance(prep) {
  return new Promise(function(resolve, reject) {
    try {
      const pres = new PptxGenJS();
      pres.layout = 'LAYOUT_16x9';
      const NAVY='002B50', GREEN='61CF00', DARK='051323', ORANGE='E8872B', BODY='556677', LABEL='8899AA';
      const cli = prep.cliente;
      const textos = prep.textos || {};
      const periodoTxt = prep.periodoTxt || '';
      const fmt = function(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1).replace('.', ','); };
      const corHex = function(n) {
        if (n === null || n === undefined || isNaN(n)) return '9AA7B4';
        if (n >= 9) return '2E7D32';
        if (n >= 7.5) return GREEN;
        if (n >= 6) return 'D4A017';
        if (n >= 4) return ORANGE;
        return 'E05252';
      };
      const bgHex = function(n) {
        if (n === null || n === undefined || isNaN(n)) return 'F4F6F8';
        if (n >= 9) return 'E8F5E9';
        if (n >= 7.5) return 'EAF8E0';
        if (n >= 6) return 'FFF8E1';
        if (n >= 4) return 'FFF3E0';
        return 'FDEAEA';
      };
      const deltaTxt = function(v) { return (v === null || v === undefined) ? '—' : (v === 0 ? '= 0,0' : (v > 0 ? '▲ +' : '▼ ') + fmt(v)); };
      const deltaCor = function(v) { return (v === null || v === undefined || v === 0) ? '6B7B8D' : (v > 0 ? '2E7D32' : 'C0392B'); };

      function estimarAlturaTexto(texto, larguraPol, fontSize, lineSpacingMultiple) {
        texto = String(texto || '');
        if (!texto) return 0.3;
        lineSpacingMultiple = lineSpacingMultiple || 1.2;
        const charsPorLinha = Math.max(10, Math.floor((larguraPol * 72) / (fontSize * 0.52)));
        let linhas = 0;
        texto.split('\n').forEach(function(par) { linhas += Math.max(1, Math.ceil(par.length / charsPorLinha)); });
        const alturaLinha = (fontSize * 1.22 * lineSpacingMultiple) / 72;
        return Math.max(0.3, linhas * alturaLinha + 0.12);
      }
      function addLogo(s) {
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:7.05, y:4.55, w:2.7, h:0.7 }); } catch(e) {} }
      }
      function splitBg(s) {
        s.background = { fill:'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x:6.8, y:0, w:3.2, h:5.625, fill:{ color: DARK } });
        addLogo(s);
      }
      function painelInfo(s, linha3) {
        s.addText(String(cli.cliente || ''), { x:7.05, y:0.8, w:2.7, h:0.6, fontSize:12, fontFace:'Arial', bold:true, color:'FFFFFF', isTextBox:true, margin:0, valign:'top' });
        s.addText(periodoTxt + (linha3 ? '\n' + linha3 : ''), { x:7.05, y:1.5, w:2.7, h:0.9, fontSize:10, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
      }
      let numSecao = 0;
      function rotulo(s, texto) {
        numSecao++;
        const n = numSecao < 10 ? '0' + numSecao : String(numSecao);
        s.addText(n + ' / ' + texto, { x:0.8, y:0.45, w:5.5, h:0.25, fontSize:9, fontFace:'Arial', bold:true, color: GREEN, isTextBox:true, margin:0, charSpacing:3 });
      }
      function titulo2(s, a, b, w) {
        s.addText([{ text:a, options:{ color: DARK } }, { text:b, options:{ color: GREEN } }], { x:0.8, y:0.9, w:(w || 5.7), h:0.6, fontSize:24, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
      }
      // slide de largura total (tabelas): fundo branco + faixa fina superior + logo pequeno no canto
      function fullBg(s) {
        s.background = { fill:'FFFFFF' };
        s.addShape(pres.ShapeType.rect, { x:0, y:0, w:10, h:0.5, fill:{ color: DARK } });
        s.addShape(pres.ShapeType.rect, { x:0, y:0.5, w:10, h:0.04, fill:{ color: GREEN } });
        if (LOGO_APRESENTACAO_DATA_URL) { try { s.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:7.6, y:0.07, w:2.1, h:0.36 }); } catch(e) {} }
      }
      function rotuloFull(s, texto) {
        numSecao++;
        const n = numSecao < 10 ? '0' + numSecao : String(numSecao);
        s.addText(n + ' / ' + texto, { x:0.5, y:0.1, w:6.5, h:0.3, fontSize:9, fontFace:'Arial', bold:true, color: GREEN, isTextBox:true, margin:0, charSpacing:3 });
      }
      function truncar(t, n) { t = String(t || ''); return t.length > n ? t.substring(0, n - 1) + '…' : t; }

      /* 1 — Capa */
      const s1 = pres.addSlide();
      s1.background = { fill: DARK };
      s1.addShape(pres.ShapeType.rect, { x:0, y:0, w:10, h:0.04, fill:{ color: GREEN } });
      s1.addText([
        { text:'Análise de ', options:{ color:'FFFFFF', fontSize:30, fontFace:'Calibri', bold:true } },
        { text:'Performance das Unidades', options:{ color: GREEN, fontSize:30, fontFace:'Calibri', bold:true } }
      ], { x:0.8, y:0.7, w:8.4, h:1.1, isTextBox:true, margin:0 });
      s1.addText('Apresentação Executiva', { x:0.8, y:1.85, w:6, h:0.4, fontSize:16, fontFace:'Calibri', color: GREEN, isTextBox:true, margin:0 });
      s1.addText(String(cli.cliente || '') + '  ·  ' + periodoTxt, { x:0.8, y:2.45, w:8.4, h:0.4, fontSize:13, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0 });
      if (prep.tipoTxt) s1.addText(prep.tipoTxt, { x:0.8, y:2.85, w:8.4, h:0.3, fontSize:11, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0 });
      if (LOGO_APRESENTACAO_DATA_URL) { try { s1.addImage({ data: LOGO_APRESENTACAO_DATA_URL, x:3.2, y:4.35, w:3.6, h:0.94 }); } catch(e) {} }

      /* 2 — Indicadores-chave */
      const s2 = pres.addSlide();
      splitBg(s2);
      rotulo(s2, 'INDICADORES-CHAVE');
      titulo2(s2, 'Nota do ', 'Cliente');
      const kpis = [
        { label:'NOTA MÉDIA DO CLIENTE' + (cli.faixa ? ' · ' + String(cli.faixa).toUpperCase() : ''), valor: fmt(cli.geral) + '/10', cor: corHex(cli.geral) },
        { label:'UNIDADES AVALIADAS', valor: String(cli.unidades), cor: NAVY },
        { label:'ANÁLISES NO PERÍODO', valor: String(cli.analises), cor: NAVY },
        { label:'VARIAÇÃO VS PERÍODO ANTERIOR', valor: deltaTxt(cli.variacao.geral), cor: deltaCor(cli.variacao.geral) }
      ];
      if (cli.organizacao !== null && cli.organizacao !== undefined) kpis.push({ label:'ORGANIZAÇÃO (MÉDIA)', valor: fmt(cli.organizacao) + '/10', cor: corHex(cli.organizacao) });
      if (cli.volume !== null && cli.volume !== undefined) kpis.push({ label:'VOLUME (MÉDIA · 10 = IDEAL)', valor: fmt(cli.volume) + '/10', cor: corHex(cli.volume) });
      kpis.forEach(function(k, i) {
        const ky = 1.7 + i * 0.6;
        s2.addShape(pres.ShapeType.rect, { x:0.8, y:ky, w:0.04, h:0.4, fill:{ color: k.cor } });
        s2.addText(k.valor, { x:1.05, y:ky, w:1.8, h:0.32, fontSize:19, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0 });
        s2.addText(k.label, { x:2.95, y:ky+0.04, w:3.6, h:0.3, fontSize:9, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, charSpacing:1 });
      });
      painelInfo(s2, cli.unidades + ' unidade(s)');

      /* 3 — Resumo executivo */
      const s3 = pres.addSlide();
      splitBg(s3);
      rotulo(s3, 'RESUMO EXECUTIVO');
      titulo2(s3, 'Resumo ', 'Executivo');
      const resumoTxt = [textos.resumo_executivo, textos.evolucao].filter(Boolean).join('\n\n');
      s3.addText(resumoTxt, { x:0.8, y:1.7, w:5.7, h:Math.min(3.5, estimarAlturaTexto(resumoTxt, 5.7, 12, 1.4)), fontSize:12, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
      painelInfo(s3);

      /* 4 — Comparativo (gráfico de barras; 8 unidades por slide) */
      const comNota = cli.lista.filter(function(u) { return u.geral !== null && u.geral !== undefined; });
      const POR_GRAFICO = 8;
      for (let ini = 0; ini < comNota.length; ini += POR_GRAFICO) {
        const lote = comNota.slice(ini, ini + POR_GRAFICO);
        const sG = pres.addSlide();
        splitBg(sG);
        rotulo(sG, 'COMPARATIVO ENTRE UNIDADES');
        titulo2(sG, 'Nota por ', 'Unidade' + (ini > 0 ? ' (continuação)' : ''));
        // barras horizontais: a primeira categoria fica embaixo no PowerPoint, então invertemos
        const ordem = lote.slice().reverse();
        try {
          sG.addChart(pres.charts.BAR, [{ name:'Nota geral', labels: ordem.map(function(u) { return truncar(u.unidade, 26); }), values: ordem.map(function(u) { return u.geral; }) }], {
            x:0.6, y:1.55, w:6.0, h:Math.max(1.8, Math.min(3.7, 0.5 * lote.length + 0.7)), barDir:'bar', barGapWidthPct:45,
            chartColors: ordem.map(function(u) { return corHex(u.geral); }),
            valAxisMinVal:0, valAxisMaxVal:10, valAxisMajorUnit:2, valAxisLabelFontSize:9, valAxisLabelColor: LABEL, valGridLine:{ color:'E2E8F0', size:0.5 },
            catAxisLabelFontSize:9, catAxisLabelColor: BODY, catAxisLabelFontFace:'Arial',
            showValue:true, dataLabelFontSize:10, dataLabelFontBold:true, dataLabelColor: DARK, dataLabelFormatCode:'0.0', showLegend:false
          });
        } catch(eChart) {}
        painelInfo(sG, 'Nota média por unidade (0 a 10)');
      }

      /* 5 — Tabela comparativa (largura total; 7 unidades por slide) */
      const POR_TABELA = 7;
      for (let ini = 0; ini < cli.lista.length; ini += POR_TABELA) {
        const lote = cli.lista.slice(ini, ini + POR_TABELA);
        const sT = pres.addSlide();
        fullBg(sT);
        rotuloFull(sT, 'TABELA COMPARATIVA');
        sT.addText([{ text:'Comparativo ', options:{ color: DARK } }, { text:'entre Unidades' + (ini > 0 ? ' (continuação)' : ''), options:{ color: GREEN } }], { x:0.5, y:0.7, w:9, h:0.5, fontSize:22, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
        const cab = ['Unidade', 'Geral', 'Equipe', 'Retaguarda', 'Área de Vendas', 'Variação vs anterior'].map(function(t, i) {
          return { text:t, options:{ bold:true, color:'FFFFFF', fill:{ color: NAVY }, fontSize:10, fontFace:'Arial', align: i === 0 ? 'left' : 'center', valign:'middle' } };
        });
        const cel = function(v) { return { text: fmt(v), options:{ bold:true, color: corHex(v), fill:{ color: bgHex(v) }, fontSize:11, fontFace:'Arial', align:'center', valign:'middle' } }; };
        const linhas = lote.map(function(u) {
          return [
            { text: truncar(u.unidade, 34), options:{ bold:true, color: NAVY, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } },
            cel(u.geral), cel(u.equipe), cel(u.retaguarda), cel(u.areaVendas),
            { text: deltaTxt(u.variacao.geral), options:{ bold:true, color: deltaCor(u.variacao.geral), fontSize:10, fontFace:'Arial', align:'center', valign:'middle' } }
          ];
        });
        if (ini + POR_TABELA >= cli.lista.length) {
          linhas.push([
            { text:'Média do cliente', options:{ bold:true, color: DARK, fill:{ color:'F0F2F4' }, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } },
            Object.assign(cel(cli.geral), {}), cel(cli.equipe), cel(cli.retaguarda), cel(cli.areaVendas),
            { text: deltaTxt(cli.variacao.geral), options:{ bold:true, color: deltaCor(cli.variacao.geral), fill:{ color:'F0F2F4' }, fontSize:10, fontFace:'Arial', align:'center', valign:'middle' } }
          ]);
        }
        sT.addTable([cab].concat(linhas), { x:0.5, y:1.4, w:9, colW:[3.0, 1.0, 1.0, 1.3, 1.5, 1.2], rowH:0.42, border:{ type:'solid', color:'E2E8F0', pt:0.75 } });
        sT.addText('Nota da unidade = média das análises do período · nota do cliente = média das unidades · "—" = não avaliado.', { x:0.5, y:5.2, w:9, h:0.25, fontSize:8, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0 });
      }

      /* 6 — Leitura comparativa (texto) */
      if (textos.comparativo) {
        const sL = pres.addSlide();
        splitBg(sL);
        rotulo(sL, 'LEITURA COMPARATIVA');
        titulo2(sL, 'Leitura ', 'Comparativa');
        sL.addText(textos.comparativo, { x:0.8, y:1.7, w:5.7, h:Math.min(3.5, estimarAlturaTexto(textos.comparativo, 5.7, 12, 1.4)), fontSize:12, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
        painelInfo(sL);
      }

      /* 7 — Organização x Volume */
      const temOV = cli.lista.some(function(u) { return u.organizacao !== null && u.organizacao !== undefined || u.volume !== null && u.volume !== undefined; });
      if (temOV) {
        // 1º slide: 5 unidades + o texto; os seguintes: 7 por slide (a última leva a linha de média)
        const lotesOV = [cli.lista.slice(0, 5)];
        for (let pos = 5; pos < cli.lista.length; pos += 7) lotesOV.push(cli.lista.slice(pos, pos + 7));
        lotesOV.forEach(function(lote, idxLote) {
          const ini = idxLote === 0 ? 0 : 5 + (idxLote - 1) * 7;
          const sO = pres.addSlide();
          fullBg(sO);
          rotuloFull(sO, 'ORGANIZAÇÃO X VOLUME');
          sO.addText([{ text:'Organização ', options:{ color: DARK } }, { text:'x Volume' + (idxLote > 0 ? ' (continuação)' : ''), options:{ color: GREEN } }], { x:0.5, y:0.7, w:9, h:0.5, fontSize:22, fontFace:'Calibri', bold:true, isTextBox:true, margin:0 });
          const cab = ['Unidade', 'Organização', 'Volume (10 = ideal)', 'Média dos dois'].map(function(t, i) {
            return { text:t, options:{ bold:true, color:'FFFFFF', fill:{ color: NAVY }, fontSize:10, fontFace:'Arial', align: i === 0 ? 'left' : 'center', valign:'middle' } };
          });
          const cel = function(v) { return { text: fmt(v), options:{ bold:true, color: corHex(v), fill:{ color: bgHex(v) }, fontSize:11, fontFace:'Arial', align:'center', valign:'middle' } }; };
          const linhas = lote.map(function(u) {
            return [{ text: truncar(u.unidade, 34), options:{ bold:true, color: NAVY, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } }, cel(u.organizacao), cel(u.volume), cel(u.orgVol)];
          });
          if (idxLote === lotesOV.length - 1) linhas.push([{ text:'Média do cliente', options:{ bold:true, color: DARK, fill:{ color:'F0F2F4' }, fontSize:10, fontFace:'Arial', align:'left', valign:'middle' } }, cel(cli.organizacao), cel(cli.volume), cel(cli.orgVol)]);
          sO.addTable([cab].concat(linhas), { x:0.5, y:1.4, w:9, colW:[3.6, 1.7, 2.0, 1.7], rowH:0.38, border:{ type:'solid', color:'E2E8F0', pt:0.75 } });
          const yTxt = 1.4 + 0.38 * (linhas.length + 1) + 0.2;
          if (idxLote === 0 && textos.volume_organizacao) {
            sO.addText(textos.volume_organizacao, { x:0.5, y:yTxt, w:9, h:Math.min(5.15 - yTxt, estimarAlturaTexto(textos.volume_organizacao, 9, 11, 1.3)), fontSize:11, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
          }
          sO.addText('Leitura do volume: quanto maior o volume de mercadoria, menor a nota (1 = volume excessivo · 10 = volume ideal).', { x:0.5, y:5.2, w:9, h:0.25, fontSize:8, fontFace:'Arial', color: LABEL, isTextBox:true, margin:0 });
        });
      }

      /* 8 — Um slide por unidade */
      cli.lista.forEach(function(u) {
        const sU = pres.addSlide();
        splitBg(sU);
        rotulo(sU, 'UNIDADE');
        sU.addText(truncar(u.unidade, 40), { x:0.8, y:0.85, w:5.7, h:0.5, fontSize:22, fontFace:'Calibri', bold:true, color: DARK, isTextBox:true, margin:0, fit:'shrink' });
        sU.addText(fmt(u.geral), { x:0.8, y:1.4, w:1.7, h:0.7, fontSize:36, fontFace:'Calibri', bold:true, color: corHex(u.geral), isTextBox:true, margin:0 });
        sU.addText((u.faixa ? String(u.faixa).toUpperCase() : '') + '\n' + u.analises + ' análise(s) no período', { x:2.5, y:1.48, w:4.0, h:0.6, fontSize:10, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.2, valign:'top' });
        const mets = [];
        if (u.retaguarda !== null && u.retaguarda !== undefined) mets.push(['Retaguarda', u.retaguarda]);
        if (u.areaVendas !== null && u.areaVendas !== undefined) mets.push(['Área de Vendas', u.areaVendas]);
        if (u.equipe !== null && u.equipe !== undefined) mets.push(['Equipe de apoio', u.equipe]);
        if (u.organizacao !== null && u.organizacao !== undefined) mets.push(['Organização', u.organizacao]);
        if (u.volume !== null && u.volume !== undefined) mets.push(['Volume (10 = ideal)', u.volume]);
        mets.push(['Variação vs anterior', null]);
        mets.forEach(function(m, i) {
          const col = i % 2, row = Math.floor(i / 2);
          const mx = 0.8 + col * 2.9, my = 2.3 + row * 0.42;
          const isDelta = m[1] === null;
          const cor = isDelta ? deltaCor(u.variacao.geral) : corHex(m[1]);
          sU.addShape(pres.ShapeType.rect, { x:mx, y:my+0.02, w:0.04, h:0.3, fill:{ color: cor } });
          sU.addText(isDelta ? deltaTxt(u.variacao.geral) : fmt(m[1]), { x:mx+0.14, y:my, w:0.85, h:0.34, fontSize:14, fontFace:'Calibri', bold:true, color: isDelta ? cor : DARK, isTextBox:true, margin:0, valign:'middle' });
          sU.addText(m[0], { x:mx+1.0, y:my, w:1.75, h:0.34, fontSize:8, fontFace:'Arial', bold:true, color: BODY, isTextBox:true, margin:0, valign:'middle' });
        });
        const yTxt = 2.3 + Math.ceil(mets.length / 2) * 0.42 + 0.1;
        const txtU = (textos.unidades && textos.unidades[u.unidade]) || '';
        if (txtU) sU.addText(txtU, { x:0.8, y:yTxt, w:5.7, h:Math.max(0.5, Math.min(5.4 - yTxt, estimarAlturaTexto(txtU, 5.7, 10, 1.3))), fontSize:10, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
        painelInfo(sU);
      });

      /* 9 — Pontos-chave e oportunidades / Sugestões */
      if (textos.pontos_positivos || textos.oportunidades) {
        const sF = pres.addSlide();
        splitBg(sF);
        rotulo(sF, 'CONCLUSÃO');
        titulo2(sF, 'Pontos-Chave ', 'e Oportunidades');
        let cy = 1.75;
        if (textos.pontos_positivos) {
          const h = Math.min(1.7, estimarAlturaTexto(textos.pontos_positivos, 5.3, 10.5, 1.3));
          sF.addShape(pres.ShapeType.ellipse, { x:0.8, y:cy, w:0.25, h:0.25, fill:{ color: GREEN } });
          sF.addText('✓', { x:0.8, y:cy, w:0.25, h:0.25, fontSize:12, bold:true, color:'FFFFFF', align:'center', valign:'middle', isTextBox:true, margin:0 });
          sF.addText(textos.pontos_positivos, { x:1.15, y:cy-0.05, w:5.3, h:h, fontSize:10.5, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
          cy += h + 0.25;
        }
        if (textos.oportunidades) {
          const h = Math.min(1.7, estimarAlturaTexto(textos.oportunidades, 5.3, 10.5, 1.3));
          sF.addShape(pres.ShapeType.ellipse, { x:0.8, y:cy, w:0.25, h:0.25, fill:{ color: ORANGE } });
          sF.addText('!', { x:0.8, y:cy, w:0.25, h:0.25, fontSize:12, bold:true, color:'FFFFFF', align:'center', valign:'middle', isTextBox:true, margin:0 });
          sF.addText(textos.oportunidades, { x:1.15, y:cy-0.05, w:5.3, h:h, fontSize:10.5, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.3, valign:'top' });
        }
        painelInfo(sF);
      }
      if (textos.sugestoes) {
        const sS = pres.addSlide();
        splitBg(sS);
        rotulo(sS, 'SUGESTÕES');
        titulo2(sS, 'Sugestões de ', 'Evolução');
        sS.addText(textos.sugestoes, { x:0.8, y:1.7, w:5.7, h:Math.min(3.5, estimarAlturaTexto(textos.sugestoes, 5.7, 12, 1.4)), fontSize:12, fontFace:'Arial', color: BODY, isTextBox:true, margin:0, lineSpacingMultiple:1.4, valign:'top' });
        painelInfo(sS);
      }

      pres.write('base64').then(resolve).catch(reject);
    } catch (e) {
      reject(e);
    }
  });
}

function init() {
  state.emailsCliente = {};
  renderTelaInicial();
}

document.addEventListener('DOMContentLoaded', init);
</script>
