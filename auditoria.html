<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Análise de Preparação para Inventário — Sistema de Gestão FC</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
<style>
:root{--navy:#002B50;--green:#61CF00;--orange:#E8872B;--dark:#051323;--bg:#F4F6F8;--text:#1A2A3A;--text-light:#6B7B8D;--border:#E2E8F0;--white:#FFF;--red:#E05252;--amber:#D4A017}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* HEADER */
.app-header{background:var(--dark);padding:24px 16px;text-align:center;width:calc(100% - 32px);max-width:560px;margin:20px auto;border-radius:12px;box-shadow:0 6px 20px rgba(5,19,35,.3)}
.app-header img{height:52px;margin-bottom:10px;}
.app-header .header-bar{display:flex;align-items:center;justify-content:space-between;max-width:560px;margin:0 auto}
.app-header .badge-mod{background:var(--green);color:var(--dark);font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.5px}
.app-header .btn-voltar{background:none;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.6);font-size:11px;padding:4px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.app-header .btn-voltar:hover{border-color:rgba(255,255,255,.5);color:#FFF}
.app-header .badge-mod{background:var(--green);color:var(--dark);font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.5px}

/* TELA INICIAL */
.tela-inicial{max-width:480px;margin:40px auto;padding:0 16px}
.card-inicio{background:var(--white);border-radius:16px;padding:28px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);border:none}
.card-inicio h2{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:6px}
.card-inicio p{font-size:13px;color:var(--text-light);margin-bottom:20px}
.btn-fc{border:none;border-radius:12px;padding:14px 24px;font-size:14px;font-weight:600;width:100%;cursor:pointer;transition:all .2s}
.btn-fc-green{background:var(--green);color:var(--dark)}.btn-fc-green:hover{background:#56b800;color:var(--dark)}
.btn-fc-navy{background:var(--navy);color:var(--white)}.btn-fc-navy:hover{background:#001d38;color:var(--white)}
.btn-fc-orange{background:var(--orange);color:var(--white)}.btn-fc-orange:hover{background:#cf7520;color:var(--white)}
.btn-fc-outline{background:transparent;border:2px solid var(--border);color:var(--text)}.btn-fc-outline:hover{border-color:var(--navy);color:var(--navy)}

/* RASCUNHOS */
.rascunho-item{background:var(--white);border-radius:12px;padding:16px;margin-bottom:10px;border:2px solid var(--border);cursor:pointer;transition:all .2s}
.rascunho-item:hover{border-color:var(--green)}.rascunho-item .ri-titulo{font-weight:600;font-size:14px;color:var(--navy)}
.rascunho-item .ri-sub{font-size:12px;color:var(--text-light);margin-top:2px}
.rascunho-item .ri-badge{display:inline-block;background:var(--orange);color:var(--white);font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-top:6px}

/* STEPPER */
.stepper-bar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 16px;position:sticky;top:0;z-index:99;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
.stepper-bar::-webkit-scrollbar{display:none}
.step-dot{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:600;margin-right:4px;cursor:pointer;transition:all .2s;border:2px solid transparent;color:var(--text-light);background:var(--bg)}
.step-dot.active{background:var(--navy);color:var(--white);border-color:var(--navy)}
.step-dot.done{background:rgba(97,207,0,.15);color:#3a8000;border-color:var(--green)}
.step-dot .bi{font-size:12px}

/* FORM CONTAINER */
.form-container{max-width:560px;margin:0 auto;padding:16px}
.secao-card{background:var(--white);border-radius:16px;padding:24px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.secao-titulo{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.secao-subtitulo{font-size:12px;color:var(--text-light);margin-bottom:20px;padding-left:28px}

/* SUBSECAO ACCORDION */
.subsecao{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden}
.subsecao-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--bg);transition:all .2s}
.subsecao-header:hover{background:#e8ecf0}
.subsecao-header .sh-titulo{font-size:13px;font-weight:600;color:var(--text)}
.subsecao-header .sh-badge{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:600}
.subsecao-header .sh-badge.pendente{background:#fef3cd;color:#856404}
.subsecao-header .sh-badge.preenchido{background:rgba(97,207,0,.15);color:#3a8000}
.subsecao-body{padding:16px;display:none;border-top:1px solid var(--border)}
.subsecao.aberta .subsecao-body{display:block}
.subsecao.aberta .subsecao-header{background:var(--white)}

/* CRITERIO */
.criterio{margin-bottom:20px}
.criterio:last-child{margin-bottom:0}
.criterio-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:8px;line-height:1.4}
.escala-hints{display:flex;justify-content:space-between;margin-bottom:4px;font-size:10px;color:var(--text-light)}
.rating-row{display:flex;gap:3px;flex-wrap:nowrap}
.rating-btn{flex:1;min-width:0;height:36px;border:2px solid var(--border);border-radius:6px;background:var(--white);font-size:12px;font-weight:600;color:var(--text-light);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;padding:0}
.rating-btn:hover{border-color:var(--navy);color:var(--navy)}
.rating-btn.selected{color:var(--white);border-color:transparent}
.rating-btn.selected.score-low{background:var(--red)}
.rating-btn.selected.score-mid{background:var(--orange)}
.rating-btn.selected.score-ok{background:var(--amber)}
.rating-btn.selected.score-high{background:var(--green)}
.rating-btn.na-btn{font-size:10px;letter-spacing:0}
.rating-btn.na-btn.selected{background:var(--text-light)}

/* CAMPOS */
.campo-obs textarea{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px;font-size:13px;resize:vertical;min-height:80px;font-family:inherit;transition:border-color .2s}
.campo-obs textarea:focus{outline:none;border-color:var(--navy)}
.campo-obs label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}

.campo-input{margin-bottom:16px}
.campo-input label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block}
.campo-input input,.campo-input select{width:100%;border:2px solid var(--border);border-radius:10px;padding:12px;font-size:14px;font-family:inherit;transition:border-color .2s;background:var(--white);color:var(--text)}
.campo-input input:focus,.campo-input select:focus{outline:none;border-color:var(--navy)}

/* FOTOS */
.fotos-section{margin-top:16px}
.fotos-section label{font-size:12px;font-weight:600;color:var(--text-light);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:block}
.fotos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.foto-slot{aspect-ratio:4/3;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;transition:all .2s;overflow:hidden;position:relative;background:var(--bg)}
.foto-slot:hover{border-color:var(--navy)}
.foto-slot .bi{font-size:20px;color:var(--text-light)}
.foto-slot span{font-size:10px;color:var(--text-light);margin-top:2px}
.foto-slot img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.foto-slot .foto-remove{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:var(--white);border:none;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}

/* NAVIGATION */
.nav-bottom{position:fixed;bottom:0;left:0;right:0;background:var(--white);border-top:1px solid var(--border);padding:12px 16px;display:flex;gap:10px;z-index:100;justify-content:center;max-width:560px;margin:0 auto}
.nav-bottom .btn-fc{width:auto;flex:1;max-width:200px}
.body-pad{padding-bottom:80px}

/* PROGRESS */
.progress-info{text-align:center;padding:8px;font-size:11px;color:var(--text-light);background:var(--white);border-top:1px solid var(--border)}

/* STATUS */
.status-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--white);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.status-toast.show{opacity:1}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(5,19,35,.7);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:12px;color:var(--white);font-size:14px}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SCORE PREVIEW */
.score-preview{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;background:var(--bg);border-radius:10px}
.score-preview .sp-valor{font-size:22px;font-weight:700;color:var(--navy)}
.score-preview .sp-label{font-size:11px;color:var(--text-light)}

/* ABAS DA TELA INICIAL (r109) */
.tela-inicial.tela-home{max-width:560px;margin:20px auto 40px}
.abas-home{display:flex;gap:6px;background:var(--white);padding:5px;border-radius:14px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.aba-home{flex:1;border:none;background:transparent;border-radius:10px;padding:11px 8px;font-size:13px;font-weight:700;color:var(--text-light);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s,color .2s}
.aba-home:hover{color:var(--navy)}
.aba-home.ativa{background:var(--navy);color:var(--white)}
.aba-home:focus-visible,.nps-card:focus-visible,.nps-chip-filtro:focus-visible,.nps-modal-x:focus-visible{outline:3px solid var(--green);outline-offset:2px}

/* PAINEL NPS (r109) */
.nps-painel{background:var(--white);border-radius:16px;padding:18px 16px 16px;margin-bottom:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:4px solid var(--green)}
.nps-topo{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nps-titulo{font-size:15px;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:8px}
.nps-titulo small{font-size:10px;font-weight:700;background:var(--dark);color:var(--green);padding:2px 8px;border-radius:8px;letter-spacing:.5px}
.nps-btn-detalhe{border:2px solid var(--border);background:transparent;color:var(--navy);font-size:11px;font-weight:700;padding:6px 12px;border-radius:10px;cursor:pointer}
.nps-btn-detalhe:hover{border-color:var(--navy)}
.nps-filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.nps-filtros select,.nps-filtros input{width:100%;border:2px solid var(--border);border-radius:10px;padding:9px 10px;font-size:12px;font-family:inherit;background:var(--white);color:var(--text);min-width:0}
.nps-filtros select:focus,.nps-filtros input:focus{outline:none;border-color:var(--navy)}
.nps-filtros select:disabled{background:var(--bg);color:var(--text-light)}
.nps-datas{grid-column:1/-1;display:none;grid-template-columns:1fr 1fr;gap:8px}
.nps-datas.aberto{display:grid}
.nps-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;transition:opacity .2s}
.nps-grid.carregando{opacity:.45}
.nps-card{border:none;background:var(--bg);border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;grid-column:span 2;font-family:inherit;transition:transform .15s,box-shadow .15s}
.nps-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,43,80,.12)}
.nps-card.nps-principal{grid-column:span 3;background:var(--dark);color:var(--white)}
.nps-card.nps-larga{grid-column:span 3}
.nps-rot{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-light)}
.nps-principal .nps-rot{color:rgba(255,255,255,.55)}
.nps-num{font-size:40px;font-weight:800;line-height:1.05}
.nps-num-s{font-size:24px;font-weight:800;line-height:1.1;color:var(--navy)}
.nps-num-s small{font-size:13px;font-weight:600;color:var(--text-light)}
.nps-sub{font-size:11px;color:var(--text-light);line-height:1.35}
.nps-principal .nps-sub{color:rgba(255,255,255,.7);font-weight:600}
.nps-card.nps-p .nps-num-s{color:#2E7D32}
.nps-card.nps-n .nps-num-s{color:var(--amber)}
.nps-card.nps-d .nps-num-s{color:var(--red)}
.nps-erro{background:#FDEAEA;color:#9B2C2C;font-size:12px;border-radius:10px;padding:12px 14px;line-height:1.5}
.nps-vazio-msg{font-size:11px;color:var(--text-light);margin-top:8px}

/* MODAL DE DETALHE DO NPS (r109) */
.nps-modal{position:fixed;inset:0;background:rgba(5,19,35,.72);z-index:250;display:flex;align-items:flex-end;justify-content:center}
.nps-folha{background:var(--bg);width:100%;max-width:640px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.nps-modal-topo{background:var(--white);padding:16px 18px 10px;border-bottom:1px solid var(--border)}
.nps-modal-linha{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.nps-modal-titulo{font-size:16px;font-weight:700;color:var(--navy)}
.nps-modal-ctx{font-size:11px;color:var(--text-light);margin-top:2px;line-height:1.4}
.nps-modal-x{border:none;background:var(--bg);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--text);flex-shrink:0}
.nps-modal-abas{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
.nps-modal-aba{border:none;background:transparent;padding:8px 12px;border-radius:10px;font-size:12px;font-weight:700;color:var(--text-light);cursor:pointer;white-space:nowrap}
.nps-modal-aba.ativa{background:var(--navy);color:var(--white)}
.nps-modal-corpo{padding:16px 18px 28px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.nps-bloco{background:var(--white);border-radius:14px;padding:14px 14px 12px;margin-bottom:12px}
.nps-bloco h4{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.6px;margin:0 0 10px}
.nps-dist{display:flex;align-items:flex-end;gap:4px;height:110px}
.nps-dcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.nps-dbar{width:100%;border-radius:4px 4px 0 0;min-height:2px}
.nps-dn{font-size:10px;color:var(--text-light);height:14px}
.nps-dl{font-size:10px;font-weight:700;color:var(--text);margin-top:3px}
.nps-legenda-faixas{display:flex;gap:12px;font-size:10px;color:var(--text-light);margin-top:8px;flex-wrap:wrap}
.nps-legenda-faixas i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.nps-linha-mes{display:grid;grid-template-columns:70px 1fr 78px;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px solid var(--bg)}
.nps-linha-mes:last-child{border-bottom:none}
.nps-trilho{height:10px;background:var(--bg);border-radius:6px;position:relative;overflow:hidden}
.nps-trilho::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#B8C4D0}
.nps-preench{position:absolute;top:0;bottom:0;border-radius:6px}
.nps-val{font-weight:800;text-align:right}
.nps-quesito{margin-bottom:14px}
.nps-quesito:last-child{margin-bottom:0}
.nps-quesito-t{font-size:12px;font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.35}
.nps-pilha{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--bg)}
.nps-pilha span{display:block;height:100%}
.nps-quesito-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--text-light);margin-top:5px}
.nps-quesito-leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.nps-tabela{width:100%;border-collapse:collapse;font-size:12px}
.nps-tabela th{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-light);text-align:center;padding:4px 4px 8px;font-weight:700}
.nps-tabela th:first-child,.nps-tabela td:first-child{text-align:left}
.nps-tabela td{padding:8px 4px;border-top:1px solid var(--bg);text-align:center;vertical-align:middle}
.nps-tabela .nps-un{font-weight:600;color:var(--navy);line-height:1.3}
.nps-tabela .nps-un small{display:block;font-weight:400;color:var(--text-light);font-size:10px}
.nps-pilula{display:inline-block;min-width:34px;padding:2px 8px;border-radius:10px;font-weight:800;font-size:12px;color:#fff}
.nps-filtros-resp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.nps-chip-filtro{border:2px solid var(--border);background:var(--white);color:var(--text);font-size:11px;font-weight:700;padding:6px 12px;border-radius:16px;cursor:pointer}
.nps-chip-filtro.ativo{background:var(--navy);border-color:var(--navy);color:#fff}
.nps-resp{background:var(--white);border-radius:14px;padding:12px 14px;margin-bottom:10px;border-left:5px solid var(--border)}
.nps-resp.p{border-left-color:#2E7D32}.nps-resp.n{border-left-color:var(--amber)}.nps-resp.d{border-left-color:var(--red)}
.nps-resp-topo{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nps-resp-un{font-size:13px;font-weight:700;color:var(--navy);line-height:1.3}
.nps-resp-un small{display:block;font-size:11px;font-weight:400;color:var(--text-light)}
.nps-nota{min-width:36px;height:36px;border-radius:50%;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.nps-resp-txt{font-size:13px;line-height:1.55;margin-top:8px;color:var(--text);white-space:pre-wrap;word-break:break-word}
.nps-resp-sem{font-size:12px;color:var(--text-light);font-style:italic;margin-top:8px}
.nps-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.nps-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--text-light)}
.nps-tag.ruim{background:#FDEAEA;color:#9B2C2C}
.nps-tag.medio{background:#FFF3E0;color:#9A5B12}
.nps-vazio{text-align:center;color:var(--text-light);font-size:13px;padding:24px 8px;line-height:1.5}
.chip-nps{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;color:#fff}
.chip-nps.p{background:#2E7D32}.chip-nps.n{background:var(--amber)}.chip-nps.d{background:var(--red)}
.chip-nps.aguarda{background:var(--bg);color:var(--text-light)}
@media(min-width:640px){.nps-modal{align-items:center}.nps-folha{border-radius:20px;max-height:88vh}}
@media(prefers-reduced-motion:reduce){.nps-card,.nps-grid{transition:none}}

/* PERFORMANCE (r110) */
.pf-filtros{background:var(--white);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf-filtros select,.pf-filtros input{width:100%;border:2px solid var(--border);border-radius:10px;padding:9px 10px;font-size:12px;font-family:inherit;background:var(--white);color:var(--text);min-width:0}
.pf-filtros select:focus,.pf-filtros input:focus{outline:none;border-color:var(--navy)}
.pf-filtros .pf-full{grid-column:1/-1}
.pf-datas{grid-column:1/-1;display:none;grid-template-columns:1fr 1fr;gap:8px}
.pf-datas.aberto{display:grid}
.pf-btn-buscar{grid-column:1/-1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;background:var(--navy);color:var(--white);cursor:pointer;transition:background .2s}
.pf-btn-buscar.pendente{background:var(--green);color:var(--dark)}
.pf-btn-buscar:focus-visible,.pf-card:focus-visible,.pf-acao:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.pf-aviso-pendente{grid-column:1/-1;font-size:11px;color:#9A5B12;background:#FFF3E0;border-radius:8px;padding:6px 10px;display:none}
.pf-aviso-pendente.visivel{display:block}
.pf-resumo-linha{font-size:12px;color:var(--text-light);margin:0 2px 12px;line-height:1.5}
.pf-resumo-linha b{color:var(--navy)}
.pf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pf-card{background:var(--white);border:none;border-radius:16px;padding:14px 14px 12px;box-shadow:0 2px 12px rgba(0,0,0,.06);border-top:5px solid var(--border);text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}
button.pf-card{cursor:pointer;transition:transform .15s,box-shadow .15s}
button.pf-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,43,80,.14)}
.pf-card-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.pf-nome{font-size:14px;font-weight:700;color:var(--navy);line-height:1.3;word-break:break-word}
.pf-sub{font-size:11px;color:var(--text-light);line-height:1.4}
.pf-nota{text-align:right;flex-shrink:0}
.pf-nota b{display:block;font-size:28px;font-weight:800;line-height:1.05}
.pf-faixa{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:8px;color:#fff;margin-top:2px}
.pf-delta{font-size:11px;font-weight:700}
.pf-met{display:grid;grid-template-columns:96px 1fr 30px;align-items:center;gap:6px;font-size:10px;color:var(--text-light)}
.pf-trilho{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.pf-trilho i{display:block;height:100%;border-radius:4px}
.pf-met b{text-align:right;font-size:11px}
.pf-pilha{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--bg)}
.pf-pilha span{display:block;height:100%}
.pf-leg{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:10px;color:var(--text-light)}
.pf-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px}
.pf-destaque{font-size:11px;line-height:1.4;color:var(--text)}
.pf-destaque span{display:block}
.pf-topo-detalhe{background:var(--dark);color:var(--white);border-radius:16px;padding:16px;margin-bottom:12px}
.pf-topo-detalhe h3{font-size:17px;font-weight:700;margin:0 0 2px}
.pf-topo-detalhe .pf-sub{color:rgba(255,255,255,.65)}
.pf-voltar{border:none;background:transparent;color:var(--navy);font-size:12px;font-weight:700;cursor:pointer;padding:4px 2px;margin-bottom:8px}
.pf-acoes{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:14px}
.pf-acao{border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.pf-acao.txt{background:#E8EAF6;color:var(--navy)}
.pf-acao.pdf{background:var(--navy);color:var(--white)}
.pf-acao.ppt{background:var(--orange);color:var(--white)}
.pf-bloco{background:var(--white);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.pf-bloco h4{font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.7px;margin:0 0 10px;border-left:4px solid var(--green);padding-left:8px}
.pf-rolagem{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pf-tab{width:100%;border-collapse:collapse;font-size:12px;min-width:420px}
.pf-tab th{background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:8px 6px;text-align:center;line-height:1.3}
.pf-tab th:first-child{text-align:left;border-radius:8px 0 0 0}.pf-tab th:last-child{border-radius:0 8px 0 0}
.pf-tab td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--bg);font-weight:700}
.pf-tab td:first-child{text-align:left;font-weight:600;color:var(--navy)}
.pf-tab tr.pf-total td{background:var(--bg);font-weight:800}
.pf-nota-tab{font-size:10px;color:var(--text-light);margin-top:8px;line-height:1.5}
.pf-texto p{font-size:13px;line-height:1.7;margin:0 0 8px;color:var(--text)}
.pf-texto .pf-un{margin-bottom:10px}
.pf-texto .pf-un b{color:var(--navy)}
.pf-caixa{border-left:4px solid var(--border);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px}
.pf-caixa h5{font-size:11px;font-weight:800;margin:0 0 4px;letter-spacing:.5px}
.pf-caixa.ok{background:#E8F5E9;border-color:#2E7D32}.pf-caixa.ok h5{color:#2E7D32}
.pf-caixa.at{background:#FFF3E0;border-color:var(--orange)}.pf-caixa.at h5{color:var(--orange)}
.pf-caixa.su{background:#E3F2FD;border-color:var(--navy)}.pf-caixa.su h5{color:var(--navy)}
.pf-caixa p{font-size:13px;line-height:1.6;margin:0}
.pf-origem{font-size:11px;color:#9A5B12;background:#FFF3E0;border-radius:8px;padding:6px 10px;margin-bottom:10px}
.pf-vazio{text-align:center;color:var(--text-light);font-size:13px;padding:28px 12px;line-height:1.6;background:var(--white);border-radius:16px}
.pf-erro{background:#FDEAEA;color:#9B2C2C;font-size:12px;border-radius:10px;padding:12px 14px;line-height:1.5;margin-bottom:12px}
.pf-carregando{opacity:.45;pointer-events:none}
.pf-links{display:grid;gap:10px;margin-top:14px}
.pf-links a,.pf-links button{display:block;text-align:center;text-decoration:none;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}
@media(max-width:420px){.pf-grid{grid-template-columns:1fr}.pf-met{grid-template-columns:86px 1fr 28px}.aba-home{font-size:11px;padding:10px 4px;gap:4px}.aba-home .bi{display:none}}
@media(prefers-reduced-motion:reduce){button.pf-card{transition:none}}

@media(max-width:380px){.rating-btn{font-size:11px;height:32px}}
</style>
</head>

/* ═══════════════════════════════════════════════════════
   UTILITÁRIOS
   ═══════════════════════════════════════════════════════ */
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(msg, ms=2500) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

function showLoading(msg='Carregando...') {
  $('#loadingMsg').textContent = msg;
  $('#loading').style.display = 'flex';
}
function hideLoading() { $('#loading').style.display = 'none'; }

function getToken() {
  return new URLSearchParams(window.location.search).get('token') || sessionStorage.getItem('fc_token');
}

function scoreClass(v) {
  if (v <= 3) return 'score-low';
  if (v <= 5) return 'score-mid';
  if (v <= 7) return 'score-ok';
  return 'score-high';
}

function scoreColor(v) {
  if (v <= 3) return 'var(--red)';
  if (v <= 5) return 'var(--orange)';
  if (v <= 7) return 'var(--amber)';
  return 'var(--green)';
}

function calcMediaSecao(secao) {
  let criterios = secao.criterios || [];
  if (secao.subsecoes) criterios = secao.subsecoes.flatMap(s => s.criterios);
  const notas = criterios.map(c => state.respostas[c.id]).filter(v => v && v !== 'NA');
  if (!notas.length) return null;
  return (notas.reduce((a,b) => a+b, 0) / notas.length).toFixed(1);
}

function secaoPreenchida(secao) {
  let criterios = secao.criterios || [];
  if (secao.subsecoes) criterios = secao.subsecoes.flatMap(s => s.criterios);
  if (secao.tipo === 'identificacao') {
    const obrigatorios = ['tipo_avaliacao','cliente','unidade','data_auditoria'];
    return obrigatorios.every(c => state.identificacao[c]);
  }
  if (secao.tipo === 'finalizacao') return true;
  return criterios.length > 0 && criterios.every(c => state.respostas[c.id] !== undefined);
}

function subsecaoPreenchida(sub) {
  return sub.criterios.every(c => state.respostas[c.id] !== undefined);
}

/* ═══════════════════════════════════════════════════════
   API (comunicação com o backend)
   ═══════════════════════════════════════════════════════ */
async function apiCall(action, dados={}) {
  try {
    const params = new URLSearchParams(window.location.search);
    const cpf = params.get('cpf') || '';
    const token = params.get('token') || '';
    const payload = Object.assign({ action: action, cpf: cpf, token: token }, dados);
    const r = await fetch(API_URL, {
      method:'POST',
      body: JSON.stringify(payload)
    });
    const json = await r.json();
    if (json.error && !json.erro) json.erro = json.error;
    if (json.error && json.ok === undefined) json.ok = false;
    return json;
  } catch(e) {
    console.error('API error:', e);
    return { ok:false, erro: e.message };
  }
}

async function salvarRascunho(silencioso) {
  const dados = {
    id: state.auditoriaId,
    identificacao: state.identificacao,
    respostas: state.respostas,
    observacoes: state.observacoes,
    // r74: BUG CORRIGIDO — este payload não incluía fotosIds, então
    // cada "próxima seção" (que chama salvarRascunho) sobrescrevia no
    // banco o campo FotosIds com {} — apagando as fotos já salvas no
    // Drive de uma auditoria reeditada, mesmo sem o usuário mexer em
    // fotos e sem nunca chegar a clicar em "Finalizar" de novo. Esse
    // era o gatilho real do problema de fotos sumindo na apresentação.
    fotosIds: state.fotosIds || {},
    secaoAtual: state.secaoAtual,
    status: 'RASCUNHO'
  };
  // Backup local sempre
  localStorage.setItem('fc_aud_' + (state.auditoriaId || 'temp'), JSON.stringify(dados));
  // Salvar no servidor
  const r = await apiCall('salvarAuditoria', dados);
  if (!silencioso) {
    if (r.ok) toast('Progresso salvo');
    else toast('Salvo localmente (sem conexão)');
  }
}

/* ═══════════════════════════════════════════════════════
   RENDERIZAÇÃO — TELA INICIAL

async function renderTelaInicial(aba) {
  showLoading('Carregando...');
  // Buscar rascunhos do servidor
  let rascunhos = [];
  const r = await apiCall('listarRascunhosAuditoria', {});
  if (r.perfil) state.perfil = r.perfil;
  if (r.ok && r.rascunhos && r.rascunhos.length) {
    rascunhos = r.rascunhos.map(x => ({
      id: x.id,
      identificacao: { cliente: x.cliente, unidade: x.unidade, data_auditoria: x.dataAuditoria, tipo_avaliacao: x.tipoAvaliacao },
      secaoAtual: x.secaoAtual,
      status: 'RASCUNHO'
    }));
  } else {
    // Fallback: buscar do localStorage
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('fc_aud_')) {
        try {
          const d = JSON.parse(localStorage.getItem(k));
          if (d.status === 'RASCUNHO') rascunhos.push(d);
        } catch(e) {}
      }
    }
  }
  // Carregar lista de clientes
  const rc = await apiCall('listarClientesFC', {});
  if (rc.ok) {
    state.clientes = rc.clientes || [];
    state.unidades = {};
    const det = rc.detalhes || {};
    for (const c in det) { state.unidades[c] = det[c].unidades || []; state.emailsCliente = state.emailsCliente || {}; for (const u in det[c].emails) state.emailsCliente[c+'|'+u] = det[c].emails[u]; }
  }
  state.rascunhos = rascunhos;
  hideLoading();

  // r109: tela inicial em duas abas (Preenchimento | Histórico) e, para o
  // Diretor, o painel de satisfação (NPS) fixo no topo, visível nas duas abas.
  state.abaHome = aba || state.abaHome || 'preench';
  const ehDiretor = state.perfil === 'DIRETOR';

  $('#app').innerHTML = `
    <div class="tela-inicial tela-home">
      <div class="card-inicio" style="text-align:center;padding:28px 24px">
        <h2 style="font-size:20px">Análise de Preparação para Inventário</h2>
        <p style="margin-bottom:0">Avaliação das condições do ambiente para a operação de inventário</p>
      </div>
      ${ehDiretor ? htmlPainelNps() : ''}
      <div class="abas-home" role="tablist">
        <button type="button" id="abaBtn-preench" class="aba-home" role="tab" onclick="mostrarAbaHome('preench')"><i class="bi bi-pencil-square"></i> Preenchimento</button>
        <button type="button" id="abaBtn-hist" class="aba-home" role="tab" onclick="mostrarAbaHome('hist')"><i class="bi bi-clock-history"></i> Histórico</button>
        ${ehDiretor ? '<button type="button" id="abaBtn-perf" class="aba-home" role="tab" onclick="mostrarAbaHome(\'perf\')"><i class="bi bi-graph-up-arrow"></i> Performance</button>' : ''}
      </div>
      <div id="abaConteudo"></div>
    </div>`;
  mostrarAbaHome(state.abaHome);
  if (ehDiretor) npsCarregarCards();
}

// Aba "Preenchimento": os mesmos cards que já existiam (Nova Avaliação + rascunhos).
function htmlAbaPreenchimento() {
  const rascunhos = state.rascunhos || [];
  let rascunhosHtml = '';

      <div class="card-inicio">

function mostrarAbaHome(aba) {
  if (aba === 'perf' && state.perfil !== 'DIRETOR') aba = 'preench';   // r110: Performance é só do Diretor
  state.abaHome = aba;
  ['preench', 'hist', 'perf'].forEach(a => {

  });

  if (!c) return;
  if (aba === 'hist') carregarHistoricoAba();
  else if (aba === 'perf') carregarPerformanceAba();
  else c.innerHTML = htmlAbaPreenchimento();

function novaAvaliacao() {
  state.auditoriaId = 'aud_' + Date.now();
  state.respostas = {};
  state.observacoes = {};
  state.fotos = {};
  state.identificacao = {};
  state.secaoAtual = 0;
  state.status = 'RASCUNHO';
  renderFormulario();
}

async function carregarRascunho(idx) {
  showLoading('Carregando avaliação...');
  const rascunho = state.rascunhos[idx];
  state.auditoriaId = rascunho.id;

  // Tentar carregar do servidor (dados completos)
  const r = await apiCall('carregarAuditoria', { id: rascunho.id });
  if (r.ok && r.auditoria) {
    state.respostas = r.auditoria.respostas || {};
    state.observacoes = r.auditoria.observacoes || {};
    state.fotos = {};
    state.identificacao = r.auditoria.identificacao || {};
    state.secaoAtual = r.auditoria.secaoAtual || 0;
  } else {
    // Fallback: dados do localStorage
    const local = localStorage.getItem('fc_aud_' + rascunho.id);
    if (local) {
      const d = JSON.parse(local);
      state.respostas = d.respostas || {};
      state.observacoes = d.observacoes || {};
      state.fotos = d.fotos || {};
      state.identificacao = d.identificacao || {};
      state.secaoAtual = d.secaoAtual || 0;
    } else {
      state.respostas = {};
      state.observacoes = {};
      state.fotos = {};
      state.identificacao = rascunho.identificacao || {};
      state.secaoAtual = 0;
    }
  }
  state.status = 'RASCUNHO';
  hideLoading();
  renderFormulario();
}


/* ═══════════════════════════════════════════════════════
   RENDERIZAÇÃO — FORMULÁRIO
   ═══════════════════════════════════════════════════════ */
function renderFormulario() {
  const secao = SECOES[state.secaoAtual];

  // Stepper
  const stepperHtml = SECOES.map((s,i) => {
    let cls = '';
    if (i === state.secaoAtual) cls = 'active';
    else if (secaoPreenchida(s)) cls = 'done';
    const icon = cls === 'done' ? '<i class="bi bi-check-lg"></i>' : (i+1);
    return `<span class="step-dot ${cls}" onclick="irParaSecao(${i})">${icon} <span class="d-none d-sm-inline">${s.titulo}</span></span>`;
  }).join('');

  // Conteúdo da seção
  let conteudo = '';
  if (secao.tipo === 'identificacao') {
    conteudo = renderIdentificacao(secao);
  } else if (secao.tipo === 'finalizacao') {
    conteudo = renderFinalizacao(secao);
  } else {
    conteudo = renderSecaoAvaliacao(secao);
  }

  // Navegação
  const prevBtn = state.secaoAtual > 0
    ? `<button class="btn-fc btn-fc-outline" onclick="secaoAnterior()"><i class="bi bi-chevron-left"></i> Anterior</button>` : '';
  const nextLabel = state.secaoAtual < SECOES.length - 1 ? 'Próxima <i class="bi bi-chevron-right"></i>' : '';
  const nextBtn = state.secaoAtual < SECOES.length - 1
    ? `<button class="btn-fc btn-fc-navy" onclick="proximaSecao()">${nextLabel}</button>` : '';

  const progresso = `${state.secaoAtual + 1} de ${SECOES.length}`;

  $('#app').innerHTML = `
    <div class="stepper-bar">${stepperHtml}</div>
    <div class="form-container body-pad">${conteudo}</div>
    <div class="progress-info">Seção ${progresso}</div>
    <div class="nav-bottom">${prevBtn}${nextBtn}</div>`;

  // Scroll stepper para a posição ativa
  setTimeout(() => {
    const active = document.querySelector('.step-dot.active');
    if (active) active.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  }, 100);
}

function setIdent(campo, valor) {
  state.identificacao[campo] = valor;
  // Auto-fill data se não preenchida
  if (campo === 'tipo_avaliacao' && !state.identificacao.data_auditoria) {
    state.identificacao.data_auditoria = new Date().toISOString().slice(0,10);
  }
}

/* ── SEÇÃO DE AVALIAÇÃO (critérios, subsecões, fotos, obs) ── */
function renderSecaoAvaliacao(secao) {
  let html = `<div class="secao-card">
    <div class="secao-titulo"><i class="bi ${secao.icone}"></i> ${secao.titulo}</div>
    <div class="secao-subtitulo">${secao.estrutura} → ${secao.departamento || ''}</div>`;

  // Critérios diretos
  if (secao.criterios) {
    html += secao.criterios.map(c => renderCriterio(c)).join('');
  }

  // Subseções (accordion)
  if (secao.subsecoes) {
    html += secao.subsecoes.map(sub => {
      const preenchido = subsecaoPreenchida(sub);
      const aberta = !preenchido;
      return `
        <div class="subsecao ${aberta?'aberta':''}" id="sub_${sub.id}">
          <div class="subsecao-header" onclick="toggleSubsecao('sub_${sub.id}')">
            <span class="sh-titulo">${sub.titulo}</span>
            <span class="sh-badge ${preenchido?'preenchido':'pendente'}">
              ${preenchido ? '<i class="bi bi-check-lg"></i> OK' : 'Pendente'}
            </span>
          </div>
          <div class="subsecao-body">
            ${sub.criterios.map(c => renderCriterio(c)).join('')}
          </div>
        </div>`;
    }).join('');
  }

  // Score parcial
  const media = calcMediaSecao(secao);
  if (media) {
    html += `<div class="score-preview">
      <span class="sp-valor" style="color:${scoreColor(parseFloat(media))}">${media}</span>
      <span class="sp-label">Score parcial desta seção</span>
    </div>`;
  }

  html += '</div>';

  // Observação
  if (secao.observacao) {
    html += `<div class="secao-card">
      <div class="campo-obs">
        <label>${secao.observacao.label}</label>
        <textarea placeholder="Registre suas observações..."
          oninput="setObs('${secao.observacao.id}',this.value)">${state.observacoes[secao.observacao.id]||''}</textarea>
      </div>
    </div>`;
  }

  // Fotos
  if (secao.fotos) {
    html += renderFotos(secao);
  }

  return html;
}

/* ── CRITÉRIO INDIVIDUAL ── */
function renderCriterio(crit) {
  const val = state.respostas[crit.id];
  const tipo = crit.tipo || 'escala';

  let hints = '';
  if (tipo === 'escala_sku') hints = '<div class="escala-hints"><span>Até 10%</span><span>Acima de 90%</span></div>';
  else if (tipo === 'escala_volume') hints = '<div class="escala-hints"><span>1 · Volume excessivo</span><span>10 · Volume ideal</span></div>';

  let botoes = '';
  for (let i = 1; i <= 10; i++) {
    const sel = val === i;
    botoes += `<button class="rating-btn ${sel ? 'selected ' + scoreClass(i) : ''}"
      onclick="setNota('${crit.id}',${i})">${i}</button>`;
  }
  const naSel = val === 'NA';
  botoes += `<button class="rating-btn na-btn ${naSel ? 'selected' : ''}"
    onclick="setNota('${crit.id}','NA')">N/A</button>`;

  return `
    <div class="criterio" id="crit_${crit.id}">
      <div class="criterio-label">${crit.label}</div>
      ${hints}
      <div class="rating-row">${botoes}</div>
    </div>`;
}

function setNota(criterioId, valor) {
  state.respostas[criterioId] = valor;
  // Re-render apenas o critério afetado e o score
  const secao = SECOES[state.secaoAtual];
  // Atualizar botões do critério
  const container = document.getElementById('crit_' + criterioId);
  if (container) {
    container.querySelectorAll('.rating-btn').forEach(btn => {
      btn.classList.remove('selected','score-low','score-mid','score-ok','score-high');
      const btnVal = btn.classList.contains('na-btn') ? 'NA' : parseInt(btn.textContent);
      if (btnVal === valor) {
        btn.classList.add('selected');
        if (typeof valor === 'number') btn.classList.add(scoreClass(valor));
      }
    });
  }
  // Atualizar badges de subseção
  if (secao.subsecoes) {
    secao.subsecoes.forEach(sub => {
      const el = document.getElementById('sub_' + sub.id);
      if (el) {
        const badge = el.querySelector('.sh-badge');
        if (subsecaoPreenchida(sub)) {
          badge.className = 'sh-badge preenchido';
          badge.innerHTML = '<i class="bi bi-check-lg"></i> OK';
        }
      }
    });
  }
  // Atualizar score preview
  const media = calcMediaSecao(secao);
  const sp = document.querySelector('.score-preview');
  if (sp && media) {
    sp.querySelector('.sp-valor').textContent = media;
    sp.querySelector('.sp-valor').style.color = scoreColor(parseFloat(media));
  }
  // Atualizar stepper dot
  updateStepper();
}

function setObs(obsId, valor) {
  state.observacoes[obsId] = valor;
}

function toggleSubsecao(id) {
  const el = document.getElementById(id);
  if (el) el.classList.toggle('aberta');
}


/* ── FOTOS ── */
function renderFotos(secao) {
  const fotos = state.fotos[secao.id] || [];
  const fotosIds = state.fotosIds ? (state.fotosIds[secao.id] || []) : [];
  let slots = '';
  // Fotos já capturadas (base64 local)
  fotos.forEach((foto, i) => {
    slots += `
      <div class="foto-slot">
        <img src="${foto.base64}" alt="Foto ${i+1}">
        <button class="foto-remove" onclick="removerFoto('${secao.id}',${i})"><i class="bi bi-x"></i></button>
      </div>`;
  });
  // Fotos já salvas no Drive (ao editar auditoria concluída)
  fotosIds.forEach((fid, i) => {
    slots += `
      <div class="foto-slot">
        <img src="https://lh3.googleusercontent.com/d/${fid}" alt="Foto salva ${i+1}">
        <button class="foto-remove" onclick="removerFotoSalva('${secao.id}',${i})"><i class="bi bi-x"></i></button>
      </div>`;
  });
  // Botão "+" para adicionar mais fotos
  slots += `
    <div class="foto-slot" onclick="capturarFoto('${secao.id}','camera')" style="cursor:pointer">
      <i class="bi bi-camera" style="font-size:18px"></i>
      <span>Câmera</span>
    </div>
    <div class="foto-slot" onclick="capturarFoto('${secao.id}','galeria')" style="cursor:pointer">
      <i class="bi bi-image" style="font-size:18px"></i>
      <span>Galeria</span>
    </div>`;
  return `
    <div class="secao-card">
      <div class="fotos-section">
        <label><i class="bi bi-camera"></i> ${secao.fotos.label}</label>
        <div class="fotos-grid">${slots}</div>
      </div>
    </div>`;
}

function removerFotoSalva(secaoId, idx) {
  if (!state.fotosIds || !state.fotosIds[secaoId]) return;
  state.fotosIds[secaoId].splice(idx, 1);
  renderFormulario();
}

let fotoTargetSecao = null;
function capturarFoto(secaoId, modo) {
  fotoTargetSecao = secaoId;
  document.getElementById(modo === 'galeria' ? 'galeriaInput' : 'cameraInput').click();
}

function processarFotoFile(file) {
  if (!file || !fotoTargetSecao) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const maxDim = 1200;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = h * maxDim / w; w = maxDim; }
        else { w = w * maxDim / h; h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL('image/jpeg', 0.7);
      if (!state.fotos[fotoTargetSecao]) state.fotos[fotoTargetSecao] = [];
      state.fotos[fotoTargetSecao].push({ base64: compressed, legenda: '' });
      renderFormulario();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('cameraInput').addEventListener('change', function(e) {
    processarFotoFile(e.target.files[0]); e.target.value = '';
  });
  document.getElementById('galeriaInput').addEventListener('change', function(e) {
    Array.from(e.target.files).forEach(f => processarFotoFile(f)); e.target.value = '';
  });
});

function removerFoto(secaoId, idx) {
  if (state.fotos[secaoId]) {
    state.fotos[secaoId].splice(idx, 1);
    renderFormulario();
  }
}

/* ── FINALIZAÇÃO ── */
function renderFinalizacao(secao) {
  // Verificar seções pendentes
  const pendentes = SECOES.filter((s,i) => i < SECOES.length-1 && !secaoPreenchida(s));

  // Calcular scores
  const secoesPontuadas = SECOES.filter(s => s.criterios || s.subsecoes);
  let todasNotas = [];
  let notasEquipe = [];
  secoesPontuadas.forEach(s => {
    let criterios = s.criterios || [];
    if (s.subsecoes) criterios = s.subsecoes.flatMap(sub => sub.criterios);
    criterios.forEach(c => {
      const v = state.respostas[c.id];
      if (v && v !== 'NA') {
        todasNotas.push(v);
        if (c.id.includes('eq_') || c.id.includes('_eq_') || c.id.includes('_pes_') || c.id.includes('pesagem')) {
          notasEquipe.push(v);
        }
      }
    });
  });

  const scoreGeral = todasNotas.length ? (todasNotas.reduce((a,b)=>a+b,0)/todasNotas.length).toFixed(1) : '—';
  const scoreEquipe = notasEquipe.length ? (notasEquipe.reduce((a,b)=>a+b,0)/notasEquipe.length).toFixed(1) : '—';

  // Scores por seção
  const scoresSecoes = secoesPontuadas.map(s => ({
    titulo: s.titulo,
    media: calcMediaSecao(s)
  })).filter(s => s.media);

  let html = '';

  // Observação da área de vendas
  if (secao.observacao) {
    html += `<div class="secao-card">
      <div class="campo-obs">
        <label>${secao.observacao.label}</label>
        <textarea placeholder="Registre suas observações..."
          oninput="setObs('${secao.observacao.id}',this.value)">${state.observacoes[secao.observacao.id]||''}</textarea>
      </div>
    </div>`;
  }

  // Fotos (r85: Finalização passou a ter slot de fotos como as demais telas)
  if (secao.fotos) {
    html += renderFotos(secao);
  }

  // Resumo de scores
  html += `
    <div class="secao-card" style="text-align:center">
      <div class="secao-titulo" style="justify-content:center"><i class="bi ${secao.icone}"></i> Resumo da Avaliação</div>
      <div style="margin:20px 0">
        <div style="font-size:48px;font-weight:700;color:${todasNotas.length ? scoreColor(parseFloat(scoreGeral)) : 'var(--text-light)'}">${scoreGeral}</div>
        <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;letter-spacing:1px">Score Geral</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
        ${scoresSecoes.map(s => `
          <div style="background:var(--bg);padding:12px;border-radius:10px">
            <div style="font-size:20px;font-weight:700;color:${scoreColor(parseFloat(s.media))}">${s.media}</div>
            <div style="font-size:10px;color:var(--text-light)">${s.titulo}</div>
          </div>
        `).join('')}
        <div style="background:var(--bg);padding:12px;border-radius:10px;border:2px solid var(--orange)">
          <div style="font-size:20px;font-weight:700;color:var(--orange)">${scoreEquipe}</div>
          <div style="font-size:10px;color:var(--text-light)">Equipe de Apoio</div>
        </div>
      </div>
    </div>`;

  // Pendências
  if (pendentes.length) {
    html += `
      <div class="secao-card" style="border-left:4px solid var(--orange)">
        <div style="font-size:13px;font-weight:600;color:var(--orange);margin-bottom:8px">
          <i class="bi bi-exclamation-triangle"></i> Seções pendentes
        </div>
        ${pendentes.map(p => `
          <div style="font-size:13px;color:var(--text);padding:4px 0">
            • ${p.titulo}
          </div>
        `).join('')}
        <div style="font-size:11px;color:var(--text-light);margin-top:8px">
          Seções com N/A são consideradas preenchidas. Você pode finalizar mesmo com seções pendentes (critérios não avaliados serão ignorados no relatório).
        </div>
      </div>`;
  }

  // Botão finalizar
  html += `
    <div class="secao-card" style="text-align:center">
      <button class="btn-fc btn-fc-green" onclick="finalizarAvaliacao()" style="font-size:16px;padding:16px 32px">
        <i class="bi bi-check-circle"></i> Finalizar Avaliação
      </button>
      <div style="font-size:11px;color:var(--text-light);margin-top:10px">
        Ao finalizar, o relatório será gerado automaticamente.
      </div>
    </div>`;

  return html;
}

function irParaSecao(idx) {

    window.scrollTo({top:0, behavior:'smooth'});

}

  document.querySelectorAll('.step-dot').forEach((dot, i) => {

/* ═══════════════════════════════════════════════════════
   FINALIZAR
   ═══════════════════════════════════════════════════════ */
async function finalizarAvaliacao() {
  // Validar identificação mínima
  if (!state.identificacao.tipo_avaliacao || !state.identificacao.cliente || !state.identificacao.unidade) {
    toast('Preencha a Identificação (tipo, cliente e unidade)');
    return;
  }

  if (!confirm('Confirma a finalização desta avaliação?\n\nO relatório será gerado automaticamente.')) return;

  state.status = 'CONCLUIDO';

  // 1. Enviar fotos separadamente (evita estouro de payload)
  // r74: BUG CORRIGIDO — ao editar uma auditoria já finalizada e
  // finalizar de novo sem mexer nas fotos, "fotosIds" começava vazio
  // aqui e sobrescrevia no banco as fotos que já estavam salvas no
  // Drive de uma finalização anterior (state.fotosIds, carregado em
  // editarAuditoria). Resultado: a apresentação "perdia" as fotos toda
  // vez que a auditoria era reeditada. Agora partimos do que já existe
  // (state.fotosIds) e só acrescentamos as fotos novas desta sessão.
  let fotosIds = Object.assign({}, state.fotosIds || {});
  const temFotos = state.fotos && Object.keys(state.fotos).length > 0;
  if (temFotos) {
    showLoading('Enviando fotos...');
    for (const secaoId of Object.keys(state.fotos)) {
      const fotosSecao = state.fotos[secaoId];
      if (!fotosSecao || !fotosSecao.length) continue;
      const rf = await apiCall('uploadFotosAuditoria', {
        fotos: fotosSecao,
        secaoId: secaoId,
        cliente: state.identificacao.cliente,
        unidade: state.identificacao.unidade,
        data: state.identificacao.data_auditoria
      });
      if (rf.ok && rf.fotosIds) {
        fotosIds[secaoId] = (fotosIds[secaoId] || []).concat(rf.fotosIds);
      }
    }
  }

  // 2. Finalizar auditoria (sem fotos base64 no payload, só IDs)
  showLoading('Finalizando avaliação...');
  const dados = {
    id: state.auditoriaId,
    identificacao: state.identificacao,
    respostas: state.respostas,
    observacoes: state.observacoes,
    fotosIds: fotosIds,
    status: 'CONCLUIDO',
    versao: VERSAO
  };

  // Backup local (sem fotos base64 pra não estourar localStorage)
  const dadosLocal = Object.assign({}, dados);
  try { localStorage.setItem('fc_aud_' + state.auditoriaId, JSON.stringify(dadosLocal)); } catch(e) {}

  const r = await apiCall('finalizarAuditoria', dados);
  if (r.ok) {
    try { localStorage.removeItem('fc_aud_' + state.auditoriaId); } catch(e) {}
  }

  hideLoading();

  // Sucesso — relatório será gerado sob demanda pelo histórico
  $('#app').innerHTML = `
    <div class="tela-inicial">
      <div class="secao-card" style="text-align:center;padding:40px 28px">
        <div style="font-size:56px;margin-bottom:16px">✅</div>
        <h2 style="font-size:20px;color:var(--navy);margin-bottom:8px">Avaliação Finalizada</h2>
        <p style="color:var(--text-light);margin-bottom:16px">
          ${state.identificacao.cliente} — ${state.identificacao.unidade}<br>${state.identificacao.data_auditoria}
        </p>
        <p style="font-size:13px;color:var(--text);margin-bottom:24px">
          A avaliação foi salva com sucesso. O relatório pode ser gerado a qualquer momento pelo <strong>Histórico</strong>.
        </p>
        <button class="btn-fc btn-fc-navy" onclick="renderTelaInicial()" style="margin-bottom:10px">
          <i class="bi bi-arrow-left"></i> Voltar ao Início
        </button>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   PAINEL DE SATISFAÇÃO (NPS) — r109 — somente Diretor
   Cards fixos no topo da tela inicial + detalhe em folha
   sobreposta. Filtros: cliente, unidade e período (data da
   análise). Os cards atualizam sozinhos; o detalhe só abre
   quando o usuário clica.
   ═══════════════════════════════════════════════════════ */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const NPS_PERIODOS = [
  { v: 'mes',    t: 'Este mês' },
  { v: '30',     t: 'Últimos 30 dias' },
  { v: '90',     t: 'Últimos 90 dias' },
  { v: 'ano',    t: 'Este ano' },
  { v: 'tudo',   t: 'Todo o período' },
  { v: 'custom', t: 'Personalizado' }
];

const NPS_QUESITOS_TXT = {
  apresentacao: 'Apresentação e identificação (uniforme e apresentação pessoal)',
  postura:      'Postura e respeito às regras da loja',
  supervisor:   'Atitude e comunicação do supervisor',
  mapeamento:   'Organização e assertividade no mapeamento dos endereços',
  horario:      'Cumprimento do horário'
};
const NPS_QUESITOS_ORDEM = ['apresentacao', 'postura', 'supervisor', 'mapeamento', 'horario'];
const NPS_COR_OPCAO = {
  'Excelente': '#2E7D32', 'Bom': '#61CF00', 'Satisfatório': '#D4A017', 'Regular': '#D4A017', 'Ruim': '#E05252',
  'Inadequado': '#E05252', 'No prazo': '#2E7D32', 'Com pequeno atraso': '#D4A017', 'Com grande atraso': '#E05252'
};
const NPS_OPCAO_RUIM = ['Inadequado', 'Ruim', 'Com grande atraso'];
const NPS_OPCAO_MEDIA = ['Regular', 'Com pequeno atraso'];

function npsFiltroInicial() { return { cliente: '', unidade: '', periodo: '90', de: '', ate: '' }; }

function npsIsoLocal(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

// Período -> {de, ate} (yyyy-MM-dd). Presets só têm limite inferior; "Personalizado" usa os dois.
function npsIntervalo(f) {
  const hoje = new Date();
  if (f.periodo === 'tudo') return { de: '', ate: '' };
  if (f.periodo === 'mes') return { de: npsIsoLocal(new Date(hoje.getFullYear(), hoje.getMonth(), 1)), ate: '' };
  if (f.periodo === 'ano') return { de: hoje.getFullYear() + '-01-01', ate: '' };
  if (f.periodo === '30' || f.periodo === '90') {
    const d = new Date(hoje);
    d.setDate(d.getDate() - parseInt(f.periodo, 10));
    return { de: npsIsoLocal(d), ate: '' };
  }
  return { de: f.de || '', ate: f.ate || '' };
}

function npsZona(n) {
  if (n === null || n === undefined) return { t: 'Sem respostas no período', c: '#8899AA' };
  if (n >= 75) return { t: 'Zona de excelência', c: '#61CF00' };
  if (n >= 50) return { t: 'Zona de qualidade', c: '#61CF00' };
  if (n >= 1)  return { t: 'Zona de aperfeiçoamento', c: '#F2C14E' };
  return { t: 'Zona crítica', c: '#FF7A7A' };
}
function npsCorValor(n) {
  if (n === null || n === undefined) return '#8899AA';
  if (n >= 50) return '#2E7D32';
  if (n >= 1) return '#D4A017';
  return '#E05252';
}
function npsCorNota(n) { return n >= 9 ? '#2E7D32' : (n >= 7 ? '#D4A017' : '#E05252'); }

      </div>
      <div class="nps-filtros">
        <select id="npsCliente" aria-label="Cliente" onchange="npsMudouCliente(this.value)">${optsCli}</select>
        <select id="npsUnidade" aria-label="Unidade" onchange="npsMudouUnidade(this.value)">${npsOpcoesUnidade()}</select>
        <select id="npsPeriodo" aria-label="Período (data da análise)" onchange="npsMudouPeriodo(this.value)" style="grid-column:1/-1">${optsPer}</select>
        <div class="nps-datas${f.periodo === 'custom' ? ' aberto' : ''}" id="npsDatas">
          <input type="date" id="npsDe" aria-label="Data inicial" value="${esc(f.de)}" onchange="npsMudouDatas()">
          <input type="date" id="npsAte" aria-label="Data final" value="${esc(f.ate)}" onchange="npsMudouDatas()">
        </div>
      </div>
      <div class="nps-grid carregando" id="npsCards">${htmlCardsNps(null)}</div>
    </div>`;
}

function npsOpcoesUnidade() {
  const f = state.npsFiltro || npsFiltroInicial();
  const unids = f.cliente ? ((state.unidades || {})[f.cliente] || []) : [];
  return '<option value="">Todas as unidades</option>' +
    unids.map(u => `<option value="${esc(u)}"${u === f.unidade ? ' selected' : ''}>${esc(u)}</option>`).join('');
}

function npsMudouCliente(v) {
  state.npsFiltro.cliente = v;
  state.npsFiltro.unidade = '';   // a unidade escolhida antes não vale mais para o novo cliente
  const sel = $('#npsUnidade');
  if (sel) sel.innerHTML = npsOpcoesUnidade();
  npsCarregarCards();
}
function npsMudouUnidade(v) { state.npsFiltro.unidade = v; npsCarregarCards(); }
function npsMudouPeriodo(v) {
  state.npsFiltro.periodo = v;
  const d = $('#npsDatas');
  if (d) d.classList.toggle('aberto', v === 'custom');
  if (v !== 'custom') npsCarregarCards();
  else if (state.npsFiltro.de || state.npsFiltro.ate) npsCarregarCards();
}
function npsMudouDatas() {
  state.npsFiltro.de = ($('#npsDe') || {}).value || '';
  state.npsFiltro.ate = ($('#npsAte') || {}).value || '';
  npsCarregarCards();
}

function npsRotuloFiltro() {
  const f = state.npsFiltro || npsFiltroInicial();
  const per = NPS_PERIODOS.find(p => p.v === f.periodo);
  let per_t = per ? per.t : '';
  if (f.periodo === 'custom') {
    const br = s => s ? s.split('-').reverse().join('/') : '…';
    per_t = br(f.de) + ' a ' + br(f.ate);
  }
  return (f.cliente || 'Todos os clientes') + ' · ' + (f.unidade || 'Todas as unidades') + ' · ' + per_t;
}

async function npsCarregarCards() {
  const box = $('#npsCards');
  if (!box) return;
  const f = state.npsFiltro;
  const iv = npsIntervalo(f);
  const req = state.npsReq = (state.npsReq || 0) + 1;
  box.classList.add('carregando');
  const r = await apiCall('npsAnalise', { cliente: f.cliente, unidade: f.unidade, de: iv.de, ate: iv.ate });
  const boxAtual = $('#npsCards');
  if (req !== state.npsReq || !boxAtual) return;   // resposta antiga ou tela já trocada
  boxAtual.classList.remove('carregando');
  if (!r.ok) {
    state.npsDados = null;
    const naoPublicado = /nao reconhecida|não reconhecida/i.test(String(r.erro || ''));
    boxAtual.style.display = 'block';
    boxAtual.innerHTML = '<div class="nps-erro">' + (naoPublicado
      ? 'O script do servidor ainda não tem o módulo NPS. Publique a nova versão no Apps Script (Implantar → Gerenciar implantações → Nova versão).'
      : 'Não foi possível carregar o NPS: ' + esc(r.erro || 'falha de conexão')) + '</div>';
    return;
  }
  boxAtual.style.display = '';
  state.npsDados = r;
  boxAtual.innerHTML = htmlCardsNps(r);
}

function htmlCardsNps(r) {
  const s = r ? r.resumo : null;
  const zona = npsZona(s ? s.nps : null);
  const pct = v => (v === null || v === undefined) ? '—' : v + '%';
  const nps = s && s.nps !== null ? s.nps : '—';
  const resp = s ? s.respondidas : '—';
  const env = s ? s.enviados : '—';
  const taxa = s && s.taxaResposta !== null ? s.taxaResposta + '% de retorno' : (s ? 'nenhuma pesquisa enviada' : 'carregando…');
  return `
      <button type="button" class="nps-card nps-principal" onclick="npsAbrirDetalhe('resumo')">
        <span class="nps-rot">NPS</span>
        <span class="nps-num" style="color:${zona.c}">${nps}</span>
        <span class="nps-sub">${zona.t}</span>
      </button>
      <button type="button" class="nps-card nps-larga" onclick="npsAbrirDetalhe('respostas','todas')">
        <span class="nps-rot">Respostas</span>
        <span class="nps-num-s">${resp}<small> de ${env} enviadas</small></span>
        <span class="nps-sub">${taxa}</span>
      </button>
      <button type="button" class="nps-card nps-p" onclick="npsAbrirDetalhe('respostas','Promotor')">
        <span class="nps-rot">Promotores</span>
        <span class="nps-num-s">${s ? pct(s.pctPromotores) : '—'}</span>
        <span class="nps-sub">notas 9–10${s ? ' · ' + s.promotores : ''}</span>
      </button>
      <button type="button" class="nps-card nps-n" onclick="npsAbrirDetalhe('respostas','Neutro')">
        <span class="nps-rot">Neutros</span>
        <span class="nps-num-s">${s ? pct(s.pctNeutros) : '—'}</span>
        <span class="nps-sub">notas 7–8${s ? ' · ' + s.neutros : ''}</span>
      </button>
      <button type="button" class="nps-card nps-d" onclick="npsAbrirDetalhe('respostas','Detrator')">
        <span class="nps-rot">Detratores</span>
        <span class="nps-num-s">${s ? pct(s.pctDetratores) : '—'}</span>
        <span class="nps-sub">notas 0–6${s ? ' · ' + s.detratores : ''}</span>
      </button>`;
}

/* ── DETALHE (folha sobreposta) ── */
function npsAbrirDetalhe(aba, cat) {
  if (!state.npsDados) { toast('Aguarde o carregamento do NPS'); return; }
  state.npsModal = { aba: aba || 'resumo', cat: cat || 'todas', soComentario: false };
  let m = document.getElementById('npsModal');
  if (!m) {
    m = document.createElement('div');
    m.id = 'npsModal';
    m.className = 'nps-modal';
    m.setAttribute('role', 'dialog');
    m.setAttribute('aria-modal', 'true');
    m.addEventListener('click', e => { if (e.target === m) npsFecharDetalhe(); });
    document.body.appendChild(m);
  }
  document.body.style.overflow = 'hidden';
  npsRenderModal();
}

function npsFecharDetalhe() {
  const m = document.getElementById('npsModal');
  if (m) m.remove();
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') npsFecharDetalhe(); });

function npsTrocarAba(aba) { state.npsModal.aba = aba; npsRenderModal(); }
function npsTrocarCat(cat) { state.npsModal.cat = cat; npsRenderModal(); }
function npsToggleComentario() { state.npsModal.soComentario = !state.npsModal.soComentario; npsRenderModal(); }

function npsRenderModal() {
  const m = document.getElementById('npsModal');
  const r = state.npsDados;
  if (!m || !r) return;
  const st = state.npsModal;
  const abas = [['resumo', 'Resumo'], ['quesitos', 'Quesitos'], ['unidades', 'Por unidade'], ['respostas', 'Respostas']];
  let corpo = '';
  if (st.aba === 'resumo') corpo = npsHtmlResumo(r);
  else if (st.aba === 'quesitos') corpo = npsHtmlQuesitos(r);
  else if (st.aba === 'unidades') corpo = npsHtmlUnidades(r);
  else corpo = npsHtmlRespostas(r, st);
  m.innerHTML = `
    <div class="nps-folha">
      <div class="nps-modal-topo">
        <div class="nps-modal-linha">
          <div>
            <div class="nps-modal-titulo">Satisfação do cliente (NPS)</div>
            <div class="nps-modal-ctx">${esc(npsRotuloFiltro())}<br>Período pela data da análise</div>
          </div>
          <button type="button" class="nps-modal-x" onclick="npsFecharDetalhe()" aria-label="Fechar">✕</button>
        </div>
        <div class="nps-modal-abas" role="tablist">
          ${abas.map(a => `<button type="button" role="tab" class="nps-modal-aba${st.aba === a[0] ? ' ativa' : ''}" onclick="npsTrocarAba('${a[0]}')">${a[1]}</button>`).join('')}
        </div>
      </div>
      <div class="nps-modal-corpo">${corpo}</div>
    </div>`;
  const corpoEl = m.querySelector('.nps-modal-corpo');
  if (corpoEl) corpoEl.scrollTop = 0;
}

function npsMesRotulo(ym) {
  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  const p = String(ym).split('-');
  if (p.length < 2) return 'sem data';
  return meses[parseInt(p[1], 10) - 1] + '/' + p[0];
}
function npsDataBR(iso) {
  const p = String(iso || '').substring(0, 10).split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : '—';
}

function npsHtmlResumo(r) {
  const s = r.resumo;
  if (!s.respondidas) {
    return `<div class="nps-vazio">Nenhuma resposta neste filtro.<br>${s.enviados ? s.enviados + ' pesquisa(s) enviada(s) aguardando resposta.' : 'Nenhuma pesquisa foi enviada neste filtro.'}</div>`;
  }
  const max = Math.max.apply(null, r.distribuicao.concat([1]));
  const dist = r.distribuicao.map((n, i) => `
    <div class="nps-dcol">
      <div class="nps-dn">${n || ''}</div>
      <div class="nps-dbar" style="height:${Math.round(n * 80 / max)}%;background:${npsCorNota(i)}"></div>
      <div class="nps-dl">${i}</div>
    </div>`).join('');
  const meses = r.porMes.map(m => {
    const v = m.nps;
    const larg = v === null ? 0 : Math.abs(v) / 2;         // -100..100 -> 0..50% do trilho
    const pos = v !== null && v >= 0 ? 'left:50%' : 'right:50%';
    return `
    <div class="nps-linha-mes">
      <span>${npsMesRotulo(m.mes)}</span>
      <div class="nps-trilho"><span class="nps-preench" style="${pos};width:${larg}%;background:${npsCorValor(v)}"></span></div>
      <span class="nps-val" style="color:${npsCorValor(v)}">${v === null ? '—' : v} <small style="font-weight:400;color:var(--text-light)">(${m.respostas})</small></span>
    </div>`;
  }).join('');
  return `
    <div class="nps-bloco">
      <h4>Distribuição das notas</h4>
      <div class="nps-dist">${dist}</div>
      <div class="nps-legenda-faixas">
        <span><i style="background:#E05252"></i>0–6 detratores</span>
        <span><i style="background:#D4A017"></i>7–8 neutros</span>
        <span><i style="background:#2E7D32"></i>9–10 promotores</span>
        <span>Nota média: <b>${s.mediaNota === null ? '—' : String(s.mediaNota).replace('.', ',')}</b></span>
      </div>
    </div>
    <div class="nps-bloco">
      <h4>Evolução por mês da análise</h4>
      ${meses}
      <div class="nps-legenda-faixas" style="margin-top:8px">NPS do mês e, entre parênteses, o número de respostas.</div>
    </div>`;
}

function npsHtmlQuesitos(r) {
  if (!r.resumo.respondidas) return '<div class="nps-vazio">Nenhuma resposta neste filtro.</div>';
  return '<div class="nps-bloco">' + NPS_QUESITOS_ORDEM.map(k => {
    const q = r.quesitos[k];
    const tot = q.total;
    if (!tot) return `<div class="nps-quesito"><div class="nps-quesito-t">${esc(NPS_QUESITOS_TXT[k])}</div><div class="nps-quesito-leg">Sem respostas neste quesito.</div></div>`;
    const seg = q.opcoes.map(o => {
      const n = q.contagens[o] || 0;
      return n ? `<span style="width:${n * 100 / tot}%;background:${NPS_COR_OPCAO[o] || '#999'}" title="${esc(o)}: ${n}"></span>` : '';
    }).join('');
    const leg = q.opcoes.map(o => {
      const n = q.contagens[o] || 0;
      return `<span><i style="background:${NPS_COR_OPCAO[o] || '#999'}"></i>${esc(o)}: <b>${n}</b> (${Math.round(n * 100 / tot)}%)</span>`;
    }).join('');
    return `<div class="nps-quesito"><div class="nps-quesito-t">${esc(NPS_QUESITOS_TXT[k])}</div><div class="nps-pilha">${seg}</div><div class="nps-quesito-leg">${leg}</div></div>`;
  }).join('') + '</div>';
}

function npsHtmlUnidades(r) {
  if (!r.porUnidade.length) return '<div class="nps-vazio">Nenhuma unidade com pesquisa neste filtro.</div>';
  const linhas = r.porUnidade.map(u => `
    <tr>
      <td class="nps-un">${esc(u.unidade)}<small>${esc(u.cliente)}${u.ultimaAnalise ? ' · última análise ' + npsDataBR(u.ultimaAnalise) : ''}</small></td>
      <td>${u.respostas}<small style="color:var(--text-light)">/${u.enviados}</small></td>
      <td>${u.nps === null ? '<span style="color:var(--text-light)">—</span>' : `<span class="nps-pilula" style="background:${npsCorValor(u.nps)}">${u.nps}</span>`}</td>
      <td style="color:#2E7D32;font-weight:700">${u.promotores}</td>
      <td style="color:var(--amber);font-weight:700">${u.neutros}</td>
      <td style="color:var(--red);font-weight:700">${u.detratores}</td>
    </tr>`).join('');
  return `
    <div class="nps-bloco">
      <h4>Do menor para o maior NPS</h4>
      <table class="nps-tabela">
        <thead><tr><th>Unidade</th><th>Resp./env.</th><th>NPS</th><th title="Promotores">P</th><th title="Neutros">N</th><th title="Detratores">D</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
      <div class="nps-legenda-faixas" style="margin-top:8px">P = promotores · N = neutros · D = detratores. Unidades sem resposta aparecem por último.</div>
    </div>`;
}

function npsHtmlRespostas(r, st) {
  const cats = [['todas', 'Todas'], ['Promotor', 'Promotores'], ['Neutro', 'Neutros'], ['Detrator', 'Detratores']];
  const chips = cats.map(c => `<button type="button" class="nps-chip-filtro${st.cat === c[0] ? ' ativo' : ''}" onclick="npsTrocarCat('${c[0]}')">${c[1]}</button>`).join('') +
    `<button type="button" class="nps-chip-filtro${st.soComentario ? ' ativo' : ''}" onclick="npsToggleComentario()">Só com comentário</button>`;
  let lista = r.respostas.filter(x => (st.cat === 'todas' || x.categoria === st.cat) && (!st.soComentario || x.comentario));
  const total = r.respostas.length;
  const cortado = r.resumo.respondidas > total ? `<div class="nps-legenda-faixas">Mostrando as ${total} respostas mais recentes.</div>` : '';
  const itens = lista.map(x => {
    const cls = x.categoria === 'Promotor' ? 'p' : (x.categoria === 'Neutro' ? 'n' : 'd');
    const tags = NPS_QUESITOS_ORDEM.filter(k => x[k]).map(k => {
      const t = NPS_OPCAO_RUIM.indexOf(x[k]) !== -1 ? ' ruim' : (NPS_OPCAO_MEDIA.indexOf(x[k]) !== -1 ? ' medio' : '');
      const nome = { apresentacao: 'Apresentação', postura: 'Postura', supervisor: 'Supervisor', mapeamento: 'Mapeamento', horario: 'Horário' }[k];
      return `<span class="nps-tag${t}">${nome}: ${esc(x[k])}</span>`;
    }).join('');
    return `
    <div class="nps-resp ${cls}">
      <div class="nps-resp-topo">
        <div class="nps-resp-un">${esc(x.unidade)}<small>${esc(x.cliente)} · análise de ${npsDataBR(x.dataAuditoria)} · respondida em ${npsDataBR(x.dataResposta)}</small></div>
        <div class="nps-nota" style="background:${npsCorNota(x.nota)}" title="${esc(x.categoria)}">${x.nota}</div>
      </div>
      ${x.comentario ? `<div class="nps-resp-txt">${esc(x.comentario)}</div>` : '<div class="nps-resp-sem">Sem comentário.</div>'}
      ${tags ? `<div class="nps-tags">${tags}</div>` : ''}
    </div>`;
  }).join('');
  return `
    <div class="nps-filtros-resp">${chips}</div>
    ${cortado}
    ${itens || '<div class="nps-vazio">Nenhuma resposta com este filtro.</div>'}`;
}

/* ═══════════════════════════════════════════════════════
   ABA "PERFORMANCE" (r110) — somente Diretor
   Cards por cliente (macro) e por unidade (detalhe), comparativo,
   texto da análise e exportação: PDF e apresentação (PPTX + PDF).
   Unidade = média das análises do período; cliente = média das
   unidades. Os filtros só são aplicados ao tocar em "Buscar".
   ═══════════════════════════════════════════════════════ */
const PF_TIPOS = [
  { v: '', t: 'Todas as análises' },
  { v: 'PRÉ-OPERAÇÃO', t: 'Somente PRÉ-OPERAÇÃO' },
  { v: 'DURANTE A OPERAÇÃO', t: 'Somente DURANTE A OPERAÇÃO' }
];
const PF_FAIXAS = ['Excelente', 'Bom', 'Regular', 'Insatisfatório', 'Crítico'];
const PF_COR_FAIXA = { 'Excelente': '#2E7D32', 'Bom': '#61CF00', 'Regular': '#D4A017', 'Insatisfatório': '#E8872B', 'Crítico': '#E05252' };

function pfCor(n) {
  if (n === null || n === undefined || isNaN(n)) return '#9AA7B4';
  if (n >= 9) return '#2E7D32';
  if (n >= 7.5) return '#61CF00';
  if (n >= 6) return '#D4A017';
  if (n >= 4) return '#E8872B';
  return '#E05252';
}
function pfBg(n) {
  if (n === null || n === undefined || isNaN(n)) return '#F4F6F8';
  if (n >= 9) return '#E8F5E9';
  if (n >= 7.5) return '#EAF8E0';
  if (n >= 6) return '#FFF8E1';
  if (n >= 4) return '#FFF3E0';
  return '#FDEAEA';
}
function pfFmt(n) { return (n === null || n === undefined || isNaN(n)) ? '—' : Number(n).toFixed(1).replace('.', ','); }
function pfDeltaHtml(v) {
  if (v === null || v === undefined) return '<span class="pf-delta" style="color:#9AA7B4">sem comparação</span>';
  if (v === 0) return '<span class="pf-delta" style="color:#6B7B8D">= 0,0 vs anterior</span>';
  return '<span class="pf-delta" style="color:' + (v > 0 ? '#2E7D32' : '#C0392B') + '">' + (v > 0 ? '▲ +' : '▼ ') + pfFmt(v) + ' vs anterior</span>';
}
function pfDeltaCurto(v) {
  if (v === null || v === undefined) return '—';
  if (v === 0) return '= 0,0';
  return (v > 0 ? '▲ +' : '▼ ') + pfFmt(v);
}
function pfDeltaCor(v) { return (v === null || v === undefined || v === 0) ? '#6B7B8D' : (v > 0 ? '#2E7D32' : '#C0392B'); }

function pfFiltroInicial() { return { cliente: '', tipo: '', periodo: '90', de: '', ate: '' }; }
function pfEstado() {
  if (!state.pf) state.pf = { filtro: pfFiltroInicial(), dados: null, aplicado: null, foco: '', textos: null, textosChave: '', origemTexto: '', req: 0 };
  return state.pf;
}
// Presets fecham HOJE (para comparar com um período anterior de mesma duração); "Personalizado" usa as datas digitadas.
function pfIntervalo(f) {
  const iv = npsIntervalo(f);
  if (f.periodo !== 'custom' && f.periodo !== 'tudo' && iv.de) iv.ate = npsIsoLocal(new Date());
  return iv;
}
function pfPeriodoRotulo(f) {
  const iv = pfIntervalo(f);
  const br = s => npsDataBR(s);
  if (!iv.de && !iv.ate) return 'Todo o período';
  if (iv.de && iv.ate) return br(iv.de) + ' a ' + br(iv.ate);
  return iv.de ? 'a partir de ' + br(iv.de) : 'até ' + br(iv.ate);
}
function pfTipoRotulo(f) { const t = PF_TIPOS.find(x => x.v === f.tipo); return t ? t.t : ''; }

/* ── Aba ── */
function carregarPerformanceAba() {
  const c = $('#abaConteudo');
  if (!c) return;
  const p = pfEstado();
  const f = p.filtro;
  const optsCli = '<option value="">Todos os clientes</option>' + (state.clientes || []).map(x => `<option value="${esc(x)}"${x === f.cliente ? ' selected' : ''}>${esc(x)}</option>`).join('');
  const optsPer = NPS_PERIODOS.map(x => `<option value="${x.v}"${x.v === f.periodo ? ' selected' : ''}>${x.t}</option>`).join('');
  const optsTipo = PF_TIPOS.map(x => `<option value="${esc(x.v)}"${x.v === f.tipo ? ' selected' : ''}>${x.t}</option>`).join('');
  c.innerHTML = `
    <div class="pf-filtros">
      <select id="pfCliente" class="pf-full" aria-label="Cliente" onchange="pfMudou('cliente',this.value)">${optsCli}</select>
      <select id="pfPeriodo" aria-label="Período (data da análise)" onchange="pfMudou('periodo',this.value)">${optsPer}</select>
      <select id="pfTipo" aria-label="Tipo de avaliação" onchange="pfMudou('tipo',this.value)">${optsTipo}</select>
      <div class="pf-datas${f.periodo === 'custom' ? ' aberto' : ''}" id="pfDatas">
        <input type="date" id="pfDe" aria-label="Data inicial" value="${esc(f.de)}" onchange="pfMudou('de',this.value)">
        <input type="date" id="pfAte" aria-label="Data final" value="${esc(f.ate)}" onchange="pfMudou('ate',this.value)">
      </div>
      <div class="pf-aviso-pendente" id="pfAviso">Filtros alterados — toque em Buscar para atualizar.</div>
      <button type="button" class="pf-btn-buscar" id="pfBtnBuscar" onclick="pfBuscar()">🔍 Buscar</button>
    </div>
    <div id="pfResultados"></div>`;
  if (p.dados) pfRender();
  else pfBuscar();   // primeira abertura: cards macro com o filtro padrão (últimos 90 dias)
}

function pfMudou(campo, valor) {
  const p = pfEstado();
  p.filtro[campo] = valor;
  if (campo === 'periodo') { const d = $('#pfDatas'); if (d) d.classList.toggle('aberto', valor === 'custom'); }
  pfMarcarPendente();
}
function pfMarcarPendente() {
  const p = pfEstado();
  const pend = !p.aplicado || JSON.stringify(p.filtro) !== JSON.stringify(p.aplicado);
  const b = $('#pfBtnBuscar'), a = $('#pfAviso');
  if (b) b.classList.toggle('pendente', !!(pend && p.aplicado));
  if (a) a.classList.toggle('visivel', !!(pend && p.aplicado));
}

async function pfBuscar() {
  const p = pfEstado();
  const f = p.filtro;
  if (f.periodo === 'custom' && f.de && f.ate && f.de > f.ate) { toast('A data inicial é maior que a final'); return; }
  const iv = pfIntervalo(f);
  const req = ++p.req;
  const box = $('#pfResultados');
  if (box) box.classList.add('pf-carregando');
  const r = await apiCall('performanceAnalise', { cliente: f.cliente, tipo: f.tipo, de: iv.de, ate: iv.ate });
  const boxAtual = $('#pfResultados');
  if (req !== p.req || state.abaHome !== 'perf' || !boxAtual) return;
  boxAtual.classList.remove('pf-carregando');
  if (!r.ok) {
    const naoPublicado = /nao reconhecida|não reconhecida/i.test(String(r.erro || ''));
    boxAtual.innerHTML = '<div class="pf-erro">' + (naoPublicado
      ? 'O script do servidor ainda não tem o módulo Performance. Publique a nova versão no Apps Script (Implantar → Gerenciar implantações → Nova versão).'
      : 'Não foi possível carregar a Performance: ' + esc(r.erro || 'falha de conexão')) + '</div>';
    return;
  }
  p.dados = r;
  p.aplicado = JSON.parse(JSON.stringify(f));
  p.foco = (f.cliente && r.clientes.some(c => c.cliente === f.cliente)) ? f.cliente : '';
  p.textos = null; p.textosChave = ''; p.origemTexto = '';
  pfMarcarPendente();
  pfRender();
}

function pfRender() {
  const p = pfEstado();
  const box = $('#pfResultados');
  if (!box || !p.dados) return;
  const d = p.dados;
  if (!d.clientes.length) {
    box.innerHTML = '<div class="pf-vazio">Nenhuma análise concluída neste filtro.<br>Ajuste o cliente, o período ou o tipo de avaliação e toque em Buscar.</div>';
    return;
  }
  const cli = p.foco ? d.clientes.find(c => c.cliente === p.foco) : null;
  box.innerHTML = cli ? pfHtmlDetalhe(cli) : pfHtmlMacro(d);
}

function pfHtmlPeriodoLinha() {
  const p = pfEstado();
  const ant = p.dados && p.dados.periodoAnterior;
  return `Período (data da análise): <b>${esc(pfPeriodoRotulo(p.aplicado))}</b> · ${esc(pfTipoRotulo(p.aplicado))} · comparado com ` +
    (ant ? `<b>${npsDataBR(ant.de)} a ${npsDataBR(ant.ate)}</b> (período anterior de mesma duração)` : '<b>—</b> (sem período anterior para comparar)');
}

function pfHtmlMetrica(rot, v) {
  const w = (v === null || v === undefined) ? 0 : Math.max(0, Math.min(100, v * 10));
  return `<div class="pf-met"><span>${rot}</span><div class="pf-trilho"><i style="width:${w}%;background:${pfCor(v)}"></i></div><b style="color:${pfCor(v)}">${pfFmt(v)}</b></div>`;
}

function pfHtmlMetricas(o) {
  let h = '';
  if (o.retaguarda !== null) h += pfHtmlMetrica('Retaguarda', o.retaguarda);
  if (o.areaVendas !== null) h += pfHtmlMetrica('Área de Vendas', o.areaVendas);
  if (o.equipe !== null) h += pfHtmlMetrica('Equipe de apoio', o.equipe);
  if (o.organizacao !== null) h += pfHtmlMetrica('Organização', o.organizacao);
  if (o.volume !== null) h += pfHtmlMetrica('Volume (10 = ideal)', o.volume);
  return h;
}

function pfHtmlMacro(d) {
  const t = d.totais;
  const cards = d.clientes.map((c, i) => {
    const total = c.unidades || 1;
    const seg = PF_FAIXAS.map(fx => c.faixas[fx] ? `<span style="width:${c.faixas[fx] * 100 / total}%;background:${PF_COR_FAIXA[fx]}" title="${fx}: ${c.faixas[fx]}"></span>` : '').join('');
    const leg = PF_FAIXAS.filter(fx => c.faixas[fx]).map(fx => `<span><i style="background:${PF_COR_FAIXA[fx]}"></i>${c.faixas[fx]} ${fx}</span>`).join('');
    return `
    <button type="button" class="pf-card" style="border-top-color:${pfCor(c.geral)}" onclick="pfAbrirCliente(${i})" aria-label="Abrir ${esc(c.cliente)}">
      <div class="pf-card-topo">
        <div><div class="pf-nome">${esc(c.cliente)}</div><div class="pf-sub">${c.unidades} unidade(s) · ${c.analises} análise(s)</div></div>
        <div class="pf-nota"><b style="color:${pfCor(c.geral)}">${pfFmt(c.geral)}</b>${c.faixa ? `<span class="pf-faixa" style="background:${pfCor(c.geral)}">${c.faixa}</span>` : ''}</div>
      </div>
      ${pfDeltaHtml(c.variacao.geral)}
      ${pfHtmlMetricas(c)}
      <div class="pf-pilha" aria-hidden="true">${seg}</div>
      <div class="pf-leg">${leg}</div>
      <div class="pf-destaque">
        ${c.referencia ? `<span>★ Referência: <b>${esc(c.referencia.unidade)}</b> (${pfFmt(c.referencia.geral)})</span>` : ''}
