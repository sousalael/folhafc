<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="robots" content="noindex, nofollow">
    <title>B.I. Financeiro — Despesas × Provisionamento</title>
    <!-- r185: B.I. Financeiro (somente Diretor). Aberto pelo botão da aba Financeiro.
         Confronto (despesas do bolso × provisionamento), Despesas totais, Provisionamentos e Extrato,
         com filtros globais em cascata, gráficos, tabelas e exportação em Excel e PDF. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
    <style>
        :root {
            --fc-primaria: #001528;
            --fc-primaria-clara: #0a3a68;
            --fc-acao: #5DC500;
            --fc-acao-escura: #4BA000;
            --fc-laranja: #E8872B;
            --fc-vermelho: #c0392b;
            --fc-fundo: #f4f6f9;
            --fc-borda: #e6eaf0;
            --fc-texto-suave: #6B7B8D;
        }
        body { background: var(--fc-fundo); color: #1f2b38; font-family: system-ui, -apple-system, sans-serif; padding-bottom: 40px; }
        .hidden { display: none !important; }

        /* Tarja com a logomarca (flutuante, cantos arredondados — padrão do sistema) */
        .rel-topo { background: var(--fc-primaria); color: #fff; padding: 14px 0; width: calc(100% - 32px); max-width: 1480px; margin: 20px auto 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,20,40,0.3); }
        .rel-topo img { height: 40px; width: auto; }
        .rel-topo .titulo { font-size: 1.2rem; font-weight: 700; margin: 0; text-align: center; }
        .topo-grade { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px; }
        .topo-grade .topo-logo { justify-self: start; }
        .topo-grade .topo-dir { justify-self: end; }
        @media (max-width: 767.98px) {
            .topo-grade { grid-template-columns: minmax(0, 1fr); justify-items: center; }
            .topo-grade .topo-logo, .topo-grade .topo-dir { justify-self: center; }
        }
        .info-dados { font-size: .78rem; color: #b8c7d6; line-height: 1.25; text-align: right; }
        .btn-topo { color: #fff; border: 1px solid rgba(255,255,255,.55); background: transparent; font-size: .82rem; font-weight: 600; border-radius: 8px; padding: 6px 12px; white-space: nowrap; }
        .btn-topo:hover, .btn-topo:focus-visible { background: rgba(255,255,255,.15); color: #fff; border-color: #fff; }
        .btn-topo:disabled { opacity: .5; }

        .bi-wrap { max-width: 1480px; margin: 0 auto; padding: 0 16px; }
        .bi-grade { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px; align-items: start; }
        .bi-lateral { background: #fff; border: 1px solid var(--fc-borda); border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgba(0,21,40,0.06); position: sticky; top: 12px; }
        .bi-lateral h2 { font-size: .95rem; font-weight: 700; color: var(--fc-primaria); margin: 0; }
        .btn-filtros-mobile { display: none; }
        @media (max-width: 991.98px) {
            .bi-grade { grid-template-columns: minmax(0, 1fr); }
            .bi-lateral { position: static; }
            .bi-lateral.recolhida .lista-filtros { display: none; }
            .btn-filtros-mobile { display: inline-block; }
        }
        .nota-filtro { font-size: .72rem; color: var(--fc-texto-suave); margin: 2px 0 10px; line-height: 1.3; }

        /* Filtro de seleção múltipla */
        .ms { position: relative; margin-bottom: 12px; }
        .ms-rotulo { display: block; font-weight: 600; color: var(--fc-primaria); font-size: .82rem; margin-bottom: 3px; }
        .ms-botao { width: 100%; text-align: left; background: #fff; border: 1px solid #ced4da; border-radius: 8px; padding: 7px 30px 7px 10px; font-size: .86rem; color: #1f2b38; position: relative; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ms-botao::after { content: ''; position: absolute; right: 12px; top: 50%; margin-top: -3px; border: 5px solid transparent; border-top-color: var(--fc-primaria); }
        .ms-botao.filtrado { border-color: var(--fc-acao); background: #f4fbee; font-weight: 600; }
        .ms-botao:focus-visible { outline: 3px solid rgba(93,197,0,.45); outline-offset: 1px; }
        .ms-painel { position: absolute; z-index: 60; left: 0; top: calc(100% + 4px); width: 100%; min-width: 260px; background: #fff; border: 1px solid var(--fc-borda); border-radius: 10px; box-shadow: 0 10px 28px rgba(0,21,40,.18); padding: 8px; }
        .ms-busca { width: 100%; font-size: .84rem; margin-bottom: 6px; }
        .ms-opcoes { max-height: 260px; overflow-y: auto; }
        .ms-item { display: flex; align-items: flex-start; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: .84rem; cursor: pointer; margin: 0; }
        .ms-item:hover { background: var(--fc-fundo); }
        .ms-item input { margin-top: 3px; accent-color: var(--fc-acao); }
        .ms-item.todos { font-weight: 700; border-bottom: 1px solid var(--fc-borda); border-radius: 0; margin-bottom: 4px; }
        .ms-vazio { font-size: .82rem; color: var(--fc-texto-suave); padding: 6px; }

        /* Cards */
        .kpi-linha { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; margin-bottom: 14px; }
        .kpi-card { background: #fff; border-radius: 12px; padding: 10px 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); border-top: 4px solid var(--kpi-cor, #999); min-width: 0; }
        .kpi-rotulo { font-size: 10px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--fc-texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-valor { font-size: 1.08rem; font-weight: 800; color: var(--fc-primaria); line-height: 1.2; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-sub { font-size: .7rem; color: var(--fc-texto-suave); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .kpi-positivo { color: #3f8f00 !important; }
        .kpi-negativo { color: var(--fc-vermelho) !important; }

        /* Abas */
        .bi-abas { display: flex; gap: 4px; border-bottom: 1px solid var(--fc-borda); margin-bottom: 14px; overflow-x: auto; }
        .bi-aba { background: none; border: none; border-bottom: 3px solid transparent; color: #6c757d; font-weight: 600; font-size: .92rem; padding: 10px 12px; white-space: nowrap; }
        .bi-aba.ativa { color: var(--fc-primaria); border-bottom-color: var(--fc-acao); }
        .bi-aba:focus-visible { outline: 3px solid rgba(93,197,0,.45); outline-offset: -3px; }

        .barra-acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
        .barra-acoes .resumo-filtros { font-size: .78rem; color: var(--fc-texto-suave); }
        .aviso { background: #fff8ec; border: 1px solid #f3d3a6; color: #7a4a0c; border-radius: 10px; padding: 8px 12px; font-size: .84rem; margin-bottom: 12px; }
        .aviso-info { background: #eef5fb; border-color: #c9ddef; color: var(--fc-primaria); }

        .bi-painel { background: #fff; border: 1px solid var(--fc-borda); border-radius: 12px; padding: 16px; box-shadow: 0 4px 16px rgba(0,21,40,0.06); margin-bottom: 16px; min-width: 0; }
        .bi-painel h3 { font-size: .98rem; font-weight: 700; color: var(--fc-primaria); margin: 0; }
        .bi-painel .explica { font-size: .78rem; color: var(--fc-texto-suave); margin: 2px 0 10px; }
        .grade-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
        @media (max-width: 1199.98px) { .grade-2 { grid-template-columns: minmax(0, 1fr); } }
        .grafico-caixa { position: relative; height: 340px; }
        .sem-dados { color: var(--fc-texto-suave); font-size: .86rem; padding: 30px 0; text-align: center; }

        /* Tabelas */
        .tabela-wrap { overflow-x: auto; max-height: 560px; overflow-y: auto; }
        .tabela-bi { width: 100%; font-size: .82rem; border-collapse: collapse; }
        .tabela-bi th { position: sticky; top: 0; background: var(--fc-primaria); color: #fff; font-weight: 600; padding: 7px 8px; white-space: nowrap; cursor: pointer; user-select: none; z-index: 1; }
        .tabela-bi th.num, .tabela-bi td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .tabela-bi td { padding: 6px 8px; border-bottom: 1px solid #eef1f5; vertical-align: top; }
        .tabela-bi tr.linha-clicavel { cursor: pointer; }
        .tabela-bi tr.linha-clicavel:hover td { background: #f4fbee; }
        .tabela-bi tr.linha-total td { font-weight: 800; background: #eef1f5; border-top: 2px solid var(--fc-primaria); position: sticky; bottom: 0; }
        .tabela-bi tr.linha-grupo td { font-weight: 700; background: #f7f9fb; }
        .tabela-bi tr.linha-filho td:first-child { padding-left: 26px; color: #47535f; }
        .selo { display: inline-block; font-weight: 700; font-size: .74rem; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
        .selo-deve { background: #fde8e6; color: var(--fc-vermelho); }
        .selo-adiant { background: #fff4d6; color: #8a6300; }
        .selo-ok { background: #e8f7da; color: #3f8f00; }
        .valor-neg { color: var(--fc-vermelho); }
        .valor-pos { color: #3f8f00; }

        .btn-fc { background: var(--fc-primaria); color: #fff; border: none; font-weight: 600; }
        .btn-fc:hover { background: var(--fc-primaria-clara); color: #fff; }
        .btn-fc-contorno { border: 1px solid var(--fc-primaria); color: var(--fc-primaria); background: #fff; font-weight: 600; }
        .btn-fc-contorno:hover { background: var(--fc-fundo); }
        .btn-fc-contorno.ativo { background: var(--fc-primaria); color: #fff; }

        .carregando { text-align: center; padding: 60px 16px; color: var(--fc-primaria); }
        .carregando .txt { margin-top: 10px; font-weight: 600; }
        .estado-msg { text-align: center; padding: 40px 20px; font-size: .95rem; }
    </style>
</head>

<script>
// =====================================================================
// B.I. FINANCEIRO — r185
// Os dados chegam do Apps Script (ação biDespProvDados) já com nome, perfil,
// grupo e a marcação "do bolso" de cada despesa. Filtros, cards, gráficos e
// tabelas são calculados aqui, no navegador — respondem na hora.
// Regra do confronto (igual à aba Financeiro): Diretores e Supervisores entram
// dos dois lados; só despesas pagas do bolso entram no confronto.
// =====================================================================
const API_URL = (function(){ /* endereço do servidor publicado pelo robô do GitHub (backend.json); se não carregar, usa o endereço fixo */ var RESERVA='https://script.google.com/macros/s/AKfycbyHQEQanZCbRh7BHA0QIvUKdmNmtrYlDuWSYf7kZc8PCZbzfXk3qrCN7YQ0je6TpENw/exec'; try{ var x=new XMLHttpRequest(); x.open('GET','backend.json?t='+Date.now(),false); x.send(null); if(x.status===200){ var j=JSON.parse(x.responseText); if(j&&typeof j.url==='string'&&/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(j.url)) return j.url; } }catch(e){} return RESERVA; })();
const params = new URLSearchParams(window.location.search);
const tokenSessao = params.get('token') || '';
const cpfLogado = params.get('cpf') || '';
const CHAVE_FILTROS = 'fc_bifin_filtros_v1';
const CHAVE_ABA = 'fc_bifin_aba_v1';

if (window.ChartDataLabels) Chart.register(ChartDataLabels);
Chart.defaults.font.family = 'system-ui, -apple-system, sans-serif';
Chart.defaults.plugins.datalabels = Object.assign(Chart.defaults.plugins.datalabels || {}, { display: false });

const COR = { navy: '#001528', verde: '#5DC500', laranja: '#E8872B', vermelho: '#c0392b', azul: '#0a3a68', cinza: '#9aa5b1', amarelo: '#E8C02B', verdeClaro: '#9fd86b' };
const PALETA = ['#001528', '#5DC500', '#E8872B', '#0a3a68', '#2d8fd5', '#8e44ad', '#16a085', '#c0392b', '#E8C02B', '#7f8c8d', '#d35400', '#27ae60'];
const MESES_ABREV = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

// ---------------- Estado ----------------
let D = [];      // despesas
let P = [];      // provisionamentos
let META = {};   // formas do bolso, data de geração
let nomes = {};  // pid -> nome
let sel = {};    // filtro -> Set de valores
let abaAtual = 'confronto';
let graficos = {};
let pacoteExport = null;
let extratoModo = 'confronto';
let painelAberto = null;

const FILTROS = [
    { k: 'ano', rot: 'Ano', prov: true },
    { k: 'mes', rot: 'Mês', prov: true },
    { k: 'pessoa', rot: 'Pessoa', prov: true },
    { k: 'perfil', rot: 'Perfil', prov: true },
    { k: 'cli', rot: 'Cliente', prov: false },
    { k: 'uni', rot: 'Unidade', prov: false },
    { k: 'grupo', rot: 'Grupo de despesa', prov: false },
    { k: 'tipo', rot: 'Tipo de despesa', prov: false },
    { k: 'forma', rot: 'Forma de pagamento', prov: false }
];
FILTROS.forEach(f => { sel[f.k] = new Set(); });

// ---------------- Utilidades ----------------
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function brl(v) { return (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function brlCurto(v) {
    const n = Number(v) || 0, a = Math.abs(n), s = n < 0 ? '-' : '';
    if (a >= 1e6) return s + 'R$ ' + (a / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mi';
    if (a >= 1e3) return s + 'R$ ' + (a / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil';
    return s + 'R$ ' + a.toLocaleString('pt-BR', { maximumFractionDigits: 0 });
}
function pct(v) { return isFinite(v) ? (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%' : '—'; }
function inteiro(v) { return (Number(v) || 0).toLocaleString('pt-BR'); }
function dataBR(di) { const s = String(di); return s.slice(6, 8) + '/' + s.slice(4, 6) + '/' + s.slice(0, 4); }
function mesChave(di) { const s = String(di); return s.slice(0, 4) + '-' + s.slice(4, 6); }
function mesRotulo(k) { const p = String(k).split('-'); return MESES_ABREV[Number(p[1]) - 1] + '/' + p[0]; }
function anoDe(di) { return String(di).slice(0, 4); }
function hojeInt() { const h = new Date(); return h.getFullYear() * 10000 + (h.getMonth() + 1) * 100 + h.getDate(); }
function diasEntre(di, ateDi) {
    const a = new Date(Math.floor(di / 10000), Math.floor(di / 100) % 100 - 1, di % 100);
    const b = new Date(Math.floor(ateDi / 10000), Math.floor(ateDi / 100) % 100 - 1, ateDi % 100);
    return Math.max(0, Math.round((b - a) / 86400000));
}
function somar(lista, campo) { let t = 0; lista.forEach(x => { t += Number(x[campo]) || 0; }); return t; }
function cortar(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

// Valor de cada filtro para uma despesa / um provisionamento
function valorD(d, k) {
    switch (k) {
        case 'ano': return anoDe(d.di);
        case 'mes': return mesChave(d.di);
        case 'pessoa': return d.pid;
        case 'perfil': return d.perfil;
        case 'cli': return d.cli;
        case 'uni': return d.cli + '|' + d.uni;
        case 'grupo': return d.grupo;
        case 'tipo': return d.tipo;
        case 'forma': return d.forma;
    }
    return '';
}
function valorP(p, k) {
    switch (k) {
        case 'ano': return anoDe(p.di);
        case 'mes': return mesChave(p.di);
        case 'pessoa': return p.pid;
        case 'perfil': return p.perfil;
    }
    return null;
}
function rotuloValor(k, v) {
    if (k === 'mes') return mesRotulo(v);
    if (k === 'pessoa') return nomes[v] || v;
    if (k === 'uni') { const p = v.split('|'); return p[1] + ' · ' + p[0]; }
    return v;
}
function passaD(d, exceto) {
    for (const f of FILTROS) { if (f.k === exceto) continue; const s = sel[f.k]; if (s.size && !s.has(valorD(d, f.k))) return false; }
    return true;
}
function passaP(p, exceto) {
    for (const f of FILTROS) { if (!f.prov || f.k === exceto) continue; const s = sel[f.k]; if (s.size && !s.has(valorP(p, f.k))) return false; }
    return true;
}
function filtrosSoDespesaAtivos() { return FILTROS.some(f => !f.prov && sel[f.k].size); }
// Pessoa/perfil apenas (para a posição de hoje, que considera todo o histórico)
function passaPessoa(x) {
    if (sel.pessoa.size && !sel.pessoa.has(x.pid)) return false;
    if (sel.perfil.size && !sel.perfil.has(x.perfil)) return false;
    return true;
}

// ---------------- Comunicação ----------------
async function chamar(payload, timeoutMs) {
    payload.token = tokenSessao;
    payload.cpf = cpfLogado;
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), timeoutMs || 90000);
    try {
        const resp = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal });
        const txt = await resp.text();
        let res;
        try { res = JSON.parse(txt); } catch (e) { throw new Error('Resposta inválida do servidor.'); }
        if (res && res.error === 'SESSAO_INVALIDA') throw new Error('Sua sessão expirou. Volte ao Sistema de Gestão, entre novamente e abra o B.I. Financeiro pelo botão da aba Financeiro.');
        if (!res || res.error) throw new Error(res && res.error ? res.error : 'Erro desconhecido.');
        return res;
    } catch (e) {
        if (e.name === 'AbortError') throw new Error('O servidor demorou demais para responder. Tente “Atualizar dados” em instantes.');
        throw e;
    } finally { clearTimeout(t); }
}

async function carregarDados() {
    const btn = document.getElementById('btn-atualizar');
    btn.disabled = true;
    document.getElementById('info-dados').innerText = 'Carregando…';

        D = res.despesas || [];

        META = { formasBolso: res.formasBolso || [], formasSemCadastro: res.formasSemCadastro || [], geradoEm: res.geradoEm || '' };
        nomes = {};
        D.concat(P).forEach(x => { nomes[x.pid] = x.nome; });
        document.getElementById('info-dados').innerHTML = 'Dados de ' + esc(META.geradoEm) + '<br>' + inteiro(D.length) + ' despesas · ' + inteiro(P.length) + ' provisionamentos';
        document.getElementById('carregando').classList.add('hidden');

        document.getElementById('area-bi').classList.remove('hidden');
        carregarFiltrosSalvos();

            document.getElementById('erro-txt').innerText = e.message;

}

function salvarFiltros() {
    const obj = {};

function carregarFiltrosSalvos() {
    let obj = null;
    try { obj = JSON.parse(localStorage.getItem(CHAVE_FILTROS) || 'null'); } catch (e) {}
    FILTROS.forEach(f => { sel[f.k] = new Set(obj && Array.isArray(obj[f.k]) ? obj[f.k] : []); });
    if (!obj) sel.ano = new Set([String(new Date().getFullYear())]); // 1ª abertura: ano atual
    try { const a = localStorage.getItem(CHAVE_ABA); if (a) abaAtual = a; } catch (e) {}
}
function opcoesFiltro(k) {
    const f = FILTROS.find(x => x.k === k);
    const vals = new Set();
    D.forEach(d => { if (passaD(d, k)) vals.add(valorD(d, k)); });
    if (f.prov) P.forEach(p => { if (passaP(p, k)) vals.add(valorP(p, k)); });
    sel[k].forEach(v => vals.add(v)); // o que está marcado continua visível
    let lista = Array.from(vals);
    if (k === 'ano' || k === 'mes') lista.sort().reverse();
    else lista.sort((a, b) => rotuloValor(k, a).localeCompare(rotuloValor(k, b), 'pt-BR'));
    return lista;
}
function montarFiltros() {

function atualizarBotoesFiltro() {

function alternarPainel(k) {
    const abrir = painelAberto !== k;
    fecharPaineis();
    if (!abrir) return;

function fecharPaineis() {
    FILTROS.forEach(f => {
        const p = document.getElementById('painel-' + f.k);

        const b = document.getElementById('btn-ms-' + f.k);

function renderPainel(k) {

    html += lista.map((v, i) => `<label class="ms-item"><input type="checkbox" data-v="${esc(v)}" ${sel[k].has(v) ? 'checked' : ''} onchange="marcarFiltro('${k}', this)"> <span>${esc(rotuloValor(k, v))}</span></label>`).join('');
    cont.innerHTML = html;
}
function marcarFiltro(k, el) {
    const v = el.getAttribute('data-v');
    if (el.checked) sel[k].add(v); else sel[k].delete(v);
    aposMudarFiltro(k);
}
function limparFiltro(k) { sel[k].clear(); aposMudarFiltro(k); }
function limparFiltros() { FILTROS.forEach(f => sel[f.k].clear()); aposMudarFiltro(null); }
function alternarValorFiltro(k, v) { // clique nas barras/linhas
    if (sel[k].has(v)) sel[k].delete(v); else sel[k].add(v);
    aposMudarFiltro(null);
}
function aposMudarFiltro(k) {
    salvarFiltros();
    atualizarBotoesFiltro();
    if (k && painelAberto === k) renderPainel(k);
    renderizar();
}
function alternarFiltrosMobile() {

function resumoFiltrosTexto() {
    const partes = [];
    FILTROS.forEach(f => {
        if (!sel[f.k].size) return;
        const vals = Array.from(sel[f.k]).map(v => rotuloValor(f.k, v));
        partes.push(f.rot + ': ' + (vals.length > 3 ? vals.slice(0, 3).join(', ') + ' +' + (vals.length - 3) : vals.join(', ')));
    });
    return partes.length ? partes.join(' · ') : 'Sem filtros (todo o histórico)';
}

// ---------------- Cálculos ----------------
function dadosFiltrados() {
    const dTodas = D.filter(d => passaD(d, null));
    const prov = P.filter(p => passaP(p, null));
    return { dTodas: dTodas, dBolso: dTodas.filter(d => d.bolso), prov: prov };
}
function agrupar(lista, chaveFn, valorFn) {
    const m = {};
    lista.forEach(x => { const k = chaveFn(x); if (!m[k]) m[k] = { k: k, v: 0, n: 0 }; m[k].v += valorFn ? valorFn(x) : x.valor; m[k].n++; });
    return Object.values(m);
}
function confrontoPorPessoa(dBolso, prov) {
    const m = {};
    function g(x) { if (!m[x.pid]) m[x.pid] = { pid: x.pid, nome: nomes[x.pid] || x.nome, perfil: x.perfil, gastou: 0, recebeu: 0, nD: 0, nP: 0 }; return m[x.pid]; }
    dBolso.forEach(d => { const p = g(d); p.gastou += d.valor; p.nD++; });
    prov.forEach(x => { const p = g(x); p.recebeu += x.valor; p.nP++; });
    return Object.values(m).map(p => { p.saldo = p.recebeu - p.gastou; return p; });
}
// Posição de hoje (todo o histórico): o provisionamento cobre primeiro as despesas mais antigas.
// O que sobra sem cobertura recebe a idade (dias desde a data da despesa).
const FAIXAS = [
    { rot: 'Até 15 dias', max: 15, cor: COR.verdeClaro },
    { rot: '16 a 30 dias', max: 30, cor: COR.amarelo },
    { rot: '31 a 60 dias', max: 60, cor: COR.laranja },
    { rot: 'Mais de 60 dias', max: Infinity, cor: COR.vermelho }
];
function posicaoHoje() {
    const hoje = hojeInt();
    const porPessoa = {};
    D.forEach(d => { if (d.bolso && passaPessoa(d)) (porPessoa[d.pid] = porPessoa[d.pid] || { desp: [], prov: 0 }).desp.push(d); });
    P.forEach(p => { if (passaPessoa(p)) (porPessoa[p.pid] = porPessoa[p.pid] || { desp: [], prov: 0 }).prov += p.valor; });
    const out = {};
    Object.keys(porPessoa).forEach(pid => {
        const o = porPessoa[pid];
        o.desp.sort((a, b) => a.di - b.di);
        let resta = o.prov;
        const faixas = FAIXAS.map(() => 0);
        let maisAntiga = null, devendo = 0;
        o.desp.forEach(d => {
            if (resta >= d.valor - 0.004) { resta -= d.valor; return; }
            const aberto = d.valor - resta; resta = 0;
            const dias = diasEntre(d.di, hoje);
            const i = FAIXAS.findIndex(f => dias <= f.max);
            faixas[i] += aberto; devendo += aberto;
            if (maisAntiga === null) maisAntiga = dias;
        });
        const totalDesp = somar(o.desp, 'valor');
        out[pid] = { pid: pid, nome: nomes[pid] || pid, faixas: faixas, devendo: devendo, maisAntiga: maisAntiga, saldo: o.prov - totalDesp };
    });
    return out;
}
function seloSaldo(s) {
    if (Math.abs(s) < 0.005) return '<span class="selo selo-ok">Quitado</span>';
    if (s < 0) return '<span class="selo selo-deve">Empresa deve ' + brl(-s) + '</span>';
    return '<span class="selo selo-adiant">Adiantado ' + brl(s) + '</span>';
}
function textoSituacao(s) { return Math.abs(s) < 0.005 ? 'QUITADO' : (s < 0 ? 'EMPRESA DEVE' : 'ADIANTADO'); }

// Tabela genérica com ordenação por coluna e linha de total
const estadoOrdem = {};
function tabela(id, cols, linhas, total, opcoes) {
    const cont = document.getElementById(id);
    if (!cont) return;
    if (!linhas.length) { cont.innerHTML = '<div class="sem-dados">Sem dados para os filtros escolhidos.</div>'; return; }
    opcoes = opcoes || {};
    const ord = estadoOrdem[id];
    let ls = linhas.slice();
    if (ord && !opcoes.semOrdenar) {
        const c = cols[ord.i];
        ls.sort((a, b) => {
            const va = a.ordem ? a.ordem[ord.i] : a.cel[ord.i], vb = b.ordem ? b.ordem[ord.i] : b.cel[ord.i];
            const r = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'pt-BR');
            return ord.desc ? -r : r;
        });
    }
    const limite = opcoes.limite || 0;
    const mostrar = limite && ls.length > limite ? ls.slice(0, limite) : ls;
    let html = '<table class="tabela-bi"><thead><tr>' + cols.map((c, i) =>
        `<th class="${c.num ? 'num' : ''}" ${opcoes.semOrdenar ? '' : `onclick="ordenarTabela('${id}', ${i})"`} scope="col">${esc(c.rot)}${ord && ord.i === i ? (ord.desc ? ' ▼' : ' ▲') : ''}</th>`).join('') + '</tr></thead><tbody>';
    html += mostrar.map(l => `<tr class="${l.classe || ''}" ${l.onclick ? 'onclick="' + l.onclick + '" tabindex="0" onkeydown="if(event.key===\'Enter\'){' + l.onclick + '}"' : ''}>` +
        l.html.map((h, i) => `<td class="${cols[i].num ? 'num' : ''}">${h}</td>`).join('') + '</tr>').join('');
    if (total) html += '<tr class="linha-total">' + total.map((h, i) => `<td class="${cols[i].num ? 'num' : ''}">${h}</td>`).join('') + '</tr>';
    html += '</tbody></table>';
    if (limite && ls.length > limite) html += `<div class="small text-muted mt-2">Mostrando ${inteiro(limite)} de ${inteiro(ls.length)} linhas. O Excel traz todas.</div>`;
    cont.innerHTML = html;
    tabelasRegistradas[id] = { cols: cols, linhas: linhas, total: total, opcoes: opcoes };
}
const tabelasRegistradas = {};
function ordenarTabela(id, i) {
    const o = estadoOrdem[id];
    estadoOrdem[id] = (o && o.i === i) ? { i: i, desc: !o.desc } : { i: i, desc: true };
    const t = tabelasRegistradas[id];
    tabela(id, t.cols, t.linhas, t.total, t.opcoes);
}
function linha(cel, html, extra) { return Object.assign({ cel: cel, html: html || cel.map(esc) }, extra || {}); }

function renderizar() {
    destruirGraficos();

    else if (abaAtual === 'despesas') renderDespesas(dados);
    else if (abaAtual === 'provisionamentos') renderProvisionamentos(dados);
    else renderExtrato(dados);
}
function registrarCards(cards) { pacoteExport.cards = cards.map(c => ({ rot: c.rot, valor: c.valor, sub: c.sub || '' })); }

// ===== Aba Confronto =====
function renderConfronto(dados) {
    pacoteExport.titulo = 'Confronto — Despesas do bolso × Provisionamento';
    const pessoas = confrontoPorPessoa(dados.dBolso, dados.prov);
    const pos = posicaoHoje();
    const gastou = somar(pessoas, 'gastou'), recebeu = somar(pessoas, 'recebeu');
    let deve = 0, adiant = 0;
    pessoas.forEach(p => { if (p.saldo < -0.004) deve += -p.saldo; else if (p.saldo > 0.004) adiant += p.saldo; });
    let saldoHoje = 0, deveHoje = 0;
    Object.values(pos).forEach(p => { saldoHoje += p.saldo; deveHoje += p.devendo; });
    const saldo = recebeu - gastou;
    const cards = [
        { rot: 'Gasto do bolso', valor: brl(gastou), cor: COR.laranja, sub: inteiro(dados.dBolso.length) + ' despesas' },
        { rot: 'Provisionado', valor: brl(recebeu), cor: COR.verde, sub: inteiro(dados.prov.length) + ' provisionamentos' },
        { rot: 'Saldo do período', valor: brl(saldo), cor: COR.navy, classe: saldo < -0.004 ? 'kpi-negativo' : (saldo > 0.004 ? 'kpi-positivo' : ''), sub: saldo < -0.004 ? 'empresa deve' : (saldo > 0.004 ? 'adiantado' : 'quitado') },
        { rot: 'Empresa deve', valor: brl(deve), cor: COR.vermelho, classe: deve > 0.004 ? 'kpi-negativo' : '', sub: pessoas.filter(p => p.saldo < -0.004).length + ' pessoa(s)' },
        { rot: 'Adiantado', valor: brl(adiant), cor: COR.amarelo, sub: pessoas.filter(p => p.saldo > 0.004).length + ' pessoa(s)' },
        { rot: '% coberto', valor: gastou > 0 ? pct(recebeu / gastou) : '—', cor: COR.azul, sub: 'provisionado ÷ gasto' },
        { rot: 'Saldo hoje (histórico)', valor: brl(saldoHoje), cor: COR.navy, classe: saldoHoje < -0.004 ? 'kpi-negativo' : (saldoHoje > 0.004 ? 'kpi-positivo' : ''), sub: 'todos os meses', dica: 'Considera todo o histórico das pessoas filtradas, ignorando o filtro de período.' },
        { rot: 'Empresa deve hoje', valor: brl(deveHoje), cor: COR.vermelho, classe: deveHoje > 0.004 ? 'kpi-negativo' : '', sub: 'despesas sem cobertura', dica: 'Soma do que está sem cobertura de provisionamento, considerando todo o histórico.' }
    ];
    registrarCards(cards);

    let html = '';
    if (filtrosSoDespesaAtivos()) html += '<div class="aviso">Atenção: há filtros de cliente, unidade, grupo, tipo ou forma de pagamento ativos. Eles reduzem só as despesas — os provisionamentos não têm essas informações — então o saldo desta aba fica distorcido.</div>';
    const notaFormas = 'Contam como gasto do bolso: ' + (META.formasBolso.length ? META.formasBolso.join(', ') : '(nenhuma forma marcada como SIM)') +
        (META.formasSemCadastro.length ? '. Sem cadastro na Config_Pagamento (contadas como do bolso): ' + META.formasSemCadastro.join(', ') : '') + '.';
    html += '<div class="aviso aviso-info">' + esc(notaFormas) + '</div>';
    html += cardsHtml(cards);
    const ordGasto = pessoas.slice().sort((a, b) => (b.gastou + b.recebeu) - (a.gastou + a.recebeu));
    const ordSaldo = pessoas.slice().sort((a, b) => a.saldo - b.saldo);
    const posLista = Object.values(pos).filter(p => p.devendo > 0.004).sort((a, b) => b.devendo - a.devendo);
    html += painelGrafico('g-div', 'Despesa do bolso × Provisionamento por pessoa', 'Despesa para a esquerda, provisionamento para a direita. Clique numa pessoa para filtrar.', alturaBarras(ordGasto.length));
    html += '<div class="grade-2">' +
        painelGrafico('g-saldo', 'Saldo por pessoa', 'Vermelho: a empresa deve à pessoa. Azul-marinho: pessoa adiantada.', alturaBarras(ordSaldo.length)) +
        painelGrafico('g-aging', 'Há quanto tempo a empresa deve', 'Posição de hoje com todo o histórico: o provisionamento cobre primeiro as despesas mais antigas.', alturaBarras(posLista.length)) + '</div>';
    html += painelGrafico('g-mensal', 'Evolução mensal', 'Despesa do bolso e provisionamento por mês; a linha é o saldo acumulado desde o início do histórico.', 360);
    html += painelTabela('t-resumo', 'Resumo por pessoa', 'Clique numa linha para filtrar a pessoa. Clique no título da coluna para ordenar.');
    document.getElementById('conteudo-aba').innerHTML = html;

    // Divergente por pessoa
    const maxV = Math.max(1, ...ordGasto.map(p => Math.max(p.gastou, p.recebeu))) * 1.25;
    criarGrafico('g-div', {
        type: 'bar',
        data: { labels: ordGasto.map(p => cortar(p.nome, 30)), datasets: [
            { label: 'Despesa do bolso', data: ordGasto.map(p => -p.gastou), backgroundColor: COR.laranja, borderRadius: 3 },
            { label: 'Provisionamento', data: ordGasto.map(p => p.recebeu), backgroundColor: COR.verde, borderRadius: 3 }] },
        options: {
            indexAxis: 'y', layout: { padding: { left: 10, right: 10 } },
            scales: { x: { stacked: true, min: -maxV, max: maxV, ticks: { callback: v => brlCurto(Math.abs(v)) }, grid: { color: '#eef1f5' } }, y: { stacked: true, grid: { display: false } } },
            plugins: { legend: { position: 'top' }, datalabels: rotulosDados(), tooltip: tooltipBRL(true) },
            onClick: (e, els) => { if (els.length) alternarValorFiltro('pessoa', ordGasto[els[0].index].pid); },
            onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
        }
    }, !ordGasto.length);
    pacoteExport.graficos.push({ titulo: 'Despesa do bolso × Provisionamento por pessoa', id: 'g-div' });

    // Saldo divergente
    const maxS = Math.max(1, ...ordSaldo.map(p => Math.abs(p.saldo))) * 1.3;
    criarGrafico('g-saldo', {
        type: 'bar',
        data: { labels: ordSaldo.map(p => cortar(p.nome, 26)), datasets: [{ label: 'Saldo', data: ordSaldo.map(p => p.saldo),
            backgroundColor: ordSaldo.map(p => p.saldo < 0 ? COR.vermelho : COR.navy), borderRadius: 3 }] },
        options: {
            indexAxis: 'y',
            scales: { x: { min: -maxS, max: maxS, ticks: { callback: v => brlCurto(v) }, grid: { color: '#eef1f5' } }, y: { grid: { display: false } } },
            plugins: { legend: { display: false }, datalabels: rotulosDados({ formatter: v => brlCurto(v) }), tooltip: { callbacks: { label: c => (c.raw < 0 ? 'Empresa deve: ' : 'Adiantado: ') + brl(Math.abs(c.raw)) } } },
            onClick: (e, els) => { if (els.length) alternarValorFiltro('pessoa', ordSaldo[els[0].index].pid); }
        }
    }, !ordSaldo.length);
    pacoteExport.graficos.push({ titulo: 'Saldo por pessoa', id: 'g-saldo' });

    // Envelhecimento
    criarGrafico('g-aging', {
        type: 'bar',
        data: { labels: posLista.map(p => cortar(p.nome, 26)), datasets: FAIXAS.map((f, i) => ({ label: f.rot, data: posLista.map(p => p.faixas[i]), backgroundColor: f.cor })) },
        options: {
            indexAxis: 'y',
            scales: { x: { stacked: true, ticks: { callback: v => brlCurto(v) }, grid: { color: '#eef1f5' } }, y: { stacked: true, grid: { display: false } } },
            plugins: { legend: { position: 'top' }, tooltip: tooltipBRL(),
                datalabels: { display: ctx => (Number(ctx.raw) || 0) > 0.004 && ctx.raw >= (posLista[0] ? posLista[0].devendo : 0) * 0.12, color: '#fff', font: { size: 10, weight: '700' }, formatter: v => brlCurto(v) } }
        }
    }, !posLista.length);
    pacoteExport.graficos.push({ titulo: 'Há quanto tempo a empresa deve', id: 'g-aging' });

    // Evolução mensal (meses presentes nos dados filtrados)
    const meses = Array.from(new Set(dados.dBolso.map(d => mesChave(d.di)).concat(dados.prov.map(p => mesChave(p.di))))).sort();
    const gM = {}, rM = {};
    dados.dBolso.forEach(d => { const k = mesChave(d.di); gM[k] = (gM[k] || 0) + d.valor; });
    dados.prov.forEach(p => { const k = mesChave(p.di); rM[k] = (rM[k] || 0) + p.valor; });
    // saldo acumulado do histórico (pessoas filtradas) até o fim de cada mês
    const movs = [];
    D.forEach(d => { if (d.bolso && passaPessoa(d)) movs.push({ k: mesChave(d.di), v: -d.valor }); });
    P.forEach(p => { if (passaPessoa(p)) movs.push({ k: mesChave(p.di), v: p.valor }); });
    const acum = meses.map(m => { let s = 0; movs.forEach(x => { if (x.k <= m) s += x.v; }); return s; });
    criarGrafico('g-mensal', {
        type: 'bar',
        data: { labels: meses.map(mesRotulo), datasets: [
            { label: 'Despesa do bolso', data: meses.map(m => gM[m] || 0), backgroundColor: COR.laranja, borderRadius: 3, order: 2 },
            { label: 'Provisionamento', data: meses.map(m => rM[m] || 0), backgroundColor: COR.verde, borderRadius: 3, order: 2 },
            { type: 'line', label: 'Saldo acumulado', data: acum, borderColor: COR.navy, backgroundColor: COR.navy, tension: .25, pointRadius: 3, order: 1,
              datalabels: { display: meses.length <= 12, align: 'top', anchor: 'end', formatter: v => brlCurto(v), color: COR.navy, font: { size: 10, weight: '700' } } }] },
        options: {
            scales: { y: { ticks: { callback: v => brlCurto(v) }, grid: { color: '#eef1f5' } }, x: { grid: { display: false } } },
            plugins: { legend: { position: 'top' }, tooltip: tooltipBRL(), datalabels: rotulosDados({ display: ctx => meses.length <= 12 && ctx.raw > 0.004, anchor: 'end', align: 'end', rotation: meses.length > 6 ? -90 : 0, font: { size: 10 } }) },
            onClick: (e, els) => { if (els.length) alternarValorFiltro('mes', meses[els[0].index]); }
        }
    }, !meses.length);
    pacoteExport.graficos.push({ titulo: 'Evolução mensal', id: 'g-mensal' });

    // Tabela resumo por pessoa
    const cols = [{ rot: 'Pessoa' }, { rot: 'Perfil' }, { rot: 'Gasto do bolso', num: true }, { rot: 'Provisionado', num: true }, { rot: 'Saldo', num: true },
        { rot: '% coberto', num: true }, { rot: 'Despesas', num: true }, { rot: 'Provisionamentos', num: true }, { rot: 'Sem cobertura há (dias)', num: true }, { rot: 'Situação' }];
    const linhas = ordSaldo.map(p => {
        const ph = pos[p.pid];
        const dias = ph && ph.maisAntiga !== null ? ph.maisAntiga : '';
        const cob = p.gastou > 0 ? p.recebeu / p.gastou : NaN;
        return linha([p.nome, p.perfil, p.gastou, p.recebeu, p.saldo, isFinite(cob) ? cob : -1, p.nD, p.nP, dias === '' ? -1 : dias, textoSituacao(p.saldo)],
            [esc(p.nome), esc(p.perfil), brl(p.gastou), brl(p.recebeu), '<span class="' + (p.saldo < -0.004 ? 'valor-neg' : (p.saldo > 0.004 ? 'valor-pos' : '')) + '">' + brl(p.saldo) + '</span>',
             isFinite(cob) ? pct(cob) : '—', inteiro(p.nD), inteiro(p.nP), dias === '' ? '—' : inteiro(dias), seloSaldo(p.saldo)],
            { onclick: "alternarValorFiltro('pessoa', '" + String(p.pid).replace(/'/g, "\\'") + "')",
              exp: [p.nome, p.perfil, brl(p.gastou), brl(p.recebeu), brl(p.saldo), isFinite(cob) ? pct(cob) : '—', inteiro(p.nD), inteiro(p.nP), dias === '' ? '—' : inteiro(dias), textoSituacao(p.saldo)] });
    });
    const totalExp = ['TOTAL', '', brl(gastou), brl(recebeu), brl(saldo), gastou > 0 ? pct(recebeu / gastou) : '—', inteiro(dados.dBolso.length), inteiro(dados.prov.length), '', ''];
    tabela('t-resumo', cols, linhas, totalExp.map(esc));
    pacoteExport.tabelas.push({ titulo: 'Resumo por pessoa', cab: cols.map(c => c.rot), linhas: linhas.map(l => l.exp), total: totalExp, num: cols.map(c => !!c.num) });
}

// ===== Aba Despesas totais =====
function renderDespesas(dados) {
    pacoteExport.titulo = 'Despesas totais (todas as formas de pagamento)';
    const L = dados.dTodas;
    const total = somar(L, 'valor'), bolso = somar(dados.dBolso, 'valor'), empresa = total - bolso;
    const unidades = new Set(L.map(d => d.cli + '|' + d.uni)).size;
    const meses = new Set(L.map(d => mesChave(d.di))).size;
    const cards = [
        { rot: 'Total de despesas', valor: brl(total), cor: COR.navy, sub: inteiro(L.length) + ' lançamentos' },
        { rot: 'Pago do bolso', valor: brl(bolso), cor: COR.laranja, sub: total > 0 ? pct(bolso / total) + ' do total' : '' },
        { rot: 'Pago pela empresa', valor: brl(empresa), cor: COR.verde, sub: total > 0 ? pct(empresa / total) + ' do total' : '' },
        { rot: 'Ticket médio', valor: brl(L.length ? total / L.length : 0), cor: COR.azul, sub: 'por lançamento' },
        { rot: 'Média mensal', valor: brl(meses ? total / meses : 0), cor: COR.azul, sub: inteiro(meses) + ' mês(es) com despesa' },
        { rot: 'Unidades atendidas', valor: inteiro(unidades), cor: COR.navy, sub: 'cliente + unidade' },
        { rot: 'Custo por unidade', valor: brl(unidades ? total / unidades : 0), cor: COR.laranja, sub: 'total ÷ unidades' },
        { rot: 'Pessoas', valor: inteiro(new Set(L.map(d => d.pid)).size), cor: COR.cinza, sub: 'que lançaram despesas' }
    ];
    registrarCards(cards);

    const porGrupo = agrupar(L, d => d.grupo).sort((a, b) => b.v - a.v);
    const porTipo = agrupar(L, d => d.tipo).sort((a, b) => b.v - a.v);
    const porCli = agrupar(L, d => d.cli).sort((a, b) => b.v - a.v);
    const porUni = agrupar(L, d => d.cli + '|' + d.uni).sort((a, b) => b.v - a.v);
    const porForma = agrupar(L, d => d.forma).sort((a, b) => b.v - a.v);
    const pessoasM = {};
    L.forEach(d => { const p = pessoasM[d.pid] = pessoasM[d.pid] || { pid: d.pid, nome: nomes[d.pid] || d.nome, bolso: 0, emp: 0 }; if (d.bolso) p.bolso += d.valor; else p.emp += d.valor; });
    const porPessoa = Object.values(pessoasM).sort((a, b) => (b.bolso + b.emp) - (a.bolso + a.emp));
    const listaMeses = Array.from(new Set(L.map(d => mesChave(d.di)))).sort();

    let html = cardsHtml(cards);
    html += painelGrafico('g-dmes', 'Evolução mensal das despesas', 'Pago do bolso × pago pela empresa. Clique num mês para filtrar.', 340);
    html += '<div class="grade-2">' +
        painelGrafico('g-dgrupo', 'Despesa por grupo', 'Clique numa barra para filtrar o grupo.', alturaBarras(porGrupo.length)) +
        painelGrafico('g-dtipo', 'Despesa por tipo (15 maiores)', 'Clique numa barra para filtrar o tipo.', alturaBarras(Math.min(15, porTipo.length))) + '</div>';
    html += '<div class="grade-2">' +
        painelGrafico('g-dcli', 'Despesa por cliente (15 maiores)', 'Clique numa barra para filtrar o cliente.', alturaBarras(Math.min(15, porCli.length))) +
        painelGrafico('g-duni', 'Despesa por unidade (15 maiores)', 'Clique numa barra para filtrar a unidade.', alturaBarras(Math.min(15, porUni.length))) + '</div>';
    html += '<div class="grade-2">' +
        painelGrafico('g-dpessoa', 'Despesa por pessoa', 'Pago do bolso × pago pela empresa. Clique para filtrar a pessoa.', alturaBarras(porPessoa.length)) +
        painelGrafico('g-dforma', 'Despesa por forma de pagamento', 'Clique numa barra para filtrar a forma.', alturaBarras(porForma.length)) + '</div>';
    html += painelTabela('t-grupo', 'Grupo › Tipo de despesa', 'Valor, participação e quantidade de lançamentos.');
    html += painelTabela('t-cli', 'Cliente › Unidade', 'Valor, participação e quantidade de lançamentos.');
    document.getElementById('conteudo-aba').innerHTML = html;

    const bM = {}, eM = {};
    L.forEach(d => { const k = mesChave(d.di); if (d.bolso) bM[k] = (bM[k] || 0) + d.valor; else eM[k] = (eM[k] || 0) + d.valor; });
    criarGrafico('g-dmes', {
        type: 'bar',
        data: { labels: listaMeses.map(mesRotulo), datasets: [
            { label: 'Pago do bolso', data: listaMeses.map(m => bM[m] || 0), backgroundColor: COR.laranja, stack: 's' },
            { label: 'Pago pela empresa', data: listaMeses.map(m => eM[m] || 0), backgroundColor: COR.navy, stack: 's' }] },
        options: {
            scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, ticks: { callback: v => brlCurto(v) }, grid: { color: '#eef1f5' } } },
            plugins: { legend: { position: 'top' }, tooltip: tooltipBRL(),
                datalabels: { display: ctx => ctx.datasetIndex === 1 && listaMeses.length <= 18, anchor: 'end', align: 'end', clip: false, font: { size: 10, weight: '700' }, color: '#1f2b38',
                    formatter: (v, ctx) => brlCurto((bM[listaMeses[ctx.dataIndex]] || 0) + (eM[listaMeses[ctx.dataIndex]] || 0)) } },
            layout: { padding: { top: 18 } },
            onClick: (e, els) => { if (els.length) alternarValorFiltro('mes', listaMeses[els[0].index]); }
        }
    }, !listaMeses.length);
    pacoteExport.graficos.push({ titulo: 'Evolução mensal das despesas', id: 'g-dmes' });

    graficoRanking('g-dgrupo', porGrupo.map(x => ({ k: x.k, rot: x.k, v: x.v })), COR.navy, 'grupo');
    graficoRanking('g-dtipo', porTipo.slice(0, 15).map(x => ({ k: x.k, rot: x.k, v: x.v })), COR.azul, 'tipo');
    graficoRanking('g-dcli', porCli.slice(0, 15).map(x => ({ k: x.k, rot: x.k, v: x.v })), COR.navy, 'cli');
    graficoRanking('g-duni', porUni.slice(0, 15).map(x => ({ k: x.k, rot: rotuloValor('uni', x.k), v: x.v })), COR.laranja, 'uni');
    graficoRanking('g-dforma', porForma.map(x => ({ k: x.k, rot: x.k, v: x.v })), COR.verde, 'forma');
    criarGrafico('g-dpessoa', {
        type: 'bar',
        data: { labels: porPessoa.map(p => cortar(p.nome, 28)), datasets: [
            { label: 'Pago do bolso', data: porPessoa.map(p => p.bolso), backgroundColor: COR.laranja },
            { label: 'Pago pela empresa', data: porPessoa.map(p => p.emp), backgroundColor: COR.navy }] },
        options: {
            indexAxis: 'y', layout: { padding: { right: 70 } },
            scales: { x: { stacked: true, ticks: { callback: v => brlCurto(v) }, grid: { color: '#eef1f5' } }, y: { stacked: true, grid: { display: false } } },
            plugins: { legend: { position: 'top' }, tooltip: tooltipBRL(),
                datalabels: { display: ctx => ctx.datasetIndex === 1, anchor: 'end', align: 'end', clip: false, font: { size: 10, weight: '700' }, color: '#1f2b38',
                    formatter: (v, ctx) => brlCurto(porPessoa[ctx.dataIndex].bolso + porPessoa[ctx.dataIndex].emp) } },
            onClick: (e, els) => { if (els.length) alternarValorFiltro('pessoa', porPessoa[els[0].index].pid); }
        }
    }, !porPessoa.length);
    ['g-dgrupo|Despesa por grupo', 'g-dtipo|Despesa por tipo (15 maiores)', 'g-dcli|Despesa por cliente (15 maiores)', 'g-duni|Despesa por unidade (15 maiores)', 'g-dpessoa|Despesa por pessoa', 'g-dforma|Despesa por forma de pagamento']
        .forEach(s => { const p = s.split('|'); pacoteExport.graficos.push({ titulo: p[1], id: p[0] }); });

    // Tabelas hierárquicas
    function hierarquia(id, titulo, chavePai, chaveFilho, rotPai, rotFilho, filtroPai) {
        const pais = agrupar(L, chavePai).sort((a, b) => b.v - a.v);
        const cols = [{ rot: rotPai + ' › ' + rotFilho }, { rot: 'Valor', num: true }, { rot: '% do total', num: true }, { rot: 'Lançamentos', num: true }, { rot: 'Ticket médio', num: true }];
        const linhas = [], exp = [];
        pais.forEach(p => {
            const lp = [p.k, brl(p.v), total ? pct(p.v / total) : '—', inteiro(p.n), brl(p.n ? p.v / p.n : 0)];
            linhas.push(linha(lp, lp.map(esc), { classe: 'linha-grupo linha-clicavel', onclick: "alternarValorFiltro('" + filtroPai + "', '" + String(p.k).replace(/'/g, "\\'") + "')" }));
            exp.push(lp);
            agrupar(L.filter(d => chavePai(d) === p.k), chaveFilho).sort((a, b) => b.v - a.v).forEach(f => {
                const lf = [f.k, brl(f.v), total ? pct(f.v / total) : '—', inteiro(f.n), brl(f.n ? f.v / f.n : 0)];
                linhas.push(linha(lf, lf.map(esc), { classe: 'linha-filho' }));
                exp.push(['   ' + f.k].concat(lf.slice(1)));
            });
        });
        const tot = ['TOTAL', brl(total), total ? '100%' : '—', inteiro(L.length), brl(L.length ? total / L.length : 0)];
        tabela(id, cols, linhas, tot.map(esc), { semOrdenar: true });
        pacoteExport.tabelas.push({ titulo: titulo, cab: cols.map(c => c.rot), linhas: exp, total: tot, num: cols.map(c => !!c.num) });
    }
    hierarquia('t-grupo', 'Grupo › Tipo de despesa', d => d.grupo, d => d.tipo, 'Grupo', 'Tipo', 'grupo');
    hierarquia('t-cli', 'Cliente › Unidade', d => d.cli, d => d.uni, 'Cliente', 'Unidade', 'cli');
}

// ===== Aba Provisionamentos =====
function renderProvisionamentos(dados) {
    pacoteExport.titulo = 'Provisionamentos';
    const L = dados.prov;
    const total = somar(L, 'valor');
    const meses = Array.from(new Set(L.map(p => mesChave(p.di)))).sort();
    const cards = [
        { rot: 'Total provisionado', valor: brl(total), cor: COR.verde, sub: inteiro(L.length) + ' lançamentos' },
        { rot: 'Ticket médio', valor: brl(L.length ? total / L.length : 0), cor: COR.azul, sub: 'por provisionamento' },
        { rot: 'Média mensal', valor: brl(meses.length ? total / meses.length : 0), cor: COR.azul, sub: inteiro(meses.length) + ' mês(es)' },
        { rot: 'Pessoas', valor: inteiro(new Set(L.map(p => p.pid)).size), cor: COR.navy, sub: 'que receberam' }
    ];
    registrarCards(cards);
    const porPessoa = agrupar(L, p => p.pid).sort((a, b) => b.v - a.v);
    const porForma = agrupar(L, p => p.forma).sort((a, b) => b.v - a.v);
    const porQuem = agrupar(L, p => p.por || '(NÃO INFORMADO)').sort((a, b) => b.v - a.v);

    let html = '';
    if (filtrosSoDespesaAtivos()) html += '<div class="aviso">Os filtros de cliente, unidade, grupo, tipo e forma de pagamento não se aplicam aos provisionamentos.</div>';
    html += cardsHtml(cards);
    html += painelGrafico('g-pmes', 'Provisionamento por mês', 'Clique num mês para filtrar.', 320);
    html += '<div class="grade-2">' +
        painelGrafico('g-ppessoa', 'Provisionamento por pessoa', 'Clique para filtrar a pessoa.', alturaBarras(porPessoa.length)) +
        painelGrafico('g-pforma', 'Como a empresa pagou', 'Forma de pagamento do provisionamento.', alturaBarras(porForma.length)) + '</div>';
    html += painelGrafico('g-pquem', 'Quem lançou', 'Usuário que registrou o provisionamento.', alturaBarras(porQuem.length));
    html += painelTabela('t-prov', 'Lançamentos de provisionamento', 'Clique no título da coluna para ordenar.');
    document.getElementById('conteudo-aba').innerHTML = html;

    const vM = {};
    L.forEach(p => { const k = mesChave(p.di); vM[k] = (vM[k] || 0) + p.valor; });
    criarGrafico('g-pmes', {
        type: 'bar',
        data: { labels: meses.map(mesRotulo), datasets: [{ label: 'Provisionado', data: meses.map(m => vM[m] || 0), backgroundColor: COR.verde, borderRadius: 3 }] },
        options: { layout: { padding: { top: 18 } }, scales: { y: { ticks: { callback: v => brlCurto(v) }, grid: { color: '#eef1f5' } }, x: { grid: { display: false } } },
            plugins: { legend: { display: false }, tooltip: tooltipBRL(), datalabels: rotulosDados({ display: ctx => meses.length <= 18 && ctx.raw > 0.004, font: { size: 10, weight: '700' } }) },
            onClick: (e, els) => { if (els.length) alternarValorFiltro('mes', meses[els[0].index]); } }
    }, !meses.length);
    graficoRanking('g-ppessoa', porPessoa.map(x => ({ k: x.k, rot: nomes[x.k] || x.k, v: x.v })), COR.verde, 'pessoa');
    graficoRanking('g-pforma', porForma.map(x => ({ k: x.k, rot: x.k, v: x.v })), COR.navy, null);
    graficoRanking('g-pquem', porQuem.map(x => ({ k: x.k, rot: x.k, v: x.v })), COR.azul, null);
    ['g-pmes|Provisionamento por mês', 'g-ppessoa|Provisionamento por pessoa', 'g-pforma|Como a empresa pagou', 'g-pquem|Quem lançou']
        .forEach(s => { const p = s.split('|'); pacoteExport.graficos.push({ titulo: p[1], id: p[0] }); });

    const cols = [{ rot: 'Data' }, { rot: 'Pessoa' }, { rot: 'Valor', num: true }, { rot: 'Forma' }, { rot: 'Observação' }, { rot: 'Lançado por' }, { rot: 'Comprovante' }];
    const ord = L.slice().sort((a, b) => b.di - a.di);
    const linhas = ord.map(p => linha([p.di, p.nome, p.valor, p.forma, p.obs, p.por, ''],
        [esc(dataBR(p.di)), esc(p.nome), brl(p.valor), esc(p.forma), esc(p.obs), esc(p.por), p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">🧾 abrir</a>' : ''],
        { exp: [dataBR(p.di), p.nome, brl(p.valor), p.forma, p.obs, p.por, p.url ? 'sim' : ''] }));
    const tot = ['TOTAL', '', brl(total), '', '', '', ''];
    tabela('t-prov', cols, linhas, tot.map(esc), { limite: 1000 });
    pacoteExport.tabelas.push({ titulo: 'Lançamentos de provisionamento', cab: cols.map(c => c.rot), linhas: linhas.map(l => l.exp), total: tot, num: cols.map(c => !!c.num) });
}

// ===== Aba Extrato =====
function montarExtratoConfronto(dados) {
    const movs = [];
    dados.dBolso.forEach(d => movs.push({ di: d.di, pid: d.pid, nome: nomes[d.pid] || d.nome, tipo: 'Despesa', desc: d.tipo + ' · ' + d.cli + ' · ' + d.uni + (d.obs ? ' · ' + d.obs : ''), forma: d.forma, desp: d.valor, prov: 0, url: d.url }));
    dados.prov.forEach(p => movs.push({ di: p.di, pid: p.pid, nome: nomes[p.pid] || p.nome, tipo: 'Provisionamento', desc: (p.obs || '') , forma: p.forma, desp: 0, prov: p.valor, url: p.url }));
    movs.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR') || a.di - b.di || (a.desp ? -1 : 1));
    const saldos = {};
    movs.forEach(m => { saldos[m.pid] = (saldos[m.pid] || 0) + m.prov - m.desp; m.saldo = saldos[m.pid]; });
    return movs;
}
function renderExtrato(dados) {
    let html = '<div class="barra-acoes">' +
        `<button class="btn btn-sm btn-fc-contorno ${extratoModo === 'confronto' ? 'ativo' : ''}" onclick="extratoModo='confronto'; renderizar()">Confronto (bolso × provisionamento)</button>` +
        `<button class="btn btn-sm btn-fc-contorno ${extratoModo === 'todas' ? 'ativo' : ''}" onclick="extratoModo='todas'; renderizar()">Todas as despesas</button></div>`;
    if (extratoModo === 'confronto') {
        pacoteExport.titulo = 'Extrato — Confronto por pessoa';
        const movs = montarExtratoConfronto(dados);
        const tD = somar(movs, 'desp'), tP = somar(movs, 'prov');
        const cards = [
            { rot: 'Movimentos', valor: inteiro(movs.length), cor: COR.navy },
            { rot: 'Despesas do bolso', valor: brl(tD), cor: COR.laranja },
            { rot: 'Provisionamentos', valor: brl(tP), cor: COR.verde },
            { rot: 'Saldo do período', valor: brl(tP - tD), cor: COR.navy, classe: tP - tD < -0.004 ? 'kpi-negativo' : (tP - tD > 0.004 ? 'kpi-positivo' : '') }
        ];
        registrarCards(cards);
        html += cardsHtml(cards) + painelTabela('t-ext', 'Extrato por pessoa com saldo corrido', 'Ordenado por pessoa e data. O saldo corrido considera só o período filtrado. Negativo = a empresa deve.');
        document.getElementById('conteudo-aba').innerHTML = html;
        const cols = [{ rot: 'Data' }, { rot: 'Pessoa' }, { rot: 'Movimento' }, { rot: 'Descrição' }, { rot: 'Forma' }, { rot: 'Despesa', num: true }, { rot: 'Provisionamento', num: true }, { rot: 'Saldo corrido', num: true }, { rot: 'Comprovante' }];
        const linhas = movs.map(m => linha([m.di, m.nome, m.tipo, m.desc, m.forma, m.desp, m.prov, m.saldo, ''],
            [esc(dataBR(m.di)), esc(m.nome), esc(m.tipo), esc(m.desc), esc(m.forma), m.desp ? brl(m.desp) : '', m.prov ? brl(m.prov) : '',
             '<span class="' + (m.saldo < -0.004 ? 'valor-neg' : (m.saldo > 0.004 ? 'valor-pos' : '')) + '">' + brl(m.saldo) + '</span>',
             m.url ? '<a href="' + esc(m.url) + '" target="_blank" rel="noopener">🧾 abrir</a>' : ''],
            { exp: [dataBR(m.di), m.nome, m.tipo, m.desc, m.forma, m.desp ? brl(m.desp) : '', m.prov ? brl(m.prov) : '', brl(m.saldo), m.url ? 'sim' : ''] }));
        const tot = ['TOTAL', '', '', '', '', brl(tD), brl(tP), brl(tP - tD), ''];
        tabela('t-ext', cols, linhas, tot.map(esc), { semOrdenar: true, limite: 1500 });
        pacoteExport.tabelas.push({ titulo: 'Extrato por pessoa', cab: cols.map(c => c.rot), linhas: linhas.map(l => l.exp), total: tot, num: cols.map(c => !!c.num) });
    } else {
        pacoteExport.titulo = 'Extrato — Todas as despesas';
        const L = dados.dTodas.slice().sort((a, b) => b.di - a.di);
        const total = somar(L, 'valor');
        const cards = [
            { rot: 'Lançamentos', valor: inteiro(L.length), cor: COR.navy },
            { rot: 'Total', valor: brl(total), cor: COR.navy },
            { rot: 'Do bolso', valor: brl(somar(dados.dBolso, 'valor')), cor: COR.laranja },
            { rot: 'Pela empresa', valor: brl(total - somar(dados.dBolso, 'valor')), cor: COR.verde }
        ];
        registrarCards(cards);
        html += cardsHtml(cards) + painelTabela('t-todas', 'Todas as despesas', 'Clique no título da coluna para ordenar.');
        document.getElementById('conteudo-aba').innerHTML = html;
        const cols = [{ rot: 'Data' }, { rot: 'Pessoa' }, { rot: 'Cliente' }, { rot: 'Unidade' }, { rot: 'Grupo' }, { rot: 'Tipo' }, { rot: 'Forma' }, { rot: 'Do bolso' }, { rot: 'Valor', num: true }, { rot: 'Observação' }, { rot: 'Comprovante' }];
        const linhas = L.map(d => linha([d.di, d.nome, d.cli, d.uni, d.grupo, d.tipo, d.forma, d.bolso ? 'SIM' : 'NÃO', d.valor, d.obs, ''],
            [esc(dataBR(d.di)), esc(nomes[d.pid] || d.nome), esc(d.cli), esc(d.uni), esc(d.grupo), esc(d.tipo), esc(d.forma), d.bolso ? 'SIM' : 'NÃO', brl(d.valor), esc(d.obs),
             d.url ? '<a href="' + esc(d.url) + '" target="_blank" rel="noopener">🧾 abrir</a>' : ''],
            { exp: [dataBR(d.di), nomes[d.pid] || d.nome, d.cli, d.uni, d.grupo, d.tipo, d.forma, d.bolso ? 'SIM' : 'NÃO', brl(d.valor), d.obs, d.url ? 'sim' : ''] }));
        const tot = ['TOTAL', '', '', '', '', '', '', '', brl(total), '', ''];
        tabela('t-todas', cols, linhas, tot.map(esc), { limite: 1500 });
        pacoteExport.tabelas.push({ titulo: 'Todas as despesas', cab: cols.map(c => c.rot), linhas: linhas.map(l => l.exp), total: tot, num: cols.map(c => !!c.num) });
    }
}

// ---------------- Exportação ----------------
const LIBS = {
    xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
    autotable: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
};
const libsCarregadas = {};
function carregarLib(nome) {
    if (libsCarregadas[nome]) return libsCarregadas[nome];
    libsCarregadas[nome] = new Promise((ok, falha) => {
        const s = document.createElement('script');
        s.src = LIBS[nome]; s.onload = ok;
        s.onerror = () => { delete libsCarregadas[nome]; falha(new Error('Não foi possível carregar o componente de exportação. Verifique a internet.')); };
        document.head.appendChild(s);
    });
    return libsCarregadas[nome];
}
function nomeArquivo(ext) {
    const h = new Date();
    return 'BI_Financeiro_' + h.getFullYear() + String(h.getMonth() + 1).padStart(2, '0') + String(h.getDate()).padStart(2, '0') + '.' + ext;
}

async function exportarExcel() {
    try {
        await carregarLib('xlsx');
        const dados = dadosFiltrados();
        const wb = XLSX.utils.book_new();
        const r2 = v => Math.round((Number(v) || 0) * 100) / 100;
        function folha(nome, cab, linhas) {
            const ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas));
            ws['!cols'] = cab.map((c, i) => ({ wch: Math.min(60, Math.max(String(c).length, ...linhas.slice(0, 300).map(l => String(l[i] == null ? '' : l[i]).length)) + 2) }));
            XLSX.utils.book_append_sheet(wb, ws, nome);
        }
        folha('Filtros', ['Filtros aplicados', 'Gerado em'], [[resumoFiltrosTexto(), new Date().toLocaleString('pt-BR')], ['Formas do bolso: ' + META.formasBolso.join(', '), 'Dados de ' + META.geradoEm]]);
        const pessoas = confrontoPorPessoa(dados.dBolso, dados.prov).sort((a, b) => a.saldo - b.saldo);
        const pos = posicaoHoje();
        const linhasR = pessoas.map(p => [p.nome, p.perfil, r2(p.gastou), r2(p.recebeu), r2(p.saldo), p.gastou > 0 ? r2(p.recebeu / p.gastou * 100) : '', p.nD, p.nP,
            pos[p.pid] && pos[p.pid].maisAntiga !== null ? pos[p.pid].maisAntiga : '', textoSituacao(p.saldo)]);
        linhasR.push(['TOTAL', '', r2(somar(pessoas, 'gastou')), r2(somar(pessoas, 'recebeu')), r2(somar(pessoas, 'saldo')), '', dados.dBolso.length, dados.prov.length, '', '']);
        folha('Confronto por pessoa', ['Pessoa', 'Perfil', 'Gasto do bolso', 'Provisionado', 'Saldo', '% coberto', 'Despesas', 'Provisionamentos', 'Sem cobertura há (dias)', 'Situação'], linhasR);
        const linhasA = Object.values(pos).filter(p => p.devendo > 0.004).sort((a, b) => b.devendo - a.devendo).map(p => [p.nome].concat(p.faixas.map(r2), [r2(p.devendo), p.maisAntiga]));
        folha('Envelhecimento hoje', ['Pessoa'].concat(FAIXAS.map(f => f.rot), ['Total sem cobertura', 'Mais antiga (dias)']), linhasA);
        const movs = montarExtratoConfronto(dados);
        folha('Extrato confronto', ['Data', 'Pessoa', 'Movimento', 'Descrição', 'Forma', 'Despesa', 'Provisionamento', 'Saldo corrido', 'Comprovante'],
            movs.map(m => [dataBR(m.di), m.nome, m.tipo, m.desc, m.forma, m.desp ? r2(m.desp) : '', m.prov ? r2(m.prov) : '', r2(m.saldo), m.url]));
        const dl = dados.dTodas.slice().sort((a, b) => b.di - a.di);
        const ld = dl.map(d => [dataBR(d.di), nomes[d.pid] || d.nome, d.perfil, d.cli, d.uni, d.grupo, d.tipo, d.forma, d.bolso ? 'SIM' : 'NÃO', r2(d.valor), d.obs, d.url]);
        ld.push(['TOTAL', '', '', '', '', '', '', '', '', r2(somar(dl, 'valor')), '', '']);
        folha('Despesas', ['Data', 'Pessoa', 'Perfil', 'Cliente', 'Unidade', 'Grupo', 'Tipo', 'Forma', 'Do bolso', 'Valor', 'Observação', 'Comprovante'], ld);
        const pl = dados.prov.slice().sort((a, b) => b.di - a.di);
        const lp = pl.map(p => [dataBR(p.di), p.nome, p.perfil, r2(p.valor), p.forma, p.obs, p.por, p.url]);
        lp.push(['TOTAL', '', '', r2(somar(pl, 'valor')), '', '', '', '']);
        folha('Provisionamentos', ['Data', 'Pessoa', 'Perfil', 'Valor', 'Forma', 'Observação', 'Lançado por', 'Comprovante'], lp);
        const tot = somar(dl, 'valor');
        const lg = agrupar(dl, d => d.grupo + '|' + d.tipo).sort((a, b) => b.v - a.v).map(x => { const p = x.k.split('|'); return [p[0], p[1], r2(x.v), tot ? r2(x.v / tot * 100) : '', x.n]; });
        folha('Por grupo e tipo', ['Grupo', 'Tipo', 'Valor', '% do total', 'Lançamentos'], lg);
        const lc = agrupar(dl, d => d.cli + '|' + d.uni).sort((a, b) => b.v - a.v).map(x => { const p = x.k.split('|'); return [p[0], p[1], r2(x.v), tot ? r2(x.v / tot * 100) : '', x.n]; });
        folha('Por cliente e unidade', ['Cliente', 'Unidade', 'Valor', '% do total', 'Lançamentos'], lc);
        XLSX.writeFile(wb, nomeArquivo('xlsx'));
    } catch (e) { alert('Erro ao gerar o Excel: ' + e.message); }
}

function carregarImagem(src) {
    return new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = falha; i.src = src; });
}
async function exportarPDF() {
    const btn = document.getElementById('btn-pdf');
    btn.disabled = true;
    try {
        await carregarLib('jspdf'); await carregarLib('autotable');
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
        const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 12, LW = W - 2 * M;
        const pk = pacoteExport;
        // Cabeçalho com faixa azul e logomarca na proporção original
        const logoEl = document.querySelector('.topo-logo');
        let logo = null;
        try { logo = await carregarImagem(logoEl.src); } catch (e) {}
        function cabecalho() {
            doc.setFillColor(0, 21, 40); doc.rect(0, 0, W, 18, 'F');
            if (logo) {
                // logomarca sempre na proporção original (nunca achatada)
                const prop = logo.naturalWidth / logo.naturalHeight;
                let h = 10, w = h * prop;
                if (w > 70) { w = 70; h = w / prop; }
                doc.addImage(logoEl.src, 'PNG', M, (18 - h) / 2, w, h);
            }
            doc.setTextColor(255, 255, 255); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
            doc.text('B.I. Financeiro — Despesas × Provisionamento', W - M, 11, { align: 'right' });
            doc.setTextColor(31, 43, 56);
        }
        cabecalho();
        let y = 26;
        doc.setFont('helvetica', 'bold'); doc.setFontSize(14); doc.text(pk.titulo, M, y); y += 6;
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
        const filtros = doc.splitTextToSize('Filtros: ' + resumoFiltrosTexto() + '   ·   Gerado em ' + new Date().toLocaleString('pt-BR'), LW);
        doc.text(filtros, M, y); y += filtros.length * 4 + 2;
        // Cards em grade
        if (pk.cards.length) {
            const porLinha = 4, gw = (LW - (porLinha - 1) * 4) / porLinha, gh = 16;
            pk.cards.forEach((c, i) => {
                const col = i % porLinha, lin = Math.floor(i / porLinha);
                const x = M + col * (gw + 4), yy = y + lin * (gh + 4);
                doc.setDrawColor(230, 234, 240); doc.setFillColor(255, 255, 255); doc.roundedRect(x, yy, gw, gh, 2, 2, 'FD');
                doc.setFillColor(93, 197, 0); doc.rect(x, yy, gw, 1.2, 'F');
                doc.setFontSize(7); doc.setTextColor(107, 123, 141); doc.text(String(c.rot).toUpperCase(), x + 3, yy + 6);
                doc.setFontSize(11); doc.setFont('helvetica', 'bold'); doc.setTextColor(0, 21, 40); doc.text(String(c.valor), x + 3, yy + 12);
                doc.setFont('helvetica', 'normal');
            });
            y += Math.ceil(pk.cards.length / porLinha) * 20 + 2;
            doc.setTextColor(31, 43, 56);
        }
        function novaPagina() { doc.addPage(); cabecalho(); return 26; }
        // Gráficos: um por bloco, largura total, proporção preservada
        for (const g of pk.graficos) {
            const ch = graficos[g.id];
            if (!ch) continue;
            const cv = ch.canvas;
            let w = LW, h = w * cv.height / cv.width;
            const maxH = H - 26 - M - 8;
            if (h > maxH) { h = maxH; w = h * cv.width / cv.height; }
            if (y + h + 8 > H - M) y = novaPagina();
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text(g.titulo, M, y + 4);
            const img = await imagemComFundo(cv);
            doc.addImage(img, 'PNG', M, y + 6, w, h);
            y += h + 12;
        }
        // Tabelas
        for (const t of pk.tabelas) {
            if (y + 25 > H - M) y = novaPagina();
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.text(t.titulo, M, y + 4);
            const estilos = {};
            t.num.forEach((n, i) => { if (n) estilos[i] = { halign: 'right' }; });
            doc.autoTable({
                startY: y + 6, head: [t.cab], body: t.linhas.map(l => l.map(v => v == null ? '' : String(v))),
                foot: t.total ? [t.total.map(v => v == null ? '' : String(v))] : undefined, showFoot: 'lastPage',
                margin: { left: M, right: M, top: 24, bottom: M }, theme: 'grid',
                styles: { fontSize: 7.5, cellPadding: 1.4, overflow: 'linebreak' }, columnStyles: estilos,
                headStyles: { fillColor: [0, 21, 40], textColor: 255 }, footStyles: { fillColor: [238, 241, 245], textColor: [0, 21, 40], fontStyle: 'bold' },
                didDrawPage: d => { if (d.pageNumber > 1) cabecalho(); }
            });
            y = doc.lastAutoTable.finalY + 10;
        }
        const n = doc.internal.getNumberOfPages();
        for (let i = 1; i <= n; i++) { doc.setPage(i); doc.setFontSize(8); doc.setTextColor(107, 123, 141); doc.text('Página ' + i + ' de ' + n, W - M, H - 5, { align: 'right' }); }
        doc.save(nomeArquivo('pdf'));
    } catch (e) { alert('Erro ao gerar o PDF: ' + e.message); }
    finally { btn.disabled = false; }
}
function imagemComFundo(canvas) {
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(canvas, 0, 0);
    return Promise.resolve(c.toDataURL('image/png'));
}

    carregarDados();
}
