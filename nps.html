<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Pesquisa de satisfação — Formula Code</title>
<style>
:root{--navy:#002B50;--green:#61CF00;--orange:#E8872B;--dark:#051323;--bg:#F4F6F8;--text:#1A2A3A;--text-light:#6B7B8D;--border:#E2E8F0;--white:#FFF;--red:#E05252;--amber:#D4A017}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;-webkit-text-size-adjust:100%}
.topo{background:var(--dark);width:calc(100% - 32px);max-width:560px;margin:20px auto 16px;border-radius:12px;box-shadow:0 6px 20px rgba(5,19,35,.3);padding:22px 16px;text-align:center}
.topo img{height:48px;display:block;margin:0 auto}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.card{background:var(--white);border-radius:16px;padding:22px 20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#3a8000;margin-bottom:6px}
h1{font-size:22px;line-height:1.25;color:var(--navy);margin-bottom:10px}
.contexto{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.contexto span{font-size:12px;font-weight:600;background:var(--bg);color:var(--navy);padding:4px 10px;border-radius:10px}
.intro{font-size:14px;color:var(--text-light)}
.pergunta{font-size:15px;font-weight:600;color:var(--navy);line-height:1.45;margin-bottom:14px}
.pergunta small{display:block;font-weight:400;font-size:12px;color:var(--text-light);margin-top:2px}
.sub{margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
.pergunta + .sub{margin-top:0;padding-top:0;border-top:none}
.sub-t{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px}
.sub-d{font-size:12px;color:var(--text-light);margin-bottom:10px}
.obrig{color:var(--red);font-weight:700}
.opcional{font-size:11px;font-weight:600;color:var(--text-light);background:var(--bg);padding:1px 8px;border-radius:8px;margin-left:6px;vertical-align:middle}

/* escalas: 1-10 (satisfação) e 0-10 (recomendação) */
.escala{display:grid;gap:6px}
.escala.e10{grid-template-columns:repeat(5,1fr)}
.escala.e11{grid-template-columns:repeat(6,1fr)}
.escala label{position:relative;cursor:pointer}
.escala input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.escala span{display:flex;align-items:center;justify-content:center;height:50px;border:2px solid var(--border);border-radius:10px;font-size:17px;font-weight:700;color:var(--text-light);background:var(--white);transition:background .15s,border-color .15s,color .15s}
.escala label:hover span{border-color:var(--navy);color:var(--navy)}
.escala input:checked + span{color:#fff;border-color:transparent}
.escala .n-d input:checked + span{background:var(--red)}
.escala .n-n input:checked + span{background:var(--amber)}
.escala .n-p input:checked + span{background:#2E7D32}
.escala input:focus-visible + span{outline:3px solid var(--green);outline-offset:2px}
.pontas{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:var(--text-light);margin-top:8px;line-height:1.4}
.card.faltou{box-shadow:0 0 0 3px var(--red),0 2px 12px rgba(0,0,0,.06)}
.msg-faltou{display:none;color:#9B2C2C;font-size:12px;font-weight:600;margin-top:10px}
.card.faltou .msg-faltou{display:block}

/* caixas de marcar (pontos que se destacaram) */
.marcas{display:grid;gap:8px}
.marcas label{position:relative;cursor:pointer;display:block}
.marcas input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.marcas span{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;font-weight:600;color:var(--text);background:var(--white);transition:background .15s,border-color .15s}
.marcas span::before{content:'';flex:0 0 22px;height:22px;border:2px solid #B8C4D0;border-radius:6px;background:#fff;transition:all .15s}
.marcas label:hover span{border-color:var(--navy)}
.marcas input:checked + span{background:#EAF8E0;border-color:var(--green)}
.marcas input:checked + span::before{background:var(--green);border-color:var(--green);content:'✓';color:var(--dark);font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.marcas input:focus-visible + span{outline:3px solid var(--green);outline-offset:2px}

textarea{width:100%;min-height:120px;border:2px solid var(--border);border-radius:12px;padding:12px 14px;font-size:14px;font-family:inherit;line-height:1.5;resize:vertical;color:var(--text)}
textarea:focus{outline:none;border-color:var(--navy)}
.contador{font-size:11px;color:var(--text-light);text-align:right;margin-top:4px}

.btn{display:block;width:100%;border:none;border-radius:12px;padding:16px 24px;font-size:16px;font-weight:700;background:var(--green);color:var(--dark);cursor:pointer;transition:background .2s}
.btn:hover{background:#56b800}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.erro{background:#FDEAEA;color:#9B2C2C;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:12px;display:none;line-height:1.5}
.erro.visivel{display:block}

.estado{text-align:center;padding:36px 22px}
.estado .icone{font-size:44px;line-height:1;margin-bottom:12px}
.estado h1{margin-bottom:8px}
.estado p{font-size:14px;color:var(--text-light)}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:gira .8s linear infinite;margin:0 auto 12px}
@keyframes gira{to{transform:rotate(360deg)}}
.rodape{text-align:center;font-size:11px;color:var(--text-light);margin-top:8px}
.rodape strong{color:var(--navy)}

@media(min-width:480px){
  .escala.e10{grid-template-columns:repeat(10,1fr);gap:4px}
  .escala.e11{grid-template-columns:repeat(11,1fr);gap:4px}
  .escala span{height:46px;font-size:15px;border-radius:8px}
  .card{padding:26px 24px}
}
@media(prefers-reduced-motion:reduce){.escala span,.opcoes span,.btn{transition:none}.spinner{animation-duration:2s}}
</style>
</head>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyHQEQanZCbRh7BHA0QIvUKdmNmtrYlDuWSYf7kZc8PCZbzfXk3qrCN7YQ0je6TpENw/exec';
const TOKEN = (new URLSearchParams(window.location.search).get('t') || '').trim();
const MAX_COMENTARIO = 2000;

function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function api(action, dados) {
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, dados || {})) });
    return await r.json();
  } catch (e) {
    return { ok: false, erro: 'Sem conexão com o servidor. Verifique sua internet e tente novamente.' };
  }
}

function telaEstado(icone, titulo, texto) {
  document.getElementById('raiz').innerHTML =
    '<div class="card estado"><div class="icone" aria-hidden="true">' + icone + '</div><h1>' + esc(titulo) + '</h1><p>' + texto + '</p></div>' +
    '<div class="rodape"><strong>Formula Code</strong> — Tecnologia, Gestão e Automação ao Seu Alcance</div>';
}

const DESTAQUES = [
  ['pontualidade', 'Pontualidade no início/fim da contagem'],
  ['supervisor', 'Liderança e comunicação do supervisor'],
  ['postura', 'Postura e respeito do time às regras da loja'],
  ['mapeamento', 'Organização e mapeamento das áreas'],
  ['outro', 'Outro / Teve algum ponto negativo?']
];

function escalaHtml(nome, de, ate) {
  const itens = [];
  for (let i = de; i <= ate; i++) {
    const cls = i >= 9 ? 'n-p' : (i >= 7 ? 'n-n' : 'n-d');
    itens.push('<label class="' + cls + '"><input type="radio" name="' + nome + '" value="' + i + '" aria-label="Nota ' + i + '"><span>' + i + '</span></label>');
  }
  return '<div class="escala ' + (ate - de === 9 ? 'e10' : 'e11') + '" role="radiogroup">' + itens.join('') + '</div>';
}

function telaFormulario(p) {
  document.getElementById('raiz').innerHTML = `
    <div class="card">
      <div class="eyebrow">Pesquisa de satisfação</div>
      <h1>Sua opinião sobre o nosso inventário</h1>
      <div class="contexto">
        <span>${esc(p.cliente)}</span><span>${esc(p.unidade)}</span>${p.dataAuditoria ? '<span>' + esc(p.dataAuditoria) + '</span>' : ''}
      </div>
      <p class="intro">Leva menos de 1 minuto. As duas primeiras perguntas são obrigatórias.</p>
    </div>

    <div class="erro" id="erro" role="alert"></div>

    <div class="card" id="cartaoCsat">
      <div class="pergunta">1. Pensando exclusivamente no inventário realizado na última noite, qual o seu nível de satisfação com a execução do serviço, organização e postura da equipe? <span class="obrig" aria-hidden="true">*</span></div>
      <div role="radiogroup" aria-label="Satisfação de 1 a 10">${escalaHtml('csat', 1, 10)}</div>
      <div class="pontas"><span>1 · Totalmente Insatisfeito</span><span>10 · Totalmente Satisfeito</span></div>
      <div class="msg-faltou">Escolha uma nota de 1 a 10.</div>
    </div>

    <div class="card" id="cartaoNps">
      <div class="pergunta">2. Considerando sua experiência geral com os nossos serviços, em uma escala de 0 a 10, o quanto você recomendaria nossa empresa para outro gerente de loja ou parceiro? <span class="obrig" aria-hidden="true">*</span></div>
      <div role="radiogroup" aria-label="Recomendação de 0 a 10">${escalaHtml('nota', 0, 10)}</div>
      <div class="pontas"><span>0 · Não Recomendaria</span><span>10 · Recomendaria Com Certeza</span></div>
      <div class="msg-faltou">Escolha uma nota de 0 a 10.</div>
    </div>

    <div class="card">
      <div class="pergunta">3. Marque os pontos que se destacaram na operação desta noite: <span class="opcional">opcional</span></div>
      <div class="marcas">
        ${DESTAQUES.map(function (d) { return '<label><input type="checkbox" name="destaque" value="' + d[0] + '"><span>' + esc(d[1]) + '</span></label>'; }).join('')}
      </div>
    </div>

    <div class="card">
      <label class="pergunta" for="comentario" style="display:block">4. O que podemos fazer para melhorar a experiência no próximo inventário? <span class="opcional">opcional</span></label>
      <textarea id="comentario" maxlength="${MAX_COMENTARIO}" placeholder="Escreva aqui, se quiser"></textarea>
      <div class="contador"><span id="contagem">0</span>/${MAX_COMENTARIO}</div>
    </div>

    <button type="button" class="btn" id="btnEnviar">Enviar avaliação</button>
    <div class="rodape"><strong>Formula Code</strong> — Tecnologia, Gestão e Automação ao Seu Alcance</div>`;

  document.getElementById('comentario').addEventListener('input', function () {
    document.getElementById('contagem').textContent = this.value.length;
  });
  document.querySelectorAll('input[name="csat"]').forEach(function (i) { i.addEventListener('change', function () { document.getElementById('cartaoCsat').classList.remove('faltou'); }); });
  document.querySelectorAll('input[name="nota"]').forEach(function (i) { i.addEventListener('change', function () { document.getElementById('cartaoNps').classList.remove('faltou'); }); });
  document.getElementById('btnEnviar').addEventListener('click', enviar);
}

function valorDe(nome) {
  const el = document.querySelector('input[name="' + nome + '"]:checked');
  return el ? el.value : '';
}

function mostrarErro(msg) {
  const e = document.getElementById('erro');
  if (!e) return;
  e.textContent = msg;
  e.classList.add('visivel');
}

async function enviar() {
  const csat = valorDe('csat');
  const nota = valorDe('nota');
  document.getElementById('cartaoCsat').classList.toggle('faltou', csat === '');
  document.getElementById('cartaoNps').classList.toggle('faltou', nota === '');
  if (csat === '' || nota === '') {
    mostrarErro(csat === '' && nota === '' ? 'Responda as perguntas 1 e 2 para enviar a avaliação.' : (csat === '' ? 'Responda a pergunta 1 (satisfação) para enviar a avaliação.' : 'Responda a pergunta 2 (recomendação) para enviar a avaliação.'));
    const alvo = document.querySelector('.card.faltou');
    if (alvo) alvo.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  document.getElementById('erro').classList.remove('visivel');
  const btn = document.getElementById('btnEnviar');
  btn.disabled = true;
  btn.textContent = 'Enviando...';
  const destaques = Array.prototype.map.call(document.querySelectorAll('input[name="destaque"]:checked'), function (i) { return i.value; });
  const r = await api('npsResponder', {
    t: TOKEN, csat: parseInt(csat, 10), nota: parseInt(nota, 10), destaques: destaques,
    comentario: document.getElementById('comentario').value
  });
  if (r && r.ok) {
    telaEstado('✅', 'Obrigado pela sua avaliação!', 'Sua resposta foi registrada. Ela nos ajuda a melhorar a cada inventário.');
    window.scrollTo(0, 0);
    return;
  }
  if (r && r.jaRespondida) {
    telaEstado('✅', 'Esta pesquisa já foi respondida', 'Obrigado! Recebemos a sua avaliação.');
    window.scrollTo(0, 0);
    return;
  }
  btn.disabled = false;
  btn.textContent = 'Enviar avaliação';
  mostrarErro((r && r.erro) || 'Não foi possível enviar agora. Tente novamente.');
  const e = document.getElementById('erro'); if (e) e.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function iniciar() {
  if (!TOKEN) { telaEstado('🔗', 'Link inválido', 'Abra a pesquisa pelo botão que veio no e-mail da Formula Code.'); return; }
  const r = await api('npsObterPesquisa', { t: TOKEN });
  if (!r || !r.ok) {
    telaEstado('🔗', 'Não foi possível abrir a pesquisa', esc((r && r.erro) || 'Tente novamente em instantes.'));
    return;
  }
  if (r.respondida) { telaEstado('✅', 'Esta pesquisa já foi respondida', 'Obrigado! Recebemos a sua avaliação.'); return; }
  telaFormulario(r);
}

iniciar();
</script>
</body>
</html>
